<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071019">
<meta name="description" content="纪录片式的世界历史速览：自动播放，地图动画、中文语音讲解与字幕。">
<title>世界历史放映厅</title>
<style>
:root {
  --bg: #050b11;
  --sea: #0a1622;
  --land: #1b252e;
  --land-edge: #34424e;
  --grat: rgba(150, 175, 195, 0.08);
  --amber: #eba23c;
  --amber-hi: #f6bf62;
  --amber-dim: rgba(235, 162, 60, 0.55);
  --text: #ece6da;
  --muted: #98a2aa;
  --panel: rgba(9, 17, 25, 0.94);
  --line: rgba(236, 230, 218, 0.12);
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }

/* ---------- 地图 ---------- */
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#world { transition: opacity .38s ease; }
.proj { transition: opacity .38s ease; }
.sphere { fill: var(--sea); }
.grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.land { fill: var(--land); stroke: var(--land-edge); stroke-width: .7; vector-effect: non-scaling-stroke; stroke-linejoin: round; }

.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 75% at 50% 45%, rgba(5, 11, 17, 0) 55%, rgba(5, 11, 17, .72) 100%),
    linear-gradient(to bottom, rgba(5, 11, 17, .55), rgba(5, 11, 17, 0) 22%, rgba(5, 11, 17, 0) 58%, rgba(5, 11, 17, .9) 100%);
}

/* 动态图层：标记、范围、航线（屏幕坐标绘制，缩放时字号不变） */
#fx g.scene { transition: opacity .45s ease; }
#fx g.scene.leaving { opacity: 0; }
.area-glow { fill: url(#g-area); }
.area-ring { fill: none; stroke: var(--amber); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 3 5; }
.area-label { fill: var(--amber-hi); font-size: 13px; letter-spacing: .18em; font-family: var(--serif); paint-order: stroke; stroke: rgba(5, 11, 17, .85); stroke-width: 4px; stroke-linejoin: round; }
.area { opacity: 0; transition: opacity 1.1s ease; }
.area.on { opacity: 1; }

.route-halo { fill: none; stroke: rgba(5, 11, 17, .65); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.route-line { fill: none; stroke: var(--amber); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.route.dash .route-line { stroke-dasharray: 2 6; stroke-width: 2.4; }
.route-head { fill: var(--amber-hi); stroke: rgba(5, 11, 17, .7); stroke-width: 1; }

.pt { opacity: 0; transition: opacity .6s ease; }
.pt.on { opacity: 1; }
.pt-dot { fill: var(--amber-hi); stroke: #0a1218; stroke-width: 1.5; }
.pt-ring { fill: none; stroke: var(--amber); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
.pt-label { fill: var(--text); font-size: 13.5px; paint-order: stroke; stroke: rgba(5, 11, 17, .88); stroke-width: 4px; stroke-linejoin: round; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }

/* ---------- 顶部：年份与章节 ---------- */
.hud {
  position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  pointer-events: none; z-index: 3;
}
.hud-year { min-width: 0; }
.year {
  font-family: var(--serif); font-weight: 700; color: var(--amber);
  font-size: clamp(27px, 7.4vw, 60px); line-height: 1.08; white-space: nowrap;
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
  text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
}
.chap { margin-top: 6px; font-size: clamp(12.5px, 1.6vw + 6px, 16px); color: var(--muted); letter-spacing: .12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
.chap b { color: var(--amber-dim); font-weight: 500; margin-right: .5em; }
.hud-btns { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px;
  background: rgba(10, 20, 30, .62); border: 1px solid var(--line); cursor: pointer; font-size: 14px; color: var(--text);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.tbtn.only-icon { padding: 0 9px; }
.tbtn svg, .cbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tbtn:hover, .cbtn:hover { border-color: var(--amber-dim); color: var(--amber-hi); }
button:focus-visible, .prog:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* ---------- 章节标题卡 ---------- */
.card { position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .7s ease, transform .9s ease; padding: 0 16px; }
.card.show { opacity: 1; transform: none; }
.card-n { color: var(--amber); letter-spacing: .5em; font-size: 13px; margin-bottom: 10px; padding-left: .5em; }
.card-t { font-family: var(--serif); font-size: clamp(28px, 6vw, 54px); font-weight: 700; text-shadow: 0 4px 30px rgba(0, 0, 0, .8); }

/* ---------- 底部：字幕与控制条 ---------- */
.bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sub { max-width: 980px; margin: 0 auto 14px; min-height: 3.2em; display: flex; align-items: flex-end; justify-content: center; }
.sub p {
  margin: 0; text-align: center; font-size: clamp(17px, 1.3vw + 11px, 27px); line-height: 1.6; letter-spacing: .03em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .95), 0 0 18px rgba(0, 0, 0, .85);
  transition: opacity .25s ease;
}
.sub p.fade { opacity: 0; }
.bar { max-width: 1100px; margin: 0 auto; transition: opacity .4s ease; }
.covered .bar { opacity: 0; pointer-events: none; }

.prog { position: relative; height: 22px; cursor: pointer; touch-action: none; }
.prog-track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: rgba(236, 230, 218, .16); overflow: hidden; }
.prog-fill { height: 100%; width: 0; background: var(--amber); border-radius: 2px; transition: width .4s ease; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 6px; width: 2px; height: 10px; margin-left: -1px; background: rgba(236, 230, 218, .45); border-radius: 1px; }
.ticks i.done { background: #0a1218; }
.prog-tip { position: absolute; bottom: 24px; transform: translateX(-50%); white-space: nowrap; background: var(--panel); border: 1px solid var(--line); padding: 4px 9px; border-radius: 6px; font-size: 12.5px; color: var(--text); opacity: 0; pointer-events: none; transition: opacity .15s; }
.prog-tip.show { opacity: 1; }

.ctrls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cbtn {
  width: 42px; height: 42px; border-radius: 21px; display: inline-flex; align-items: center; justify-content: center;
  background: rgba(10, 20, 30, .55); border: 1px solid var(--line); cursor: pointer; color: var(--text); flex-shrink: 0;
}
.cbtn.play { width: 50px; height: 50px; border-radius: 25px; background: var(--amber); color: #111; border-color: transparent; }
.cbtn.play:hover { background: var(--amber-hi); color: #111; }
.cbtn.play svg { width: 22px; height: 22px; fill: currentColor; stroke-width: 2.4; }
.cbtn.txt { width: auto; padding: 0 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.i-pause, .playing .i-play { display: none; }
.playing .i-pause { display: block; }
.i-off, .mute .i-on { display: none; }
.mute .i-off { display: block; }
.mute #btnVoice { color: var(--muted); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; }
.grow { flex: 1; }

/* ---------- 封面 ---------- */
.cover {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 90px 16px 190px;
  background: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(5, 11, 17, .78), rgba(5, 11, 17, .35) 70%, rgba(5, 11, 17, 0));
  transition: opacity .6s ease; z-index: 2;
}
.cover.gone { opacity: 0; pointer-events: none; }
.cover-in { max-width: 620px; }
.kicker { color: var(--amber); letter-spacing: .3em; font-size: 13px; margin: 0 0 14px; }
.cover h1 { font-family: var(--serif); font-size: clamp(36px, 9vw, 76px); margin: 0 0 16px; letter-spacing: .08em; font-weight: 700; text-shadow: 0 4px 30px rgba(0, 0, 0, .7); }
.lede { color: var(--text); opacity: .86; line-height: 1.8; margin: 0 0 10px; font-size: clamp(14.5px, 1vw + 10px, 17px); }
.meta { color: var(--muted); font-size: 13.5px; letter-spacing: .1em; margin: 0 0 22px; }
.cover-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn {
  height: 48px; padding: 0 26px; border-radius: 24px; font-size: 16px; cursor: pointer; letter-spacing: .1em;
  border: 1px solid var(--amber-dim); background: rgba(10, 20, 30, .6); color: var(--text);
}
.btn.primary { background: var(--amber); border-color: transparent; color: #111; font-weight: 600; }
.btn.primary:hover { background: var(--amber-hi); }
.btn:not(.primary):hover { color: var(--amber-hi); }
.btn small { display: block; font-size: 11.5px; letter-spacing: .02em; font-weight: 400; opacity: .75; margin-top: -2px; }
.btn.two { height: auto; padding: 9px 24px; line-height: 1.4; }
.hint { color: var(--muted); font-size: 12.5px; margin: 18px 0 0; line-height: 1.7; }

/* ---------- 面板 ---------- */
.panel { position: absolute; inset: 0; z-index: 5; background: rgba(3, 7, 11, .55); display: flex; justify-content: flex-end; }
.panel-in {
  width: min(420px, 100%); height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: max(18px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.panel h2 { font-family: var(--serif); font-size: 22px; margin: 0; letter-spacing: .1em; }
.x { background: none; border: 1px solid var(--line); border-radius: 16px; height: 32px; padding: 0 14px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.toc-list { list-style: none; margin: 0; padding: 0; }
.toc-list li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; padding: 11px 8px; cursor: pointer;
  background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text);
}
.toc-list .n { grid-row: span 2; color: var(--amber-dim); font-family: var(--serif); font-size: 18px; font-variant-numeric: tabular-nums; }
.toc-list .t { font-size: 15.5px; }
.toc-list .s { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.toc-list li.cur button { background: rgba(235, 162, 60, .1); }
.toc-list li.cur .n, .toc-list li.cur .t { color: var(--amber-hi); }
.toc-list li button:hover .t { color: var(--amber-hi); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row.col { flex-direction: column; align-items: stretch; }
.row label { font-size: 15px; }
.row label b { color: var(--amber); font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
select { width: 100%; height: 40px; border-radius: 8px; background: #0e1a25; color: var(--text); border: 1px solid var(--line); padding: 0 10px; font: inherit; font-size: 14.5px; }
input[type=range] { width: 100%; accent-color: var(--amber); }
.switch { width: 50px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: rgba(236, 230, 218, .15); position: relative; cursor: pointer; flex-shrink: 0; }
.switch span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: var(--text); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--amber); }
.switch[aria-checked="true"] span { transform: translateX(22px); background: #111; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin: 10px 0 0; }
.note a { color: var(--amber); }

.toast { position: absolute; z-index: 6; left: 50%; top: 90px; transform: translate(-50%, -10px); background: var(--panel); border: 1px solid var(--amber-dim); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 手机与窄屏 ---------- */
@media (max-width: 640px) {
  .tbtn span { display: none; }
  .tbtn { padding: 0 9px; }
  .cbtn { width: 40px; height: 40px; }
  .cbtn.play { width: 46px; height: 46px; }
  .sub { min-height: 4.8em; margin-bottom: 10px; }
  .pt-label { font-size: 12.5px; }
  .area-label { font-size: 12px; letter-spacing: .12em; }
  .cover { padding: 80px 16px 170px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .sub { min-height: 2.6em; margin-bottom: 6px; }
  .sub p { font-size: 16px; line-height: 1.45; }
  .year { font-size: 26px; }
  .cover { padding: 56px 16px 120px; }
  .cover h1 { font-size: 34px; margin-bottom: 8px; }
  .lede { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  .pt-ring { display: none; }
}

</style>
</head>

界还有争论。接下来的大半天，地球的主角都是单细胞生物，它们安安静静地繁殖了十几个小时，几乎没有任何剧情。如果这是一部电影，观众大概已经睡着了。"},{"c":1,"y":-538000000,"cam":[11,10,1],"t":"晚上九点多，寒武纪生命大爆发，海里突然热闹起来，长眼睛的、带硬壳的、长腿的，纷纷登场。晚上十点四十多分，恐龙出现了。它们统治地球将近一个小时，直到晚上十一点三十九分左右，戏份戛然而止。"},{"c":1,"y":-66000000,"cam":[-89,21,4.5],"t":"让恐龙退场的，是约六千六百万年前的一颗小行星，它撞在今天墨西哥的尤卡坦半岛附近，留下了直径约一百八十公里的希克苏鲁伯撞击坑。恐龙的大部分家族就此灭绝，只有一支活了下来，就是今天窗外叽叽喳喳的鸟。","pts":[["希克苏鲁伯撞击坑",-89.5,21.4]],"ar":[["撞击区域",-89.5,21.4,4]]},{"c":1,"y":-300000,"cam":[10,10,2.2],"t":"那我们人类呢？智人大约在三十万年前出现在非洲，摩洛哥的杰贝尔依罗出土的化石就有这么古老。放进地球的这一天里，我们只占了最后大约五点六秒。也就是说，你眨几下眼的工夫，人类的全部历史就演完了。","pts":[["杰贝尔依罗",-8.87,31.86,"l"],["奥莫基比什",35.95,5.4]],"ar":[["非洲",20,3,18]]},{"c":1,"y":-300000,"cam":[11,10,1],"t":"五秒多实在太挤，我们换一把尺子：把智人的三十万年，再拉长成一天。这样一来，一小时约等于一万两千五百年。按这把尺子，农业出现在最后一个小时里；有文字的历史只占最后约二十五分钟；工业革命以来的世界，只占最后约一点二分钟。"},{"c":1,"y":-300000,"cam":[25,5,1.6],"t":"所以这部片子的大部分时间，都花在这一天的最后半小时里。这不是因为之前不重要，而是因为之前的人没给我们留下文字，只留下石器、骨头和火堆的灰烬。好，灯光暗下，放映开始。"},{"c":2,"y":-300000,"cam":[60,10,1.6],"t":"三十万年前的非洲，智人并不孤单。在之后很长一段时间里，地球上还生活着好几种人：欧洲和西亚有尼安德特人，亚洲有丹尼索瓦人，印尼的弗洛勒斯岛上还有身高一米左右、被戏称为霍比特人的小个子人类。那时的地球，是一个多种人类共存的星球。","pts":[["尼安德特人（欧洲、西亚）",6.95,51.23,"r"],["丹尼索瓦洞",84.68,51.4],["弗洛勒斯岛",120.45,-8.53]],"ar":[["智人的故乡",30,2,14]]},{"c":2,"y":-70000,"cam":[40,18,3.2],"t":"智人并不是一出生就急着离家。大约十几万年前，就有零星的队伍走出非洲，到过今天的以色列一带，但大多没有留下后代。大约七万到六万年前，才发生了那次真正改变世界的大扩散。为什么偏偏是那时候？学界还在争论，气候变化可能是重要推手。","pts":[["米斯利亚洞穴",34.97,32.75,"l"],["曼德海峡",43.4,12.6]],"rt":[[[36,4],[40,9],[43.3,12.6],[46,15],[52,18],[57,22]],[[33,25],[33.5,29.5],[35,33],[38,36]]],"rs":"d"},{"c":2,"y":-50000,"cam":[110,5,2.2],"t":"一路向东的人们沿着海岸线前进，吃着贝壳和鱼，穿过南亚，进入东南亚。至少五万年前，他们已经划船渡海，登上了澳大利亚，有学者认为还能早到六万五千年前。即使在冰期海平面最低的时候，这段海路也从来没有完全连成陆地。","pts":[["苏拉威西岩画",119.6,-4.9,"r"],["马杰德贝贝",132.6,-12.5],["蒙哥湖",143.1,-33.7]],"rt":[[[57,22],[65,24],[72,20],[80,12],[90,21],[98,14],[103,2],[112,-7],[122,-9],[130,-11],[134,-14]]],"rs":"d"},{"c":2,"y":-45000,"cam":[20,46,4],"t":"大约四万五千年前，智人进入欧洲，在那里遇到了已经住了几十万年的尼安德特人。尼安德特人脑容量不比我们小，会用火、做工具、照顾伤病的同伴，并不是漫画里那种笨拙的野蛮人。大约四万年前，他们从化石记录里消失了，原因至今众说纷纭。","pts":[["巴乔基罗洞",25.43,42.95],["肖维洞穴",4.42,44.39,"l"],["尼安德河谷",6.95,51.23]],"rt":[[[36,34],[33,38],[28,41],[25,43],[18,46],[10,47],[3,46]]],"rs":"d"},{"c":2,"y":-40000,"cam":[60,40,2.2],"t":"不过，尼安德特人并没有完全消失。今天非洲以外的人，基因组里平均约有百分之二来自尼安德特人。换句话说，两群人当年不只是打过照面。更奇妙的是，研究发现，帮助藏族人适应高海拔的一个关键基因变体，来自神秘的丹尼索瓦人。","pts":[["青藏高原",89,32]],"ar":[["尼安德特人",15,46,9],["丹尼索瓦人",95,35,12]]},{"c":2,"y":-40000,"cam":[70,38,1.8],"t":"同一时期，东亚也有了智人的足迹，北京周口店附近的田园洞出土了约四万年前的人骨。法国肖维洞穴的岩壁上，有人用炭笔画下奔跑的马和狮子，距今三万多年；苏拉威西岛的洞穴里，有一幅至少四万五千年前画的野猪。艺术，几乎是和智人一起走遍世界的。","pts":[["田园洞",115.88,39.66],["肖维洞穴",4.42,44.39,"l"],["苏拉威西",119.6,-4.9]]},{"c":2,"y":-16000,"cam":[-150,35,1.5],"t":"冰期时海平面很低，西伯利亚和阿拉斯加之间露出一片宽阔的陆地，叫白令陆桥。人类从这里走进美洲。具体什么时候，争议很大：比较稳妥的说法是至少一万五千年前；美国新墨西哥州白沙的人类脚印，显示可能早到两万多年前。","p":"p","pts":[["白令陆桥",-169,65.5,"t"],["白沙脚印",-106.3,32.9],["蒙特维德",-73.2,-41.5]],"rt":[[[125,63],[150,66],[172,66],[-169,65.5],[-155,64],[-140,60],[-125,52],[-112,40],[-100,25],[-85,12],[-77,2],[-78,-15],[-73,-38]]],"rs":"d"},{"c":2,"y":-12000,"cam":[175,-5,1.4],"t":"这场从非洲出发的长跑持续了几万年。冰期结束时，除了南极和许多偏远海岛，人类几乎到过了所有大陆。顺便剧透一下：最后被人类定居的大块陆地是新西兰，要等到约公元十三世纪，由驾驶双体独木舟的波利尼西亚航海者完成。","p":"p","pts":[["新西兰（约 13 世纪）",174.8,-41.3,"l"],["夏威夷",-155.5,19.6],["复活节岛",-109.35,-27.1]],"ar":[["波利尼西亚",-150,-15,22]]},{"c":3,"y":-11700,"cam":[11,25,1.2],"t":"大约一万一千七百年前，最后一个冰期结束，地球进入温暖稳定的全新世。冰川后退，海平面上升，白令陆桥被淹没，美洲与亚洲从此隔海相望。气候变得靠谱之后，人类开始在好几个地方做同一件影响至今的事：种地。"},{"c":3,"y":-9500,"cam":[38,36,7],"t":"不过在种地之前，先有一个谜。土耳其东南部的哥贝克力石阵，建于约一万一千多年前，几吨重的石柱上刻着狐狸、野猪和蝎子。它比英国巨石阵早六千多年，比埃及金字塔早约七千年。让考古学家吃惊的是，建造者很可能还是狩猎采集者。","a":true,"pts":[["哥贝克力石阵",38.92,37.22]]},{"c":3,"y":-9000,"cam":[40,34,4.5],"t":"有学者猜想：也许正是为了让一大群人聚在一起搞大工程，人们才不得不想办法多弄粮食。在石阵附近的新月沃地，人类驯化了小麦、大麦、豌豆，后来又驯化了山羊、绵羊和牛。约旦河谷的杰里科，很早就修起了石墙和石塔。","a":true,"pts":[["哥贝克力",38.92,37.22],["杰里科",35.44,31.87,"l"],["恰塔霍裕克",32.83,37.67,"l"]],"ar":[["新月沃地",40,34,5]]},{"c":3,"y":-8000,"cam":[114,33,4.5],"t":"同一时期，地球另一边的中国，也在独立地发明农业。大约一万年前，长江下游的先民开始驯化水稻，浙江的上山遗址就有早期稻作的痕迹；黄河流域则驯化了粟和黍，也就是小米和黄米。南稻北粟的格局，一直延续到今天。","a":true,"pts":[["磁山",114.1,36.57],["上山",119.95,29.47]],"ar":[["粟作（黄河）",112,36,3.5],["稻作（长江）",117,30,3.5]]},{"c":3,"y":-7000,"cam":[-85,0,2.2],"t":"美洲的人们没有任何外援，同样独立发明了农业。墨西哥人把一种穗子只有几厘米长的野草，经过几千年选育，变成了玉米；南瓜在那里驯化得更早，距今约一万年。安第斯山区的人们，则驯化了土豆、藜麦和羊驼。","a":true,"pts":[["巴尔萨斯河谷",-100.5,18.2,"l"],["的的喀喀湖",-69.4,-15.9]],"ar":[["中美洲：玉米、南瓜、豆子",-97,18,5],["安第斯：土豆、藜麦、羊驼",-70,-14,6]]},{"c":3,"y":-7000,"cam":[70,10,1.3],"t":"新几内亚高地的人们，也独立种起了芋头和香蕉。把这些地方放到一张地图上看：农业不是一个天才的发明，而是好几群互不相识的人，在冰期结束后，几乎不约而同地走上了同一条路。","a":true,"ar":[["新月沃地",40,34,5],["中国",115,33,6],["中美洲",-97,18,5],["安第斯",-70,-14,6],["新几内亚",144,-6,4]]},{"c":3,"y":-7000,"cam":[36,36,5],"t":"种地真是好事吗？考古发现，早期农民往往比狩猎采集者更矮，牙病更多，干活更累。有人开玩笑说：不是人类驯化了小麦，而是小麦驯化了人类，让一个物种心甘情愿地每天弯腰除草、挑水、赶鸟。可是种地能养活更多人，人口一多，就回不去了。","a":true,"pts":[["恰塔霍裕克",32.83,37.67]]},{"c":3,"y":-7500,"cam":[33,35,9],"t":"定居带来了村庄，也带来了新室友。狗是最早的家畜，驯化时间比农业还早，可能在一万五千年以前。猫则可能是自己找上门的：粮仓招来老鼠，老鼠招来猫。塞浦路斯岛上有一座约九千五百年前的墓，人和一只猫被葬在一起。","a":true,"pts":[["塞浦路斯：人与猫的合葬墓",33.3,34.75,"b"]]},{"c":4,"y":-3500,"cam":[45,32,7],"t":"公元前四千年前后，两河流域南部的乌鲁克成了世界上最早的城市之一，人口后来可能达到几万人。城里有神庙、工匠和官吏，也有一个大问题：东西太多，记不住了。谁交了几袋大麦，谁欠了几头羊，总得有个记录。","a":true,"pts":[["乌鲁克",45.64,31.32],["乌尔",46.1,30.96,"b"]],"ar":[["苏美尔",45.8,31.4,1.8]]},{"c":4,"y":-3200,"cam":[45,32,6],"t":"于是，大约公元前三千二百年，苏美尔人用芦苇杆在泥板上压出符号，这就是楔形文字的前身。最早的文字绝大多数是账本：大麦多少、啤酒多少、羊多少。说得夸张一点，人类最早写下的句子，大概就是：某某还欠两只羊。","a":true,"pts":[["乌鲁克",45.64,31.32]]},{"c":4,"y":-3100,"cam":[31,27,5],"t":"几乎同时，尼罗河畔的埃及也有了象形文字，并在约公元前三千一百年完成统一。尼罗河每年定时泛滥，留下肥沃的黑泥，埃及人就按照洪水的节奏安排一年的生活。古希腊历史学家希罗多德说得好：埃及是尼罗河的礼物。","a":true,"pts":[["孟菲斯",31.25,29.85,"l"],["底比斯",32.64,25.7]],"ar":[["尼罗河谷",31.5,27,3.5]]},{"c":4,"y":-2560,"cam":[31.1,30,12],"t":"约公元前二千五百六十年，胡夫大金字塔建成，原高约一百四十六米，在之后三千多年里一直是世界上最高的人造建筑。考古发现，修金字塔的主力并不是奴隶，而是有组织的劳工，他们有住处、有医疗，口粮里还有面包和啤酒。","a":true,"pts":[["吉萨金字塔",31.13,29.98]]},{"c":4,"y":-2600,"cam":[-40,20,1.6],"t":"当两河和尼罗河忙着建城的时候，地球另一边也没闲着。南美秘鲁的卡拉尔，在约公元前两千六百年就有了金字塔形的土台和广场，是美洲已知最早的城市之一；英国的巨石阵，也在这一千多年里分几期建成。文明并不只有一个起点。","a":true,"pts":[["卡拉尔",-77.52,-10.89],["巨石阵",-1.83,51.18],["吉萨",31.13,29.98]]},{"c":4,"y":-2500,"cam":[70,27,5],"t":"再往东，印度河流域出现了哈拉帕和摩亨佐达罗。这些城市街道横平竖直，家家户户连着排水沟，规划水平让后来许多城市汗颜。他们也有文字，刻在小小的印章上，可惜至今没人能读懂。顺便一提，金字塔建成时，北冰洋的弗兰格尔岛上还活着最后一批猛犸象。","a":true,"pts":[["哈拉帕",72.86,30.63],["摩亨佐达罗",68.14,27.33,"l"],["洛塔尔",72.25,22.52]],"ar":[["印度河文明",70.5,27,4.5]]},{"c":4,"y":-1750,"cam":[44,32,7],"t":"约公元前一千七百五十年，巴比伦国王汉谟拉比把两百八十多条法律刻在一块两米多高的黑色石碑上，如今陈列在巴黎卢浮宫。里面有著名的以眼还眼，但惩罚轻重要看身份。连卖酒的都管：女酒商若在啤酒价钱上做手脚，要被扔进水里。","a":true,"pts":[["巴比伦",44.42,32.54]]},{"c":4,"y":-1750,"cam":[46,31,8],"t":"同一时代，两河流域的乌尔城还留下了一块著名的泥板：一个叫南尼的人写信痛骂铜商埃亚纳西尔，说他卖的铜质量差，对客人还爱答不理。这块泥板现藏大英博物馆，常被称为已知最早的投诉信之一。看来，差评的历史和文字差不多一样长。","a":true,"pts":[["乌尔",46.1,30.96]]},{"c":4,"y":-1250,"cam":[113,35,7],"t":"东亚这边，河南偃师的二里头遗址可能与传说中的夏朝有关，学界仍有争论。可以确定的是商朝：公元前十三世纪前后，商王在龟甲和牛骨上刻字占卜，问下雨、问打仗，也问牙疼。据说一八九九年，王懿荣在中药龙骨上认出了这些字，甲骨文才重见天日。","a":true,"pts":[["二里头",112.69,34.69,"l"],["殷墟",114.31,36.12]],"ar":[["商",114,35,3]]},{"c":5,"y":-1300,"cam":[32,35,4.2],"t":"公元前十四到十三世纪的东地中海，是一个热闹的国际社会。埃及、赫梯、亚述、巴比伦、迈锡尼希腊，国王们互相写信称兄道弟，通用的外交语言是阿卡德语。各国之间交换黄金、木材、马匹，还有制造青铜必需的铜和锡。","a":true,"pts":[["哈图沙（赫梯）",34.62,40.02],["迈锡尼",22.76,37.73,"l"],["乌加里特",35.78,35.6],["巴比伦",44.42,32.54],["底比斯",32.64,25.7]]},{"c":5,"y":-1274,"cam":[35,32,5],"t":"约公元前一千二百七十四年，埃及法老拉美西斯二世和赫梯人在卡迭石大战一场，双方都宣称自己赢了。十几年后，两国签订了已知最早的和平条约之一，条约的复制品今天挂在纽约联合国总部。打完仗再签合同，这个流程三千多年没怎么变。","a":true,"pts":[["卡迭石",36.51,34.56],["底比斯",32.64,25.7]],"rt":[[[32.6,25.7],[31.5,30],[33.5,31.3],[35,33],[36.4,34.4]]]},{"c":5,"y":-1200,"cam":[30,37,4.5],"t":"然而就在约公元前一千二百年前后，这个国际体系在几十年内接连崩塌。赫梯首都哈图沙被焚毁，叙利亚海岸的商业名城乌加里特被毁，希腊的迈锡尼王宫纷纷倒下。乌加里特国王的一封信里写着：父亲，敌人的船来了。","a":true,"pts":[["哈图沙",34.62,40.02],["乌加里特",35.78,35.6],["迈锡尼",22.76,37.73,"l"],["特洛伊",26.24,39.96,"l"]]},{"c":5,"y":-1177,"cam":[28,33,4],"t":"埃及的神庙浮雕把这些入侵者称为海上民族。约公元前一千一百七十七年前后，拉美西斯三世打退了他们，但埃及也从此元气大伤。今天的学者认为，崩溃不是单一原因造成的：干旱、地震、饥荒、移民、贸易中断，像多米诺骨牌一样一起倒下。","a":true,"pts":[["梅迪奈特哈布神庙",32.6,25.72],["尼罗河三角洲",31,31.2,"l"]],"rt":[[[25,38],[28,35],[31.5,33],[31.3,31.5]]]},{"c":5,"y":-1050,"cam":[25,36,4],"t":"崩溃之后，希腊进入几百年的黑暗时代，连线形文字都失传了。但废墟里也长出了新东西：铁器逐渐普及，腓尼基人发展出只有二十多个字母的字母表。后来的希腊字母、拉丁字母，都是它的后代。你今天在键盘上敲的英文字母，祖上就在这片海岸。","a":true,"pts":[["比布鲁斯",35.65,34.12],["推罗",35.2,33.27,"b"],["迦太基",10.32,36.85]],"rt":[[[35.2,33.3],[30,34],[24,35],[16,37],[10.5,37]]]},{"c":5,"y":-1046,"cam":[10,30,1.1],"t":"同一时间的东方，并没有发生类似的大崩溃。约公元前一千零四十六年，周武王在牧野打败商纣王，周朝建立，后来发展出影响深远的礼乐制度和天命观念。而在大西洋彼岸的墨西哥湾，奥尔梅克人正在雕刻重达数吨到数十吨的巨石人头像。","a":true,"pts":[["牧野",113.9,35.3],["镐京",108.77,34.23,"l"],["圣洛伦索（奥尔梅克）",-94.76,17.75]]},{"c":6,"y":-800,"cam":[65,32,2.2],"t":"德国哲学家雅斯贝尔斯注意到一个奇妙的现象：大约公元前八百年到前两百年之间，中国、印度、希腊、以色列等地，几乎同时涌现出一批伟大的思想家。他把这段时期称为轴心时代。他们彼此几乎不可能见面，却都在追问：人应该怎样活着。","a":true,"ar":[["希腊",23,38.5,3],["以色列",35.3,31.8,2],["印度",83,25.5,4],["中国",115,35,5]]},{"c":6,"y":-551,"cam":[114,35,6],"t":"在中国，春秋末年礼崩乐坏。孔子生于公元前五百五十一年，他带着学生周游列国十几年，四处推销自己的政治主张，几乎没有国君真正采纳。他晚年回到鲁国教书整理典籍，据说弟子三千。一个求职屡屡碰壁的老师，后来影响了东亚两千多年。","pts":[["曲阜",116.99,35.58]],"ar":[["鲁国",117,35.6,1.2]]},{"c":6,"y":-450,"cam":[113,35,5],"t":"被尊为道家始祖的老子，生平扑朔迷离，学界对他是谁、生活在何时都有争论。传说他骑着青牛出函谷关，留下五千言的《道德经》，从此不知所终。到了战国时期，儒、墨、道、法、名、阴阳各家各显神通，史称百家争鸣。","a":true,"pts":[["函谷关",110.88,34.63,"l"],["曲阜",116.99,35.58]]},{"c":6,"y":-500,"cam":[84,25,6],"t":"在印度恒河流域，释迦族的王子悉达多放弃王位出家，据传在菩提伽耶的一棵菩提树下悟道，被尊称为佛陀。他的生卒年学界争论很大，大约在公元前五世纪前后。佛教后来走出印度，沿着商路传到中亚、中国、东南亚和日本。","a":true,"pts":[["蓝毗尼",83.28,27.47],["菩提伽耶",84.99,24.69],["鹿野苑",83.03,25.38,"l"]]},{"c":6,"y":-587,"cam":[40,32,5.5],"t":"在地中海东岸，希伯来先知们批评权贵、呼吁公义，留下了激昂的言辞。公元前五百八十七年或五百八十六年，巴比伦攻陷耶路撒冷，大批犹太人被掳往巴比伦。在流亡中，他们整理和传承自己的经典，这些文字后来深刻影响了犹太教、基督教和伊斯兰教。","a":true,"pts":[["耶路撒冷",35.23,31.78,"l"],["巴比伦",44.42,32.54]],"rt":[[[35.3,31.8],[36.5,34],[38.5,36],[41,35.5],[43.5,33.5],[44.4,32.6]]]},{"c":6,"y":-399,"cam":[23.7,38,11],"t":"在雅典，苏格拉底整天在广场上拉着人提问，一直问到对方哑口无言。他一个字的书都没写，我们知道的他，主要来自学生柏拉图等人的记录。公元前三百九十九年，他被判饮毒芹汁而死。苏格拉底、柏拉图、亚里士多德，师徒三代构成了西方哲学的接力赛。","pts":[["雅典",23.73,37.98]]},{"c":6,"y":-500,"cam":[60,30,1.6],"t":"想一想这个画面：孔子在鲁国讲学的时候，恒河边可能有人在听佛陀说法，雅典人正在建立民主制度。他们谁也不知道谁的存在，留下的思想却在两千多年后的今天，仍然被几十亿人阅读、争论和引用。","a":true,"pts":[["曲阜",116.99,35.58],["菩提伽耶",84.99,24.69],["雅典",23.73,37.98,"l"],["耶路撒冷",35.23,31.78,"b"]]},{"c":7,"y":-539,"cam":[47,32,4.5],"t":"公元前五百三十九年，波斯的居鲁士大帝几乎兵不血刃地进入巴比伦。他允许被掳的犹太人返回家乡、重建圣殿。一个刻满楔形文字的泥土圆柱记录了他的政令，后来被称为居鲁士圆柱。有人说它是最早的人权宣言，不过学界对这个说法有争论。","pts":[["帕萨尔加德",53.17,30.19],["巴比伦",44.42,32.54,"l"]],"rt":[[[53.2,30.2],[50,31.5],[47,32.6],[44.5,32.6]]]},{"c":7,"y":-500,"cam":[48,33,2.8],"t":"到大流士一世时，波斯帝国东到印度河，西到埃及和爱琴海，是当时世界上最大的帝国。帝国修了一条两千多公里的御道，沿途设驿站换马。希罗多德形容这些信使，雪、雨、酷热和黑夜都挡不住他们，这句话今天还刻在纽约一座邮局的门楣上。","a":true,"pts":[["苏萨",48.25,32.19,"b"],["萨第斯",28.04,38.49,"l"],["波斯波利斯",52.89,29.93]],"ar":[["波斯帝国",50,33,14]],"rt":[[[48.25,32.2],[45.5,34.5],[43,36.5],[38,38],[33,39],[28.1,38.5]]]},{"c":7,"y":-490,"cam":[24,38.5,10],"t":"公元前四百九十年，波斯军队在希腊的马拉松登陆，被雅典人击败。传说一名士兵一路跑回雅典报捷，喊完胜利就倒地而死，这个故事很可能是后人添加的。现代马拉松全程四十二点一九五公里，则是在一九零八年伦敦奥运会上定下的。","pts":[["马拉松",23.97,38.15],["雅典",23.73,37.98,"l"]],"rt":[[[23.97,38.15],[23.85,38.05],[23.73,37.98]]]},{"c":7,"y":-480,"cam":[23,38.5,8],"t":"十年后，波斯王薛西斯亲征。公元前四百八十年，斯巴达国王列奥尼达率领三百斯巴达勇士和几千名希腊联军，在温泉关阻击波斯大军。不久，雅典海军在萨拉米斯海湾大败波斯舰队。电影里只剩三百人，其实他们身边还有不少盟友。","pts":[["温泉关",22.54,38.8,"l"],["萨拉米斯",23.48,37.95,"l"],["雅典",23.73,37.98]]},{"c":7,"y":-447,"cam":[23.5,38,7],"t":"打赢之后，雅典迎来了黄金时代：帕特农神庙在公元前四百四十七年动工，民主制度运转起来，戏剧、哲学和历史学一起开花。不过雅典的民主只属于成年男性公民，女性、奴隶和外邦人都没有投票权。后来雅典和斯巴达内斗了二十多年，两败俱伤。","pts":[["雅典",23.73,37.98],["斯巴达",22.43,37.07,"l"]]},{"c":7,"y":-334,"cam":[50,30,2.4],"t":"希腊北方的马其顿崛起了。公元前三百三十四年，二十一岁的亚历山大率军渡海进入亚洲，打败波斯，占领埃及，在那里建了亚历山大城，一路打到印度河流域。士兵们实在不想再走了，他才掉头回来。前后十一年，走完了一条史诗级的远征路线。","pts":[["佩拉",22.52,40.76,"l"],["伊苏斯",36.2,36.85],["亚历山大城",29.92,31.2,"b"],["高加米拉",43.43,36.56],["希达斯皮斯河",73.7,32.95]],"rt":[[[22.5,40.8],[26.4,40.1],[29,39],[33,37.5],[36.2,36.8],[35.5,33.5],[34.5,31.5],[29.9,31.2],[34,31.3],[38,35.5],[43.4,36.6],[44.4,32.5],[52.9,29.9],[60,34],[66.9,36.8],[69.5,34.5],[73.7,33]]]},{"c":7,"y":-323,"cam":[60,33,1.9],"t":"公元前三百二十三年，亚历山大在巴比伦病逝，年仅三十二岁，帝国随即被部将瓜分，希腊文化却随之传遍中东，史称希腊化时代。巧的是，他出生的公元前三百五十六年，按通行说法，正是商鞅在秦国开始变法的那一年。一个在西边开疆拓土，一个在东边为统一铺路。","pts":[["巴比伦",44.42,32.54],["秦国",108.7,34.3]],"ar":[["希腊化世界",45,33,13]]},{"c":7,"y":-261,"cam":[82,23,4.5],"t":"亚历山大走后不久，印度出现了孔雀王朝。第三代君主阿育王在征服羯陵伽的战争中造成大量死亡。据他自己的碑文记载，他此后深感悔恨，转而推行佛法，把诏令刻在石柱和岩壁上，遍布各地。征服者在胜利之后公开反省战争，这在历史上并不常见。","a":true,"pts":[["华氏城",85.14,25.6],["羯陵伽",85.84,20.19]],"ar":[["孔雀王朝",80,23,9]]},{"c":8,"y":-3500,"cam":[75,47,1.7],"t":"镜头先离开城市，来到另一种文明的舞台：欧亚大草原。它从匈牙利平原一直延伸到中国东北，东西绵延约八千公里，几乎横跨半个地球。这里雨水太少，种地很难，却长满了青草。谁能驾驭吃草的动物，谁就能在这里活下去。","a":true,"ar":[["欧亚大草原",75,48,16]]},{"c":8,"y":-2200,"cam":[55,50,3],"t":"人类什么时候骑上了马？哈萨克斯坦的博泰遗址曾被认为是最早养马的地方，约五千五百年前。但二〇二一年的古DNA研究发现，今天所有家马的共同祖先，大约四千两百年前起源于伏尔加河和顿河之间的草原，随后迅速传遍了欧亚大陆。","a":true,"pts":[["博泰遗址",67.6,53.2],["伏尔加河—顿河草原",43,49,"l"]],"ar":[["家马的故乡",43,49,4]]},{"c":8,"y":-3000,"cam":[35,48,2.2],"t":"差不多同一时期，草原上的颜那亚人赶着牛车四处迁徙。古DNA研究显示，约五千年前起，他们的后代大量进入欧洲，今天许多欧洲人身上都有他们的基因。不少学者认为这与印欧语系的扩散有关：从英语、俄语到波斯语、印地语，可能有一个共同的远祖，不过学界仍有争论。","a":true,"ar":[["颜那亚文化",42,48,6]],"rt":[[[40,48],[32,48],[24,48.5],[16,50],[8,51]],[[50,47],[60,45],[66,40],[72,32],[76,28]]],"rs":"d"},{"c":8,"y":-2000,"cam":[80,42,1.8],"t":"约公元前两千年，乌拉尔山南麓的辛塔什塔人造出了带辐条车轮的轻便马车，也就是战车。轮子从笨重的实心木盘变成辐条，马车一下子快了许多。此后几百年里，战车出现在埃及、两河、印度和商朝的战场上，河南安阳殷墟就出土过商代的车马坑。","a":true,"pts":[["辛塔什塔",60.3,52.5],["殷墟车马坑",114.31,36.12]]},{"c":8,"y":-700,"cam":[60,48,2],"t":"到了公元前一千年前后，草原上出现了真正的骑马民族。古希腊人把他们统称为斯基泰人，他们活跃在黑海北岸到阿尔泰山的广大地区。希罗多德写道，他们没有城市，住在大篷车上，人人都是马背上的弓箭手。","a":true,"pts":[["黑海北岸",34,47,"l"]],"ar":[["斯基泰人的活动范围",55,48,13]]},{"c":8,"y":-650,"cam":[93.6,52,7],"t":"斯基泰人和他们的草原近亲留下了大量黄金。他们喜欢把鹿、豹和狮鹫做成扭曲盘绕的造型，学者称之为斯基泰动物纹样。在今天俄罗斯图瓦的阿尔然二号古墓里，考古学家发现了五千多件黄金制品，墓主人可能是一对草原上的王族夫妇。","a":true,"pts":[["阿尔然古墓",93.6,52]]},{"c":8,"y":-513,"cam":[32,46,4],"t":"公元前五一三年前后，波斯国王大流士亲率大军渡过多瑙河，远征斯基泰。斯基泰人不跟他正面交战，而是一路后撤，填井烧草，让波斯大军在空旷的草原上找不到敌人。据希罗多德记载，大流士最后只得撤军。这一招，后来被许多草原民族反复使用。","a":true,"pts":[["多瑙河",28.7,45.2,"l"]],"rt":[[[28.9,41],[28.5,43.5],[28.7,45.3],[30.5,46.5],[34,47.5],[37,48.5]]]},{"c":8,"y":-400,"cam":[40,46,4],"t":"古希腊神话里有一支女战士部落，叫亚马孙人。考古学家在斯基泰人的墓葬里发现，有不少女性和弓箭、长矛葬在一起，骨骼上还带着战伤。不少学者认为，亚马孙女战士的传说，可能部分来自希腊人对草原骑马女战士的见闻。","a":true,"pts":[["黑海北岸墓葬",36,47.5]]},{"c":8,"y":-450,"cam":[87.5,50,7],"t":"阿尔泰山的巴泽雷克古墓被冻土封存了两千多年，里面保存着毛毡、丝绸和马具，还有一块迄今已知最古老的栽绒地毯。一九九三年，考古学家在附近的乌科克高原发现了一位女子的冰冻遗体，人称冰公主，她的肩上还留着一只鹿身鹰嘴神兽的精美纹身。","a":true,"pts":[["巴泽雷克",88,50.7],["乌科克高原",87.6,49.4,"b"]]},{"c":8,"y":-300,"cam":[77,43.5,7],"t":"在今天哈萨克斯坦的伊塞克，考古学家发现了一座约公元前四到三世纪的古墓，墓主人全身衣服缀满黄金饰片，人称金人。墓主人的性别和身份学界还有争论，但金人已经成了哈萨克斯坦的象征之一，阿拉木图独立纪念碑的顶上站着的就是他。","a":true,"pts":[["伊塞克金人墓",77.5,43.35],["阿拉木图",76.9,43.24,"b"]]},{"c":8,"y":-300,"cam":[60,45,2.4],"t":"草原民族的看家本领是骑射。他们用木头、兽角和筋层层粘合成复合弓，短小有力，适合在马背上拉开。他们还有一手绝招：假装撤退，在马上回身放箭。后来罗马人就在帕提亚人这一招下吃过大亏，这种射法常被称为帕提亚回马箭。","a":true},{"c":8,"y":-209,"cam":[108,43,3.2],"t":"镜头转到草原东部。公元前二〇九年，匈奴的冒顿杀父自立为单于，迅速统一了蒙古高原的各个部落，建立起一个强大的草原帝国。几乎同一时间，秦朝在起义中崩溃，中原陷入楚汉相争。草原和农耕世界，同时进入了新的时代。","pts":[["蒙古高原",103,47]],"ar":[["匈奴",105,46,9]]},{"c":8,"y":-200,"cam":[112,40,6],"t":"公元前二〇〇年，刚刚建立汉朝的刘邦亲率大军北击匈奴，却在白登山被冒顿的骑兵围困了七天七夜，据说靠给单于的阏氏送礼才得以脱身。此后几十年，汉朝只能采取和亲政策，嫁公主、送丝绸和粮食，换取边境的安宁。","pts":[["白登山",113.4,40.15],["长安",108.94,34.26,"b"]]},{"c":8,"y":-119,"cam":[108,44,4],"t":"到了汉武帝时期，汉朝国力强盛，决定反击。卫青和霍去病多次率领骑兵深入草原。公元前一一九年的漠北之战，霍去病一路追击到狼居胥山，留下了封狼居胥的典故。他去世时年仅二十多岁。连年战争，让双方都付出了沉重的代价。","pts":[["长安",108.94,34.26],["狼居胥山（一说今蒙古国境内）",108.5,48.5]],"rt":[[[112.5,40.5],[111,43],[109.5,46],[108.6,48.3]]]},{"c":8,"y":-165,"cam":[82,40,2.4],"t":"匈奴的崛起，在欧亚大陆上引发了连锁反应。原本生活在河西走廊一带的月氏人被匈奴打败，被迫西迁，一路走到阿姆河流域，也就是张骞千辛万苦要寻找的大月氏。草原上的一次碰撞，就这样把一群人推到了几千公里之外。","a":true,"pts":[["河西走廊",100,39],["阿姆河流域（大月氏）",66.9,37,"l"]],"rt":[[[100,39],[94,40.5],[88,43],[80,43],[74,41],[69,38.5],[67,37.2]]],"rs":"d"},{"c":8,"y":127,"cam":[60,33,1.6],"t":"公元一世纪，大月氏的一支崛起，建立了贵霜帝国，统治今天的阿富汗、巴基斯坦和印度北部，约二世纪的迦腻色伽王时期最为强盛。那时欧亚大陆从西到东排着四大帝国：罗马、安息、贵霜和东汉，丝绸之路就从它们中间穿过。","a":true,"ar":[["罗马",15,41,10],["安息",53,33,8],["贵霜",72,31,7],["东汉",110,33,10]]},{"c":8,"y":150,"cam":[70,33,5],"t":"贵霜的钱币特别有意思：上面有用希腊字母写的铭文，刻着希腊神、波斯神、印度神，还有佛陀。一个帝国的硬币，就像一本多语种的宗教百科全书。这恰好说明，贵霜站在各种文明的十字路口上。","a":true,"pts":[["布路沙布逻（今白沙瓦）",71.57,34,"b"],["马图拉",77.67,27.49]],"ar":[["贵霜",70,32,6]]},{"c":8,"y":150,"cam":[72,34.5,7],"t":"在贵霜控制的犍陀罗地区，诞生了一种独特的佛像艺术。佛陀的面容带着希腊雕像的味道，衣褶像罗马长袍。犍陀罗是最早塑造佛陀形象的地区之一，这种风格后来沿着丝绸之路东传，影响了新疆、敦煌乃至云冈石窟的佛像。","a":true,"pts":[["犍陀罗",72,34],["塔克西拉",72.83,33.75,"b"]]},{"c":8,"y":167,"cam":[90,37,2.4],"t":"东汉后期，来自安息的安世高和来自贵霜的支娄迦谶先后来到洛阳翻译佛经，他们是最早把佛经大量译成汉文的人。佛教传入中国，走的正是草原和绿洲之间的这条路，而领路的，有很多是中亚的僧人和商人。","a":true,"pts":[["洛阳",112.45,34.62],["贵霜",70,34]],"rt":[[[70,34.5],[74,37.5],[76,39.5],[82,41.7],[89,42.8],[94.7,40.1],[100,39],[104,36],[109,34.3],[112.4,34.6]]]},{"c":8,"y":89,"cam":[104,45,4],"t":"公元一世纪，匈奴分裂为南北两部，南匈奴归附汉朝。公元八十九年，东汉窦宪大破北匈奴，在燕然山刻石记功，铭文由班固撰写。二〇一七年，中蒙两国考古学家在蒙古国的山崖上确认了这处摩崖石刻，史书里的记载得到了证实。","pts":[["燕然山铭（今蒙古国杭爱山）",102.5,45.2],["洛阳",112.45,34.62]]},{"c":8,"y":156,"cam":[110,45,3.2],"t":"北匈奴一部分向西远走，另一部分融入了新兴的鲜卑。鲜卑人后来大举南下，建立了北魏等政权，深刻地参与了中国历史。至于四世纪出现在欧洲的匈人，是否就是西迁匈奴的后代，前面讲过，学界还在争论。","a":true,"ar":[["鲜卑",115,45,8]]},{"c":8,"y":415,"cam":[100,38,2.6],"t":"草原和农耕世界交流的另一项成果是马镫。有了马镫，骑手能稳稳地踩在马上挥舞兵器。目前已知最早的马镫证据都来自中国：三国和西晋的陶俑上已出现单边马镫，辽宁北燕冯素弗墓出土了现存最早的一对实物马镫。马镫后来一路西传，大约八世纪在欧洲普及。","a":true,"pts":[["长沙（西晋陶俑）",112.94,28.23],["北票（冯素弗墓）",120.77,41.8]]},{"c":8,"y":300,"cam":[75,43,1.6],"t":"草原民族常被描述成劫掠者，但他们同样是牧人、工匠、商人和信使。丝绸、马匹、毛皮和金属器物经由他们在东西方之间流动，宗教和技术也随之传播。没有草原上的骑手，欧亚大陆的两端也许要晚得多才会认识彼此。","a":true,"rt":[[[115,41],[100,43],[85,45],[70,46],[55,47],[40,47],[28,46]]]},{"c":8,"y":-221,"cam":[100,42,2],"t":"草原上的故事还远远没有结束。几百年后，突厥人、契丹人和蒙古人还会一次又一次从这里出发，改写欧亚大陆的地图。不过现在，让我们先回到长城以南：一个统一的帝国，即将在战国的硝烟中诞生。"},{"c":9,"y":-221,"cam":[112,34,4],"t":"公元前二百二十一年，秦王嬴政灭掉六国，自称始皇帝。他统一文字和度量衡，连马车两个轮子之间的距离都统一了，这样车轮在全国的路上都能压进同样的车辙。他还把各国的长城连接起来，修驰道、筑宫殿，还在骊山脚下修了一座地下军团。","pts":[["咸阳",108.7,34.33]],"ar":[["秦",112,33,8]]},{"c":9,"y":-210,"cam":[109.3,34.4,12],"t":"一九七四年，陕西临潼的农民打井时挖出了陶片，秦始皇陵兵马俑就此重见天日。据估计，几个陶俑坑里有约八千件兵马俑，据说几乎每张脸都不一样。可惜秦朝本身只存在了十几年，始皇帝死后没几年，就在大起义中崩溃了。","pts":[["秦始皇陵兵马俑",109.27,34.38]]},{"c":9,"y":-202,"cam":[110,33,3.2],"t":"公元前二百零二年，刘邦建立汉朝。汉朝前后延续了约四百年，汉人、汉字、汉语，这些名字都和它有关。公元二年的户口统计显示，汉朝登记人口接近六千万，这是世界上保存至今最早的较完整人口统计之一。","pts":[["长安",108.94,34.26],["洛阳",112.45,34.62,"b"]],"ar":[["汉",112,33,9]]},{"c":9,"y":-138,"cam":[88,40,3],"t":"公元前一百三十八年前后，汉武帝派张骞出使西域，想联合大月氏夹击匈奴。张骞刚出发就被匈奴扣留了十年，还在那里娶妻生子，逃出后继续西行。他出发时一百多人，十三年后回到长安时只剩两人。联盟没谈成，却打开了通往西方的大门。","a":true,"pts":[["长安",108.94,34.26],["大宛",71.8,40.6],["大月氏（巴克特里亚）",66.9,36.76,"l"]],"rt":[[[108.9,34.3],[103.8,36],[98.5,39.7],[94.7,40.1],[89,42.8],[82,41.7],[76,39.5],[71.8,40.6],[68.8,38.5],[66.9,36.8]]]},{"c":9,"y":-100,"cam":[65,37,2.2],"t":"从此，丝绸、漆器向西，葡萄、苜蓿、良马向东。这条商路后来被称为丝绸之路，不过这个名字通常认为是德国地理学家李希霍芬在一八七七年提出的，汉朝人并不这么叫。它也不是一条路，而是一张由无数商队、绿洲和中间商组成的大网。","a":true,"pts":[["长安",108.94,34.26],["敦煌",94.66,40.14],["喀什",75.99,39.47],["撒马尔罕",66.96,39.65,"t"],["泰西封",44.58,33.09,"b"],["安条克",36.16,36.2,"l"]],"rt":[[[108.9,34.3],[103.8,36],[94.7,40.1],[89,42.8],[82,41.7],[76,39.5],[67,39.6],[62,37.6],[54,36.5],[44.6,33.1],[40,35.3],[36.2,36.2]]]},{"c":9,"y":-218,"cam":[6,41,4.5],"t":"同一时间的地中海，罗马还是个共和国，由元老院和每年选出的两位执政官管理。公元前二百一十八年，迦太基名将汉尼拔带着几十头战象翻越阿尔卑斯山，奇袭意大利。他在意大利转战了十几年，却始终没能攻下罗马城。","pts":[["迦太基",10.32,36.85],["罗马",12.5,41.9],["新迦太基",-0.98,37.6,"l"]],"rt":[[[-0.98,37.6],[0.5,40],[2.5,42.3],[4.6,43.7],[6.5,45],[7.6,45.1],[9.2,45.4],[11.3,44.5],[12.3,43.1]]]},{"c":9,"y":-44,"cam":[12,43,7],"t":"公元前一百四十六年，迦太基被罗马彻底摧毁。共和国越打越大，权力也越来越集中。公元前四十九年，凯撒率军渡过卢比孔河，掀起内战；公元前四十四年三月十五日，他在元老院遇刺身亡。他的养子屋大维最终胜出，罗马从此进入帝国时代。","pts":[["卢比孔河",12.4,44.1],["罗马",12.5,41.9]],"rt":[[[12.4,44.1],[12.6,43.5],[12.7,42.8],[12.5,41.95]]]},{"c":9,"y":-30,"cam":[30,30.5,8],"t":"说到这个时代，不能不提埃及女王克利奥帕特拉。她死于公元前三十年，是托勒密王朝最后一位实际统治者。有个冷知识：她离一九六九年人类登月的时间，比离大金字塔建成的时间还要近。在她眼里，金字塔已经是两千多年前的古董了。","pts":[["亚历山大城",29.92,31.2],["吉萨金字塔",31.13,29.98]]},{"c":9,"y":100,"cam":[65,35,1.5],"t":"公元一、二世纪，欧亚大陆两端各有一个庞大的帝国：东边的汉朝，西边的罗马，人口都在几千万的级别。罗马贵族迷上了中国丝绸，老普林尼抱怨说，每年都有大笔钱财流向东方，只为买奢侈品。可两个帝国从没正式打过交道，中间隔着安息等中间商。","a":true,"ar":[["罗马帝国",18,40,11],["安息",53,33,8],["汉",110,33,11]]},{"c":9,"y":97,"cam":[70,36,2.6],"t":"公元九十七年，东汉西域都护班超派甘英出使大秦，也就是罗马。甘英一路走到条支的海边，一般认为在波斯湾一带，当地的安息船夫告诉他：渡海顺风要三个月，逆风可能要两年，很多人会思念家乡而死。甘英听完就回去了。有人怀疑，安息人是怕中间商的生意被抢。","pts":[["洛阳",112.45,34.62],["条支（一说波斯湾）",47.8,30.5,"b"]],"rt":[[[112.4,34.6],[108.9,34.3],[103.8,36],[94.7,40.1],[89,42.8],[82,41.7],[76,39.5],[67,39.6],[62,37.6],[54,35.5],[48,31]]]},{"c":9,"y":166,"cam":[110,25,4],"t":"公元一百六十六年，东汉史书记载，大秦王安敦派使者从日南郡，也就是今天的越南中部，来到洛阳献礼。安敦很可能就是罗马皇帝马可·奥勒留·安东尼。不过礼物是象牙、犀角和玳瑁，全是东南亚特产，很多学者认为这些人其实是自称使节的商人。","pts":[["日南郡",107.1,16.8],["洛阳",112.45,34.62]],"rt":[[[107.1,16.8],[108.5,21],[110.5,25.5],[112.5,30],[112.45,34.5]]]},{"c":9,"y":105,"cam":[60,38,1.6],"t":"这一时期，两边都有大事。公元七十九年，维苏威火山喷发，掩埋了庞贝城，也意外地把一座罗马城市的日常生活封存了下来。公元一百零五年，东汉的蔡伦改进了造纸术。此前已经有纸，但他让纸变得便宜好用，这件事对世界的影响，可能比很多场战争都大。","pts":[["庞贝",14.49,40.75],["洛阳",112.45,34.62]]},{"c":10,"y":-1500,"cam":[76,27,3.6],"t":"镜头来到南亚次大陆。印度河流域的城市在公元前一九〇〇年前后逐渐衰落，原因可能和气候变化、河流改道有关。此后，印度北部进入吠陀时代。说一种古老印欧语言的人群来到这里，他们的颂歌后来被编成《梨俱吠陀》，是现存最古老的印欧语文献之一。","a":true,"pts":[["摩亨佐达罗（已衰落）",68.14,27.33,"l"],["旁遮普",74.5,31]],"ar":[["早期吠陀文化",74,30.5,3.5]]},{"c":10,"y":-1200,"cam":[76,29,4.5],"t":"《梨俱吠陀》有一千多首颂歌。神奇的是，很长时间里它们完全靠背诵传承。婆罗门为了一字不差，发明了正着背、倒着背、交错着背等多种记忆方法。二〇〇三年，联合国教科文组织把吠陀诵唱宣布为人类口头和非物质遗产代表作。","a":true,"ar":[["吠陀的故乡",75,30,4]]},{"c":10,"y":-800,"cam":[80,26,4],"t":"吠陀时代后期，社会逐渐分成四个等级，叫瓦尔那：祭司婆罗门、武士刹帝利、从事农商的吠舍和从事劳作的首陀罗。后来它又和成千上万的职业群体交织在一起，形成复杂的种姓制度，在印度历史上影响深远。今天的印度宪法明确禁止种姓歧视。","a":true,"ar":[["恒河平原",82,26,5]]},{"c":10,"y":-600,"cam":[82,26,4.5],"t":"公元前六世纪前后，恒河流域出现了许多争雄的国家，佛经里称为十六大国。城市重新兴起，钱币开始流通，铁器让人们开垦茂密的森林。就是在这种热闹的环境里，佛陀和耆那教的大雄提出了新的思想。","a":true,"pts":[["王舍城（摩揭陀）",85.42,25.03],["舍卫城（拘萨罗）",82.04,27.51,"l"],["吠舍离",85.13,25.99,"t"]]},{"c":10,"y":-326,"cam":[73,32.5,7],"t":"公元前三二六年，亚历山大的大军在希达斯皮斯河畔打败了当地国王波鲁斯。据古希腊史家记载，亚历山大问他想受到怎样的对待，波鲁斯回答：像对待一位国王那样。亚历山大很欣赏他，让他继续统治。不久，疲惫的士兵拒绝再往东走。","pts":[["希达斯皮斯河",73.7,32.95],["塔克西拉",72.83,33.75,"l"]]},{"c":10,"y":-322,"cam":[82,24,3.6],"t":"亚历山大走后，旃陀罗笈多建立了孔雀王朝，定都华氏城，也就是今天的巴特那。传统说法认为，他的谋士考底利耶写了一部治国之书《政事论》，从税收、间谍到外交无所不谈，常被拿来和马基雅维利的《君主论》相比。成书年代和作者，学界有争论。","a":true,"pts":[["华氏城（今巴特那）",85.14,25.6]],"ar":[["孔雀王朝",80,24,9]]},{"c":10,"y":-300,"cam":[85.1,25.6,9],"t":"塞琉古王朝派到孔雀宫廷的使节麦加斯梯尼，描述过华氏城：城市沿着恒河延伸，围着木头城墙，有几百座塔楼。他的原书早已失传，只在后来希腊作家的引用里留下片段。这是外国人对印度最早的详细记载之一。","a":true,"pts":[["华氏城",85.14,25.6]]},{"c":10,"y":-250,"cam":[80,24,4],"t":"前面讲过，阿育王在战争之后转向佛法。他留下的狮子柱头，四只雄狮背对背站立，如今是印度的国徽；柱头上的法轮，出现在印度国旗正中。两千多年前一位国王的作品，就这样印在了今天的每一张印度钞票上。","a":true,"pts":[["鹿野苑狮子柱头",83.03,25.38],["桑奇",77.74,23.48,"l"]]},{"c":10,"y":-250,"cam":[80,24,3.2],"t":"阿育王的诏令大多用婆罗米字母刻成。这种文字后来被人遗忘，直到一八三七年才由英国学者詹姆斯·普林塞普破译。今天南亚和东南亚的许多文字，比如印地语用的天城体、泰文、高棉文，都是婆罗米字母的后代。","a":true,"ar":[["阿育王诏令分布",79,24,9]]},{"c":10,"y":-150,"cam":[77.7,23.5,9],"t":"孔雀王朝之后，印度又陷入分裂，佛教却继续兴盛。桑奇大塔的石门上刻满了佛陀前世的故事，但有个奇特之处：早期佛教艺术在好几百年里都不直接雕刻佛陀本人，而是用菩提树、法轮和足印来象征他。","a":true,"pts":[["桑奇大塔",77.74,23.48]]},{"c":10,"y":-150,"cam":[73,33,5],"t":"印度西北部还出现过希腊人的王国。其中一位国王米南德，在佛经《那先比丘经》里，同高僧那先展开了一场关于灵魂和自我的长篇辩论。据佛经记载，国王最后被说服了。一位希腊国王与一位印度僧人的对话，堪称古代版的东西方论坛。","a":true,"pts":[["奢羯罗（今锡亚尔科特）",74.53,32.49],["塔克西拉",72.83,33.75,"l"]],"ar":[["印度-希腊王国",72,33,4]]},{"c":10,"y":50,"cam":[65,15,2.4],"t":"公元一世纪，希腊和罗马的商船已经掌握了印度洋季风的规律，从红海直航印度。南印度的港口挤满了外国商人，考古学家在这里发现了大量罗马金币和地中海式的双耳陶罐。罗马人买走胡椒、宝石和细棉布，付的是真金白银。","a":true,"pts":[["穆济里斯",76.2,10.15],["阿里卡梅杜",79.85,11.9],["贝勒尼基（红海港口）",35.47,23.91,"l"]],"rt":[[[35.5,23.9],[38,20],[42,14],[44,12.3],[55,12],[66,11],[76.1,10.2]]]},{"c":10,"y":100,"cam":[78,11,5],"t":"在印度最南端，泰米尔人的朱罗、潘地亚、哲罗三个王国互相争雄。这一时期的泰米尔语诗歌被称为桑伽姆文学，有爱情诗也有战争诗，是印度最古老的非梵语文学之一。印度的历史，从来不只是恒河边上的故事。","a":true,"ar":[["朱罗",79.5,11,1.6],["潘地亚",78,9.5,1.4],["哲罗",76.3,10.6,1.4]]},{"c":10,"y":300,"cam":[80,24,3],"t":"这几百年里，印度教逐渐成形，对毗湿奴和湿婆的信仰日益兴盛，两大史诗《摩诃婆罗多》和《罗摩衍那》也大致定型。《摩诃婆罗多》约有十万颂，常被称为世界上最长的史诗之一，篇幅大约是荷马两部史诗加起来的十倍。","a":true},{"c":10,"y":320,"cam":[80,25,3.6],"t":"公元三二〇年前后，旃陀罗笈多一世在恒河流域建立笈多王朝。他和孔雀王朝的开国君主同名，但两人相隔六百多年，并没有关系。笈多王朝统一了印度北部的大部分地区，开启了被后人称为古典时代的繁荣期。","a":true,"pts":[["华氏城",85.14,25.6]],"ar":[["笈多王朝",80,25,8]]},{"c":10,"y":400,"cam":[78,23,5],"t":"笈多时代也是梵语文学的黄金时期。诗人迦梨陀娑写下了戏剧《沙恭达罗》，讲国王和林中少女的爱情。一千多年后，这部剧被译成欧洲语言，德国诗人歌德读后赞不绝口，还专门写诗称颂它。","a":true,"pts":[["优禅尼",75.78,23.18]]},{"c":10,"y":405,"cam":[90,25,2.4],"t":"这时，东晋僧人法显已年过六十，他从长安出发，经陆路到印度求法，再从斯里兰卡坐船经南海回国，前后十几年。他的《佛国记》记录了笈多王朝的社会：刑罚宽松，百姓安乐，很多人不杀生、不饮酒。","a":true,"pts":[["长安",108.94,34.26],["华氏城",85.14,25.6],["师子国（斯里兰卡）",80.7,7.9,"l"],["青州（登陆）",120.4,36.3]],"rt":[[[108.9,34.3],[103.8,36],[94.7,40.1],[82,41.7],[76,39.5],[72,35.5],[74,31],[80,27],[85.1,25.6],[81,12],[80.6,7.5],[90,5],[100,5],[105,0],[110,10],[116,22],[121,31],[120.4,36.2]]]},{"c":10,"y":450,"cam":[85.4,25.1,9],"t":"笈多时期还建立了那烂陀寺，它后来发展成规模庞大的佛教学府，鼎盛时据说有上万名师生，玄奘和义净都在这里求过学。十二世纪末，那烂陀在战乱中被毁，据说藏书烧了好几个月。","a":true,"pts":[["那烂陀",85.44,25.14]]},{"c":10,"y":480,"cam":[75.7,20.5,9],"t":"马哈拉施特拉的阿旃陀石窟开凿在一条马蹄形峡谷的崖壁上，洞里的壁画描绘了佛陀的前世故事和宫廷生活，色彩至今依稀可辨。这些石窟后来被丛林掩没，直到一八一九年，一位英国军官打猎时才偶然重新发现了它们。","a":true,"pts":[["阿旃陀石窟",75.7,20.55]]},{"c":10,"y":499,"cam":[84,25,6],"t":"公元四九九年，数学家阿耶波多完成了一部天文数学著作。他给出的圆周率约为三点一四一六，还提出星空看起来在转动，是因为地球在自转。一九七五年，印度把自己的第一颗人造卫星命名为阿耶波多号。","pts":[["华氏城",85.14,25.6]]},{"c":10,"y":500,"cam":[75,30,3],"t":"五世纪后期起，来自中亚的嚈哒人等不断入侵，笈多王朝在内忧外患中逐渐衰落，六世纪中叶走向终结，印度北部再次分裂。不过，笈多时代留下的数字、文学、天文和宗教艺术，早已随着商人和僧侣传到了东南亚和东亚。","a":true,"ar":[["嚈哒人",68,36,5]],"rt":[[[68,37],[71,34],[73.5,31.5],[76,29]]]},{"c":10,"y":500,"cam":[95,12,2.4],"t":"印度文化向东南亚传播，靠的主要不是征服，而是商人、僧侣和婆罗门。梵语、印度教和佛教一起越过孟加拉湾，后来造就了吴哥窟和婆罗浮屠。这个故事，我们讲到东南亚的时候再展开。","a":true,"rt":[[[86,21],[92,15],[97,10],[101,6]],[[80,12],[88,8],[96,5],[104,1],[110,-6]]]},{"c":10,"y":550,"cam":[70,30,2],"t":"印度人还发明了国际象棋的祖先恰图兰卡，大约在六世纪出现。棋盘上有象、马、车和步兵，正好对应古印度军队的四个兵种。它后来传到波斯，又经阿拉伯世界传入欧洲，慢慢变成了今天的国际象棋。","a":true,"rt":[[[78,25],[65,30],[53,33],[44,34],[36,36],[25,38],[12,42]]]},{"c":11,"y":235,"cam":[60,38,1.5],"t":"公元三世纪，罗马陷入危机，五十年里换了二十多位皇帝，大多死于非命。同一时期，东方的汉朝已在公元二百二十年终结，中国进入三国时代。欧亚大陆的两端，几乎同时陷入了分裂和动荡。","ar":[["罗马（三世纪危机）",18,41,10],["三国",112,32,8]]},{"c":11,"y":330,"cam":[29,41,8],"t":"君士坦丁大帝在公元三百一十三年承认基督教合法，又在三百三十年把都城迁到拜占庭，改名君士坦丁堡，也就是今天的伊斯坦布尔。这座城卡在欧亚交界，三面环水，城墙坚固，在之后一千多年里一直是东方罗马的心脏。","pts":[["君士坦丁堡",28.98,41.01]]},{"c":11,"y":376,"cam":[35,46,2.8],"t":"四世纪后期，来自欧亚草原的匈人西进，引发了连锁反应。哥特人被挤得渡过多瑙河，进入罗马境内。公元三百七十八年的阿德里安堡战役，罗马皇帝瓦伦斯战死。有人认为匈人与中国史书里的匈奴有关，但证据不足，学界一直有争论。","pts":[["阿德里安堡",26.56,41.68,"b"],["多瑙河",28.5,45.3,"l"]],"rt":[[[75,47],[65,48],[55,47.5],[47,47],[40,47.2],[33,46.8],[29,46]]]},{"c":11,"y":383,"cam":[114,34,4.5],"t":"同一时期的中国，也在经历民族大迁徙。西晋灭亡后，北方先后出现许多政权，南方则有东晋和后来的南朝。公元三百八十三年的淝水之战，东晋以少胜多。北魏后来开凿了云冈和龙门石窟。南北对峙了很久，直到五百八十九年，隋朝才重新统一。","pts":[["淝水",116.8,32.6],["建康",118.8,32.06,"b"],["平城",113.3,40.08],["云冈石窟",113.12,40.11,"l"]]},{"c":11,"y":410,"cam":[12,42,4],"t":"公元三百九十五年，罗马帝国正式分为东西两半。四百一十年，西哥特人攻入罗马城，这是八百年来罗马城第一次被外敌攻陷。四百五十五年，汪达尔人再次洗劫罗马，英语里表示恶意破坏的词，就来自他们的名字。","pts":[["罗马",12.5,41.9],["迦太基",10.32,36.85]],"rt":[[[-5.5,36],[-2,35.4],[3,36.7],[10.3,36.9],[11.5,39],[12.5,41.8]]]},{"c":11,"y":476,"cam":[12,43,6],"t":"公元四百七十六年，日耳曼将领奥多亚克废黜了西罗马最后一位皇帝。这位少年皇帝的名字叫罗慕路斯·奥古斯都路，恰好把罗马的建城者罗慕路斯和第一位皇帝奥古斯都合在了一起，奥古斯都路的意思是小奥古斯都。他没有被杀，而是领了一笔年金去养老了。","pts":[["拉文纳",12.2,44.42],["罗马",12.5,41.9]]},{"c":11,"y":537,"cam":[22,38,3.2],"t":"西罗马亡了，东罗马却又活了近千年。他们始终自称罗马人，拜占庭帝国这个叫法是后世学者起的。查士丁尼一世夺回了意大利和北非，公元五百三十七年建成圣索菲亚大教堂。但从五百四十一年起，一场被称为查士丁尼瘟疫的鼠疫暴发，夺去了大量人口。","pts":[["君士坦丁堡",28.98,41.01]],"ar":[["东罗马",28,38,9]]},{"c":11,"y":500,"cam":[80,23,4],"t":"在印度，笈多王朝被称为古典黄金时代。印度数学家发展出带零的十进制计数法，公元六百二十八年，婆罗摩笈多系统地写下了零的运算规则。这套数字后来经阿拉伯人传到欧洲，就是今天所说的阿拉伯数字。没有它，你的手机里连一个数字都存不下。","a":true,"pts":[["华氏城",85.14,25.6]],"ar":[["笈多王朝",81,25,7]]},{"c":12,"y":-27000,"cam":[20,-10,2.2],"t":"先从非洲最南端说起。纳米比亚的一个洞穴里，出土过画着动物的石板，距今两万多年，是非洲已知最古老的艺术品之一。非洲南部的桑人狩猎采集者在岩壁上画了上万年，基因研究显示，他们所属的人群是现代人类中最早分化出去的支系之一。","pts":[["阿波罗十一号洞穴（纳米比亚）",17.1,-27.75,"l"]],"ar":[["桑人的故土",22,-24,9]]},{"c":12,"y":-6000,"cam":[15,20,2.6],"t":"你可能想不到，大约一万一千年到五千年前，撒哈拉曾经是一片稀树草原，有湖泊、河马和鳄鱼，埃及西南部一处岩画上甚至画着游泳的人。后来气候逐渐变干，人们纷纷迁往尼罗河谷和萨赫勒地区，这也许推动了埃及文明的兴起。","a":true,"pts":[["游泳者洞穴",25.8,23.5]],"ar":[["绿色撒哈拉",10,21,13]]},{"c":12,"y":-2500,"cam":[31,20,5],"t":"一说到古代非洲，很多人只想到埃及。其实在尼罗河上游，今天的苏丹北部，很早就有一个强大的王国：库施。约公元前两千五百年，克尔玛城已经是繁荣的中心，埃及人从这里换取黄金、象牙和乌木。","a":true,"pts":[["克尔玛",30.4,19.6,"l"],["底比斯",32.64,25.7]],"ar":[["库施",31.5,18.5,3]]},{"c":12,"y":-2000,"cam":[32,22,5],"t":"埃及人把这一带叫作努比亚，有人认为这个名字和古埃及语里的黄金有关，不过学界有争论。努比亚的弓箭手非常有名，埃及人甚至称这里为弓之地。两国几千年来时而交战、时而通商，关系错综复杂。","a":true,"ar":[["努比亚",32,19.5,3.5]]},{"c":12,"y":-1000,"cam":[22,-5,1.9],"t":"非洲历史上规模最大的迁徙之一，是班图人的扩散。约四五千年前起，说班图语的农人从今天喀麦隆与尼日利亚交界一带出发，带着农业和后来的铁器，在两三千年里逐渐散布到非洲中部、东部和南部。今天约有三亿多人说班图语，斯瓦希里语、祖鲁语都是其中的成员。","a":true,"pts":[["班图人的起点",10,6,"l"]],"rt":[[[10,6],[15,2],[20,-3],[27,-5],[32,-2],[36,-4]],[[10,6],[13,-2],[15,-10],[20,-16],[27,-22],[30,-28]]],"rs":"d"},{"c":12,"y":-747,"cam":[32,24,3.6],"t":"约公元前一五〇〇年，埃及新王国征服了库施。但七百多年后，局面反转了：公元前八世纪，库施国王皮耶挥师北上，征服了整个埃及，开创了埃及第二十五王朝。他们后来被称为黑法老，统治埃及将近一个世纪。","a":true,"pts":[["纳帕塔",31.83,18.53],["孟菲斯",31.25,29.85,"l"]],"rt":[[[31.8,18.6],[33,21],[32.6,25.7],[31.4,28],[31.25,29.8]]]},{"c":12,"y":-671,"cam":[31.5,27,5],"t":"第二十五王朝的塔哈尔卡还出现在《圣经》里。他在位时，亚述大军入侵埃及，公元前六七一年攻占孟菲斯，库施国王们最终被赶回南方。不过他们并没有消失，而是在努比亚继续统治了将近一千年。","pts":[["孟菲斯",31.25,29.85]],"rt":[[[36,33],[34,31.3],[32.3,30.9],[31.3,29.9]]]},{"c":12,"y":-500,"cam":[8,9.5,6],"t":"西非尼日利亚中部，约公元前一千五百年到公元一世纪，存在着诺克文化。诺克人留下了许多陶塑人头，眼睛呈三角形或半圆形，发型精致。他们也是撒哈拉以南最早冶铁的人群之一，大约公元前五百年就会炼铁了。","a":true,"pts":[["诺克",8,9.6]],"ar":[["诺克文化",7.8,9.5,2]]},{"c":12,"y":-250,"cam":[-4.5,14,7],"t":"在马里的尼日尔河内陆三角洲，杰内-杰诺古城约在公元前三世纪开始有人居住，后来发展成数千人以上的城镇。过去有人以为西非城市是阿拉伯商人带来的，杰内-杰诺证明，早在跨撒哈拉贸易兴盛之前，西非就有了自己的城市。","a":true,"pts":[["杰内-杰诺",-4.55,13.9]]},{"c":12,"y":-300,"cam":[33.7,17,8],"t":"库施后来以麦罗埃为都城。苏丹境内有两百多座金字塔，数量比埃及还多，只是更小、更尖。麦罗埃人发展出了自己的文字，学者们已经能读出每个字母的发音，却仍然看不懂大部分词句的意思。","a":true,"pts":[["麦罗埃金字塔群",33.75,16.94]]},{"c":12,"y":-24,"cam":[33,20,5],"t":"麦罗埃还是古代非洲重要的炼铁中心，城外堆着大片炉渣。库施的女王很有名，被罗马人称为坎迪斯。公元前一世纪末，一位据说独眼的女王阿玛尼雷纳斯和罗马军队打过仗，最后双方签订的和约，一般认为对库施相当有利。","a":true,"pts":[["麦罗埃",33.75,16.94],["阿斯旺",32.9,24.09,"l"]]},{"c":12,"y":50,"cam":[45,0,3],"t":"公元一世纪的一本希腊航海手册《厄立特里亚海周航记》，记载了红海和东非沿海的贸易港口，那里出口象牙、犀角和龟甲。东非海岸与阿拉伯、印度的海上贸易由此可见一斑，后来，斯瓦希里文明就在这片海岸上成长起来。","a":true,"pts":[["阿杜利斯",39.65,15.27],["东非海岸",39.5,-6]],"rt":[[[39.6,15.2],[43.3,12.6],[51,11.5],[48,4],[43,-1],[39.6,-6]]]},{"c":12,"y":100,"cam":[10,20,2.6],"t":"约公元一世纪前后，骆驼在北非普及开来。骆驼能好些天不喝水，背着重物穿越沙漠，被称为沙漠之舟。有了它，跨越撒哈拉的长途贸易才真正成为可能：北非的盐和西非的黄金开始穿过大沙漠交换，为后来西非的黄金帝国埋下了伏笔。","a":true,"rt":[[[-5,31],[-4,24],[-3,18],[-3,16.8]],[[10,33],[11,25],[8,18],[5,14]]]},{"c":12,"y":100,"cam":[39,14,6],"t":"在东非的埃塞俄比亚高原，公元一世纪前后兴起了阿克苏姆王国。它控制着红海贸易，出口象牙、黄金和香料，还铸造自己的金币。三世纪的波斯先知摩尼曾把阿克苏姆列为当时世界四大强国之一，和罗马、波斯、中国并列。","a":true,"pts":[["阿克苏姆",38.72,14.13],["阿杜利斯（港口）",39.65,15.27]],"ar":[["阿克苏姆王国",38.8,14.5,2.6]]},{"c":12,"y":300,"cam":[38.7,14.1,10],"t":"阿克苏姆人竖起了巨大的花岗岩方尖碑，最高的一座约三十三米，可能在竖立时就倒塌了，至今碎成几段躺在地上。另一座约二十四米高的石碑在一九三七年被意大利人运到罗马，直到二〇〇五年才归还埃塞俄比亚。","a":true,"pts":[["阿克苏姆石碑群",38.72,14.13]]},{"c":12,"y":330,"cam":[39,14,6],"t":"四世纪，阿克苏姆国王埃扎纳皈依基督教，阿克苏姆因此成为世界上最早接受基督教为国教的国家之一。他铸造的钱币上，原本的日月图案换成了十字架。埃塞俄比亚独特的基督教传统，一直延续到今天。","a":true,"pts":[["阿克苏姆",38.72,14.13]]},{"c":12,"y":330,"cam":[38.7,14.1,8],"t":"埃塞俄比亚流传着一个古老的传说：示巴女王拜访所罗门王，回国后生下儿子孟尼利克，他把约柜带回了埃塞俄比亚。如今阿克苏姆的一座教堂据称就收藏着约柜，但只有一位守护僧人能见到它，外人无从证实。","a":true,"pts":[["阿克苏姆锡安圣母教堂",38.72,14.13]]},{"c":12,"y":350,"cam":[33,18,5],"t":"四世纪中叶，麦罗埃逐渐衰落，据阿克苏姆的碑文记载，国王埃扎纳曾远征到这一带。此后努比亚出现了几个基督教王国，七世纪时挡住了阿拉伯军队的进攻，还和埃及签订了一份长期和约，维持了好几百年。","a":true,"pts":[["麦罗埃",33.75,16.94],["阿克苏姆",38.72,14.13]],"rt":[[[38.7,14.1],[37,15],[35,16],[33.8,17]]]},{"c":12,"y":615,"cam":[40,18,5],"t":"约公元六一五年，穆罕默德的一批早期追随者在麦加受到迫害，渡过红海逃到阿克苏姆，受到了国王的保护。这次事件在伊斯兰历史上被称为第一次希吉拉，比前面讲过的迁往麦地那还早几年。","a":true,"pts":[["麦加",39.83,21.42],["阿克苏姆",38.72,14.13]],"rt":[[[39.8,21.4],[40.2,19],[40.4,17],[39.6,15.3],[38.8,14.2]]]},{"c":12,"y":600,"cam":[80,-10,1.3],"t":"非洲还有一个出人意料的移民故事。远在东南亚的南岛语族航海者，大约在公元第一千年里，横渡整个印度洋来到马达加斯加。直到今天，马达加斯加语和婆罗洲的一种语言最为接近，岛上居民的基因里同时带着东南亚和非洲的成分。","a":true,"pts":[["马达加斯加",46.9,-19],["婆罗洲",114.6,-1]],"rt":[[[112,-3],[100,-6],[85,-9],[70,-13],[55,-17],[48,-18.5]]]},{"c":12,"y":600,"cam":[20,5,1.4],"t":"回头看，非洲的古代史远比很多教科书讲得丰富：有曾经统治埃及的库施，有铸造金币的阿克苏姆，有冶铁的诺克，还有横跨大陆的班图迁徙。这些故事之所以鲜为人知，部分是因为文字记载少，也因为外界长期习惯用偏见看待这片大陆。","a":true,"ar":[["库施",32,18,4],["阿克苏姆",39,14,3],["诺克",8,9.5,2.5],["杰内-杰诺",-4.5,14,2.5]]},{"c":13,"y":-1200,"cam":[-94,18,6],"t":"现在让镜头越过大西洋。前面提到过奥尔梅克人的巨石人头像。奥尔梅克常被称为中美洲的母文化，约公元前一二〇〇年在墨西哥湾沿岸兴起。后来中美洲流行的许多东西，比如玉器崇拜、复杂的历法和橡胶球赛，可能都能追溯到他们。","a":true,"pts":[["圣洛伦索",-94.76,17.75,"l"],["拉文塔",-94.04,18.1]],"ar":[["奥尔梅克",-94.4,17.9,1.4]]},{"c":13,"y":-1600,"cam":[-94.6,17.6,9],"t":"说到橡胶，中美洲人三千多年前就会把橡胶树的汁液和一种牵牛花的汁混在一起，做出有弹性的橡胶。他们用橡胶球玩一种只能用髋部撞球的比赛。在某些时期和地区，这种球赛带有宗教仪式的色彩，学界认为有时还和献祭联系在一起。","a":true,"pts":[["埃尔马纳蒂",-94.6,17.6]]},{"c":13,"y":-900,"cam":[-77.2,-9.6,8],"t":"南美洲这边，前面讲过约公元前两千六百年的卡拉尔。约公元前九百年，安第斯山区的查文德万塔尔成了重要的宗教中心。神庙内部有迷宫一样的地下通道，研究者推测，祭司可能利用它们在仪式中营造神秘的声音和光影效果。","a":true,"pts":[["查文德万塔尔",-77.18,-9.59]]},{"c":13,"y":-500,"cam":[-96.8,17,9],"t":"约公元前五百年，萨波特克人在瓦哈卡山谷削平一座山顶，建起了阿尔万山城。这里留下了美洲最早的文字和历法记录之一。城里有一组浮雕，因为人物姿势奇特被称为舞者，但它们刻画的很可能是被俘虏的敌人。","a":true,"pts":[["阿尔万山",-96.77,17.04]]},{"c":13,"y":-500,"cam":[-95,18,4],"t":"中美洲人同时使用两套历法：一套是两百六十天的神圣历，一套是三百六十五天的太阳历。两套历法像两个齿轮一样咬合转动，每五十二年才回到同一个组合。到后来的阿兹特克时代，每逢这个周期，人们会熄灭所有火种，再举行新火仪式重新点燃。","a":true},{"c":13,"y":-200,"cam":[-75.1,-14.7,9],"t":"秘鲁南部的纳斯卡人在沙漠上画出了巨大的线条和图案：蜂鸟、猴子、蜘蛛，有的长达数百米，最好从空中才能看清。为什么要画它们？学界有许多说法，比如祭祀时行走的路线，或与水源、天文有关。至于外星人跑道之类的说法，没有任何证据。","a":true,"pts":[["纳斯卡线条",-75.13,-14.74]]},{"c":13,"y":2024,"cam":[-75.1,-14.7,9],"t":"二〇二四年，日本山形大学的团队借助人工智能分析航拍图像，一下子又找到了三百多个新的纳斯卡图案，大多是比较小的浮雕式图形，几乎让已知图案的数量翻了一倍。古人的谜题，正在被最新的技术一点点解开。","pts":[["纳斯卡",-75.13,-14.74]]},{"c":13,"y":300,"cam":[-79.6,-6.8,8],"t":"秘鲁北部海岸的莫切人是出色的工匠，他们的陶器能塑出栩栩如生的人像，连表情都清清楚楚。一九八七年发现的西潘王墓，出土了大量金银饰品，被称为美洲的图坦卡蒙墓。莫切人还修建了庞大的灌溉渠，在沙漠里种出庄稼。","a":true,"pts":[["西潘王墓",-79.6,-6.8]],"ar":[["莫切",-79,-8,2]]},{"c":13,"y":450,"cam":[-98.8,19.7,10],"t":"公元初的几个世纪，墨西哥谷地崛起了特奥蒂瓦坎。鼎盛时人口可能有十万以上，是当时美洲最大的城市，在全世界也名列前茅。城市沿着一条宽阔的中轴大道布局，两侧矗立着太阳金字塔和月亮金字塔。","a":true,"pts":[["太阳金字塔",-98.84,19.69],["月亮金字塔",-98.84,19.7,"l"]],"ar":[["特奥蒂瓦坎",-98.84,19.69,0.15]]},{"c":13,"y":450,"cam":[-98.8,19.7,9],"t":"有意思的是，我们至今不知道是谁建造了特奥蒂瓦坎，连它原本叫什么都不清楚。特奥蒂瓦坎这个名字是几百年后阿兹特克人起的，意思是众神诞生之地；那条大道叫亡者大道，也是阿兹特克人以为两旁是坟墓而起的名字。","a":true,"pts":[["亡者大道",-98.84,19.69]]},{"c":13,"y":550,"cam":[-94,18.5,4],"t":"城里有专门的外来居民区，比如瓦哈卡人和玛雅人的街区。约六世纪，城市中心被大火焚烧，此后逐渐衰落，原因可能与内乱有关，学界仍有争论。特奥蒂瓦坎的影响力，曾远达一千多公里外的玛雅城市。","a":true,"pts":[["特奥蒂瓦坎",-98.84,19.69],["蒂卡尔",-89.62,17.22]],"rt":[[[-98.8,19.7],[-96,18.5],[-93,17.8],[-89.7,17.2]]]},{"c":13,"y":250,"cam":[-89.5,17.5,5],"t":"在尤卡坦半岛和今天的危地马拉，玛雅人创造了另一种文明。他们从来不是一个统一的帝国，而是几十个互相竞争的城邦，有点像古希腊。约公元二五〇年到九〇〇年是所谓的古典期，蒂卡尔、卡拉克穆尔、科潘、帕伦克等城市盛极一时。","a":true,"pts":[["蒂卡尔",-89.62,17.22],["卡拉克穆尔",-89.74,18.1,"l"],["科潘",-89.14,14.84],["帕伦克",-91.98,17.48,"l"]],"ar":[["玛雅低地",-89.8,17.6,3]]},{"c":13,"y":357,"cam":[-89.5,17.5,6],"t":"中美洲人还独立发明了零，玛雅人把它用得最为纯熟，常用一个像贝壳的符号表示，比零在欧洲普及早了一千年左右。他们用二十进制计数，这可能和人有十根手指加十根脚趾有关。他们的长历法可以精确记录跨越几千年的日期。","a":true},{"c":13,"y":600,"cam":[-89.6,17.2,8],"t":"玛雅文字是古代美洲被破译得最完整的文字。它既有表意符号，也有表音符号，同一个词可以有好几种写法，书吏往往借此炫技。二十世纪后半叶，在苏联语言学家克诺罗佐夫等人的研究基础上，学者们终于读懂了大部分碑文。","a":true,"pts":[["蒂卡尔",-89.62,17.22]]},{"c":13,"y":562,"cam":[-89.5,17.4,7],"t":"玛雅城邦之间的争霸十分激烈。蒂卡尔和卡拉克穆尔是两大强国，各自拉拢盟友，相持了一百多年。公元五六二年，卡拉克穆尔的盟友卡拉科尔击败了蒂卡尔，此后蒂卡尔沉寂了一百多年，才重新崛起。","pts":[["蒂卡尔",-89.62,17.22],["卡拉克穆尔",-89.74,18.1,"l"],["卡拉科尔",-89.12,16.76]]},{"c":13,"y":683,"cam":[-92,17.5,10],"t":"帕伦克国王巴加尔在位将近七十年，于公元六八三年去世，葬在铭文神庙下的墓室里。一九五二年，墨西哥考古学家打开墓室，发现国王戴着玉石面具。石棺盖上的雕刻曾被一些人想象成在驾驶宇宙飞船，其实刻的是国王坠入冥界、与世界之树相连的场景。","pts":[["帕伦克铭文神庙",-91.98,17.48]]},{"c":13,"y":1000,"cam":[-88.6,20.7,8],"t":"前面讲过，八到九世纪南部低地的玛雅城邦相继衰落。但玛雅人并没有消失：北方的奇琴伊察继续繁荣，今天仍有数百万玛雅人生活在墨西哥和中美洲，说着三十种左右的玛雅语言。","a":true,"pts":[["奇琴伊察",-88.57,20.68]]},{"c":13,"y":1000,"cam":[-88.6,20.7,10],"t":"奇琴伊察的库库尔坎金字塔，每到春分和秋分的下午，阳光会在北面台阶的边缘投下一串三角形的影子，看起来像一条大蛇从塔顶游下来，和底部的蛇头雕刻连成一体。每年都有成千上万的游客专程来看这条光影之蛇。","a":true,"pts":[["库库尔坎金字塔",-88.57,20.68]]},{"c":13,"y":1562,"cam":[-89.4,20.4,8],"t":"可惜的是，玛雅人写在树皮纸折页书上的大量典籍，在十六世纪被西班牙传教士当作异端焚毁。一五六二年，主教兰达在马尼一次就烧掉了许多抄本。今天世界上公认的玛雅古抄本，只剩下四部。","pts":[["马尼",-89.39,20.39]]},{"c":13,"y":2012,"cam":[-92,17.5,7],"t":"长历法的一个大周期在二〇一二年十二月二十一日结束，结果被误传成玛雅人预言了世界末日。其实帕伦克的碑文里还提到过几千年后的未来日期。对玛雅人来说，那一天大概就像汽车里程表进了一位。","pts":[["帕伦克",-91.98,17.48]]},{"c":13,"y":2018,"cam":[-89.7,17.3,7],"t":"二〇一八年前后，考古学家用飞机搭载激光雷达扫描危地马拉北部的丛林，发现了数以万计此前不为人知的房屋、堤道和农田。玛雅低地的人口可能比过去以为的多得多，鼎盛时也许有好几百万，具体数字学界仍有争论。","ar":[["激光雷达扫描区",-89.8,17.3,1]]},{"c":13,"y":700,"cam":[-71,-15,5],"t":"的的喀喀湖畔海拔约三千八百米的高原上，蒂瓦纳库城大约在公元五百到一千年间兴盛，人们用台田技术在寒冷的高原上耕作。北面的瓦里在秘鲁山地建立了可能是安第斯第一个帝国式的国家，还修筑了道路，为后来的印加帝国打下了基础。","a":true,"pts":[["蒂瓦纳库",-68.67,-16.55],["瓦里",-74.2,-13.06,"l"]],"ar":[["蒂瓦纳库",-68.7,-16.5,2.4],["瓦里",-74.5,-12,3]]},{"c":13,"y":700,"cam":[-74.2,-13,8],"t":"用绳结记事的奇普，过去常被看作印加人的发明。考古学家在瓦里文化的遗址中也发现了奇普，说明这种记录方式的历史比印加更早。至于奇普除了数字之外能不能记录语言，学界至今仍在探索。","a":true,"pts":[["瓦里",-74.2,-13.06]]},{"c":13,"y":1050,"cam":[-95,37,4],"t":"在北美洲，人们同样建起了令人惊叹的遗址：俄亥俄河谷的霍普韦尔人修筑了巨大的几何形土方工程；新墨西哥的查科峡谷里，普韦布洛人的先民建起多层石头大房子，最大的一座有好几百个房间。它们都已被列入世界遗产。","a":true,"pts":[["查科峡谷",-107.96,36.06,"l"],["霍普韦尔土方工程",-82.43,40.05],["卡霍基亚",-90.06,38.66,"b"]]},{"c":13,"y":1050,"cam":[-80,5,1.4],"t":"在与旧大陆完全隔绝的情况下，美洲人独立发明了农业、城市、文字、历法和零。他们没有铁器，没有牛马这样的大型家畜，也几乎不用轮子运输，却建起了金字塔和道路网。这本身就是人类创造力的一个绝佳证明。","a":true,"ar":[["中美洲",-94,18,6],["安第斯",-72,-12,8],["北美",-95,38,8]]},{"c":14,"y":610,"cam":[42,23,5],"t":"七世纪初，阿拉伯半岛的麦加是一座商业城市。约公元六百一十年，商人穆罕默德宣布自己受到启示，开始传播伊斯兰教。起初追随者不多，在麦加还受到排挤。这里不讨论信仰本身，我们只看它如何改变了世界地图。","a":true,"pts":[["麦加",39.83,21.42,"l"],["麦地那",39.61,24.47,"l"]]},{"c":14,"y":622,"cam":[40,23,8],"t":"公元六百二十二年，穆罕默德带领信众从麦加迁到麦地那，这次迁徙叫希吉拉，伊斯兰历就以这一年为元年。在麦地那，他建立起一个兼具宗教和政治的共同体。到六百三十二年他去世时，阿拉伯半岛的大部分已经统一在新信仰之下。","pts":[["麦加",39.83,21.42],["麦地那",39.61,24.47]],"rt":[[[39.83,21.42],[39.4,22.5],[39.3,23.5],[39.61,24.42]]]},{"c":14,"y":651,"cam":[42,30,2.6],"t":"此后短短几十年里，阿拉伯军队击败了彼此打得两败俱伤的东罗马和波斯萨珊王朝。叙利亚、埃及、伊拉克相继纳入版图，萨珊王朝在六百五十一年灭亡。帝国的政治中心先移到大马士革，后来又移到巴格达。","pts":[["大马士革",36.29,33.51,"l"],["泰西封",44.58,33.09],["亚历山大城",29.92,31.2,"l"]],"rt":[[[39.6,24.5],[37,29],[36.3,33.4]],[[39.6,24.5],[42.5,28],[44.5,33]],[[37,30],[33,30.5],[30,31.1]],[[44.6,33.1],[51,33.5],[57,34],[62,35]]]},{"c":14,"y":711,"cam":[-2,38,5],"t":"公元七百一十一年，将领塔里克率军从北非渡海进入西班牙。登陆的那座山后来就以他的名字命名：直布罗陀，意思是塔里克之山。七百三十二年，他们在法国图尔附近被法兰克人挡住。此后七百多年里，伊比利亚半岛的历史与伊斯兰文明紧密交织。","pts":[["直布罗陀",-5.35,36.14,"b"],["科尔多瓦",-4.78,37.88,"l"],["图尔",0.69,47.39]],"rt":[[[-5.6,35.8],[-5.35,36.2],[-4.8,37.9],[-3,40],[-1,42.5],[0.3,45],[0.7,47.2]]]},{"c":14,"y":751,"cam":[72,40,4],"t":"公元七百五十一年，新兴的阿拔斯王朝与唐朝在中亚的怛逻斯河畔交战，唐将高仙芝战败。传统说法认为，被俘的唐朝工匠把造纸术带到了撒马尔罕，不过学界有争论，造纸术可能更早就已西传。被俘的杜环后来回到中国，写下了《经行记》。","pts":[["怛逻斯",71.4,42.9],["撒马尔罕",66.96,39.65,"l"],["安西（龟兹）",82.96,41.72]]},{"c":14,"y":830,"cam":[44,33,7],"t":"阿拔斯王朝在七百六十二年动工修建新都巴格达，城市修成圆形，很快成为国际大都会。在智慧宫等学术机构里，学者们把希腊、波斯、印度的典籍译成阿拉伯文。数学家花拉子密写出了代数学的奠基之作，英语里的代数和算法两个词，都源于他的书名和名字。","a":true,"pts":[["巴格达",44.37,33.31]]},{"c":14,"y":900,"cam":[20,35,2.6],"t":"九到十世纪的伊斯兰世界，医学、天文、光学都相当发达。许多古希腊著作靠阿拉伯文译本得以保存，后来又经西班牙和西西里回流欧洲，为文艺复兴埋下了伏笔。英语里的糖、咖啡、酒精等词，追根溯源都能找到阿拉伯语的影子。","a":true,"pts":[["巴格达",44.37,33.31],["科尔多瓦",-4.78,37.88,"l"],["开罗",31.24,30.04,"b"]],"ar":[["伊斯兰世界",30,30,15]]},{"c":15,"y":-247,"cam":[55,35,3.6],"t":"这一章，镜头停在伊朗高原。亚历山大死后，塞琉古王朝控制了这片土地。约公元前二四七年，来自东北草原边缘的帕提亚人起兵，逐渐建立起一个大帝国。中国史书称之为安息，前面甘英遇到的那些船夫，就是安息人。","a":true,"pts":[["尼萨（安息早期都城）",58.2,37.95]],"ar":[["安息",53,33,8]]},{"c":15,"y":-53,"cam":[39,36.9,8],"t":"公元前五十三年，罗马三巨头之一的克拉苏率军东征安息，在卡莱被安息骑兵击溃。安息轻骑兵一边后撤一边回身放箭，重骑兵再趁势冲锋，罗马军团损失惨重，克拉苏本人也死了。据罗马史家记载，罗马人在这一战中看到了闪闪发光的丝绸军旗。","pts":[["卡莱",39.03,36.86]]},{"c":15,"y":-53,"cam":[70,38,2.4],"t":"关于卡莱之战，有一个流传很广的猜想：被俘的罗马士兵后来辗转来到东方，甚至有人说甘肃的骊靬古城就是他们的后代建的。不过，考古和基因研究都没有找到可靠证据，这更像是一个浪漫的传说。","pts":[["卡莱",39.03,36.86,"l"],["骊靬（今甘肃永昌）",101.97,38.25]]},{"c":15,"y":116,"cam":[42,34,4.5],"t":"此后近三百年，罗马和安息隔着幼发拉底河反复拉锯。罗马人几次攻入安息的都城泰西封，却始终没能彻底征服它。安息人则稳稳地坐在东西方之间，把东方的丝绸和香料转卖给罗马，赚得盆满钵满。","pts":[["泰西封",44.58,33.09],["幼发拉底河",40.5,34.6,"l"]]},{"c":15,"y":224,"cam":[50,32,4],"t":"公元二二四年，波斯人阿尔达希尔推翻了安息，建立萨珊王朝。萨珊人自认为是古代居鲁士、大流士那个波斯帝国的继承者，把琐罗亚斯德教奉为国教。此后四百多年，萨珊波斯和罗马，以及后来的东罗马，一直是西亚的两大强权。","pts":[["伊斯塔赫尔（萨珊发源地）",52.9,29.98],["泰西封",44.58,33.09,"l"]],"ar":[["萨珊波斯",52,33,9]]},{"c":15,"y":260,"cam":[52.9,30,9],"t":"公元二六〇年，萨珊国王沙普尔一世在战场上俘虏了罗马皇帝瓦勒良，这是罗马皇帝第一次被外敌活捉。伊朗的纳克什-鲁斯塔姆崖壁上，至今刻着罗马皇帝在沙普尔马前屈服的浮雕。至于罗马史家写的那些屈辱细节，真实程度就难以考证了。","pts":[["纳克什-鲁斯塔姆",52.87,29.99]]},{"c":15,"y":260,"cam":[52,32,4],"t":"琐罗亚斯德教相信，世界是光明与黑暗、善与恶的斗争，人应当以善思、善言、善行站在光明一边。神庙里的圣火长明不灭，所以中国人称之为拜火教或祆教。它的末日审判、天使等观念，有学者认为影响了后来的犹太教和基督教，也有学者不同意。","a":true,"pts":[["亚兹德（火神庙）",54.37,31.9]]},{"c":15,"y":274,"cam":[70,33,1.7],"t":"萨珊帝国还诞生了一位宗教创始人：摩尼。他把琐罗亚斯德教、基督教和佛教的元素糅合在一起，创立了摩尼教。摩尼教一度从北非传到中国，后来在中国演变成明教，也就是金庸小说里明教的原型。泉州至今还保存着一尊摩尼光佛像。","a":true,"pts":[["泰西封",44.58,33.09],["泉州（草庵摩尼光佛）",118.5,24.75]]},{"c":15,"y":531,"cam":[46,33,5],"t":"萨珊在库思老一世时期达到鼎盛，他于五三一年即位，改革税制和军制，被后人称为公正的国王。据说国际象棋正是在这一时期从印度传入波斯的。波斯语的沙赫马特，意思是国王无路可走，英语里的将死一词就是从这里来的。","pts":[["泰西封",44.58,33.09]]},{"c":15,"y":550,"cam":[48.5,32.3,8],"t":"萨珊的贡迪沙普尔是一个学术中心。据后世记载，被东罗马排挤的学者和基督教医生来到这里，希腊医学和印度医学在这里交汇，后来深刻影响了巴格达的学术。不过学者也提醒，后世对它规模的描述可能有所夸大。","a":true,"pts":[["贡迪沙普尔",48.5,32.3]]},{"c":15,"y":540,"cam":[60,32,1.8],"t":"萨珊首都泰西封的宫殿有一个巨大的砖砌拱顶，高约三十多米，一千多年后仍然屹立在今天的伊拉克。萨珊的银器、织锦和玻璃器沿着丝绸之路流传，在日本奈良的正仓院里，至今还收藏着萨珊风格的玻璃碗。","a":true,"pts":[["泰西封宫拱顶",44.58,33.09],["奈良正仓院",135.84,34.69]]},{"c":15,"y":626,"cam":[38,36,3.6],"t":"七世纪初，萨珊和东罗马打了一场持续二十多年的大战。萨珊一度攻占耶路撒冷和埃及，兵临君士坦丁堡，后来又被东罗马反攻打回。两大帝国精疲力竭之时，阿拉伯半岛上的一股新力量正在崛起，这就是前一章的开头。","pts":[["君士坦丁堡",28.98,41.01,"l"],["耶路撒冷",35.23,31.78],["泰西封",44.58,33.09]]},{"c":15,"y":651,"cam":[80,36,2],"t":"公元六五一年，萨珊最后一位国王伊嗣俟三世在逃亡途中被杀。他的儿子卑路斯逃到唐朝求援，唐高宗任命他为波斯都督，后来他在长安去世。今天乾陵前的六十一尊蕃臣石像中，有一尊据考就是卑路斯。","pts":[["木鹿（伊嗣俟三世遇害处）",61.84,37.66],["长安",108.94,34.26],["乾陵",108.21,34.58,"b"]],"rt":[[[61.8,37.7],[67,39.6],[76,39.5],[82,41.7],[89,42.8],[94.7,40.1],[100,39],[104,36],[108.9,34.3]]]},{"c":15,"y":800,"cam":[62,24,3.6],"t":"阿拉伯征服后，伊朗逐渐伊斯兰化。一部分坚守信仰的琐罗亚斯德教徒漂洋过海迁往印度，被称为帕西人。他们人数不多，却在近代印度的商业里举足轻重：塔塔集团的创始家族，还有皇后乐队的主唱弗雷迪·墨丘利，都出身帕西人家庭。","a":true,"pts":[["桑詹（帕西人登陆地）",72.85,20.2],["孟买",72.88,19.08,"b"]],"rt":[[[56.3,27.2],[62,24.5],[68,22],[72.7,20.3]]]},{"c":15,"y":900,"cam":[62,38,4.5],"t":"伊朗被征服了，波斯语却没有被阿拉伯语取代。九到十世纪，萨曼王朝等地方政权大力扶持用阿拉伯字母书写的新波斯语。今天的伊朗人读一千年前的波斯诗歌，大致还能读懂，这在世界语言史上相当少见。","a":true,"pts":[["布哈拉（萨曼王朝都城）",64.42,39.77]],"ar":[["萨曼王朝",64,38.5,5]]},{"c":15,"y":1010,"cam":[59.5,36.5,8],"t":"大约一〇一〇年，诗人菲尔多西完成了史诗《列王纪》，用约五万联诗句讲述伊朗从神话时代到萨珊灭亡的历史。据说他尽量少用阿拉伯词汇，努力保存波斯语的纯正。这部史诗被视为伊朗民族认同的基石。","pts":[["图斯（菲尔多西故乡）",59.5,36.5]]},{"c":15,"y":1025,"cam":[55,36,4],"t":"波斯学者为伊斯兰黄金时代作出了巨大贡献。伊本·西那，西方称他为阿维森纳，写下了《医典》，这部书在欧洲的大学里被当作医学教材用了好几百年。前面提到的花拉子密，以及比鲁尼、拉齐，也都来自波斯文化圈。","pts":[["哈马丹（伊本·西那墓）",48.5,34.8,"l"],["花剌子模",60.6,41.5]]},{"c":15,"y":1079,"cam":[58.8,36.2,8],"t":"数学家兼诗人欧玛尔·海亚姆参与制定了一部新历法，以精确著称，有人说它比后来的格里历还准，但具体精度说法不一。他的四行诗集《鲁拜集》在十九世纪被译成英文，在西方风靡一时，他也因此成为最有名的波斯诗人之一。","pts":[["内沙布尔（海亚姆故乡）",58.8,36.21]]},{"c":15,"y":1273,"cam":[42,34,3.4],"t":"十三世纪，诗人鲁米写下大量神秘主义诗歌，今天在美国也是畅销书。十四世纪的哈菲兹在伊朗更是家喻户晓，伊朗人至今有用哈菲兹诗集占卜的习俗：心里想着一件事，随手翻开一页，读到的诗句就当作回答。","pts":[["科尼亚（鲁米墓）",32.49,37.87,"l"],["设拉子（哈菲兹墓）",52.53,29.59]]},{"c":15,"y":1273,"cam":[52,32,5],"t":"英语里的天堂一词，可以追溯到古伊朗语里围起来的园子。波斯园林常用水渠把园子分成四块，象征生命之水和世界的四方。后来印度的泰姬陵、西班牙的阿尔罕布拉宫，都能看到这种园林布局的影子。","a":true,"pts":[["伊斯法罕",51.67,32.65]]},{"c":15,"y":1300,"cam":[65,36,1.8],"t":"伊朗的新年叫诺鲁孜节，在春分这一天，据说已有三千年左右的历史。如今从中亚到高加索、从土耳其到阿富汗，有三亿多人过这个节，联合国还设立了国际诺鲁孜节。一个节日穿越了古波斯、伊斯兰和现代的种种变迁，一直活到今天。","a":true,"ar":[["诺鲁孜节流行的地区",58,37,14]]},{"c":15,"y":1300,"cam":[80,30,1.6],"t":"很长时间里，波斯语是东方伊斯兰世界的通用文化语言，从奥斯曼宫廷到印度的莫卧儿王朝都在使用。元朝设立的回回国子学，一般认为教的就是波斯文字，泉州的一些古代石碑上也刻着波斯文。常有人说，伊朗被征服了很多次，但每次都是征服者被波斯文化同化。","a":true,"pts":[["伊斯坦布尔",28.98,41.01,"l"],["德里",77.2,28.6],["泉州",118.6,24.9],["大都",116.4,39.9]]},{"c":16,"y":618,"cam":[108.9,34.3,9],"t":"公元六百一十八年，唐朝建立。唐都长安面积八十多平方公里，是当时世界上最大的城市之一，人口据估计可能接近百万，学界有争论。城里住着波斯商人、粟特商人、日本留学生和新罗僧人，西市里能买到来自半个世界的货物。","pts":[["长安",108.94,34.26]],"ar":[["长安城",108.94,34.26,0.35]]},{"c":16,"y":629,"cam":[88,32,2.8],"t":"约公元六百二十九年，僧人玄奘偷偷出关，独自西行求法。他穿过沙漠，翻越雪山，在印度的那烂陀寺学习多年，六百四十五年回到长安，带回六百多部经典。他口述的《大唐西域记》成了研究中亚和印度历史的宝贵资料，也是《西游记》的灵感来源。","a":true,"pts":[["长安",108.94,34.26],["那烂陀寺",85.44,25.14]],"rt":[[[108.9,34.3],[103.8,36],[98.5,39.7],[94.7,40.1],[89.2,42.9],[82.9,41.7],[76.5,42.5],[71.4,42.9],[67,39.6],[67,36.7],[69.2,34.5],[72.8,34],[77.5,29],[82,26.5],[85.4,25.2]]]},{"c":16,"y":690,"cam":[122,35,4.5],"t":"唐朝的影响向东传到日本，日本前后派出十几批遣唐使，学习唐朝的制度、建筑和文字，奈良和京都的城市布局都模仿了长安的棋盘格局。公元六百九十年，武则天称帝，成为中国历史上唯一被正统史书承认的女皇帝。","pts":[["长安",108.94,34.26],["奈良",135.8,34.68]],"rt":[[[135.8,34.7],[133,34],[130.4,33.6],[126,31.5],[121.8,30.5],[116,32.5],[112.5,34.6],[109,34.3]]]},{"c":16,"y":755,"cam":[113,36,5],"t":"盛唐的繁华在公元七百五十五年戛然而止。安史之乱持续了八年，战火波及大半个北方，户籍上登记的人口锐减，其中虽有统计体系崩溃的因素，但战乱的惨烈毋庸置疑。杜甫写下了国破山河在，城春草木深。唐朝此后再也没能恢复盛世的气象。","pts":[["范阳",116.2,39.9],["洛阳",112.45,34.62],["长安",108.94,34.26,"l"]]},{"c":16,"y":800,"cam":[7,47,4.5],"t":"同一时代的西欧，法兰克国王查理曼统一了大片领土。公元八百年圣诞节，教皇在罗马为他加冕，称他为罗马人的皇帝。据他的传记作者记载，查理曼年纪很大了才学写字，把写字板放在枕头底下练习，但始终没练好。","pts":[["亚琛",6.08,50.78],["罗马",12.5,41.9]],"ar":[["查理曼帝国",7,47,6.5]]},{"c":16,"y":802,"cam":[25,42,2.6],"t":"查理曼虽然自己写不好字，却大力兴办学校、抄写古籍，书吏们推广的一种清晰小写字母，就是今天小写拉丁字母的祖先。他还和巴格达的哈里发哈伦·拉希德互派使节，哈里发送来了一头名叫阿布·阿巴斯的大象，公元八百零二年走到了亚琛。","pts":[["亚琛",6.08,50.78,"l"],["巴格达",44.37,33.31]],"rt":[[[44.4,33.3],[40,35],[36.2,36.2],[30,32],[20,33],[10.3,37.5],[8.8,44.3],[7.5,47.5],[6.1,50.7]]]},{"c":16,"y":793,"cam":[0,57,4],"t":"公元七百九十三年，一群维京人突袭了英格兰东北海岸林迪斯法恩岛上的修道院，维京时代由此拉开序幕。他们来自斯堪的纳维亚，有时抢劫，更多时候经商和定居。顺便澄清一下：维京人的头盔并没有角，那是十九世纪歌剧服装设计师的创意。","pts":[["林迪斯法恩",-1.8,55.67,"l"]],"rt":[[[5.3,60.4],[3,58.5],[0,56.5],[-1.6,55.7]]]},{"c":16,"y":1000,"cam":[-10,55,2],"t":"维京长船能出海，也能沿河逆流而上。向东，他们沿河南下，参与建立了基辅罗斯，还到君士坦丁堡当皇帝的卫队，在圣索菲亚大教堂的栏杆上刻下涂鸦。向西，他们定居冰岛和格陵兰，约公元一千年前后登上了北美的纽芬兰，比哥伦布早了近五百年。","a":true,"pts":[["基辅",30.52,50.45],["君士坦丁堡",28.98,41.01],["冰岛",-19,64.9],["格陵兰定居点",-45.5,61.15,"l"],["兰塞奥兹牧草地",-55.53,51.6,"l"]],"rt":[[[10,60],[-7,62],[-19,64.5],[-35,63.5],[-45,61.2],[-52,56],[-55.4,51.7]],[[18,59.5],[24,59.5],[30,59.5],[31.3,58.5],[31,54],[30.5,50.5],[31.5,47],[30,43.5],[29,41.1]]]},{"c":16,"y":802,"cam":[-20,20,1.2],"t":"同一时期的其他角落：中美洲的玛雅低地城邦在八、九世纪相继衰落，原因可能包括长期干旱和战争；东南亚的高棉帝国约在公元八百零二年建立，后来建起了吴哥。历史从来不只有一个舞台，只是聚光灯常常打不过来。","pts":[["蒂卡尔（玛雅）",-89.62,17.22],["吴哥",103.87,13.41],["长安",108.94,34.26,"t"]]},{"c":17,"y":-16500,"cam":[131,37,3],"t":"这一章，镜头来到大唐的东边：朝鲜半岛和日本列岛。两地之间隔着一道海峡，海峡里的对马岛，北端离韩国釜山只有约五十公里。千百年来，稻米、铁器、汉字和佛教，都曾沿着这条水路来来往往，人也一样。","a":true,"pts":[["釜山",129.04,35.1,"l"],["对马岛",129.33,34.42,"b"]],"ar":[["朝鲜半岛",127.5,37.5,3.5],["日本列岛",136.5,36,5]]},{"c":17,"y":-16500,"cam":[140.6,41,6],"t":"先从史前说起。在日本青森的大平山元遗址，考古学家发现了约一万六千五百年前的陶片，是世界上最古老的陶器之一，中国江西仙人洞的陶片还要更早。烧陶的不是农民，而是打猎、捕鱼、采集的人，这打破了「先种地、后烧陶」的老印象。","a":true,"pts":[["大平山元遗址",140.6,41.07]]},{"c":17,"y":-2600,"cam":[140.7,40.8,8],"t":"日本这段漫长的史前时代叫绳文时代，因为陶器上常压着绳子的纹路，它延续了一万年以上。青森的三内丸山遗址曾是一个大村落，有人居住了约一千七百年。这里留下六个巨大的柱坑，柱子是直径约一米的栗木，到底盖了个什么，至今是个谜。","a":true,"pts":[["三内丸山遗址",140.7,40.81]]},{"c":17,"y":-2333,"cam":[127,39,4.5],"t":"朝鲜半岛有一个建国传说：天神之子桓雄降临人间，一只熊和一只老虎求他让自己变成人。桓雄让它们只吃艾草和大蒜、躲在洞里不见阳光。老虎半途跑了，熊坚持下来变成女子，生下了檀君。后世史书推算檀君建国在公元前二三三三年，这是传说，不是信史。","a":true,"ar":[["朝鲜半岛",127.5,38,3.5]]},{"c":17,"y":-1000,"cam":[126.8,36.3,5.5],"t":"进入青铜时代后，半岛各地竖起了大量支石墓：几块石头撑起一块大石板，像一张巨大的石桌子。据统计，朝鲜半岛有三万多座支石墓，有人估计约占全世界的四成。高敞、和顺、江华三处支石墓群，二〇〇〇年一起被列入世界遗产。","a":true,"pts":[["高敞",126.7,35.43],["和顺",126.93,34.98],["江华岛",126.45,37.71]]},{"c":17,"y":-500,"cam":[130,34.3,5.5],"t":"大约在公元前十世纪到前三世纪之间，具体何时开始学界争论很大，水稻种植和金属器具从大陆经朝鲜半岛传到九州，日本进入弥生时代，不少人也从半岛渡海而来。九州的吉野里遗址有深深的环壕和木栅，说明村落之间已经开始打仗了。","a":true,"pts":[["吉野里遗址",130.39,33.33]],"rt":[[[129.05,35],[128.95,34.6],[129.4,33.95],[129.85,33.6]]]},{"c":17,"y":-108,"cam":[125,40,4.5],"t":"公元前一〇八年，汉武帝灭了半岛北部的卫满朝鲜，设立乐浪等四个郡，乐浪郡的治所在今天平壤附近。这正是前面讲过的张骞通西域之后不久。乐浪郡存在了四百多年，汉朝的铜镜、漆器和汉字由此进一步传到半岛南部和日本。","pts":[["乐浪郡（今平壤附近）",125.75,39.02]],"ar":[["汉四郡一带",125.5,40.5,2.5]]},{"c":17,"y":-57,"cam":[127.5,38.5,4],"t":"按照十二世纪的史书《三国史记》，新罗建于公元前五十七年，高句丽建于前三十七年，百济建于前十八年。这些年份是传统说法，不少学者认为三国真正成形要晚得多。此后约七百年，三国在半岛上时而结盟、时而争战，史称三国时代。","a":true,"pts":[["卒本（高句丽）",125.35,41.27],["慰礼城（百济）",127.12,37.52,"l"],["庆州（新罗）",129.22,35.84]]},{"c":17,"y":57,"cam":[130.3,33.7,8],"t":"中国的《汉书》说，乐浪海外有倭人，分为一百多个小国。公元五十七年，倭的奴国派使者到洛阳，东汉光武帝赐了一枚金印。一七八四年，福冈志贺岛的农民挖出一枚金印，上刻「汉委奴国王」，被认为就是那一枚，不过真伪也争论过。","pts":[["志贺岛",130.3,33.67]]},{"c":17,"y":239,"cam":[133,34,4.5],"t":"据《三国志》里的《魏志·倭人传》，三世纪的倭国由女王卑弥呼统治，她擅长鬼道，深居宫中，有婢女千人。约二三九年，她遣使到魏，被封为亲魏倭王。至于她的邪马台国在九州还是在奈良一带，日本学者从江户时代一直争论到今天。","a":true,"pts":[["箸墓古坟",135.84,34.54]],"ar":[["九州说",130.6,33.3,1.2],["畿内说",135.8,34.6,1.2]]},{"c":17,"y":414,"cam":[126.2,40.3,5.5],"t":"四世纪末到五世纪，高句丽在广开土王手中大举扩张。四一四年，他的儿子长寿王在今天吉林集安立起好太王碑，高六米多，刻了近一千八百字。碑文中有一段讲到倭，各国学者对它的断句和理解至今各不相同。四二七年，高句丽迁都平壤。","pts":[["集安（好太王碑）",126.19,41.15],["平壤",125.75,39.02,"b"]],"ar":[["高句丽",125.5,41.3,3.5]]},{"c":17,"y":450,"cam":[135.5,34.57,9],"t":"同一时期，日本进入古坟时代，各地首领流行修建前方后圆的大墓，从空中看像一个钥匙孔。大阪的大仙陵古坟长约四百八十六米，是日本最大的古坟，也是世界上占地最大的陵墓之一。传统上说它是仁德天皇的陵，但墓主究竟是谁，学界并无定论。","a":true,"pts":[["大仙陵古坟",135.49,34.56]]},{"c":17,"y":500,"cam":[129.22,35.84,9],"t":"新罗的都城在今天韩国的庆州，城里至今隆起着一座座小山似的王陵。天马冢出土了一顶金冠，上面立着树枝和鹿角形的装饰，挂满了勾玉和金片，一动就闪闪发光。不少学者认为，树和鹿角象征通天，和古代的萨满信仰有关。","a":true,"pts":[["天马冢（庆州）",129.21,35.84]]},{"c":17,"y":538,"cam":[131.5,35,3.8],"t":"六世纪中叶，百济的圣王向倭国赠送佛像和佛经，传统说法是五三八年或五五二年。朝廷里为要不要拜这位外来的神吵翻了天：苏我氏支持，物部氏反对。五八七年，苏我氏打败了物部氏，佛教从此在日本扎下了根。","a":true,"pts":[["泗沘（百济都城）",126.91,36.28,"l"],["飞鸟",135.82,34.47]],"rt":[[[126.6,36],[126,35.2],[126.4,34.2],[128,34.4],[129.3,34],[130.4,33.95],[131.3,33.95],[132.4,33.95],[133.5,34.3],[134.5,34.5],[135.35,34.62]]]},{"c":17,"y":604,"cam":[135.75,34.6,8],"t":"据《日本书纪》，推古天皇时的圣德太子在六〇四年制定十七条宪法，第一条就是以和为贵。相传他创建的法隆寺，金堂和五重塔被认为是世界现存最古老的木构建筑。不过，太子的事迹多出自一百多年后的史书，学界对其真实性争论不少。","pts":[["法隆寺",135.73,34.61]]},{"c":17,"y":607,"cam":[124,34,3.6],"t":"六〇七年，倭国使者小野妹子来到隋朝，国书开头写道：日出处天子致书日没处天子，无恙。据《隋书》记载，隋炀帝看了很不高兴。让他不快的，也许是对方同样自称天子，想平起平坐。用「日出处」来称呼日本，这是已知最早的记录之一。","pts":[["洛阳",112.45,34.62,"l"],["飞鸟",135.82,34.47]]},{"c":17,"y":612,"cam":[124.6,40.3,5],"t":"六一二年，隋炀帝发动大军进攻高句丽。高句丽名将乙支文德诱敌深入，在萨水一带大败隋军。据史书记载，渡过辽河的三十万五千人，回到辽东城的只有两千七百人。隋朝连年征战，民怨沸腾，六年后就灭亡了，取而代之的正是上一章的唐朝。","pts":[["辽东城（今辽阳）",123.17,41.27,"l"],["萨水（今清川江）",125.6,39.62],["平壤",125.75,39.02,"b"]],"rt":[[[123.2,41.2],[124.4,40.3],[125.3,39.75],[125.7,39.15]]]},{"c":17,"y":645,"cam":[135.8,34.47,8],"t":"六四五年，日本飞鸟宫里发生政变：中大兄皇子和中臣镰足当场刺杀权臣苏我入鹿。随后的改革叫大化改新，仿照隋唐建立中央集权。「大化」是日本第一个年号，这个传统一直延续到今天的「令和」。镰足后来被赐姓藤原，请记住这个姓。","pts":[["飞鸟宫",135.82,34.47]]},{"c":17,"y":663,"cam":[128,37,4.3],"t":"六六〇年，唐与新罗联军灭了百济。六六三年，倭国派水军援助百济复国，在白江口与唐、新罗水军交战，倭军大败，《日本书纪》记载损失了四百艘船。六六八年，唐与新罗又灭了高句丽。延续数百年的三国时代就此落幕。","pts":[["白江口",126.6,36,"l"],["泗沘",126.91,36.28],["平壤",125.75,39.02]]},{"c":17,"y":664,"cam":[130.5,33.5,9],"t":"白江口之后，日本担心唐和新罗渡海来攻，在九州大宰府附近筑起长约一点二公里的水城土堤，又在山上修了大野城等山城，指导筑城的就有流亡日本的百济贵族。据估计，当时渡海定居日本的百济上层人士约有三千人，带去了技术和学问。","pts":[["水城",130.51,33.52,"l"],["大野城",130.5,33.56],["大宰府",130.53,33.51,"b"]]},{"c":17,"y":676,"cam":[127.8,37.3,4.5],"t":"灭掉百济和高句丽之后，唐朝想直接管辖这些土地，新罗不答应，两国又打了起来。到六七六年，新罗把唐军挡在大同江以北，控制了大同江以南的半岛。史称统一新罗。从此，庆州作为都城又繁荣了两百多年。","pts":[["庆州",129.22,35.84]],"ar":[["统一新罗",127.8,36.4,2.6]]},{"c":17,"y":698,"cam":[129,43.5,4],"t":"高句丽灭亡三十年后，六九八年，大祚荣在东北建国，后来被唐朝封为渤海郡王，国号就叫渤海。渤海全盛时号称「海东盛国」，曾三十多次派使者到日本。它的历史归属，今天中国、韩国和朝鲜学者看法不同。九二六年，渤海被契丹所灭。","pts":[["上京龙泉府",129.2,44.08]],"ar":[["渤海",130,44,5]]},{"c":17,"y":710,"cam":[135.8,34.69,8],"t":"七一〇年，日本迁都平城京，也就是今天的奈良，前面讲过，它仿照长安建造。差不多同一时期，「倭」改称「日本」，君主称「天皇」。七一二年的《古事记》和七二〇年的《日本书纪》是日本现存最早的史书，从神话一路讲到七世纪。","pts":[["平城京（奈良）",135.79,34.69]]},{"c":17,"y":751,"cam":[129.3,35.8,9],"t":"八世纪是新罗的鼎盛期。约七五一年，宰相金大城开始兴建佛国寺和石窟庵。石窟庵是在山上用花岗岩砌出的人造石窟，正中一尊释迦坐像面朝东方的大海，据说初升的太阳正好照在佛像额头。一九九五年，两处一起被列入世界遗产。","a":true,"pts":[["佛国寺",129.33,35.79,"l"],["石窟庵",129.35,35.8]]},{"c":17,"y":752,"cam":[135.84,34.69,9],"t":"七五二年，奈良东大寺的大佛举行开眼仪式，为大佛点睛的是一位来自印度的僧人，据说有约一万名僧人到场。大佛原高约十六米，用掉了当时日本大量的铜。现在的大佛殿是一七〇九年重建的，比原来小了约三成，直到一九九八年还是世界最大的木构建筑。","pts":[["东大寺",135.84,34.69]]},{"c":17,"y":753,"cam":[126,32,4.5],"t":"同一时期，唐朝扬州的高僧鉴真应日本僧人邀请东渡传戒。他前后尝试了六次，五次失败，途中双目失明，七五三年底终于在九州登岸，那年他六十五岁左右。七五九年，他在奈良建立唐招提寺，四年后在那里圆寂。","pts":[["扬州",119.42,32.39,"l"],["萨摩（登岸处）",130.23,31.27,"b"],["唐招提寺",135.78,34.68]],"rt":[[[119.42,32.39],[120.8,31.9],[122.2,31.2],[125,30.3],[128,30.4],[129.9,31.2]]]},{"c":17,"y":794,"cam":[135.76,35.01,8],"t":"七九四年，桓武天皇迁都平安京，也就是今天的京都。此后一千多年，这里一直是天皇的都城，直到一八六九年天皇才迁往东京。日本由此进入约四百年的平安时代。这个名字听上去很太平，后半段却一点也不太平。","pts":[["平安京（京都）",135.76,35.01]]},{"c":17,"y":828,"cam":[125,34.5,3.2],"t":"九世纪的东亚海上，最有名的人物是新罗人张保皋。他早年在唐朝从军，回国后于八二八年在莞岛设立清海镇，打击贩卖人口的海盗，又组建船队，经营新罗、唐朝和日本之间的贸易，后人称他海上王。日本僧人圆仁的旅行日记，留下了关于他的珍贵记载。","pts":[["清海镇（莞岛）",126.75,34.32,"b"],["博多",130.4,33.6]]},{"c":17,"y":900,"cam":[135.76,35.01,7],"t":"八九四年，日本停派遣唐使，本土文化渐渐长出了自己的味道。日本人从当作音符用的汉字里，变出了自己的字母：草书简化成平假名，比如「安」字的草书就成了平假名的第一个字母；截取汉字的一部分，就成了片假名。九三五年前后，歌人纪贯之写《土佐日记》，开头竟假装自己是个女人。","a":true,"pts":[["平安京",135.76,35.01]]},{"c":17,"y":918,"cam":[127.3,37,5],"t":"九世纪末新罗衰落，半岛又分裂成三块，史称后三国。九一八年，武将王建建立高丽，后来定都开城。九三五年新罗末代国王归降，第二年高丽灭了后百济，重新统一。渤海灭亡后，不少遗民也投奔高丽。西方语言里的「科里亚」，就是从高丽来的。","pts":[["开城",126.55,37.97],["庆州",129.22,35.84]]},{"c":17,"y":1000,"cam":[135.76,35.01,8],"t":"公元一〇〇〇年前后，平安京的宫廷里出了两位才女。清少纳言侍奉皇后定子，随笔《枕草子》爱列清单，比如「可憎之事」。紫式部侍奉中宫彰子，写下五十四帖的《源氏物语》，出场人物约四百个，常被称为世界最早的长篇小说之一，不过这个说法也有争议。","a":true,"pts":[["平安京",135.76,35.01]]},{"c":17,"y":1018,"cam":[135.76,35.02,8],"t":"这时真正掌权的是藤原氏，正是中臣镰足的后代。他们把女儿嫁给天皇，再以外祖父的身份摄政，叫摄关政治。一〇一八年，藤原道长的第三个女儿也当上了皇后，他在宴席上作歌：此世即我世，如满月无缺。紫式部侍奉的彰子，就是道长的长女。","pts":[["平安京",135.76,35.01]]},{"c":17,"y":1123,"cam":[127.5,36.5,5],"t":"高丽最有名的工艺是青瓷。一一二三年，出使高丽的宋朝官员徐兢记载，高丽人把青瓷的颜色叫作翡色，近年做得越发精美。高丽还雕印过整部大藏经。说句后话：初雕本毁于十三世纪的蒙古入侵，后来重刻的八万多块经版，至今保存在海印寺。","pts":[["开城",126.55,37.97],["海印寺",128.1,35.8]]},{"c":17,"y":1167,"cam":[132,36,3.6],"t":"平安后期，地方上靠弓马吃饭的武士越来越强。一一五六年起京都接连两次内乱，都靠武士决出胜负。一一六七年，平清盛成为第一个当上太政大臣的武士。巧的是，海峡对面的高丽在一一七〇年也发生武臣政变，武人掌权约一百年。","pts":[["平安京",135.76,35.01],["开城",126.55,37.97,"l"]]},{"c":17,"y":1185,"cam":[131,34,7],"t":"一一八〇年，源氏起兵讨伐平氏，史称源平合战。一一八五年，双方在本州和九州之间的坛之浦海上决战，平氏覆灭，年仅六岁的安德天皇随外祖母投海身亡。后来的《平家物语》开头写道：祇园精舍的钟声，回响着诸行无常。","pts":[["坛之浦",130.96,33.96]]},{"c":17,"y":1192,"cam":[139.55,35.32,8],"t":"一一九二年，源赖朝被任命为征夷大将军，在关东的镰仓建立幕府，也有学者认为幕府在一一八五年就已实际成立。此后直到一八六八年，日本大多数时候由武士政权掌握实权，前后近七百年。现在，把时钟拨回九六〇年，去看看大陆上的宋朝。","pts":[["镰仓",139.55,35.32]]},{"c":18,"y":960,"cam":[114.3,34.8,8],"t":"公元九百六十年，赵匡胤在陈桥驿黄袍加身，建立宋朝。宋朝在军事上常被说成弱，但在经济、科技和文化上，却是中国历史上的高峰之一。北宋都城开封的商铺可以临街开店，夜市热闹到深夜，城市生活的规矩比唐朝宽松得多。","pts":[["开封（东京）",114.3,34.8]]},{"c":18,"y":1100,"cam":[114,30,4],"t":"张择端的《清明上河图》长五米多，画了几百个人物，从船夫、轿夫到算命先生，是一幅宋代城市生活的超长截图。宋朝人口在十二世纪初突破了一亿。从越南中部引进的占城稻生长期短、耐旱，让很多地方的粮食产量大大提高。","a":true,"pts":[["开封",114.3,34.8],["杭州",120.15,30.27],["占城",108.3,13.8]],"rt":[[[108.3,13.8],[109.5,18],[111,21.5],[115,24.5],[118.5,27.5],[120,30]]]},{"c":18,"y":1024,"cam":[104,30.7,8],"t":"人一多、生意一大，铜钱就不够用了，四川流通的铁钱更是沉得要命。成都的商人先发明了纸质的交子，公元一千零二十四年，北宋政府开始正式发行官方交子，这是世界上最早的政府发行纸币之一。当然，纸币一发多，通货膨胀也就跟着来了。","pts":[["成都",104.07,30.67]]},{"c":18,"y":1044,"cam":[114,33,5],"t":"宋朝还见证了几项改变世界的技术。一千零四十四年成书的《武经总要》记载了火药配方；北宋平民毕昇发明了泥活字印刷，由沈括记在《梦溪笔谈》里；到十二世纪初，《萍洲可谈》已经记载了船员在阴天用指南针辨别方向。","pts":[["开封",114.3,34.8],["广州",113.26,23.13]]},{"c":18,"y":1054,"cam":[60,40,1.6],"t":"公元一千零五十四年，宋朝天文官记录天关星附近出现一颗客星，白天都能看见，持续了二十多天。今天我们知道，那是一次超新星爆发，它的遗迹就是著名的蟹状星云。同一年，基督教会在罗马和君士坦丁堡之间正式分裂。","pts":[["开封",114.3,34.8],["罗马",12.5,41.9,"l"],["君士坦丁堡",28.98,41.01]]},{"c":18,"y":1127,"cam":[117,31,5],"t":"一千一百二十七年，金兵攻破开封，徽宗、钦宗二帝被俘，史称靖康之变。宋室南渡，后来以临安，也就是今天的杭州为都城。南宋虽然丢了北方，海上贸易却更加兴旺，福建泉州成了世界级的大港，被外国旅行者称为刺桐。","pts":[["开封",114.3,34.8],["临安（杭州）",120.15,30.27],["泉州",118.6,24.9]],"rt":[[[114.3,34.8],[116,33],[118.5,32],[119.8,30.6]]]},{"c":18,"y":1066,"cam":[-1,52,5.5],"t":"同一时期的英格兰，一千零六十六年，国王去世，三方争夺王位。九月，挪威国王哈拉尔从北方入侵，在斯坦福桥被英格兰国王哈罗德击败；几天后，诺曼底公爵威廉在南岸登陆。哈罗德的军队急行军南下，十月十四日在黑斯廷斯决战。","pts":[["斯坦福桥",-0.91,53.99],["黑斯廷斯",0.49,50.91],["诺曼底",-0.37,49.18,"b"]],"rt":[[[5.3,60.4],[2,57.5],[-0.5,54.5],[-0.9,54]],[[-0.4,49.3],[0,50.2],[0.45,50.85]]]},{"c":18,"y":1066,"cam":[0,50.5,9],"t":"哈罗德战死，传说是被箭射中了眼睛，但这个细节学界有争论。威廉在圣诞节加冕，人称征服者威廉。这一切被绣在一幅长约七十米的贝叶挂毯上，上面还绣着一颗彗星，那正是一千零六十六年出现的哈雷彗星。","pts":[["黑斯廷斯",0.49,50.91],["伦敦",-0.12,51.5,"l"]]},{"c":18,"y":1086,"cam":[-1,51,6],"t":"征服之后，英格兰的上层说法语，下层说英语，大量法语词涌进了英语。活的牛叫cow，来自古英语；端上餐桌的牛肉叫beef，来自法语。猪和猪肉、羊和羊肉也一样。常听到的解释是农民养牛、贵族吃肉，实际过程更复杂。今天英语词汇约有三成源自法语。","pts":[["伦敦",-0.12,51.5]],"ar":[["英格兰",-1.5,52.5,2.6]]},{"c":19,"y":-500,"cam":[108,6,2.2],"t":"这一章，镜头南下来到东南亚。这里一边是中南半岛，一边是星罗棋布的马来群岛，正好夹在印度和中国这两大文明之间。季风每年定时转向，帆船顺风而来、顺风而去，这片海成了古代世界最繁忙的十字路口之一。","a":true,"ar":[["中南半岛",102,15,7],["马来群岛",113,-2,9]]},{"c":19,"y":-500,"cam":[105.9,20.3,6],"t":"先看越南北部的红河流域。约公元前一千纪中叶起，这里兴起了东山文化，最有名的是青铜大鼓。鼓面上铸着头戴羽冠的人、高脚屋、船只和飞翔的水鸟。铜鼓用于祈雨、祭祀和葬礼，从越南到印度尼西亚东部，已经发现了两百多面。","a":true,"pts":[["东山",105.76,19.8,"l"],["玉缕",105.98,20.5]],"ar":[["东山文化",105.8,20.6,1.6]]},{"c":19,"y":-111,"cam":[108,20,4.2],"t":"公元前一一一年，汉武帝灭南越国，在今天越南北部和中部设郡，此后约一千年，越南北部大体处在中国历代王朝的统治之下。公元四〇年，交趾的征侧、征贰姐妹起兵反抗，征侧一度自立为王，约三年后被东汉名将马援镇压。她们至今是越南的民族英雄。","pts":[["番禺（广州）",113.26,23.13],["交趾",106.06,21.04,"l"],["麊泠",105.72,21.18,"t"],["日南",107.6,16.5,"l"]],"ar":[["南越国",110.5,22.5,3]]},{"c":19,"y":100,"cam":[93,10,3.6],"t":"还记得古代印度那一章留下的伏笔吗？大约从公元初起，印度的商人、僧侣和婆罗门越过孟加拉湾来到这里。东南亚的统治者主动学习梵文、印度教和佛教，用来装点王权，但并不照搬：神话被改编成本地版本，字母也被改造来书写自己的语言。","a":true,"pts":[["印度东海岸",80.3,13.1,"l"],["马来半岛",99,9]],"rt":[[[80.6,13],[87,12],[93,10.5],[97.9,8.9]],[[80.5,8],[88,6.5],[95.5,5.8],[99.5,3.3]]]},{"c":19,"y":100,"cam":[105,11.2,5.5],"t":"湄公河下游最早的大国叫扶南。中国史书记载了一个建国传说：一个叫混填的外来者乘船而来，用神弓射穿了女王柳叶的船，女王只好投降并嫁给了他。这个故事出自三世纪中叶东吴使者康泰、朱应的见闻，学者多把它看作象征性的传说。","a":true,"pts":[["吴哥波雷",104.98,10.99,"t"]],"ar":[["扶南",105.2,10.8,2.4]]},{"c":19,"y":150,"cam":[105.6,10.3,7.5],"t":"扶南的大港俄厄，在今天越南南部。一九四二年起的考古发掘中，这里出土了罗马安东尼·庇护时代的金质奖章，还有仿照罗马金币做的金饰。前面讲过，一六六年自称大秦使者的人正是从日南上岸，罗马的影子确实到过这片海。","a":true,"pts":[["俄厄港",105.15,10.25,"l"]]},{"c":19,"y":192,"cam":[108.5,14.8,5.5],"t":"约公元一九二年，今天越南中部的人们摆脱汉朝统治，建立了国家，中国史书先后称它林邑、环王、占城，今天一般叫占婆。前面宋朝那章讲的占城稻，就来自这里。占婆人在美山的山谷里修建红砖神庙，前后延续了好几百年。","a":true,"pts":[["美山",108.12,15.77,"l"],["占城（毗阇耶）",109.07,13.9]],"ar":[["占婆",108.7,14.3,2.2]]},{"c":19,"y":412,"cam":[101,15,2.2],"t":"东晋高僧法显在印度和斯里兰卡求法多年，后来搭商船回国。途中遇上风暴，船漂到一个叫耶婆提的岛上，可能是爪哇或苏门答腊。他在那里住了五个月，再搭船北上，又被大风吹偏，四一二年竟然在山东崂山靠了岸。","pts":[["狮子国",80.6,7.5,"l"],["耶婆提",106.85,-6.2,"b"],["崂山",120.62,36.15]],"rt":[[[81.5,6.2],[88,5],[95.3,6.3],[98.8,4.6],[100.8,2.8],[103,1.1],[105.2,-2],[106.8,-5.8]],[[106.9,-5.6],[106.5,-1],[107.5,4],[110,9.5],[113,15],[117,21],[119.6,24.4],[122.5,29],[123,33],[120.75,36.1]]]},{"c":19,"y":671,"cam":[100,10,1.9],"t":"六七一年，唐朝僧人义净从广州搭船南下，二十来天就到了苏门答腊的室利佛逝，在这里学了半年梵文语法，才去印度的那烂陀寺。他后来写道，这里的僧人有一千多，建议想去印度的中国僧人先在此住上一两年，学好规矩再走。","pts":[["广州",113.26,23.13],["室利佛逝（巨港）",104.75,-2.99,"b"],["那烂陀寺",85.44,25.14,"l"]],"rt":[[[113.3,22.6],[113,19],[111,16.5],[110,12],[106.5,6],[105,1.5],[105.3,-1.8],[104.8,-2.9]],[[104.8,-2.9],[105.2,-2],[104.4,0.4],[103,1.1],[100.8,2.8],[98.8,4.6],[95.5,6.5],[90,14],[88,21.4]]]},{"c":19,"y":683,"cam":[103,0,4],"t":"巨港附近出土的一块石碑记载，六八三年，一位首领率领约两万人乘船出征，碑文中出现了室利佛逝的国名。这是现存最古老的马来语碑文。此后三百多年，室利佛逝控制着马六甲海峡，迫使往来商船到它的港口停靠，海峡就是它的收费站。","pts":[["巨港",104.75,-2.99,"b"],["马六甲海峡",100.6,3.2,"l"]],"ar":[["室利佛逝",103.5,-0.5,5]]},{"c":19,"y":800,"cam":[110.3,-7.6,8],"t":"约八到九世纪，爪哇中部的夏连特拉王朝建起了婆罗浮屠。它里面没有殿堂，本身就是一座用约五万五千立方米安山岩垒成的巨大佛塔，像一座立体的曼陀罗。顶层有七十二座镂空小塔，每座里面都坐着一尊佛像，全寺原有五百零四尊佛像。","a":true,"pts":[["婆罗浮屠",110.2,-7.61,"l"],["默拉皮火山",110.45,-7.54]]},{"c":19,"y":800,"cam":[110.2,-7.6,9],"t":"朝圣者从底层出发，顺时针绕行，一层层往上走，沿途经过两千六百多块浮雕，象征从充满欲望的人间一步步走向觉悟。后来这座佛塔被火山灰和丛林掩埋，一八一四年，英国人莱佛士听说了它，派人清理出来。如今它被认为是世界上最大的佛教寺庙。","a":true,"pts":[["婆罗浮屠",110.2,-7.61]]},{"c":19,"y":802,"cam":[104,13.5,7.5],"t":"镜头转到柬埔寨。八〇二年，阇耶跋摩二世在荔枝山上举行仪式，宣布自己是统御四方的转轮王，不再臣服于一个叫「爪哇」的势力，这个爪哇究竟指哪里，学界还有争论。一般把这一年看作高棉帝国，也就是吴哥王朝的开端。","pts":[["荔枝山",104.1,13.57,"t"],["吴哥",103.87,13.41,"l"]],"ar":[["高棉",104.5,12.8,2.5]]},{"c":19,"y":830,"cam":[110,8,2.4],"t":"一九九八年，印尼勿里洞岛附近的渔民发现了一艘约八三〇年沉没的阿拉伯式帆船，船上有约六万件唐朝货物，大多是湖南长沙窑的瓷碗，其中一只写着宝历二年，也就是八二六年。船上还有迄今发现的最大的唐代金杯。","a":true,"pts":[["广州",113.26,23.13],["勿里洞沉船",107.2,-2.4,"l"],["长沙",112.94,28.23]],"rt":[[[113.3,22.6],[113,18],[110,11],[107.5,4],[107.2,-2.3]]]},{"c":19,"y":856,"cam":[110.35,-7.68,8.5],"t":"婆罗浮屠东南不远处，八五六年落成了印度教的普兰巴南神庙群，主殿湿婆神庙高四十七米。当地传说，一位王子要在一夜之间建一千座神庙，眼看建到第九百九十九座，公主让村妇舂米、点火，公鸡以为天亮打起鸣来，鬼神一哄而散。","pts":[["普兰巴南",110.49,-7.75],["婆罗浮屠",110.2,-7.61,"l"]]},{"c":19,"y":938,"cam":[106.4,21,7],"t":"回到越南北部。九三八年，吴权在白藤江迎战南汉水军。他事先在江底打下包着铁尖的木桩，涨潮时把敌舰引进来，等退潮时木桩露出水面，敌船纷纷被刺穿。南汉王子刘弘操战死，第二年吴权称王，越南从此走上独立的道路。","pts":[["白藤江",106.78,20.92],["大罗城",105.85,21.03,"l"]]},{"c":19,"y":1010,"cam":[105.9,20.7,7.5],"t":"一〇一〇年，李朝开国皇帝李公蕴把都城从山间的华闾迁到红河边。据说他看见一条龙从河上腾空而起，便取名升龙，就是今天的河内，二〇一〇年河内办了千年庆典。一〇七〇年这里修起了祭祀孔子的文庙，五年后开科取士。","pts":[["华闾",105.9,20.29,"l"],["升龙（今河内）",105.85,21.03]],"rt":[[[105.9,20.32],[105.87,21]]]},{"c":19,"y":1025,"cam":[93,3,2.3],"t":"一〇二五年，南印度的朱罗王朝派舰队远征室利佛逝，攻破都城巨港，俘虏了国王。室利佛逝从此一蹶不振。后来它被世人渐渐遗忘，直到一九一八年，法国学者赛代斯才从碑文和中国史书里，把这个海上帝国重新拼了出来。","pts":[["坦贾武尔",79.14,10.79,"l"],["吉打",100.36,5.65],["巨港",104.75,-2.99,"b"]],"rt":[[[80.2,10.6],[86,7],[93,3],[96,0],[99,-3.5],[102.5,-6.5],[104.8,-6.6],[105.8,-5.95],[106.2,-5.4],[105.9,-3.5],[105.2,-2.4],[104.8,-2.9]]]},{"c":19,"y":1044,"cam":[95.6,19.5,5],"t":"一〇四四年，阿奴律陀成为蒲甘国王，把伊洛瓦底江流域统一起来，常被视为缅甸国家的奠基人。他推崇上座部佛教。此后两百多年，蒲甘平原上建起了一万多座佛塔和寺庙，如今还留下两千多座，红砖佛塔铺满平原，像一片石头的森林。","pts":[["蒲甘",94.86,21.17,"l"],["直通",97.37,16.92]],"ar":[["蒲甘王朝",95.6,20,3.5]]},{"c":19,"y":1113,"cam":[103.87,13.41,9.5],"t":"再回吴哥。一一一三年即位的苏利耶跋摩二世，花了几十年修建吴哥窟，献给毗湿奴。它占地约一百六十公顷，护城河宽一百九十米，中央主塔高六十五米，被吉尼斯世界纪录列为世界最大的宗教建筑。它动工的时候，巴黎圣母院还要再过约四十年才开工。","pts":[["吴哥窟",103.867,13.412]]},{"c":19,"y":1130,"cam":[103.87,13.41,9.5],"t":"吴哥窟有个特别之处：大多数高棉神庙朝东，它却朝西。有学者说西方与毗湿奴有关，也有学者认为它是国王的陵庙。回廊浮雕里有一幅乳海翻腾：众神和阿修罗拉着一条巨蛇搅动大海，求取长生甘露。今天吴哥窟就印在柬埔寨的国旗上。","a":true,"pts":[["吴哥窟",103.867,13.412]]},{"c":19,"y":1150,"cam":[103.85,13.42,8.5],"t":"吴哥不只是神庙，还是一座水利城市。高棉人挖出长约八公里、宽约两公里的西池等大水库，用沟渠蓄水、分水，应付雨季和旱季。二〇〇七年的研究发现，大吴哥地区至少有一千平方公里，可能是工业革命之前面积最大的城市。","a":true,"pts":[["西池",103.78,13.44,"l"],["吴哥窟",103.867,13.412,"b"]],"ar":[["大吴哥地区",103.87,13.43,0.2]]},{"c":19,"y":1177,"cam":[106,11.8,4.2],"t":"一一七七年，占婆的船队沿湄公河而上，穿过洞里萨湖突袭吴哥，攻破都城，杀死了高棉国王，此后占领约四年。一一八一年，阇耶跋摩七世赶走占婆军队登上王位。这位信奉大乘佛教的国王，据碑文记载在全国修建了一百零二座医院。","pts":[["吴哥",103.87,13.41,"l"],["占婆",109.07,13.9]],"rt":[[[109.3,13.6],[109.5,11.5],[107.5,9.8],[106.75,9.6],[105.8,10.3],[104.92,11.56],[104.4,12.4],[103.95,13.1],[103.87,13.35]]]},{"c":19,"y":1190,"cam":[103.87,13.43,9.5],"t":"阇耶跋摩七世在新都城吴哥通王城的正中建起巴戎寺，原有四十九座宝塔，塔上刻着约两百张巨大的微笑面孔，有人说是观音菩萨，有人说是国王本人。回廊浮雕里有赶集、做饭、斗鸡的市井生活，也有和占婆人在洞里萨湖上的水战。","a":true,"pts":[["巴戎寺",103.859,13.441,"t"],["塔布茏寺",103.889,13.435]]},{"c":19,"y":1238,"cam":[100.5,16,5],"t":"十三世纪，泰人在湄南河上游崛起。约一二三八年，两位泰人首领脱离高棉的控制，建立了素可泰王国，名字来自梵文，意思是幸福的黎明。它常被看作泰国历史上第一个泰人王国，不过也有学者提醒，这种说法有不少是近代塑造的。","a":true,"pts":[["素可泰",99.7,17.02,"l"]],"ar":[["素可泰王国",100,17,2.5]]},{"c":19,"y":1287,"cam":[101,17,2.6],"t":"这时，蒙古人建立的元朝，兵锋也伸向了东南亚，蒙古的故事后面再细讲。一二八二年起，元军从海路进攻占城，占婆国王退入山林打游击，元军最终撤走。缅甸的蒲甘王朝在元军的连番进攻中，约一二八七年崩溃，不过新研究认为，元军可能根本没有打到蒲甘城下。","a":true,"pts":[["蒲甘",94.86,21.17,"l"],["占城",109.07,13.9],["大都",116.4,39.9]]},{"c":19,"y":1288,"cam":[106.5,21,7],"t":"元朝两次渡海攻打日本都以失败告终，在南方，元军也三次进攻大越。一二八八年，陈兴道在白藤江照搬了三百多年前吴权的办法：江底打木桩，涨潮时诱敌深入，退潮时出击，元朝水军几乎全军覆没。此后大越以名义上的朝贡换来了和平。","pts":[["白藤江",106.78,20.92],["升龙",105.85,21.03,"l"]]},{"c":19,"y":1292,"cam":[99.7,17.02,8],"t":"一八三三年，后来的泰国国王蒙固在素可泰发现了一块石碑，传统上定为一二九二年，被视为最早的泰文。碑上写道：水里有鱼，田里有稻。还说宫门挂着一口钟，百姓有冤可以敲钟见国王。不过有学者怀疑它是后世伪造，争论至今没有完全平息。","pts":[["素可泰",99.7,17.02]]},{"c":19,"y":1293,"cam":[112,-5,2.8],"t":"一二九三年，元军登陆爪哇，要惩罚曾在元朝使者脸上刺字的爪哇国王，却发现他已被政敌所杀。国王的女婿罗登·威查耶先借元军之手打败仇人，再回头突袭元军，迫使元军撤走，随后建立了满者伯夷王国，它后来成为群岛上最强大的国家之一。","pts":[["泉州",118.6,24.9],["杜板",112.05,-6.9,"t"],["满者伯夷",112.38,-7.56,"b"]],"rt":[[[118.8,24.6],[117,21],[113,15],[110,9],[108.5,3],[108.5,0],[108.7,-2],[110,-5],[112.05,-6.75]]]},{"c":19,"y":1296,"cam":[113,20,3.2],"t":"一二九六年，元朝派使团前往真腊，也就是柬埔寨。温州人周达观随行，从温州出海，经过占城，再沿湄公河进入洞里萨湖，在吴哥住了将近一年。回国后他写下《真腊风土记》，这是现存唯一一部亲历者描写吴哥日常生活的著作。","pts":[["温州",120.67,28],["占城",109.07,13.9],["吴哥",103.87,13.41,"l"]],"rt":[[[120.9,27.9],[121.3,27],[119.6,24.4],[117,21.4],[112,17.5],[109.7,13.9],[109.5,11.5],[107.5,9.8],[106.75,9.6],[105.8,10.3],[104.92,11.56],[104.4,12.4],[103.95,13.1],[103.87,13.35]]]},{"c":19,"y":1297,"cam":[103.87,13.43,9],"t":"书里说，当地买卖都由妇女来做，所以中国人到了那里，常常先娶一位当地妻子，帮着做生意。有些中国水手觉得这里不必多穿衣服，米粮容易得到，干脆留下不走了。打官司时，有时让双方坐进石塔，几天后谁生病谁理亏，叫作天狱。","pts":[["吴哥通王城",103.859,13.441]]},{"c":19,"y":1300,"cam":[106,8,2.1],"t":"到十四世纪初，东南亚的主角正在换班：吴哥渐渐衰落，素可泰和大越方兴未艾，爪哇有了满者伯夷，伊斯兰教也将随着商船来到这片海。下一章，时间倒回六世纪，镜头离开季风吹拂的海洋，回到蒙古高原，去看突厥人怎样从草原一路走向西亚。","a":true,"pts":[["吴哥",103.87,13.41,"l"],["升龙",105.85,21.03],["素可泰",99.7,17.02,"l"],["满者伯夷",112.38,-7.56]]},{"c":20,"y":552,"cam":[100,46,3],"t":"这一章，镜头回到蒙古高原。草原那一章的结尾说过，突厥人还会从这里出发。五五二年，阿史那部的首领土门打败了昔日的主人柔然，自称伊利可汗，建立突厥汗国。突厥这个名字，第一次作为一个国家的名号登上了欧亚大陆的舞台。","pts":[["于都斤山（杭爱山）",101,47.5]],"ar":[["突厥汗国",100,47,9]]},{"c":20,"y":540,"cam":[89,48,5],"t":"突厥这个名字从哪来？中国史书说，他们住在金山南麓，金山的形状像古代的头盔兜鍪，当地人把兜鍪叫作突厥，部落就以此为名。也有学者认为这只是一种民间解释。史书还记载，柔然可汗曾骂土门是给自己打铁的锻奴。","a":true,"pts":[["金山（阿尔泰山）",89,48.5]]},{"c":20,"y":540,"cam":[100,46,4],"t":"突厥王族阿史那氏还有一个祖先传说：远古时部落被敌人灭族，只剩一个男孩，被一头母狼救活养大，他的后代繁衍成了突厥。这当然是传说，但狼从此成了突厥的象征。据《周书》记载，突厥可汗的军旗上就装饰着金色的狼头。","a":true,"ar":[["阿史那部的草原",98,47,6]]},{"c":20,"y":568,"cam":[60,45,2.8],"t":"突厥扩张得飞快，不过二三十年，地盘就从中国东北一直延伸到黑海边。五六八年，突厥派粟特人出使君士坦丁堡，向东罗马皇帝推销丝绸，双方还商量着联手对付波斯。中国的丝绸，就这样经过突厥人和粟特人之手，转运到了地中海。","pts":[["撒马尔罕（粟特）",66.96,39.65,"b"],["君士坦丁堡",28.98,41.01,"l"]],"rt":[[[66.9,39.7],[62,43],[55,46],[48,47],[42,45],[40,42.5],[36,41],[30,41]]]},{"c":20,"y":603,"cam":[85,44,2.2],"t":"这么大的汗国，很难靠一个可汗管住。五八一年
