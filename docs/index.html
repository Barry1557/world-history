末达到约三亿。一千七百九十三年，英国派马戛尔尼使团来华，希望扩大通商。乾隆在给英王的敕谕里说，天朝物产丰盈，无所不有，原不借外夷货物以通有无。这次会面，后来被许多史家反复回味。","pts":[["北京",116.4,39.9],["承德避暑山庄",117.94,40.99]]},{"c":33,"y":1789,"cam":[2.35,48.86,10],"t":"一千七百八十九年，法国财政濒临破产，国王召开三级会议，局势迅速失控。七月十四日，巴黎民众攻占了巴士底狱。冷知识：当时监狱里只关着七个人，四个伪造犯、两个精神病人，还有一个被家人送进去的贵族。但巴士底狱象征着王权，它的陷落成了革命的标志。","pts":[["巴士底狱",2.37,48.85],["凡尔赛",2.12,48.8,"l"]]},{"c":33,"y":1793,"cam":[2.35,48.86,8],"t":"同年八月，《人权和公民权宣言》发表。革命越走越激进，一千七百九十三年一月，国王路易十六被送上断头台。接下来的恐怖统治中，仅经过正式判决处死的就有约一万七千人。革命也带来了新事物：公制单位米和公斤，就诞生于这个时期的法国。","pts":[["巴黎",2.35,48.86]]},{"c":33,"y":1791,"cam":[-72.5,19,7],"t":"法国大革命的口号传到了加勒比海的圣多明各，那里是当时世界上最赚钱的殖民地之一，靠几十万被奴役的非洲人种植甘蔗和咖啡。一千七百九十一年，奴隶起义爆发，杜桑·卢维杜尔成为起义领袖。他们先后与法国、西班牙和英国的军队作战。","pts":[["圣多明各（海地）",-72.3,19.2]],"ar":[["圣多明各",-72.5,19,1.5]]},{"c":33,"y":1804,"cam":[-72.5,19,7],"t":"一千八百零四年一月一日，海地宣布独立，成为世界上第一个由被奴役者通过起义建立的国家。但独立的代价沉重：一千八百二十五年，法国以武力相威胁，要求海地支付巨额赔款来换取承认，据估算，海地为此背负的债务一直还到了二十世纪中叶。","pts":[["太子港",-72.34,18.54]]},{"c":33,"y":1804,"cam":[10,48,3],"t":"法国这边，一位科西嘉出身的炮兵军官拿破仑迅速崛起，一千七百九十九年发动政变上台，一千八百零四年加冕称帝，据记载是他自己把皇冠戴到了头上。他颁布的《拿破仑法典》影响了世界上许多国家的民法。他的军队几乎横扫了欧洲大陆。","pts":[["巴黎",2.35,48.86],["科西嘉",9.1,42.1]],"ar":[["拿破仑帝国",8,48,8]]},{"c":33,"y":1812,"cam":[20,52,3],"t":"顺便替拿破仑澄清一下：他并不矮，身高约一米六九，比当时法国男性的平均身高还略高一点。矮子的印象，来自法国和英国长度单位的换算误会，以及英国漫画家的刻意丑化。一千八百一十二年，他率领数十万大军进攻俄国，在严冬中撤退时几乎全军覆没。","pts":[["莫斯科",37.62,55.75],["涅曼河",23.9,54.9,"l"]],"rt":[[[23.9,54.9],[27.5,54.6],[30.3,54.8],[33,55],[35.5,55.5],[37.5,55.75]]]},{"c":33,"y":1815,"cam":[-30,0,1.4],"t":"一千八百一十五年，拿破仑在比利时的滑铁卢战败，被流放到南大西洋的圣赫勒拿岛，一千八百二十一年死在那里。随后，拉丁美洲在玻利瓦尔等人的带领下掀起独立浪潮，到十九世纪二十年代，西班牙在美洲大陆的殖民地基本都独立了。","pts":[["滑铁卢",4.4,50.68,"l"],["圣赫勒拿岛",-5.72,-15.97],["加拉加斯（玻利瓦尔）",-66.9,10.5,"l"]]},{"c":34,"y":1769,"cam":[-2.2,53,7],"t":"十八世纪后半叶，英国开始了一场比任何政治革命都更深刻的变革。一千七百六十九年，瓦特为改良蒸汽机申请了专利；新式纺纱机让一个工人能顶过去好几个人。为什么偏偏是英国？煤炭便宜、工资高、市场大，学界有很多解释，至今仍在争论。","pts":[["格拉斯哥",-4.25,55.86,"l"],["伯明翰",-1.9,52.49],["曼彻斯特",-2.24,53.48]]},{"c":34,"y":1830,"cam":[-2.6,53.45,14],"t":"一千八百三十年，利物浦到曼彻斯特的铁路通车，这是世界上第一条完全靠蒸汽机车运营的城际铁路。人类第一次可以比马跑得更快地长途旅行。各地原本按自己的太阳时间过日子，为了排列车时刻表，英国铁路后来统一采用了伦敦时间。","pts":[["利物浦",-2.98,53.41,"l"],["曼彻斯特",-2.24,53.48]],"rt":[[[-2.98,53.41],[-2.6,53.44],[-2.24,53.48]]]},{"c":34,"y":1848,"cam":[5,50,4.5],"t":"工业化也有黑暗的一面。工厂里有大量童工，一天工作十几个小时；城市烟尘弥漫，工人挤在拥挤的贫民窟里。一千八百四十八年，马克思和恩格斯发表《共产党宣言》，同一年，欧洲许多国家爆发革命。工业革命改变了财富，也改变了思想。","pts":[["曼彻斯特",-2.24,53.48,"l"],["伦敦",-0.12,51.5],["巴黎",2.35,48.86],["柏林",13.4,52.52]]},{"c":34,"y":1800,"cam":[60,40,1.3],"t":"在工业革命之前，中国的江南和英国的富裕地区，生活水平可能相差不大，学界对此有过激烈争论。但此后，东西方之间的差距迅速拉大，史学家称之为大分流。到了十九世纪，拥有蒸汽船和新式火炮的欧洲国家，把目光投向了亚洲。","a":true,"ar":[["英格兰",-1.5,52.5,3],["江南",120,31,3]]},{"c":34,"y":1839,"cam":[100,18,2.6],"t":"英国从中国买茶叶，却没有多少东西能卖给中国，白银不断流向东方。于是英国商人向中国大量走私鸦片，到十九世纪三十年代末，每年运来的鸦片多达约四万箱。一千八百三十九年，林则徐在虎门当众销毁鸦片两百多万斤，前后用了二十多天。","pts":[["加尔各答",88.36,22.57,"l"],["广州",113.26,23.13],["虎门",113.67,22.82,"b"]],"rt":[[[88.4,22],[90,17],[94,10],[99,4],[104,1.5],[108,8],[112,16],[113.6,22.5]]]},{"c":34,"y":1842,"cam":[116,27,4],"t":"一千八百四十年，英国发动鸦片战争。清军装备落后，节节败退。一千八百四十二年，清政府签订《南京条约》，割让香港岛，开放广州、厦门、福州、宁波、上海五处通商口岸，赔款两千一百万银元。中国近代史，通常就从这里讲起。","pts":[["广州",113.26,23.13],["厦门",118.09,24.48],["福州",119.3,26.08],["宁波",121.55,29.87],["上海",121.47,31.23],["香港",114.17,22.3,"b"],["南京",118.78,32.06,"l"]]},{"c":34,"y":1860,"cam":[114,32,3.6],"t":"接下来的二十年，清朝内外交困。一千八百五十年底爆发的太平天国运动席卷南方许多省份，死亡人数估计在两千万以上，学界估计差异较大。一千八百六十年，英法联军攻入北京，焚毁了圆明园。这些都是那个时代沉重的伤痕。","pts":[["北京圆明园",116.3,40.01],["天京（南京）",118.78,32.06]],"ar":[["太平天国",116,29,5]]},{"c":34,"y":1861,"cam":[20,40,1.1],"t":"一千八百六十一年是个特别的年份。这一年，美国南北战争爆发，战争结束时奴隶制被废除；俄国沙皇宣布废除农奴制；清朝设立总理衙门，洋务运动起步，开始办工厂、造轮船。世界各地，都在用自己的方式应对这个突然加速的时代。","pts":[["华盛顿",-77.04,38.9],["圣彼得堡",30.32,59.94],["北京",116.4,39.9]]},{"c":34,"y":1853,"cam":[139.7,35.4,8],"t":"日本的大门是被黑船敲开的。一千八百五十三年，美国海军准将佩里率领冒着黑烟的蒸汽军舰驶入江户湾，要求日本开国。日本举国震惊，国内爆发激烈争论。一千八百六十八年，德川幕府倒台，明治天皇亲政，史称明治维新。","pts":[["江户（东京）",139.69,35.69],["浦贺",139.72,35.24,"b"]]},{"c":34,"y":1872,"cam":[139.6,35.55,12],"t":"明治政府大刀阔斧地改革：废除武士特权，推行义务教育，派出岩仓使节团考察欧美近两年。一千八百七十二年，东京到横滨的铁路通车。日本几乎是一边抄作业、一边改作业，几十年里就从一个闭关的岛国变成了工业强国。","pts":[["东京",139.69,35.69],["横滨",139.64,35.44]],"rt":[[[139.76,35.66],[139.7,35.55],[139.64,35.46]]]},{"c":34,"y":1895,"cam":[125,33,4.5],"t":"一千八百九十四年，中日甲午战争爆发，北洋水师全军覆没。一千八百九十五年的《马关条约》中，中国割让台湾，赔款两亿两白银。这场失败深深刺痛了中国人，变法图强的呼声从此越来越高。这时，海底电报已经把各大洲连在一起，坏消息很快就能传遍世界。","pts":[["威海卫",122.12,37.5],["马关（下关）",130.94,33.96],["台湾",121,23.7]]},{"c":35,"y":1884,"cam":[18,5,2],"t":"十九世纪末，欧洲列强掀起瓜分世界的狂潮。一千八百八十四年到八十五年的柏林会议上，各国代表在地图上划分非洲，与会者中没有一个非洲人。到一千九百一十四年，非洲大约九成的土地处在殖民统治之下。一千八百九十六年，埃塞俄比亚在阿杜瓦击败意大利军队，保住了独立。","pts":[["柏林",13.4,52.52],["阿杜瓦",38.89,14.16],["蒙罗维亚（利比里亚）",-10.8,6.3,"l"]],"ar":[["非洲",20,3,18]]},{"c":35,"y":1900,"cam":[22,-3,4.5],"t":"殖民统治常常伴随着残酷的剥削。在比利时国王利奥波德二世私人控制的刚果，当地人被强迫采集橡胶，完不成定额就会遭到砍手等酷刑，大量人口死亡。消息传出后，引发了国际舆论的强烈谴责。殖民的伤痕，至今仍在许多地区留下印记。","a":true,"pts":[["利奥波德维尔",15.3,-4.32,"l"]],"ar":[["刚果自由邦",23,-3,8]]},{"c":35,"y":1911,"cam":[115,34,4],"t":"一千九百年，八国联军攻入北京。次年的《辛丑条约》要求中国赔款四亿五千万两白银，相当于当时每个中国人赔一两。一千九百一十一年十月十日，武昌起义爆发，次年一月一日中华民国成立，二月清帝退位，两千多年的帝制就此终结。","pts":[["北京",116.4,39.9],["武昌",114.3,30.55],["南京",118.78,32.06]]},{"c":35,"y":1914,"cam":[18.4,43.85,12],"t":"一千九百一十四年六月二十八日，奥匈帝国皇储斐迪南大公在萨拉热窝遇刺。当天早些时候的一次炸弹袭击已经失败，下午车队却拐错了路口，车子停下倒车时，恰好停在刺客普林西普面前。一个月后，奥匈帝国对塞尔维亚宣战，盟约像锁链一样，把欧洲大国一个个拖入战争。","pts":[["萨拉热窝",18.41,43.86]]},{"c":35,"y":1914,"cam":[3,50,7],"t":"战争很快在西线陷入僵局。也有让人动容的片刻：一千九百一十四年的圣诞节，西线一些地段的英国和德国士兵自发停火，走出战壕交换香烟和食物，有的地方据说还一起踢了足球。可惜这样的停火，后来再也没有大规模出现过。","pts":[["伊珀尔",2.88,50.85,"l"],["阿尔芒蒂耶尔",2.88,50.69,"b"]]},{"c":35,"y":1916,"cam":[4,49,5],"t":"几百公里长的战壕从北海一直延伸到瑞士边境。一千九百一十六年七月一日，索姆河战役第一天，英军伤亡近六万人，其中约一万九千人阵亡。机枪、铁丝网、毒气和大炮，把战争变成了一台吞噬生命的机器。","pts":[["索姆河",2.7,50,"l"],["凡尔登",5.39,49.16]],"rt":[[[2.6,51.15],[2.9,50.8],[2.8,50.3],[2.8,49.9],[3.3,49.4],[4.5,49.25],[5.4,49.1],[6.4,48.8],[7.1,48.2],[7.3,47.6]]]},{"c":35,"y":1917,"cam":[60,40,1.5],"t":"中国也与这场战争有关。一千九百一十七年，北洋政府对德宣战；在此前后，约十四万华工远赴欧洲，在法国和比利时挖战壕、搬弹药、修铁路，许多人长眠异乡。一战期间，全世界约有一千五百万到两千万人死亡。","pts":[["山东",117.5,36.5],["法国北部",2.5,50,"l"]],"rt":[[[120.3,36.1],[128,40],[140,45],[145,50]],[[-70,47],[-40,48],[-10,48.5],[1,49.5]]]},{"c":35,"y":1917,"cam":[30.3,59.9,8],"t":"一千九百一十七年，俄国爆发革命，沙皇退位。到了十一月，列宁领导布尔什维克夺取政权。冷知识：这场革命叫十月革命，却发生在公历十一月，因为当时俄国还在用比公历慢十三天的儒略历。不久后，俄国退出一战，后来建立了苏联。","pts":[["彼得格勒",30.32,59.94]]},{"c":35,"y":1918,"cam":[11,25,1],"t":"一千九百一十八年十一月十一日，一战停火。可另一场灾难正在蔓延：一九一八年流感大流行在全球夺去了数千万人的生命，估计从两千多万到五千万不等。它被叫作西班牙流感，并不是因为源自西班牙，而是因为中立的西班牙新闻不受战时审查，报道得最多。"},{"c":35,"y":1919,"cam":[60,42,1.5],"t":"一千九百一十九年巴黎和会召开。中国是战胜国之一，却被要求把战前德国在山东的权益转交给日本。消息传回国内，五月四日，北京的学生走上街头抗议，掀起了五四运动。最终，中国代表拒绝在《凡尔赛和约》上签字。","pts":[["巴黎",2.35,48.86,"l"],["北京",116.4,39.9],["青岛",120.38,36.07,"b"]]},{"c":35,"y":1921,"cam":[119,31,7],"t":"五四前后的新文化运动，请来了两位先生：德先生和赛先生，也就是民主和科学。白话文取代文言文，鲁迅发表了《狂人日记》。一千九百二十一年，中国共产党在上海召开第一次全国代表大会，最后一天的会议转移到浙江嘉兴南湖的一条游船上举行。","pts":[["上海",121.47,31.23],["嘉兴南湖",120.76,30.76,"b"],["北京",116.4,39.9]]},{"c":36,"y":1929,"cam":[-74,40.7,8],"t":"一千九百二十年代的美国一片繁荣，股市似乎只涨不跌。一千九百二十九年十月，纽约股市崩盘，大萧条席卷全球。到一千九百三十三年，美国约四分之一的劳动力失业，德国失业人数也多达数百万。经济上的绝望，为极端势力的崛起提供了土壤。","pts":[["纽约华尔街",-74.01,40.71]]},{"c":36,"y":1933,"cam":[40,40,1.6],"t":"一千九百三十三年，希特勒在德国上台，迅速建立独裁统治，疯狂扩军，并对犹太人展开系统性迫害。意大利的墨索里尼早在一千九百二十二年就已掌权。在亚洲，日本军国主义势力日益膨胀，把扩张的矛头对准了中国。","pts":[["柏林",13.4,52.52],["罗马",12.5,41.9,"l"],["东京",139.69,35.69]]},{"c":36,"y":1937,"cam":[118,38,4],"t":"一千九百三十一年九月十八日，日本制造九一八事变，侵占中国东北。一千九百三十七年七月七日，卢沟桥事变爆发，中国开始全面抗战。请记住这个时间：在欧洲战火燃起的两年多以前，中国已经在全面抗击侵略了。","pts":[["沈阳（九一八）",123.43,41.8],["卢沟桥",116.21,39.85,"l"]]},{"c":36,"y":1937,"cam":[118.8,32.05,10],"t":"一千九百三十七年十二月，日军攻占南京，在此后数周内对放下武器的士兵和平民进行了大规模屠杀。远东国际军事法庭认定遇难者在二十万以上，南京军事法庭认定为三十万以上。这是人类历史上最黑暗的暴行之一，今天的南京有一座纪念馆，铭记着遇难同胞。","pts":[["南京",118.78,32.06]]},{"c":36,"y":1939,"cam":[8,50,4],"t":"一千九百三十九年九月一日，德国入侵波兰，英法对德宣战，欧洲战争爆发。第二年，德军绕过马其诺防线，用六个星期左右击败了法国。英国在丘吉尔领导下坚持抵抗，在不列颠空战中顶住了德国空军的狂轰滥炸。","pts":[["华沙",21.01,52.23],["巴黎",2.35,48.86,"l"],["伦敦",-0.12,51.5,"l"]]},{"c":36,"y":1942,"cam":[-170,30,1.1],"t":"一千九百四十一年六月，德国撕毁条约，入侵苏联。十二月七日，日本偷袭美国珍珠港，美国随即参战，战争真正成为世界大战。一千九百四十二年的中途岛海战，和一千九百四十二年到四十三年的斯大林格勒战役，成为太平洋和欧洲战场的重要转折点。","p":"p","pts":[["珍珠港",-157.95,21.36],["中途岛",-177.37,28.21,"t"],["斯大林格勒",44.5,48.7,"l"]]},{"c":36,"y":1942,"cam":[19.2,50,7],"t":"在纳粹控制的欧洲，约六百万犹太人在大屠杀中被杀害，同时遇害的还有大量罗姆人、残障人士和其他受害者。奥斯维辛等集中营成为人类罪恶的代名词。今天，奥斯维辛旧址作为纪念馆保留下来，提醒后人：这样的事情，绝不能再发生。","pts":[["奥斯维辛",19.2,50.03]]},{"c":36,"y":1942,"cam":[108,28,3.5],"t":"中国战场长期牵制了大量日军。从台儿庄、武汉等正面战场的会战，到敌后战场的游击战争，中国军民坚持了艰苦卓绝的抗战。滇缅公路和飞越喜马拉雅山的驼峰航线，成为输送援华物资的生命线。抗战期间，中国军民伤亡超过三千五百万。","pts":[["台儿庄",117.73,34.56],["武汉",114.3,30.59],["重庆",106.55,29.56],["昆明",102.71,25.04,"l"]],"rt":[[[91.7,26.2],[95.5,27.5],[99,26],[102.7,25.05]],[[97,22.5],[99,23.5],[100.5,24.5],[102.7,25]]]},{"c":36,"y":1944,"cam":[5,51,4],"t":"一千九百四十四年六月六日，盟军在法国诺曼底登陆，十几万士兵在一天之内踏上海滩，开辟了第二战场。东线的苏军也在不断推进。一千九百四十五年四月，苏军攻入柏林，五月八日，德国无条件投降。","pts":[["诺曼底",-0.6,49.35,"l"],["柏林",13.4,52.52]],"rt":[[[-1.5,50.7],[-0.9,50],[-0.6,49.4]],[[30,52.5],[24,52.4],[19,52.4],[13.5,52.5]]]},{"c":36,"y":1945,"cam":[133,35,5],"t":"一千九百四十五年八月六日和九日，美国在日本广岛和长崎投下原子弹，数十万人死伤。八月八日，苏联对日宣战。八月十五日，日本宣布无条件投降，九月二日签署投降书。第二天，九月三日，后来被定为中国人民抗日战争胜利纪念日。","pts":[["广岛",132.46,34.39],["长崎",129.87,32.75,"l"],["东京",139.69,35.69]]},{"c":36,"y":1945,"cam":[11,20,1],"t":"第二次世界大战造成约七千万到八千五百万人死亡，是人类历史上伤亡最惨重的战争。一千九百四十五年十月，联合国成立，中国是安理会五个常任理事国之一。经历过浩劫的人们希望，用对话代替战争，用规则约束强权。","pts":[["旧金山（联合国宪章签署）",-122.42,37.77],["纽约（联合国总部）",-74,40.75]]},{"c":37,"y":1947,"cam":[40,52,2],"t":"战后的世界很快分成两大阵营。一千九百四十六年，丘吉尔说，一道铁幕已经在欧洲大陆落下。美国和苏联为首的两大阵营，开始了长达四十多年的冷战。之所以叫冷战，是因为两个超级大国从未直接开战，但各地的代理人战争却一点也不冷。","pts":[["富尔顿（铁幕演说）",-91.95,38.85]],"ar":[["北约阵营",-10,48,10],["华约阵营",45,55,14]]},{"c":37,"y":1949,"cam":[95,28,3.2],"t":"与此同时，殖民帝国纷纷瓦解。一千九百四十七年八月，印度和巴基斯坦独立，但分治过程中爆发了大规模暴力，一千多万人被迫背井离乡，死亡人数估计从几十万到两百万不等。一千九百四十九年十月一日，中华人民共和国成立。","pts":[["新德里",77.21,28.61,"l"],["卡拉奇",67,24.86,"l"],["北京",116.4,39.9]]},{"c":37,"y":1960,"cam":[40,5,1.6],"t":"一千九百五十五年，二十九个亚非国家在印度尼西亚万隆开会，发出了团结反殖的声音。一千九百六十年被称为非洲独立年，这一年有十七个非洲国家宣告独立。联合国成立时只有五十一个成员国，如今已经有一百九十三个。","pts":[["万隆",107.6,-6.91],["阿克拉",-0.19,5.6,"l"],["拉各斯",3.38,6.52,"b"],["内罗毕",36.82,-1.29]],"ar":[["非洲独立年",10,5,12]]},{"c":37,"y":1962,"cam":[-80,25,4.5],"t":"冷战曾几次让世界走到悬崖边缘。一千九百五十年到五十三年的朝鲜战争造成了巨大伤亡。一千九百六十二年十月，苏联在古巴部署导弹被美国发现，双方对峙了十三天，核战争一触即发，最终各退一步。很多历史学家认为，那是人类离核战争最近的一次。","pts":[["古巴",-79.5,21.8],["华盛顿",-77.04,38.9],["迈阿密",-80.19,25.76,"l"]],"ar":[["导弹射程",-79.5,22,9]]},{"c":37,"y":1961,"cam":[63.3,46,5],"t":"冷战也打到了太空。一千九百五十七年，苏联发射了第一颗人造卫星；一千九百六十一年四月十二日，加加林乘坐东方一号绕地球飞行一圈，成为第一个进入太空的人，全程约一百零八分钟。不久，美国总统肯尼迪宣布，要在十年之内把人送上月球。","pts":[["拜科努尔发射场",63.31,45.96]]},{"c":37,"y":1969,"cam":[-80.6,28.5,7],"t":"一千九百六十九年七月二十日，阿波罗十一号登月，阿姆斯特朗走出登月舱：这是个人的一小步，却是人类的一大步。指引飞船登月的计算机，可读写内存只有约四千字节，今天一部普通手机的内存是它的几百万倍。月面上没有风，那些脚印可能会保存很久很久。","pts":[["肯尼迪航天中心",-80.6,28.57]]},{"c":37,"y":1970,"cam":[105,38,3.5],"t":"中国在艰苦条件下也走出了自己的路：一千九百六十四年第一颗原子弹爆炸成功，一千九百七十年第一颗人造卫星东方红一号上天，在太空播放《东方红》乐曲。一千九百七十一年，中华人民共和国恢复在联合国的合法席位；一千九百七十二年，美国总统尼克松访华。","pts":[["罗布泊",90.3,40.3,"l"],["酒泉卫星发射中心",100.3,40.96],["北京",116.4,39.9]]},{"c":37,"y":1978,"cam":[118,28,3.5],"t":"一千九百七十八年底，中国开始改革开放。此后几十年，中国经济高速增长，数亿人摆脱贫困，这是人类历史上规模最大的减贫进程之一。同一时期，日本和亚洲四小龙也先后崛起，世界经济的重心开始向东亚回摆。","pts":[["深圳",114.06,22.54],["北京",116.4,39.9],["上海",121.47,31.23]]},{"c":37,"y":1989,"cam":[13.4,52.52,12],"t":"一千九百八十九年十一月九日晚上，东德官员沙博夫斯基在直播的新闻发布会上宣布放宽出境规定。记者问什么时候生效，他翻了翻文件，说：据我所知，立即生效。其实新规原定第二天才实施。成千上万的东柏林人涌向边境，柏林墙当晚就被打开了。","pts":[["柏林",13.4,52.52],["勃兰登堡门",13.38,52.52,"b"]]},{"c":37,"y":1991,"cam":[60,55,2],"t":"柏林墙倒塌不到一年，一千九百九十年十月，德国统一。一千九百九十一年十二月，苏联解体，分成了十五个国家，冷战结束。有人宣称历史已经终结，此后不再有大的意识形态之争。后来的世界证明，历史并没有那么听话。","pts":[["莫斯科",37.62,55.75]],"ar":[["苏联",80,58,18]]},{"c":37,"y":1969,"cam":[-120,36,7],"t":"说到这里，要倒回一千九百六十九年。就在登月的同一年，美国的阿帕网传出了第一条消息。本来要输入LOGIN，结果才打了L和O两个字母，系统就崩溃了。于是网络传出的第一个词是：LO。听起来，倒像是在说：瞧！","pts":[["洛杉矶（加州大学）",-118.44,34.07],["斯坦福研究所",-122.18,37.46,"l"]],"rt":[[[-118.44,34.07],[-120,35.5],[-121.5,36.8],[-122.18,37.45]]]},{"c":37,"y":1994,"cam":[60,45,1.6],"t":"一千九百八十九年，伯纳斯-李在欧洲核子研究中心提出了万维网的设想，一千九百九十一年向公众开放。一千九百八十七年，一封常被称作中国第一封国际电子邮件的邮件从北京发出，内容是：越过长城，走向世界。一千九百九十四年，中国正式全功能接入国际互联网。","pts":[["日内瓦（欧洲核子研究中心）",6.05,46.23,"l"],["北京",116.4,39.9]]},{"c":37,"y":2022,"cam":[11,20,1],"t":"两百多年前，地球上只有约十亿人；二零二二年十一月，世界人口达到了八十亿，今天大约三分之二的人在使用互联网。我们这一代人，生活在人类历史上最富裕、联系最紧密，也面临气候变化等全新挑战的时代。故事还在继续。"},{"c":37,"y":202   }

  /* ================= 年份滚动 ================= */
  var yearEl = $('year'), yearShown = null, yearAnim = 0;
  function trim1(v) { return String(Math.round(v * 10) / 10); }
  function fmtYear(y, approx) {
    if (y <= -1e8) return '约 ' + trim1(-y / 1e8) + ' 亿年前';
    if (y <= -1e4) { var w = -y / 1e4; return '约 ' + (w >= 10 ? Math.round(w) : trim1(w)) + ' 万年前'; }
    y = Math.round(y);
    if (y < 0) return (approx ? '约' : '') + '公元前 ' + (-y) + ' 年';
    return (approx ? '约' : '') + '公元 ' + Math.max(1, y) + ' 年';
  }
  function setYear(s, instant) {
    cancelAnimationFrame(yearAnim);
    var to = s.y, from = yearShown;
    if (s.yt) { yearEl.textContent = s.yt; yearShown = to; return; }
    if (instant || RM || from === null || from === to) { yearEl.textContent = fmtYear(to, s.a); yearShown = to; return; }
    var logMode = from < -1e4 && to < -1e4, t0 = performance.now(), dur = 1300;
    var step = function (now) {
      var t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3), v;
      if (logMode) v = -Math.exp(Math.log(-from) + (Math.log(-to) - Math.log(-from)) * e);
      else v = from + (to - from) * e;
      if (t >= 1) v = to;
      yearEl.textContent = fmtYear(v, s.a);
      yearShown = v;
      if (t < 1) yearAnim = requestAnimationFrame(step);
    };
    yearAnim = requestAnimationFrame(step);
  }

  /* ================= 切换镜头 ================= */
  var cardT = 0, lastCh = null;
  function goScene(i, opt) {
    opt = opt || {};
    i = Math.max(0, Math.min(SC.length - 1, i));
    stopAll();
    var chChanged = SC[i].c !== SC[cur].c || lastCh === null;
    cur = i; sent = opt.sent && opt.sent < SC[i].sents.length ? opt.sent : 0;
    finished = false;
    var s = SC[i];
    clearGroups();
    var flyMs = moveCamera(s, opt.instant);
    buildGroup(s, opt.instant ? 0 : Math.min(900, flyMs * 0.45));
    setYear(s, opt.instant);
    setChapter(s, chChanged && !opt.instant && !opt.quiet);
    showSub(s.sents[sent]);
    updateProgress(); saveState();
    if (playing) {
      var my = token;
      var delay = opt.auto ? (chChanged ? 2200 : 800) : 420;
      timer = setTimeout(function () { if (my === token && playing) speakCurrent(); }, delay);
    }
  }

  function setChapter(s, showCard) {
    var c = CH[s.c - 1];
    $('chap').innerHTML = '<b>第 ' + s.c + ' 章</b>' + esc(c.title);
    markToc();
    if (lastCh !== s.c && showCard && !stage.classList.contains('covered')) {
      $('cardN').textContent = '第 ' + s.c + ' 章';
      $('cardT').textContent = c.title;
      var card = $('card');
      card.classList.add('show');
      clearTimeout(cardT);
      cardT = setTimeout(function () { card.classList.remove('show'); }, 2600);
    }
    lastCh = s.c;
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ================= 字幕与进度 ================= */
  var subEl = $('subText'), subT = 0;
  function showSub(text) {
    text = (text || '').replace(/[，：]$/, '');
    if (subEl.textContent === text) return;
    if (RM) { subEl.textContent = text; return; }
    subEl.classList.add('fade');
    clearTimeout(subT);
    subT = setTimeout(function () { subEl.textContent = text; subEl.classList.remove('fade'); }, 160);
  }

  function fraction() {
    var s = SC[cur], done = 0;
    for (var j = 0; j < sent; j++) done += s.sents[j].length;
    return (CUM[cur] + done) / TOTAL;
  }
  function updateProgress() {
    var f = fraction();
    $('progFill').style.width = (f * 100).toFixed(2) + '%';
    $('count').textContent = (cur + 1) + ' / ' + SC.length;
    var ticks = $('ticks').children;
    for (var i = 0; i < ticks.length; i++) ticks[i].classList.toggle('done', +ticks[i].dataset.f <= f + 1e-9);
    $('prog').setAttribute('aria-valuenow', Math.round(f * 100));
  }
  function buildTicks() {
    var box = $('ticks');
    CH.forEach(function (c, ci) {
      if (ci === 0) return;
      var f = CUM[CHSTART[ci + 1]] / TOTAL, t = document.createElement('i');
      t.style.left = (f * 100).toFixed(3) + '%'; t.dataset.f = f;
      box.appendChild(t);
    });
  }
  function sceneAt(f) {
    var pos = f * TOTAL, i = 0;
    while (i < SC.length - 1 && CUM[i + 1] <= pos) i++;
    return i;
  }
  (function progressEvents() {
    var prog = $('prog'), tip = $('progTip');
    var fAt = function (e) { var r = prog.getBoundingClientRect(); return Math.max(0, Math.min(0.9999, (e.clientX - r.left) / r.width)); };
    prog.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      var f = fAt(e), s = SC[sceneAt(f)];
      tip.textContent = '第 ' + s.c + ' 章 · ' + CH[s.c - 1].title;
      var r = prog.getBoundingClientRect();
      var x = Math.max(80, Math.min(r.width - 80, f * r.width));
      tip.style.left = x + 'px'; tip.classList.add('show');
    });
    prog.addEventListener('pointerleave', function () { tip.classList.remove('show'); });
    prog.addEventListener('click', function (e) { goScene(sceneAt(fAt(e)), {}); });
    prog.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); goScene(cur + (e.key === 'ArrowRight' ? 1 : -1), {}); }
    });
  })();

  /* ================= 目录与设置 ================= */
  function buildToc() {
    var ol = $('tocList');
    CH.forEach(function (c, ci) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="n">' + (ci + 1 < 10 ? '0' : '') + (ci + 1) + '</span><span class="t">' + esc(c.title) + '</span><span class="s">' + esc(c.sub) + '</span>';
      b.addEventListener('click', function () { closePanels(); goScene(CHSTART[ci + 1], {}); if (stage.classList.contains('covered')) play(true); });
      li.appendChild(b); ol.appendChild(li);
    });
  }
  function markToc() {
    var lis = $('tocList').children, c = SC[cur].c;
    for (var i = 0; i < lis.length; i++) lis[i].classList.toggle('cur', i + 1 === c);
  }
  function openPanel(id) {
    closePanels();
    $(id).hidden = false;
    if (id === 'toc') { var c = $('tocList').children[SC[cur].c - 1]; if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' }); }
  }
  function closePanels() { $('toc').hidden = true; $('settings').hidden = true; }
  ['toc', 'settings'].forEach(function (id) {
    var p = $(id);
    p.addEventListener('click', function (e) { if (e.target === p || e.target.hasAttribute('data-close')) closePanels(); });
  });
  $('btnToc').addEventListener('click', function () { openPanel('toc'); });
  $('btnSet').addEventListener('click', function () { openPanel('settings'); });

  function renderVoiceSel() {
    var sel = $('optVoiceSel'), note = $('voiceNote');
    sel.innerHTML = '';
    if (!hasTTS) {
      sel.disabled = true; note.textContent = '这个浏览器不支持语音合成，将只显示字幕。';
      return;
    }
    if (!voices.length) {
      sel.disabled = true;
      var o = document.createElement('option'); o.textContent = '未找到中文声音'; sel.appendChild(o);
      note.textContent = '没有找到中文语音，将按字数计时、只显示字幕。Mac 可在「系统设置 → 辅助功能 → 朗读内容」中添加中文声音（如「婷婷」）。';
      return;
    }
    sel.disabled = false;
    voices.forEach(function (v, i) {
      var o = document.createElement('option');
      o.value = i; o.textContent = v.name + '（' + v.lang + (v.localService ? '' : '，联网') + '）';
      if (v === voice) o.selected = true;
      sel.appendChild(o);
    });
    note.textContent = '标注「联网」的声音需要连接境外服务器，在国内可能无法播放，建议选本机声音。';
  }
  $('optVoiceSel').addEventListener('change', function (e) {
    voice = voices[+e.target.value] || voice; errCount = 0; saved.vn = voice && voice.name;
    saveState();
    if (playing) speakCurrent(true);
  });
  function updateVoiceBtn() {
    stage.classList.toggle('mute', !voiceUsable());
    var sw = $('optVoice'); sw.setAttribute('aria-checked', voiceOn ? 'true' : 'false');
    $('btnVoice').setAttribute('aria-label', voiceOn ? '关闭语音' : '打开语音');
  }
  function setVoiceOn(on) {
    voiceOn = on; errCount = 0; updateVoiceBtn(); saveState();
    if (on && hasTTS && !voices.length) toast('没有找到中文语音，将只显示字幕');
    if (playing) speakCurrent(true);
  }
  $('optVoice').addEventListener('click', function () { setVoiceOn(!voiceOn); });
  $('btnVoice').addEventListener('click', function () { setVoiceOn(!voiceOn); toast(voiceOn ? '语音讲解：开' : '语音讲解：关（只看字幕）'); });

  function setRate(r, restart) {
    rate = clampRate(r);
    $('btnRate').textContent = rate.toFixed(1) + '×';
    $('rateVal').textContent = rate.toFixed(1) + '×';
    $('optRate').value = rate;
    saveState();
    if (restart && playing) speakCurrent(true);
  }
  $('optRate').addEventListener('change', function (e) { setRate(+e.target.value, true); });
  $('optRate').addEventListener('input', function (e) { $('rateVal').textContent = (+e.target.value).toFixed(1) + '×'; });
  $('btnRate').addEventListener('click', function () {
    var n = rate >= 1.6 ? 0.8 : rate + 0.2;
    setRate(n, true); toast('语速 ' + rate.toFixed(1) + ' 倍');
  });

  /* ================= 控制按钮与键盘 ================= */
  $('btnPlay').addEventListener('click', toggle);
  $('btnPrev').addEventListener('click', function () { goScene(cur - 1, {}); });
  $('btnNext').addEventListener('click', function () { goScene(cur + 1, {}); });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
    if (e.key === 'Escape') { closePanels(); return; }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (stage.classList.contains('covered')) { startFrom(finished ? 0 : (saved.i > 0 ? cur : 0)); return; }
      toggle(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goScene(cur + 1, {}); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goScene(cur - 1, {}); }
  });

  var fullBtn = $('btnFull');
  if (document.fullscreenEnabled && !/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    fullBtn.hidden = false;
    fullBtn.addEventListener('click', function () {
      try { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen(); } catch (e) { /* ignore */ }
    });
  }

  var toastT = 0;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ================= 封面 ================= */
  function minutes() { return Math.round(TOTAL / 4.6 / 60); }
  function showCover(mode) {
    stage.classList.add('covered');
    clearTimeout(cardT); $('card').classList.remove('show');
    $('cover').classList.remove('gone');
    var btns = $('coverBtns'); btns.innerHTML = '';
    var mk = function (html, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.innerHTML = html; b.addEventListener('click', fn); btns.appendChild(b); return b; };
    if (mode === 'end') {
      $('coverKicker').textContent = '全片终';
      $('coverTitle').textContent = '放映结束';
      $('coverLede').innerHTML = '谢谢观看。人类的故事还在继续，<br>下一章由我们来写。';
      mk('从头再看一遍', 'primary', function () { startFrom(0); });
      mk('章节目录', '', function () { openPanel('toc'); });
      $('coverHint').textContent = '想核对书里说的年代和数字？设置里有核对记录的链接。';
      return;
    }
    if (mode === 'resume') {
      var s = SC[cur];
      mk('从上次的地方继续<small>第 ' + s.c + ' 章 · ' + esc(CH[s.c - 1].title) + ' · 第 ' + (cur + 1) + ' 段</small>', 'primary two', function () { startFrom(cur, sent); }).focus();
      mk('从头开始', '', function () { startFrom(0); });
    } else {
      mk('开始放映', 'primary', function () { startFrom(0); }).focus();
    }
  }
  function hideCover() {
    if (!stage.classList.contains('covered')) return;
    stage.classList.remove('covered');
    $('cover').classList.add('gone');
  }
  function startFrom(i, s) {
    hideCover();
    if (i !== cur || (s || 0) !== sent) goScene(i, { sent: s || 0, quiet: true });
    // 在点击事件里同步开始朗读，满足 iOS/Safari 必须由用户手势触发声音的要求
    play(true);
    lastCh = null;
    setChapter(SC[cur], true);
  }

  /* ================= 启动 ================= */
  window.addEventListener('resize', debounce(function () {
    measure();
    var t = targetCam(SC[cur]); fly = null; cam = t; showProj(t.pk); applyWorld();
    groups.forEach(function (G) { updateGroup(G, performance.now()); });
    kick();
  }, 120));
  function debounce(fn, ms) { var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; }

  buildToc(); buildTicks();
  setRate(rate, false);
  updateVoiceBtn();
  $('coverMeta').textContent = CH.length + ' 章 · ' + SC.length + ' 个镜头 · 约 ' + minutes() + ' 分钟';
  measure();

  // 进度按「章节标题 + 章内第几段」保存，插入新章节后仍能回到原处
  var savedAt = -1;
  if (typeof saved.ct === 'string') {
    for (var ci = 0; ci < CH.length; ci++) {
      if (CH[ci].title === saved.ct) {
        var first = CHSTART[ci + 1], next = ci + 1 < CH.length ? CHSTART[ci + 2] : SC.length;
        savedAt = Math.min(first + Math.max(0, saved.ci | 0), next - 1);
        if (savedAt !== first + (saved.ci | 0)) saved.s = 0;
        break;
      }
    }
  } else if (saved.i > 0 && saved.i < SC.length) savedAt = saved.i;
  var resume = savedAt > 0 && !saved.done;
  saved.i = savedAt;
  cur = resume ? savedAt : 0;
  sent = resume && saved.s < SC[cur].sents.length ? (saved.s || 0) : 0;
  var s0 = SC[cur];
  cam = targetCam(s0); showProj(cam.pk); applyWorld();
  buildGroup(s0, 400);
  setYear(s0, true); setChapter(s0, false);
  subEl.textContent = s0.sents[sent];
  updateProgress();
  showCover(resume ? 'resume' : 'start');

  // 供自动化自测使用的只读接口
  window.__wh = {
    get cur() { return cur; }, get sent() { return sent; }, get playing() { return playing; }, get finished() { return finished; },
    count: SC.length, go: function (i) { goScene(i, { instant: true }); }, next: function () { sentenceDone(); }, cam: function () { return cam; }, view: function () { return view; }
  };
})();

</script>
</body>
