<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071019">
<meta name="description" content="纪录片式的世界历史速览：自动播放，地图动画、中文语音讲解与字幕。">
<title>世界历史放映厅</title>
<style>
:root {
  --bg: #050b11;
  --sea: #0a1622;
  --land: #1b252e;
  --land-edge: #34424e;
  --grat: rgba(150, 175, 195, 0.08);
  --amber: #eba23c;
  --amber-hi: #f6bf62;
  --amber-dim: rgba(235, 162, 60, 0.55);
  --text: #ece6da;
  --muted: #98a2aa;
  --panel: rgba(9, 17, 25, 0.94);
  --line: rgba(236, 230, 218, 0.12);
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }

/* ---------- 地图 ---------- */
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#world { transition: opacity .38s ease; }
.proj { transition: opacity .38s ease; }
.sphere { fill: var(--sea); }
.grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.land { fill: var(--land); stroke: var(--land-edge); stroke-width: .7; vector-effect: non-scaling-stroke; stroke-linejoin: round; }

.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 75% at 50% 45%, rgba(5, 11, 17, 0) 55%, rgba(5, 11, 17, .72) 100%),
    linear-gradient(to bottom, rgba(5, 11, 17, .55), rgba(5, 11, 17, 0) 22%, rgba(5, 11, 17, 0) 58%, rgba(5, 11, 17, .9) 100%);
}

/* 动态图层：标记、范围、航线（屏幕坐标绘制，缩放时字号不变） */
#fx g.scene { transition: opacity .45s ease; }
#fx g.scene.leaving { opacity: 0; }
.area-glow { fill: url(#g-area); }
.area-ring { fill: none; stroke: var(--amber); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 3 5; }
.area-label { fill: var(--amber-hi); font-size: 13px; letter-spacing: .18em; font-family: var(--serif); paint-order: stroke; stroke: rgba(5, 11, 17, .85); stroke-width: 4px; stroke-linejoin: round; }
.area { opacity: 0; transition: opacity 1.1s ease; }
.area.on { opacity: 1; }

.route-halo { fill: none; stroke: rgba(5, 11, 17, .65); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.route-line { fill: none; stroke: var(--amber); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.route.dash .route-line { stroke-dasharray: 2 6; stroke-width: 2.4; }
.route-head { fill: var(--amber-hi); stroke: rgba(5, 11, 17, .7); stroke-width: 1; }

.pt { opacity: 0; transition: opacity .6s ease; }
.pt.on { opacity: 1; }
.pt-dot { fill: var(--amber-hi); stroke: #0a1218; stroke-width: 1.5; }
.pt-ring { fill: none; stroke: var(--amber); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
.pt-label { fill: var(--text); font-size: 13.5px; paint-order: stroke; stroke: rgba(5, 11, 17, .88); stroke-width: 4px; stroke-linejoin: round; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }

/* ---------- 顶部：年份与章节 ---------- */
.hud {
  position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  pointer-events: none; z-index: 3;
}
.hud-year { min-width: 0; }
.year {
  font-family: var(--serif); font-weight: 700; color: var(--amber);
  font-size: clamp(27px, 7.4vw, 60px); line-height: 1.08; white-space: nowrap;
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
  text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
}
.chap { margin-top: 6px; font-size: clamp(12.5px, 1.6vw + 6px, 16px); color: var(--muted); letter-spacing: .12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
.chap b { color: var(--amber-dim); font-weight: 500; margin-right: .5em; }
.hud-btns { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px;
  background: rgba(10, 20, 30, .62); border: 1px solid var(--line); cursor: pointer; font-size: 14px; color: var(--text);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.tbtn.only-icon { padding: 0 9px; }
.tbtn svg, .cbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tbtn:hover, .cbtn:hover { border-color: var(--amber-dim); color: var(--amber-hi); }
button:focus-visible, .prog:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* ---------- 章节标题卡 ---------- */
.card { position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .7s ease, transform .9s ease; padding: 0 16px; }
.card.show { opacity: 1; transform: none; }
.card-n { color: var(--amber); letter-spacing: .5em; font-size: 13px; margin-bottom: 10px; padding-left: .5em; }
.card-t { font-family: var(--serif); font-size: clamp(28px, 6vw, 54px); font-weight: 700; text-shadow: 0 4px 30px rgba(0, 0, 0, .8); }

/* ---------- 底部：字幕与控制条 ---------- */
.bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sub { max-width: 980px; margin: 0 auto 14px; min-height: 3.2em; display: flex; align-items: flex-end; justify-content: center; }
.sub p {
  margin: 0; text-align: center; font-size: clamp(17px, 1.3vw + 11px, 27px); line-height: 1.6; letter-spacing: .03em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .95), 0 0 18px rgba(0, 0, 0, .85);
  transition: opacity .25s ease;
}
.sub p.fade { opacity: 0; }
.bar { max-width: 1100px; margin: 0 auto; transition: opacity .4s ease; }
.covered .bar { opacity: 0; pointer-events: none; }

.prog { position: relative; height: 22px; cursor: pointer; touch-action: none; }
.prog-track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: rgba(236, 230, 218, .16); overflow: hidden; }
.prog-fill { height: 100%; width: 0; background: var(--amber); border-radius: 2px; transition: width .4s ease; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 6px; width: 2px; height: 10px; margin-left: -1px; background: rgba(236, 230, 218, .45); border-radius: 1px; }
.ticks i.done { background: #0a1218; }
.prog-tip { position: absolute; bottom: 24px; transform: translateX(-50%); white-space: nowrap; background: var(--panel); border: 1px solid var(--line); padding: 4px 9px; border-radius: 6px; font-size: 12.5px; color: var(--text); opacity: 0; pointer-events: none; transition: opacity .15s; }
.prog-tip.show { opacity: 1; }

.ctrls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cbtn {
  width: 42px; height: 42px; border-radius: 21px; display: inline-flex; align-items: center; justify-content: center;
  background: rgba(10, 20, 30, .55); border: 1px solid var(--line); cursor: pointer; color: var(--text); flex-shrink: 0;
}
.cbtn.play { width: 50px; height: 50px; border-radius: 25px; background: var(--amber); color: #111; border-color: transparent; }
.cbtn.play:hover { background: var(--amber-hi); color: #111; }
.cbtn.play svg { width: 22px; height: 22px; fill: currentColor; stroke-width: 2.4; }
.cbtn.txt { width: auto; padding: 0 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.i-pause, .playing .i-play { display: none; }
.playing .i-pause { display: block; }
.i-off, .mute .i-on { display: none; }
.mute .i-off { display: block; }
.mute #btnVoice { color: var(--muted); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; }
.grow { flex: 1; }

/* ---------- 封面 ---------- */
.cover {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 90px 16px 190px;
  background: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(5, 11, 17, .78), rgba(5, 11, 17, .35) 70%, rgba(5, 11, 17, 0));
  transition: opacity .6s ease; z-index: 2;
}
.cover.gone { opacity: 0; pointer-events: none; }
.cover-in { max-width: 620px; }
.kicker { color: var(--amber); letter-spacing: .3em; font-size: 13px; margin: 0 0 14px; }
.cover h1 { font-family: var(--serif); font-size: clamp(36px, 9vw, 76px); margin: 0 0 16px; letter-spacing: .08em; font-weight: 700; text-shadow: 0 4px 30px rgba(0, 0, 0, .7); }
.lede { color: var(--text); opacity: .86; line-height: 1.8; margin: 0 0 10px; font-size: clamp(14.5px, 1vw + 10px, 17px); }
.meta { color: var(--muted); font-size: 13.5px; letter-spacing: .1em; margin: 0 0 22px; }
.cover-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn {
  height: 48px; padding: 0 26px; border-radius: 24px; font-size: 16px; cursor: pointer; letter-spacing: .1em;
  border: 1px solid var(--amber-dim); background: rgba(10, 20, 30, .6); color: var(--text);
}
.btn.primary { background: var(--amber); border-color: transparent; color: #111; font-weight: 600; }
.btn.primary:hover { background: var(--amber-hi); }
.btn:not(.primary):hover { color: var(--amber-hi); }
.btn small { display: block; font-size: 11.5px; letter-spacing: .02em; font-weight: 400; opacity: .75; margin-top: -2px; }
.btn.two { height: auto; padding: 9px 24px; line-height: 1.4; }
.hint { color: var(--muted); font-size: 12.5px; margin: 18px 0 0; line-height: 1.7; }

/* ---------- 面板 ---------- */
.panel { position: absolute; inset: 0; z-index: 5; background: rgba(3, 7, 11, .55); display: flex; justify-content: flex-end; }
.panel-in {
  width: min(420px, 100%); height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: max(18px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.panel h2 { font-family: var(--serif); font-size: 22px; margin: 0; letter-spacing: .1em; }
.x { background: none; border: 1px solid var(--line); border-radius: 16px; height: 32px; padding: 0 14px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.toc-list { list-style: none; margin: 0; padding: 0; }
.toc-list li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; padding: 11px 8px; cursor: pointer;
  background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text);
}
.toc-list .n { grid-row: span 2; color: var(--amber-dim); font-family: var(--serif); font-size: 18px; font-variant-numeric: tabular-nums; }
.toc-list .t { font-size: 15.5px; }
.toc-list .s { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.toc-list li.cur button { background: rgba(235, 162, 60, .1); }
.toc-list li.cur .n, .toc-list li.cur .t { color: var(--amber-hi); }
.toc-list li button:hover .t { color: var(--amber-hi); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row.col { flex-direction: column; align-items: stretch; }
.row label { font-size: 15px; }
.row label b { color: var(--amber); font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
select { width: 100%; height: 40px; border-radius: 8px; background: #0e1a25; color: var(--text); border: 1px solid var(--line); padding: 0 10px; font: inherit; font-size: 14.5px; }
input[type=range] { width: 100%; accent-color: var(--amber); }
.switch { width: 50px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: rgba(236, 230, 218, .15); position: relative; cursor: pointer; flex-shrink: 0; }
.switch span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: var(--text); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--amber); }
.switch[aria-checked="true"] span { transform: translateX(22px); background: #111; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin: 10px 0 0; }
.note a { color: var(--amber); }

.toast { position: absolute; z-index: 6; left: 50%; top: 90px; transform: translate(-50%, -10px); background: var(--panel); border: 1px solid var(--amber-dim); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 手机与窄屏 ---------- */
@media (max-width: 640px) {
  .tbtn span { display: none; }
  .tbtn { padding: 0 9px; }
  .cbtn { width: 40px; height: 40px; }
  .cbtn.play { width: 46px; height: 46px; }
  .sub { min-height: 4.8em; margin-bottom: 10px; }
  .pt-label { font-size: 12.5px; }
  .area-label { font-size: 12px; letter-spacing: .12em; }
  .cover { padding: 80px 16px 170px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .sub { min-height: 2.6em; margin-bottom: 6px; }
  .sub p { font-size: 16px; line-height: 1.45; }
  .year { font-size: 26px; }
  .cover { padding: 56px 16px 120px; }
  .cover h1 { font-size: 34px; margin-bottom: 8px; }
  .lede { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  .pt-ring { display: none; }
}

</style>
</head>

window.WH = {"scale":360,"W":1969.48,"H":1024.12,"lon0":{"a":11,"p":154},"chapters":[{"title":"地球的一天","sub":"把 46 亿年压成 24 小时，人类只占最后几秒"},{"title":"走出非洲","sub":"智人走向世界，以及我们身上的尼安德特人基因"},{"title":"农业革命","sub":"好几个地方各自独立发明了种地"},{"title":"文明的曙光","sub":"苏美尔的账本、金字塔、印度河与甲骨文"},{"title":"青铜时代大崩溃","sub":"约公元前 1200 年，一个国际体系的倒塌"},{"title":"轴心时代","sub":"孔子、佛陀、苏格拉底与希伯来先知"},{"title":"波斯与希腊","sub":"居鲁士、希波战争、亚历山大东征"},{"title":"秦汉与罗马","sub":"欧亚大陆两端的两个大帝国"},{"title":"罗马的落幕","sub":"民族大迁徙、476 年，与又活了近千年的东罗马"},{"title":"伊斯兰的兴起","sub":"622 年、帝国扩张、智慧宫与怛逻斯"},{"title":"大唐、查理曼与维京人","sub":"长安的盛世与欧洲的新秩序"},{"title":"宋朝与诺曼征服","sub":"纸币、活字、指南针，以及 1066 年"},{"title":"十字军","sub":"1096—1291 年的东征"},{"title":"蒙古旋风与黑死病","sub":"最大的陆地帝国与最惨烈的瘟疫"},{"title":"郑和、君士坦丁堡与印刷机","sub":"十五世纪的三件大事"},{"title":"大航海","sub":"哥伦布、达·伽马、麦哲伦，以及白银流向中国"},{"title":"宗教改革与科学革命","sub":"路德、伽利略、牛顿与利玛窦"},{"title":"革命的时代","sub":"美国独立、法国大革命、海地与拿破仑"},{"title":"蒸汽、鸦片与明治","sub":"工业革命改变了世界的力量对比"},{"title":"帝国主义与第一次世界大战","sub":"瓜分世界、一战、十月革命与五四运动"},{"title":"大萧条与第二次世界大战","sub":"中国的全面抗战始于 1937 年"},{"title":"冷战、登月与互联网","sub":"从铁幕到柏林墙倒塌，再回到「一天」"}],"scenes":[{"c":1,"y":-4600000000,"cam":[11,10,1],"t":"欢迎来到世界历史放映厅。接下来的一个多小时，我们要把人类的故事从头到尾放一遍。开场之前，先做个小实验：把地球四十六亿年的历史，压缩成一天二十四小时。午夜零点，地球诞生；到了第二天午夜十二点，就是此时此刻。"},{"c":1,"y":-3800000000,"cam":[11,0,1],"t":"凌晨四点前后，大约三十八亿年前，海洋里出现了最早的生命，具体时间学界还有争论。接下来的大半天，地球的主角都是单细胞生物，它们安安静静地繁殖了十几个小时，几乎没有任何剧情。如果这是一部电影，观众大概已经睡着了。"},{"c":1,"y":-538000000,"cam":[11,10,1],"t":"晚上九点多，寒武纪生命大爆发，海里突然热闹起来，长眼睛的、带硬壳的、长腿的，纷纷登场。晚上十点四十多分，恐龙出现了。它们统治地球将近一个小时，直到晚上十一点三十九分左右，戏份戛然而止。"},{"c":1,"y":-66000000,"cam":[-89,21,4.5],"t":"让恐龙退场的，是约六千六百万年前的一颗小行星，它撞在今天墨西哥的尤卡坦半岛附近，留下了直径约一百八十公里的希克苏鲁伯撞击坑。恐龙的大部分家族就此灭绝，只有一支活了下来，就是今天窗外叽叽喳喳的鸟。","pts":[["希克苏鲁伯撞击坑",-89.5,21.4]],"ar":[["撞击区域",-89.5,21.4,4]]},{"c":1,"y":-300000,"cam":[10,10,2.2],"t":"那我们人类呢？智人大约在三十万年前出现在非洲，摩洛哥的杰贝尔依罗出土的化石就有这么古老。放进地球的这一天里，我们只占了最后大约五点六秒。也就是说，你眨几下眼的工夫，人类的全部历史就演完了。","pts":[["杰贝尔依罗",-8.87,31.86,"l"],["奥莫基比什",35.95,5.4]],"ar":[["非洲",20,3,18]]},{"c":1,"y":-300000,"cam":[11,10,1],"t":"五秒多实在太挤，我们换一把尺子：把智人的三十万年，再拉长成一天。这样一来，一小时约等于一万两千五百年。按这把尺子，农业出现在最后一个小时里；有文字的历史只占最后约二十五分钟；工业革命以来的世界，只占最后约一点二分钟。"},{"c":1,"y":-300000,"cam":[25,5,1.6],"t":"所以这部片子的大部分时间，都花在这一天的最后半小时里。这不是因为之前不重要，而是因为之前的人没给我们留下文字，只留下石器、骨头和火堆的灰烬。好，灯光暗下，放映开始。"},{"c":2,"y":-300000,"cam":[60,10,1.6],"t":"三十万年前的非洲，智人并不孤单。在之后很长一段时间里，地球上还生活着好几种人：欧洲和西亚有尼安德特人，亚洲有丹尼索瓦人，印尼的弗洛勒斯岛上还有身高一米左右、被戏称为霍比特人的小个子人类。那时的地球，是一个多种人类共存的星球。","pts":[["尼安德特人（欧洲、西亚）",6.95,51.23,"r"],["丹尼索瓦洞",84.68,51.4],["弗洛勒斯岛",120.45,-8.53]],"ar":[["智人的故乡",30,2,14]]},{"c":2,"y":-70000,"cam":[40,18,3.2],"t":"智人并不是一出生就急着离家。大约十几万年前，就有零星的队伍走出非洲，到过今天的以色列一带，但大多没有留下后代。大约七万到六万年前，才发生了那次真正改变世界的大扩散。为什么偏偏是那时候？学界还在争论，气候变化可能是重要推手。","pts":[["米斯利亚洞穴",34.97,32.75,"l"],["曼德海峡",43.4,12.6]],"rt":[[[36,4],[40,9],[43.3,12.6],[46,15],[52,18],[57,22]],[[33,25],[33.5,29.5],[35,33],[38,36]]],"rs":"d"},{"c":2,"y":-50000,"cam":[110,5,2.2],"t":"一路向东的人们沿着海岸线前进，吃着贝壳和鱼，穿过南亚，进入东南亚。至少五万年前，他们已经划船渡海，登上了澳大利亚，有学者认为还能早到六万五千年前。即使在冰期海平面最低的时候，这段海路也从来没有完全连成陆地。","pts":[["苏拉威西岩画",119.6,-4.9,"r"],["马杰德贝贝",132.6,-12.5],["蒙哥湖",143.1,-33.7]],"rt":[[[57,22],[65,24],[72,20],[80,12],[90,21],[98,14],[103,2],[112,-7],[122,-9],[130,-11],[134,-14]]],"rs":"d"},{"c":2,"y":-45000,"cam":[20,46,4],"t":"大约四万五千年前，智人进入欧洲，在那里遇到了已经住了几十万年的尼安德特人。尼安德特人脑容量不比我们小，会用火、做工具、照顾伤病的同伴，并不是漫画里那种笨拙的野蛮人。大约四万年前，他们从化石记录里消失了，原因至今众说纷纭。","pts":[["巴乔基罗洞",25.43,42.95],["肖维洞穴",4.42,44.39,"l"],["尼安德河谷",6.95,51.23]],"rt":[[[36,34],[33,38],[28,41],[25,43],[18,46],[10,47],[3,46]]],"rs":"d"},{"c":2,"y":-40000,"cam":[60,40,2.2],"t":"不过，尼安德特人并没有完全消失。今天非洲以外的人，基因组里平均约有百分之二来自尼安德特人。换句话说，两群人当年不只是打过照面。更奇妙的是，研究发现，帮助藏族人适应高海拔的一个关键基因变体，来自神秘的丹尼索瓦人。","pts":[["青藏高原",89,32]],"ar":[["尼安德特人",15,46,9],["丹尼索瓦人",95,35,12]]},{"c":2,"y":-40000,"cam":[70,38,1.8],"t":"同一时期，东亚也有了智人的足迹，北京周口店附近的田园洞出土了约四万年前的人骨。法国肖维洞穴的岩壁上，有人用炭笔画下奔跑的马和狮子，距今三万多年；苏拉威西岛的洞穴里，有一幅至少四万五千年前画的野猪。艺术，几乎是和智人一起走遍世界的。","pts":[["田园洞",115.88,39.66],["肖维洞穴",4.42,44.39,"l"],["苏拉威西",119.6,-4.9]]},{"c":2,"y":-16000,"cam":[-150,35,1.5],"t":"冰期时海平面很低，西伯利亚和阿拉斯加之间露出一片宽阔的陆地，叫白令陆桥。人类从这里走进美洲。具体什么时候，争议很大：比较稳妥的说法是至少一万五千年前；美国新墨西哥州白沙的人类脚印，显示可能早到两万多年前。","p":"p","pts":[["白令陆桥",-169,65.5,"t"],["白沙脚印",-106.3,32.9],["蒙特维德",-73.2,-41.5]],"rt":[[[125,63],[150,66],[172,66],[-169,65.5],[-155,64],[-140,60],[-125,52],[-112,40],[-100,25],[-85,12],[-77,2],[-78,-15],[-73,-38]]],"rs":"d"},{"c":2,"y":-12000,"cam":[175,-5,1.4],"t":"这场从非洲出发的长跑持续了几万年。冰期结束时，除了南极和许多偏远海岛，人类几乎到过了所有大陆。顺便剧透一下：最后被人类定居的大块陆地是新西兰，要等到约公元十三世纪，由驾驶双体独木舟的波利尼西亚航海者完成。","p":"p","pts":[["新西兰（约 13 世纪）",174.8,-41.3,"l"],["夏威夷",-155.5,19.6],["复活节岛",-109.35,-27.1]],"ar":[["波利尼西亚",-150,-15,22]]},{"c":3,"y":-11700,"cam":[11,25,1.2],"t":"大约一万一千七百年前，最后一个冰期结束，地球进入温暖稳定的全新世。冰川后退，海平面上升，白令陆桥被淹没，美洲与亚洲从此隔海相望。气候变得靠谱之后，人类开始在好几个地方做同一件影响至今的事：种地。"},{"c":3,"y":-9500,"cam":[38,36,7],"t":"不过在种地之前，先有一个谜。土耳其东南部的哥贝克力石阵，建于约一万一千多年前，几吨重的石柱上刻着狐狸、野猪和蝎子。它比英国巨石阵早六千多年，比埃及金字塔早约七千年。让考古学家吃惊的是，建造者很可能还是狩猎采集者。","a":true,"pts":[["哥贝克力石阵",38.92,37.22]]},{"c":3,"y":-9000,"cam":[40,34,4.5],"t":"有学者猜想：也许正是为了让一大群人聚在一起搞大工程，人们才不得不想办法多弄粮食。在石阵附近的新月沃地，人类驯化了小麦、大麦、豌豆，后来又驯化了山羊、绵羊和牛。约旦河谷的杰里科，很早就修起了石墙和石塔。","a":true,"pts":[["哥贝克力",38.92,37.22],["杰里科",35.44,31.87,"l"],["恰塔霍裕克",32.83,37.67,"l"]],"ar":[["新月沃地",40,34,5]]},{"c":3,"y":-8000,"cam":[114,33,4.5],"t":"同一时期，地球另一边的中国，也在独立地发明农业。大约一万年前，长江下游的先民开始驯化水稻，浙江的上山遗址就有早期稻作的痕迹；黄河流域则驯化了粟和黍，也就是小米和黄米。南稻北粟的格局，一直延续到今天。","a":true,"pts":[["磁山",114.1,36.57],["上山",119.95,29.47]],"ar":[["粟作（黄河）",112,36,3.5],["稻作（长江）",117,30,3.5]]},{"c":3,"y":-7000,"cam":[-85,0,2.2],"t":"美洲的人们没有任何外援，同样独立发明了农业。墨西哥人把一种穗子只有几厘米长的野草，经过几千年选育，变成了玉米；南瓜在那里驯化得更早，距今约一万年。安第斯山区的人们，则驯化了土豆、藜麦和羊驼。","a":true,"pts":[["巴尔萨斯河谷",-100.5,18.2,"l"],["的的喀喀湖",-69.4,-15.9]],"ar":[["中美洲：玉米、南瓜、豆子",-97,18,5],["安第斯：土豆、藜麦、羊驼",-70,-14,6]]},{"c":3,"y":-7000,"cam":[70,10,1.3],"t":"新几内亚高地的人们，也独立种起了芋头和香蕉。把这些地方放到一张地图上看：农业不是一个天才的发明，而是好几群互不相识的人，在冰期结束后，几乎不约而同地走上了同一条路。","a":true,"ar":[["新月沃地",40,34,5],["中国",115,33,6],["中美洲",-97,18,5],["安第斯",-70,-14,6],["新几内亚",144,-6,4]]},{"c":3,"y":-7000,"cam":[36,36,5],"t":"种地真是好事吗？考古发现，早期农民往往比狩猎采集者更矮，牙病更多，干活更累。有人开玩笑说：不是人类驯化了小麦，而是小麦驯化了人类，让一个物种心甘情愿地每天弯腰除草、挑水、赶鸟。可是种地能养活更多人，人口一多，就回不去了。","a":true,"pts":[["恰塔霍裕克",32.83,37.67]]},{"c":3,"y":-7500,"cam":[33,35,9],"t":"定居带来了村庄，也带来了新室友。狗是最早的家畜，驯化时间比农业还早，可能在一万五千年以前。猫则可能是自己找上门的：粮仓招来老鼠，老鼠招来猫。塞浦路斯岛上有一座约九千五百年前的墓，人和一只猫被葬在一起。","a":true,"pts":[["塞浦路斯：人与猫的合葬墓",33.3,34.75,"b"]]},{"c":4,"y":-3500,"cam":[45,32,7],"t":"公元前四千年前后，两河流域南部的乌鲁克成了世界上最早的城市之一，人口后来可能达到几万人。城里有神庙、工匠和官吏，也有一个大问题：东西太多，记不住了。谁交了几袋大麦，谁欠了几头羊，总得有个记录。","a":true,"pts":[["乌鲁克",45.64,31.32],["乌尔",46.1,30.96,"b"]],"ar":[["苏美尔",45.8,31.4,1.8]]},{"c":4,"y":-3200,"cam":[45,32,6],"t":"于是，大约公元前三千二百年，苏美尔人用芦苇杆在泥板上压出符号，这就是楔形文字的前身。最早的文字绝大多数是账本：大麦多少、啤酒多少、羊多少。说得夸张一点，人类最早写下的句子，大概就是：某某还欠两只羊。","a":true,"pts":[["乌鲁克",45.64,31.32]]},{"c":4,"y":-3100,"cam":[31,27,5],"t":"几乎同时，尼罗河畔的埃及也有了象形文字，并在约公元前三千一百年完成统一。尼罗河每年定时泛滥，留下肥沃的黑泥，埃及人就按照洪水的节奏安排一年的生活。古希腊历史学家希罗多德说得好：埃及是尼罗河的礼物。","a":true,"pts":[["孟菲斯",31.25,29.85,"l"],["底比斯",32.64,25.7]],"ar":[["尼罗河谷",31.5,27,3.5]]},{"c":4,"y":-2560,"cam":[31.1,30,12],"t":"约公元前二千五百六十年，胡夫大金字塔建成，原高约一百四十六米，在之后三千多年里一直是世界上最高的人造建筑。考古发现，修金字塔的主力并不是奴隶，而是有组织的劳工，他们有住处、有医疗，口粮里还有面包和啤酒。","a":true,"pts":[["吉萨金字塔",31.13,29.98]]},{"c":4,"y":-2600,"cam":[-40,20,1.6],"t":"当两河和尼罗河忙着建城的时候，地球另一边也没闲着。南美秘鲁的卡拉尔，在约公元前两千六百年就有了金字塔形的土台和广场，是美洲已知最早的城市之一；英国的巨石阵，也在这一千多年里分几期建成。文明并不只有一个起点。","a":true,"pts":[["卡拉尔",-77.52,-10.89],["巨石阵",-1.83,51.18],["吉萨",31.13,29.98]]},{"c":4,"y":-2500,"cam":[70,27,5],"t":"再往东，印度河流域出现了哈拉帕和摩亨佐达罗。这些城市街道横平竖直，家家户户连着排水沟，规划水平让后来许多城市汗颜。他们也有文字，刻在小小的印章上，可惜至今没人能读懂。顺便一提，金字塔建成时，北冰洋的弗兰格尔岛上还活着最后一批猛犸象。","a":true,"pts":[["哈拉帕",72.86,30.63],["摩亨佐达罗",68.14,27.33,"l"],["洛塔尔",72.25,22.52]],"ar":[["印度河文明",70.5,27,4.5]]},{"c":4,"y":-1750,"cam":[44,32,7],"t":"约公元前一千七百五十年，巴比伦国王汉谟拉比把两百八十多条法律刻在一块两米多高的黑色石碑上，如今陈列在巴黎卢浮宫。里面有著名的以眼还眼，但惩罚轻重要看身份。连卖酒的都管：女酒商若在啤酒价钱上做手脚，要被扔进水里。","a":true,"pts":[["巴比伦",44.42,32.54]]},{"c":4,"y":-1750,"cam":[46,31,8],"t":"同一时代，两河流域的乌尔城还留下了一块著名的泥板：一个叫南尼的人写信痛骂铜商埃亚纳西尔，说他卖的铜质量差，对客人还爱答不理。这块泥板现藏大英博物馆，常被称为已知最早的投诉信之一。看来，差评的历史和文字差不多一样长。","a":true,"pts":[["乌尔",46.1,30.96]]},{"c":4,"y":-1250,"cam":[113,35,7],"t":"东亚这边，河南偃师的二里头遗址可能与传说中的夏朝有关，学界仍有争论。可以确定的是商朝：公元前十三世纪前后，商王在龟甲和牛骨上刻字占卜，问下雨、问打仗，也问牙疼。据说一八九九年，王懿荣在中药龙骨上认出了这些字，甲骨文才重见天日。","a":true,"pts":[["二里头",112.69,34.69,"l"],["殷墟",114.31,36.12]],"ar":[["商",114,35,3]]},{"c":5,"y":-1300,"cam":[32,35,4.2],"t":"公元前十四到十三世纪的东地中海，是一个热闹的国际社会。埃及、赫梯、亚述、巴比伦、迈锡尼希腊，国王们互相写信称兄道弟，通用的外交语言是阿卡德语。各国之间交换黄金、木材、马匹，还有制造青铜必需的铜和锡。","a":true,"pts":[["哈图沙（赫梯）",34.62,40.02],["迈锡尼",22.76,37.73,"l"],["乌加里特",35.78,35.6],["巴比伦",44.42,32.54],["底比斯",32.64,25.7]]},{"c":5,"y":-1274,"cam":[35,32,5],"t":"约公元前一千二百七十四年，埃及法老拉美西斯二世和赫梯人在卡迭石大战一场，双方都宣称自己赢了。十几年后，两国签订了已知最早的和平条约之一，条约的复制品今天挂在纽约联合国总部。打完仗再签合同，这个流程三千多年没怎么变。","a":true,"pts":[["卡迭石",36.51,34.56],["底比斯",32.64,25.7]],"rt":[[[32.6,25.7],[31.5,30],[33.5,31.3],[35,33],[36.4,34.4]]]},{"c":5,"y":-1200,"cam":[30,37,4.5],"t":"然而就在约公元前一千二百年前后，这个国际体系在几十年内接连崩塌。赫梯首都哈图沙被焚毁，叙利亚海岸的商业名城乌加里特被毁，希腊的迈锡尼王宫纷纷倒下。乌加里特国王的一封信里写着：父亲，敌人的船来了。","a":true,"pts":[["哈图沙",34.62,40.02],["乌加里特",35.78,35.6],["迈锡尼",22.76,37.73,"l"],["特洛伊",26.24,39.96,"l"]]},{"c":5,"y":-1177,"cam":[28,33,4],"t":"埃及的神庙浮雕把这些入侵者称为海上民族。约公元前一千一百七十七年前后，拉美西斯三世打退了他们，但埃及也从此元气大伤。今天的学者认为，崩溃不是单一原因造成的：干旱、地震、饥荒、移民、贸易中断，像多米诺骨牌一样一起倒下。","a":true,"pts":[["梅迪奈特哈布神庙",32.6,25.72],["尼罗河三角洲",31,31.2,"l"]],"rt":[[[25,38],[28,35],[31.5,33],[31.3,31.5]]]},{"c":5,"y":-1050,"cam":[25,36,4],"t":"崩溃之后，希腊进入几百年的黑暗时代，连线形文字都失传了。但废墟里也长出了新东西：铁器逐渐普及，腓尼基人发展出只有二十多个字母的字母表。后来的希腊字母、拉丁字母，都是它的后代。你今天在键盘上敲的英文字母，祖上就在这片海岸。","a":true,"pts":[["比布鲁斯",35.65,34.12],["推罗",35.2,33.27,"b"],["迦太基",10.32,36.85]],"rt":[[[35.2,33.3],[30,34],[24,35],[16,37],[10.5,37]]]},{"c":5,"y":-1046,"cam":[10,30,1.1],"t":"同一时间的东方，并没有发生类似的大崩溃。约公元前一千零四十六年，周武王在牧野打败商纣王，周朝建立，后来发展出影响深远的礼乐制度和天命观念。而在大西洋彼岸的墨西哥湾，奥尔梅克人正在雕刻重达数吨到数十吨的巨石人头像。","a":true,"pts":[["牧野",113.9,35.3],["镐京",108.77,34.23,"l"],["圣洛伦索（奥尔梅克）",-94.76,17.75]]},{"c":6,"y":-800,"cam":[65,32,2.2],"t":"德国哲学家雅斯贝尔斯注意到一个奇妙的现象：大约公元前八百年到前两百年之间，中国、印度、希腊、以色列等地，几乎同时涌现出一批伟大的思想家。他把这段时期称为轴心时代。他们彼此几乎不可能见面，却都在追问：人应该怎样活着。","a":true,"ar":[["希腊",23,38.5,3],["以色列",35.3,31.8,2],["印度",83,25.5,4],["中国",115,35,5]]},{"c":6,"y":-551,"cam":[114,35,6],"t":"在中国，春秋末年礼崩乐坏。孔子生于公元前五百五十一年，他带着学生周游列国十几年，四处推销自己的政治主张，几乎没有国君真正采纳。他晚年回到鲁国教书整理典籍，据说弟子三千。一个求职屡屡碰壁的老师，后来影响了东亚两千多年。","pts":[["曲阜",116.99,35.58]],"ar":[["鲁国",117,35.6,1.2]]},{"c":6,"y":-450,"cam":[113,35,5],"t":"被尊为道家始祖的老子，生平扑朔迷离，学界对他是谁、生活在何时都有争论。传说他骑着青牛出函谷关，留下五千言的《道德经》，从此不知所终。到了战国时期，儒、墨、道、法、名、阴阳各家各显神通，史称百家争鸣。","a":true,"pts":[["函谷关",110.88,34.63,"l"],["曲阜",116.99,35.58]]},{"c":6,"y":-500,"cam":[84,25,6],"t":"在印度恒河流域，释迦族的王子悉达多放弃王位出家，据传在菩提伽耶的一棵菩提树下悟道，被尊称为佛陀。他的生卒年学界争论很大，大约在公元前五世纪前后。佛教后来走出印度，沿着商路传到中亚、中国、东南亚和日本。","a":true,"pts":[["蓝毗尼",83.28,27.47],["菩提伽耶",84.99,24.69],["鹿野苑",83.03,25.38,"l"]]},{"c":6,"y":-587,"cam":[40,32,5.5],"t":"在地中海东岸，希伯来先知们批评权贵、呼吁公义，留下了激昂的言辞。公元前五百八十七年或五百八十六年，巴比伦攻陷耶路撒冷，大批犹太人被掳往巴比伦。在流亡中，他们整理和传承自己的经典，这些文字后来深刻影响了犹太教、基督教和伊斯兰教。","a":true,"pts":[["耶路撒冷",35.23,31.78,"l"],["巴比伦",44.42,32.54]],"rt":[[[35.3,31.8],[36.5,34],[38.5,36],[41,35.5],[43.5,33.5],[44.4,32.6]]]},{"c":6,"y":-399,"cam":[23.7,38,11],"t":"在雅典，苏格拉底整天在广场上拉着人提问，一直问到对方哑口无言。他一个字的书都没写，我们知道的他，主要来自学生柏拉图等人的记录。公元前三百九十九年，他被判饮毒芹汁而死。苏格拉底、柏拉图、亚里士多德，师徒三代构成了西方哲学的接力赛。","pts":[["雅典",23.73,37.98]]},{"c":6,"y":-500,"cam":[60,30,1.6],"t":"想一想这个画面：孔子在鲁国讲学的时候，恒河边可能有人在听佛陀说法，雅典人正在建立民主制度。他们谁也不知道谁的存在，留下的思想却在两千多年后的今天，仍然被几十亿人阅读、争论和引用。","a":true,"pts":[["曲阜",116.99,35.58],["菩提伽耶",84.99,24.69],["雅典",23.73,37.98,"l"],["耶路撒冷",35.23,31.78,"b"]]},{"c":7,"y":-539,"cam":[47,32,4.5],"t":"公元前五百三十九年，波斯的居鲁士大帝几乎兵不血刃地进入巴比伦。他允许被掳的犹太人返回家乡、重建圣殿。一个刻满楔形文字的泥土圆柱记录了他的政令，后来被称为居鲁士圆柱。有人说它是最早的人权宣言，不过学界对这个说法有争论。","pts":[["帕萨尔加德",53.17,30.19],["巴比伦",44.42,32.54,"l"]],"rt":[[[53.2,30.2],[50,31.5],[47,32.6],[44.5,32.6]]]},{"c":7,"y":-500,"cam":[48,33,2.8],"t":"到大流士一世时，波斯帝国东到印度河，西到埃及和爱琴海，是当时世界上最大的帝国。帝国修了一条两千多公里的御道，沿途设驿站换马。希罗多德形容这些信使，雪、雨、酷热和黑夜都挡不住他们，这句话今天还刻在纽约一座邮局的门楣上。","a":true,"pts":[["苏萨",48.25,32.19,"b"],["萨第斯",28.04,38.49,"l"],["波斯波利斯",52.89,29.93]],"ar":[["波斯帝国",50,33,14]],"rt":[[[48.25,32.2],[45.5,34.5],[43,36.5],[38,38],[33,39],[28.1,38.5]]]},{"c":7,"y":-490,"cam":[24,38.5,10],"t":"公元前四百九十年，波斯军队在希腊的马拉松登陆，被雅典人击败。传说一名士兵一路跑回雅典报捷，喊完胜利就倒地而死，这个故事很可能是后人添加的。现代马拉松全程四十二点一九五公里，则是在一九零八年伦敦奥运会上定下的。","pts":[["马拉松",23.97,38.15],["雅典",23.73,37.98,"l"]],"rt":[[[23.97,38.15],[23.85,38.05],[23.73,37.98]]]},{"c":7,"y":-480,"cam":[23,38.5,8],"t":"十年后，波斯王薛西斯亲征。公元前四百八十年，斯巴达国王列奥尼达率领三百斯巴达勇士和几千名希腊联军，在温泉关阻击波斯大军。不久，雅典海军在萨拉米斯海湾大败波斯舰队。电影里只剩三百人，其实他们身边还有不少盟友。","pts":[["温泉关",22.54,38.8,"l"],["萨拉米斯",23.48,37.95,"l"],["雅典",23.73,37.98]]},{"c":7,"y":-447,"cam":[23.5,38,7],"t":"打赢之后，雅典迎来了黄金时代：帕特农神庙在公元前四百四十七年动工，民主制度运转起来，戏剧、哲学和历史学一起开花。不过雅典的民主只属于成年男性公民，女性、奴隶和外邦人都没有投票权。后来雅典和斯巴达内斗了二十多年，两败俱伤。","pts":[["雅典",23.73,37.98],["斯巴达",22.43,37.07,"l"]]},{"c":7,"y":-334,"cam":[50,30,2.4],"t":"希腊北方的马其顿崛起了。公元前三百三十四年，二十一岁的亚历山大率军渡海进入亚洲，打败波斯，占领埃及，在那里建了亚历山大城，一路打到印度河流域。士兵们实在不想再走了，他才掉头回来。前后十一年，走完了一条史诗级的远征路线。","pts":[["佩拉",22.52,40.76,"l"],["伊苏斯",36.2,36.85],["亚历山大城",29.92,31.2,"b"],["高加米拉",43.43,36.56],["希达斯皮斯河",73.7,32.95]],"rt":[[[22.5,40.8],[26.4,40.1],[29,39],[33,37.5],[36.2,36.8],[35.5,33.5],[34.5,31.5],[29.9,31.2],[34,31.3],[38,35.5],[43.4,36.6],[44.4,32.5],[52.9,29.9],[60,34],[66.9,36.8],[69.5,34.5],[73.7,33]]]},{"c":7,"y":-323,"cam":[60,33,1.9],"t":"公元前三百二十三年，亚历山大在巴比伦病逝，年仅三十二岁，帝国随即被部将瓜分，希腊文化却随之传遍中东，史称希腊化时代。巧的是，他出生的公元前三百五十六年，按通行说法，正是商鞅在秦国开始变法的那一年。一个在西边开疆拓土，一个在东边为统一铺路。","pts":[["巴比伦",44.42,32.54],["秦国",108.7,34.3]],"ar":[["希腊化世界",45,33,13]]},{"c":7,"y":-261,"cam":[82,23,4.5],"t":"亚历山大走后不久，印度出现了孔雀王朝。第三代君主阿育王在征服羯陵伽的战争中造成大量死亡。据他自己的碑文记载，他此后深感悔恨，转而推行佛法，把诏令刻在石柱和岩壁上，遍布各地。征服者在胜利之后公开反省战争，这在历史上并不常见。","a":true,"pts":[["华氏城",85.14,25.6],["羯陵伽",85.84,20.19]],"ar":[["孔雀王朝",80,23,9]]},{"c":8,"y":-221,"cam":[112,34,4],"t":"公元前二百二十一年，秦王嬴政灭掉六国，自称始皇帝。他统一文字和度量衡，连马车两个轮子之间的距离都统一了，这样车轮在全国的路上都能压进同样的车辙。他还把各国的长城连接起来，修驰道、筑宫殿，还在骊山脚下修了一座地下军团。","pts":[["咸阳",108.7,34.33]],"ar":[["秦",112,33,8]]},{"c":8,"y":-210,"cam":[109.3,34.4,12],"t":"一九七四年，陕西临潼的农民打井时挖出了陶片，秦始皇陵兵马俑就此重见天日。据估计，几个陶俑坑里有约八千件兵马俑，据说几乎每张脸都不一样。可惜秦朝本身只存在了十几年，始皇帝死后没几年，就在大起义中崩溃了。","pts":[["秦始皇陵兵马俑",109.27,34.38]]},{"c":8,"y":-202,"cam":[110,33,3.2],"t":"公元前二百零二年，刘邦建立汉朝。汉朝前后延续了约四百年，汉人、汉字、汉语，这些名字都和它有关。公元二年的户口统计显示，汉朝登记人口接近六千万，这是世界上保存至今最早的较完整人口统计之一。","pts":[["长安",108.94,34.26],["洛阳",112.45,34.62,"b"]],"ar":[["汉",112,33,9]]},{"c":8,"y":-138,"cam":[88,40,3],"t":"公元前一百三十八年前后，汉武帝派张骞出使西域，想联合大月氏夹击匈奴。张骞刚出发就被匈奴扣留了十年，还在那里娶妻生子，逃出后继续西行。他出发时一百多人，十三年后回到长安时只剩两人。联盟没谈成，却打开了通往西方的大门。","a":true,"pts":[["长安",108.94,34.26],["大宛",71.8,40.6],["大月氏（巴克特里亚）",66.9,36.76,"l"]],"rt":[[[108.9,34.3],[103.8,36],[98.5,39.7],[94.7,40.1],[89,42.8],[82,41.7],[76,39.5],[71.8,40.6],[68.8,38.5],[66.9,36.8]]]},{"c":8,"y":-100,"cam":[65,37,2.2],"t":"从此，丝绸、漆器向西，葡萄、苜蓿、良马向东。这条商路后来被称为丝绸之路，不过这个名字通常认为是德国地理学家李希霍芬在一八七七年提出的，汉朝人并不这么叫。它也不是一条路，而是一张由无数商队、绿洲和中间商组成的大网。","a":true,"pts":[["长安",108.94,34.26],["敦煌",94.66,40.14],["喀什",75.99,39.47],["撒马尔罕",66.96,39.65,"t"],["泰西封",44.58,33.09,"b"],["安条克",36.16,36.2,"l"]],"rt":[[[108.9,34.3],[103.8,36],[94.7,40.1],[89,42.8],[82,41.7],[76,39.5],[67,39.6],[62,37.6],[54,36.5],[44.6,33.1],[40,35.3],[36.2,36.2]]]},{"c":8,"y":-218,"cam":[6,41,4.5],"t":"同一时间的地中海，罗马还是个共和国，由元老院和每年选出的两位执政官管理。公元前二百一十八年，迦太基名将汉尼拔带着几十头战象翻越阿尔卑斯山，奇袭意大利。他在意大利转战了十几年，却始终没能攻下罗马城。","pts":[["迦太基",10.32,36.85],["罗马",12.5,41.9],["新迦太基",-0.98,37.6,"l"]],"rt":[[[-0.98,37.6],[0.5,40],[2.5,42.3],[4.6,43.7],[6.5,45],[7.6,45.1],[9.2,45.4],[11.3,44.5],[12.3,43.1]]]},{"c":8,"y":-44,"cam":[12,43,7],"t":"公元前一百四十六年，迦太基被罗马彻底摧毁。共和国越打越大，权力也越来越集中。公元前四十九年，凯撒率军渡过卢比孔河，掀起内战；公元前四十四年三月十五日，他在元老院遇刺身亡。他的养子屋大维最终胜出，罗马从此进入帝国时代。","pts":[["卢比孔河",12.4,44.1],["罗马",12.5,41.9]],"rt":[[[12.4,44.1],[12.6,43.5],[12.7,42.8],[12.5,41.95]]]},{"c":8,"y":-30,"cam":[30,30.5,8],"t":"说到这个时代，不能不提埃及女王克利奥帕特拉。她死于公元前三十年，是托勒密王朝最后一位实际统治者。有个冷知识：她离一九六九年人类登月的时间，比离大金字塔建成的时间还要近。在她眼里，金字塔已经是两千多年前的古董了。","pts":[["亚历山大城",29.92,31.2],["吉萨金字塔",31.13,29.98]]},{"c":8,"y":100,"cam":[65,35,1.5],"t":"公元一、二世纪，欧亚大陆两端各有一个庞大的帝国：东边的汉朝，西边的罗马，人口都在几千万的级别。罗马贵族迷上了中国丝绸，老普林尼抱怨说，每年都有大笔钱财流向东方，只为买奢侈品。可两个帝国从没正式打过交道，中间隔着安息等中间商。","a":true,"ar":[["罗马帝国",18,40,11],["安息",53,33,8],["汉",110,33,11]]},{"c":8,"y":97,"cam":[70,36,2.6],"t":"公元九十七年，东汉西域都护班超派甘英出使大秦，也就是罗马。甘英一路走到条支的海边，一般认为在波斯湾一带，当地的安息船夫告诉他：渡海顺风要三个月，逆风可能要两年，很多人会思念家乡而死。甘英听完就回去了。有人怀疑，安息人是怕中间商的生意被抢。","pts":[["洛阳",112.45,34.62],["条支（一说波斯湾）",47.8,30.5,"b"]],"rt":[[[112.4,34.6],[108.9,34.3],[103.8,36],[94.7,40.1],[89,42.8],[82,41.7],[76,39.5],[67,39.6],[62,37.6],[54,35.5],[48,31]]]},{"c":8,"y":166,"cam":[110,25,4],"t":"公元一百六十六年，东汉史书记载，大秦王安敦派使者从日南郡，也就是今天的越南中部，来到洛阳献礼。安敦很可能就是罗马皇帝马可·奥勒留·安东尼。不过礼物是象牙、犀角和玳瑁，全是东南亚特产，很多学者认为这些人其实是自称使节的商人。","pts":[["日南郡",107.1,16.8],["洛阳",112.45,34.62]],"rt":[[[107.1,16.8],[108.5,21],[110.5,25.5],[112.5,30],[112.45,34.5]]]},{"c":8,"y":105,"cam":[60,38,1.6],"t":"这一时期，两边都有大事。公元七十九年，维苏威火山喷发，掩埋了庞贝城，也意外地把一座罗马城市的日常生活封存了下来。公元一百零五年，东汉的蔡伦改进了造纸术。此前已经有纸，但他让纸变得便宜好用，这件事对世界的影响，可能比很多场战争都大。","pts":[["庞贝",14.49,40.75],["洛阳",112.45,34.62]]},{"c":9,"y":235,"cam":[60,38,1.5],"t":"公元三世纪，罗马陷入危机，五十年里换了二十多位皇帝，大多死于非命。同一时期，东方的汉朝已在公元二百二十年终结，中国进入三国时代。欧亚大陆的两端，几乎同时陷入了分裂和动荡。","ar":[["罗马（三世纪危机）",18,41,10],["三国",112,32,8]]},{"c":9,"y":330,"cam":[29,41,8],"t":"君士坦丁大帝在公元三百一十三年承认基督教合法，又在三百三十年把都城迁到拜占庭，改名君士坦丁堡，也就是今天的伊斯坦布尔。这座城卡在欧亚交界，三面环水，城墙坚固，在之后一千多年里一直是东方罗马的心脏。","pts":[["君士坦丁堡",28.98,41.01]]},{"c":9,"y":376,"cam":[35,46,2.8],"t":"四世纪后期，来自欧亚草原的匈人西进，引发了连锁反应。哥特人被挤得渡过多瑙河，进入罗马境内。公元三百七十八年的阿德里安堡战役，罗马皇帝瓦伦斯战死。有人认为匈人与中国史书里的匈奴有关，但证据不足，学界一直有争论。","pts":[["阿德里安堡",26.56,41.68,"b"],["多瑙河",28.5,45.3,"l"]],"rt":[[[75,47],[65,48],[55,47.5],[47,47],[40,47.2],[33,46.8],[29,46]]]},{"c":9,"y":383,"cam":[114,34,4.5],"t":"同一时期的中国，也在经历民族大迁徙。西晋灭亡后，北方先后出现许多政权，南方则有东晋和后来的南朝。公元三百八十三年的淝水之战，东晋以少胜多。北魏后来开凿了云冈和龙门石窟。南北对峙了很久，直到五百八十九年，隋朝才重新统一。","pts":[["淝水",116.8,32.6],["建康",118.8,32.06,"b"],["平城",113.3,40.08],["云冈石窟",113.12,40.11,"l"]]},{"c":9,"y":410,"cam":[12,42,4],"t":"公元三百九十五年，罗马帝国正式分为东西两半。四百一十年，西哥特人攻入罗马城，这是八百年来罗马城第一次被外敌攻陷。四百五十五年，汪达尔人再次洗劫罗马，英语里表示恶意破坏的词，就来自他们的名字。","pts":[["罗马",12.5,41.9],["迦太基",10.32,36.85]],"rt":[[[-5.5,36],[-2,35.4],[3,36.7],[10.3,36.9],[11.5,39],[12.5,41.8]]]},{"c":9,"y":476,"cam":[12,43,6],"t":"公元四百七十六年，日耳曼将领奥多亚克废黜了西罗马最后一位皇帝。这位少年皇帝的名字叫罗慕路斯·奥古斯都路，恰好把罗马的建城者罗慕路斯和第一位皇帝奥古斯都合在了一起，奥古斯都路的意思是小奥古斯都。他没有被杀，而是领了一笔年金去养老了。","pts":[["拉文纳",12.2,44.42],["罗马",12.5,41.9]]},{"c":9,"y":537,"cam":[22,38,3.2],"t":"西罗马亡了，东罗马却又活了近千年。他们始终自称罗马人，拜占庭帝国这个叫法是后世学者起的。查士丁尼一世夺回了意大利和北非，公元五百三十七年建成圣索菲亚大教堂。但从五百四十一年起，一场被称为查士丁尼瘟疫的鼠疫暴发，夺去了大量人口。","pts":[["君士坦丁堡",28.98,41.01]],"ar":[["东罗马",28,38,9]]},{"c":9,"y":500,"cam":[80,23,4],"t":"在印度，笈多王朝被称为古典黄金时代。印度数学家发展出带零的十进制计数法，公元六百二十八年，婆罗摩笈多系统地写下了零的运算规则。这套数字后来经阿拉伯人传到欧洲，就是今天所说的阿拉伯数字。没有它，你的手机里连一个数字都存不下。","a":true,"pts":[["华氏城",85.14,25.6]],"ar":[["笈多王朝",81,25,7]]},{"c":10,"y":610,"cam":[42,23,5],"t":"七世纪初，阿拉伯半岛的麦加是一座商业城市。约公元六百一十年，商人穆罕默德宣布自己受到启示，开始传播伊斯兰教。起初追随者不多，在麦加还受到排挤。这里不讨论信仰本身，我们只看它如何改变了世界地图。","a":true,"pts":[["麦加",39.83,21.42,"l"],["麦地那",39.61,24.47,"l"]]},{"c":10,"y":622,"cam":[40,23,8],"t":"公元六百二十二年，穆罕默德带领信众从麦加迁到麦地那，这次迁徙叫希吉拉，伊斯兰历就以这一年为元年。在麦地那，他建立起一个兼具宗教和政治的共同体。到六百三十二年他去世时，阿拉伯半岛的大部分已经统一在新信仰之下。","pts":[["麦加",39.83,21.42],["麦地那",39.61,24.47]],"rt":[[[39.83,21.42],[39.4,22.5],[39.3,23.5],[39.61,24.42]]]},{"c":10,"y":651,"cam":[42,30,2.6],"t":"此后短短几十年里，阿拉伯军队击败了彼此打得两败俱伤的东罗马和波斯萨珊王朝。叙利亚、埃及、伊拉克相继纳入版图，萨珊王朝在六百五十一年灭亡。帝国的政治中心先移到大马士革，后来又移到巴格达。","pts":[["大马士革",36.29,33.51,"l"],["泰西封",44.58,33.09],["亚历山大城",29.92,31.2,"l"]],"rt":[[[39.6,24.5],[37,29],[36.3,33.4]],[[39.6,24.5],[42.5,28],[44.5,33]],[[37,30],[33,30.5],[30,31.1]],[[44.6,33.1],[51,33.5],[57,34],[62,35]]]},{"c":10,"y":711,"cam":[-2,38,5],"t":"公元七百一十一年，将领塔里克率军从北非渡海进入西班牙。登陆的那座山后来就以他的名字命名：直布罗陀，意思是塔里克之山。七百三十二年，他们在法国图尔附近被法兰克人挡住。此后七百多年里，伊比利亚半岛的历史与伊斯兰文明紧密交织。","pts":[["直布罗陀",-5.35,36.14,"b"],["科尔多瓦",-4.78,37.88,"l"],["图尔",0.69,47.39]],"rt":[[[-5.6,35.8],[-5.35,36.2],[-4.8,37.9],[-3,40],[-1,42.5],[0.3,45],[0.7,47.2]]]},{"c":10,"y":751,"cam":[72,40,4],"t":"公元七百五十一年，新兴的阿拔斯王朝与唐朝在中亚的怛逻斯河畔交战，唐将高仙芝战败。传统说法认为，被俘的唐朝工匠把造纸术带到了撒马尔罕，不过学界有争论，造纸术可能更早就已西传。被俘的杜环后来回到中国，写下了《经行记》。","pts":[["怛逻斯",71.4,42.9],["撒马尔罕",66.96,39.65,"l"],["安西（龟兹）",82.96,41.72]]},{"c":10,"y":830,"cam":[44,33,7],"t":"阿拔斯王朝在七百六十二年动工修建新都巴格达，城市修成圆形，很快成为国际大都会。在智慧宫等学术机构里，学者们把希腊、波斯、印度的典籍译成阿拉伯文。数学家花拉子密写出了代数学的奠基之作，英语里的代数和算法两个词，都源于他的书名和名字。","a":true,"pts":[["巴格达",44.37,33.31]]},{"c":10,"y":900,"cam":[20,35,2.6],"t":"九到十世纪的伊斯兰世界，医学、天文、光学都相当发达。许多古希腊著作靠阿拉伯文译本得以保存，后来又经西班牙和西西里回流欧洲，为文艺复兴埋下了伏笔。英语里的糖、咖啡、酒精等词，追根溯源都能找到阿拉伯语的影子。","a":true,"pts":[["巴格达",44.37,33.31],["科尔多瓦",-4.78,37.88,"l"],["开罗",31.24,30.04,"b"]],"ar":[["伊斯兰世界",30,30,15]]},{"c":11,"y":618,"cam":[108.9,34.3,9],"t":"公元六百一十八年，唐朝建立。唐都长安面积八十多平方公里，是当时世界上最大的城市之一，人口据估计可能接近百万，学界有争论。城里住着波斯商人、粟特商人、日本留学生和新罗僧人，西市里能买到来自半个世界的货物。","pts":[["长安",108.94,34.26]],"ar":[["长安城",108.94,34.26,0.35]]},{"c":11,"y":629,"cam":[88,32,2.8],"t":"约公元六百二十九年，僧人玄奘偷偷出关，独自西行求法。他穿过沙漠，翻越雪山，在印度的那烂陀寺学习多年，六百四十五年回到长安，带回六百多部经典。他口述的《大唐西域记》成了研究中亚和印度历史的宝贵资料，也是《西游记》的灵感来源。","a":true,"pts":[["长安",108.94,34.26],["那烂陀寺",85.44,25.14]],"rt":[[[108.9,34.3],[103.8,36],[98.5,39.7],[94.7,40.1],[89.2,42.9],[82.9,41.7],[76.5,42.5],[71.4,42.9],[67,39.6],[67,36.7],[69.2,34.5],[72.8,34],[77.5,29],[82,26.5],[85.4,25.2]]]},{"c":11,"y":690,"cam":[122,35,4.5],"t":"唐朝的影响向东传到日本，日本前后派出十几批遣唐使，学习唐朝的制度、建筑和文字，奈良和京都的城市布局都模仿了长安的棋盘格局。公元六百九十年，武则天称帝，成为中国历史上唯一被正统史书承认的女皇帝。","pts":[["长安",108.94,34.26],["奈良",135.8,34.68]],"rt":[[[135.8,34.7],[133,34],[130.4,33.6],[126,31.5],[121.8,30.5],[116,32.5],[112.5,34.6],[109,34.3]]]},{"c":11,"y":755,"cam":[113,36,5],"t":"盛唐的繁华在公元七百五十五年戛然而止。安史之乱持续了八年，战火波及大半个北方，户籍上登记的人口锐减，其中虽有统计体系崩溃的因素，但战乱的惨烈毋庸置疑。杜甫写下了国破山河在，城春草木深。唐朝此后再也没能恢复盛世的气象。","pts":[["范阳",116.2,39.9],["洛阳",112.45,34.62],["长安",108.94,34.26,"l"]]},{"c":11,"y":800,"cam":[7,47,4.5],"t":"同一时代的西欧，法兰克国王查理曼统一了大片领土。公元八百年圣诞节，教皇在罗马为他加冕，称他为罗马人的皇帝。据他的传记作者记载，查理曼年纪很大了才学写字，把写字板放在枕头底下练习，但始终没练好。","pts":[["亚琛",6.08,50.78],["罗马",12.5,41.9]],"ar":[["查理曼帝国",7,47,6.5]]},{"c":11,"y":802,"cam":[25,42,2.6],"t":"查理曼虽然自己写不好字，却大力兴办学校、抄写古籍，书吏们推广的一种清晰小写字母，就是今天小写拉丁字母的祖先。他还和巴格达的哈里发哈伦·拉希德互派使节，哈里发送来了一头名叫阿布·阿巴斯的大象，公元八百零二年走到了亚琛。","pts":[["亚琛",6.08,50.78,"l"],["巴格达",44.37,33.31]],"rt":[[[44.4,33.3],[40,35],[36.2,36.2],[30,32],[20,33],[10.3,37.5],[8.8,44.3],[7.5,47.5],[6.1,50.7]]]},{"c":11,"y":793,"cam":[0,57,4],"t":"公元七百九十三年，一群维京人突袭了英格兰东北海岸林迪斯法恩岛上的修道院，维京时代由此拉开序幕。他们来自斯堪的纳维亚，有时抢劫，更多时候经商和定居。顺便澄清一下：维京人的头盔并没有角，那是十九世纪歌剧服装设计师的创意。","pts":[["林迪斯法恩",-1.8,55.67,"l"]],"rt":[[[5.3,60.4],[3,58.5],[0,56.5],[-1.6,55.7]]]},{"c":11,"y":1000,"cam":[-10,55,2],"t":"维京长船能出海，也能沿河逆流而上。向东，他们沿河南下，参与建立了基辅罗斯，还到君士坦丁堡当皇帝的卫队，在圣索菲亚大教堂的栏杆上刻下涂鸦。向西，他们定居冰岛和格陵兰，约公元一千年前后登上了北美的纽芬兰，比哥伦布早了近五百年。","a":true,"pts":[["基辅",30.52,50.45],["君士坦丁堡",28.98,41.01],["冰岛",-19,64.9],["格陵兰定居点",-45.5,61.15,"l"],["兰塞奥兹牧草地",-55.53,51.6,"l"]],"rt":[[[10,60],[-7,62],[-19,64.5],[-35,63.5],[-45,61.2],[-52,56],[-55.4,51.7]],[[18,59.5],[24,59.5],[30,59.5],[31.3,58.5],[31,54],[30.5,50.5],[31.5,47],[30,43.5],[29,41.1]]]},{"c":11,"y":802,"cam":[-20,20,1.2],"t":"同一时期的其他角落：中美洲的玛雅低地城邦在八、九世纪相继衰落，原因可能包括长期干旱和战争；东南亚的高棉帝国约在公元八百零二年建立，后来建起了吴哥。历史从来不只有一个舞台，只是聚光灯常常打不过来。","pts":[["蒂卡尔（玛雅）",-89.62,17.22],["吴哥",103.87,13.41],["长安",108.94,34.26,"t"]]},{"c":12,"y":960,"cam":[114.3,34.8,8],"t":"公元九百六十年，赵匡胤在陈桥驿黄袍加身，建立宋朝。宋朝在军事上常被说成弱，但在经济、科技和文化上，却是中国历史上的高峰之一。北宋都城开封的商铺可以临街开店，夜市热闹到深夜，城市生活的规矩比唐朝宽松得多。","pts":[["开封（东京）",114.3,34.8]]},{"c":12,"y":1100,"cam":[114,30,4],"t":"张择端的《清明上河图》长五米多，画了几百个人物，从船夫、轿夫到算命先生，是一幅宋代城市生活的超长截图。宋朝人口在十二世纪初突破了一亿。从越南中部引进的占城稻生长期短、耐旱，让很多地方的粮食产量大大提高。","a":true,"pts":[["开封",114.3,34.8],["杭州",120.15,30.27],["占城",108.3,13.8]],"rt":[[[108.3,13.8],[109.5,18],[111,21.5],[115,24.5],[118.5,27.5],[120,30]]]},{"c":12,"y":1024,"cam":[104,30.7,8],"t":"人一多、生意一大，铜钱就不够用了，四川流通的铁钱更是沉得要命。成都的商人先发明了纸质的交子，公元一千零二十四年，北宋政府开始正式发行官方交子，这是世界上最早的政府发行纸币之一。当然，纸币一发多，通货膨胀也就跟着来了。","pts":[["成都",104.07,30.67]]},{"c":12,"y":1044,"cam":[114,33,5],"t":"宋朝还见证了几项改变世界的技术。一千零四十四年成书的《武经总要》记载了火药配方；北宋平民毕昇发明了泥活字印刷，由沈括记在《梦溪笔谈》里；到十二世纪初，《萍洲可谈》已经记载了船员在阴天用指南针辨别方向。","pts":[["开封",114.3,34.8],["广州",113.26,23.13]]},{"c":12,"y":1054,"cam":[60,40,1.6],"t":"公元一千零五十四年，宋朝天文官记录天关星附近出现一颗客星，白天都能看见，持续了二十多天。今天我们知道，那是一次超新星爆发，它的遗迹就是著名的蟹状星云。同一年，基督教会在罗马和君士坦丁堡之间正式分裂。","pts":[["开封",114.3,34.8],["罗马",12.5,41.9,"l"],["君士坦丁堡",28.98,41.01]]},{"c":12,"y":1127,"cam":[117,31,5],"t":"一千一百二十七年，金兵攻破开封，徽宗、钦宗二帝被俘，史称靖康之变。宋室南渡，后来以临安，也就是今天的杭州为都城。南宋虽然丢了北方，海上贸易却更加兴旺，福建泉州成了世界级的大港，被外国旅行者称为刺桐。","pts":[["开封",114.3,34.8],["临安（杭州）",120.15,30.27],["泉州",118.6,24.9]],"rt":[[[114.3,34.8],[116,33],[118.5,32],[119.8,30.6]]]},{"c":12,"y":1066,"cam":[-1,52,5.5],"t":"同一时期的英格兰，一千零六十六年，国王去世，三方争夺王位。九月，挪威国王哈拉尔从北方入侵，在斯坦福桥被英格兰国王哈罗德击败；几天后，诺曼底公爵威廉在南岸登陆。哈罗德的军队急行军南下，十月十四日在黑斯廷斯决战。","pts":[["斯坦福桥",-0.91,53.99],["黑斯廷斯",0.49,50.91],["诺曼底",-0.37,49.18,"b"]],"rt":[[[5.3,60.4],[2,57.5],[-0.5,54.5],[-0.9,54]],[[-0.4,49.3],[0,50.2],[0.45,50.85]]]},{"c":12,"y":1066,"cam":[0,50.5,9],"t":"哈罗德战死，传说是被箭射中了眼睛，但这个细节学界有争论。威廉在圣诞节加冕，人称征服者威廉。这一切被绣在一幅长约七十米的贝叶挂毯上，上面还绣着一颗彗星，那正是一千零六十六年出现的哈雷彗星。","pts":[["黑斯廷斯",0.49,50.91],["伦敦",-0.12,51.5,"l"]]},{"c":12,"y":1086,"cam":[-1,51,6],"t":"征服之后，英格兰的上层说法语，下层说英语，大量法语词涌进了英语。活的牛叫cow，来自古英语；端上餐桌的牛肉叫beef，来自法语。猪和猪肉、羊和羊肉也一样。常听到的解释是农民养牛、贵族吃肉，实际过程更复杂。今天英语词汇约有三成源自法语。","pts":[["伦敦",-0.12,51.5]],"ar":[["英格兰",-1.5,52.5,2.6]]},{"c":13,"y":1095,"cam":[18,42,3],"t":"公元一千零九十五年，教皇乌尔班二世在法国克莱蒙发表演说，号召西欧人前往东方夺取耶路撒冷。起因之一，是东罗马皇帝向西方求援，抵抗塞尔柱突厥人。第二年，大批骑士和平民踏上东征之路，十字军东征就此开始，前后持续了约两百年。","pts":[["克莱蒙",3.08,45.78,"l"],["君士坦丁堡",28.98,41.01],["耶路撒冷",35.23,31.78]],"rt":[[[3.1,45.8],[8,47.5],[16,48],[20.5,44.8],[26,42.5],[29,41],[32,39.5],[35,37],[36.2,36.2],[35.8,33.8],[35.2,31.9]]]},{"c":13,"y":1099,"cam":[36,34,6],"t":"一千零九十九年，第一次十字军攻占耶路撒冷，城中大批穆斯林和犹太居民遭到屠杀。十字军随后在地中海东岸建立了几个十字军国家。对当地居民来说，这首先是一场漫长而血腥的入侵。","pts":[["耶路撒冷",35.23,31.78],["安条克",36.16,36.2],["埃德萨",38.79,37.16]],"ar":[["十字军国家",36,34,3]]},{"c":13,"y":1187,"cam":[35.4,32.4,10],"t":"一千一百八十七年，萨拉丁在哈丁战役中大败十字军，随后收复了耶路撒冷。与八十多年前不同，他没有对城中居民展开屠杀，许多人缴纳赎金后得以离开。萨拉丁因此在中东和欧洲都留下了宽厚君主的名声。","pts":[["哈丁",35.45,32.8],["耶路撒冷",35.23,31.78]]},{"c":13,"y":1192,"cam":[35,32.5,8],"t":"于是有了第三次十字军，英格兰国王狮心王理查和萨拉丁成了一对著名的对手。据记载，理查的战马阵亡时，萨拉丁的弟弟阿迪勒派人送去了战马。双方打了一年多，最终在一千一百九十二年达成协议：耶路撒冷仍归穆斯林，但基督徒朝圣者可以前往。有趣的是，两人始终没有见过面。","pts":[["阿卡",35.07,32.92],["雅法",34.75,32.05,"l"],["耶路撒冷",35.23,31.78]]},{"c":13,"y":1204,"cam":[21,42,4.5],"t":"最出人意料的是第四次十字军。他们欠了威尼斯一大笔船费，在威尼斯的影响下转而攻打基督教城市君士坦丁堡，一千二百零四年将其洗劫一空。许多珍宝被运往西方，今天威尼斯圣马可教堂的青铜驷马，就是当年的战利品。","pts":[["威尼斯",12.33,45.44,"l"],["君士坦丁堡",28.98,41.01]],"rt":[[[12.4,45.4],[14,44],[16.5,42.5],[19,40],[21.5,37],[24,37],[26,39.5],[28.9,41]]]},{"c":13,"y":1291,"cam":[35,33,8],"t":"十字军运动还有许多插曲，比如所谓的儿童十字军，传说成分很大。一千二百二十九年，神圣罗马皇帝腓特烈二世干脆通过谈判，兵不血刃地拿到了耶路撒冷，结果还被教会谴责。一千二百九十一年，十字军在东方的最后重镇阿卡陷落，东征时代结束。","pts":[["阿卡",35.07,32.92],["耶路撒冷",35.23,31.78]]},{"c":13,"y":1150,"cam":[10,25,1],"t":"十字军时代，欧洲人从东方带回了对糖、香料和丝绸的胃口，威尼斯和热那亚的商人赚得盆满钵满。同一时期，柬埔寨正在建造吴哥窟；北美密西西比河畔的卡霍基亚，人口可能有一两万；非洲南部的大津巴布韦正在兴起；日本则在十二世纪末进入武士掌权的幕府时代。","a":true,"pts":[["吴哥窟",103.87,13.41],["卡霍基亚",-90.06,38.66],["镰仓",139.55,35.32],["大津巴布韦",30.93,-20.27],["威尼斯",12.33,45.44,"l"]]},{"c":14,"y":1206,"cam":[104,47,4],"t":"一千二百零六年，蒙古草原上的铁木真被各部推举为成吉思汗。他把草原部落重新编成千户、百户，打破了原有的部落界限，建立起一支纪律严明的骑兵。此后几十年，蒙古人建立了历史上面积最大的连续陆地帝国，两千多万平方公里。","pts":[["斡难河源",110.5,48.9],["哈拉和林",102.83,47.2,"l"]],"ar":[["蒙古高原",105,47,6]]},{"c":14,"y":1258,"cam":[70,42,2.2],"t":"蒙古的征服极其残酷。一千二百一十九年起的西征中，中亚花剌子模的许多城市遭到毁灭性打击，人口损失极其惨重。一千二百五十八年，蒙古军攻陷巴格达，阿拔斯王朝灭亡，智慧宫等文化宝库毁于一旦。这是人类历史上沉重的一页。","pts":[["撒马尔罕",66.96,39.65],["巴格达",44.37,33.31,"l"],["哈拉和林",102.83,47.2]],"rt":[[[102.8,47.2],[93,46],[84,45],[76,43],[70,41.5],[67,39.7]],[[67,39.7],[62,37],[55,36.5],[49,35],[44.4,33.3]]]},{"c":14,"y":1260,"cam":[80,35,1.5],"t":"蒙古也有打不过的时候。一千二百六十年，埃及马穆鲁克军队在巴勒斯坦的阿音札鲁特击败蒙古军，阻止了他们进入非洲。忽必烈两次渡海进攻日本，一千二百七十四年和一千二百八十一年都遭遇风暴受挫，日本人后来称之为神风。","pts":[["阿音札鲁特",35.36,32.55,"l"],["博多湾",130.4,33.6]],"ar":[["蒙古帝国",85,45,22]]},{"c":14,"y":1279,"cam":[114,31,4],"t":"一千二百七十一年，忽必烈定国号为元，以大都，也就是今天的北京为都城。一千二百七十九年，元军在崖山海战中消灭了南宋最后的抵抗力量，据史书记载，大臣陆秀夫背着年幼的皇帝跳海殉国。元朝成为第一个由北方游牧民族建立、统治全中国的王朝。","pts":[["大都（北京）",116.4,39.9],["崖山",113.1,22.2]]},{"c":14,"y":1287,"cam":[60,42,1.6],"t":"蒙古帝国客观上把欧亚大陆连成了一片，驿站遍布各地。威尼斯人马可·波罗据说在元朝生活了十几年，学界对他的游记有过不少争论。反方向也有人：一千二百八十七年前后，景教僧人拉班·扫马从大都一路西行，到了巴黎和罗马，见过法国国王和教皇。","pts":[["大都",116.4,39.9],["巴黎",2.35,48.86,"l"],["罗马",12.5,41.9,"b"],["威尼斯",12.33,45.44]],"rt":[[[116.4,39.9],[110,40.5],[100,40],[94.7,40.1],[87,43.5],[76,42],[67,39.7],[58,37],[51,36],[44.4,33.5],[40,37],[32,39.5],[29,41],[20,40],[14,41],[12.5,41.9],[8.9,44.4],[5,46],[2.4,48.8]]]},{"c":14,"y":1324,"cam":[-5,22,3],"t":"同一时代的西非，马里帝国正在鼎盛。一千三百二十四年，国王曼萨·穆萨前往麦加朝圣，带着大批随从和黄金，路过开罗时出手阔绰。据阿拉伯史家记载，当地金价因此下跌了好些年。同一时期，摩洛哥旅行家伊本·白图泰走了近三十年，足迹从西非一直到中国。","pts":[["廷巴克图",-3,16.77],["开罗",31.24,30.04],["麦加",39.83,21.42]],"ar":[["马里帝国",-6,14,7]],"rt":[[[-3,16.8],[2,19],[10,23],[20,27],[28,29.8],[31.2,30]]]},{"c":14,"y":1346,"cam":[55,44,2.6],"t":"然而，把欧亚连起来的道路也运送了别的东西。十四世纪三四十年代，鼠疫从中亚扩散开来，二零二二年的一项古DNA研究，把源头指向今天吉尔吉斯斯坦的伊塞克湖一带。据一份当时的记载，围攻黑海港口卡法的军队，把染病的尸体抛进了城里。","pts":[["伊塞克湖一带",76.5,42.5],["卡法",35.38,45.03]],"rt":[[[76.5,42.5],[70,43],[62,44.5],[54,46.5],[47,46.5],[40,46],[35.5,45.1]]]},{"c":14,"y":1347,"cam":[12,45,3],"t":"一千三百四十七年，商船把鼠疫带到了西西里，随后席卷欧洲、中东和北非。短短几年里，欧洲约有三分之一到一半的人口死亡，有的城镇几乎空无一人。人们不知道病因，恐慌之中，一些地方还发生了迫害犹太人的暴行。这是人类历史上最惨烈的瘟疫之一。","pts":[["墨西拿",15.55,38.19],["佛罗伦萨",11.26,43.77,"l"],["卡法",35.38,45.03]],"ar":[["黑死病",10,47,12]],"rt":[[[35.4,45],[31.5,43],[29,41],[26,39],[23,36.5],[19,37.5],[15.6,38.2]]]},{"c":14,"y":1368,"cam":[60,40,1.6],"t":"瘟疫之后，西欧劳动力奇缺，幸存的农民和工匠要求更高的工钱，封建束缚开始松动。地中海港口开始要求外来船只隔离，后来定为四十天，英语里的检疫一词就来自意大利语的四十天。在东方，元朝在灾荒和起义中崩溃，一千三百六十八年，朱元璋建立明朝。","pts":[["威尼斯",12.33,45.44,"l"],["应天（南京）",118.78,32.06]]},{"c":15,"y":1405,"cam":[90,8,2.2],"t":"一千四百零五年，明成祖朱棣派郑和率船队下西洋。第一次出航就有两百多艘船、两万七千多人。据记载，最大的宝船长四十四丈，换算下来超过一百米，不过学界对这个尺寸争论很大。郑和前后七次出海，最远到达东非沿岸。","pts":[["南京",118.78,32.06],["马六甲",102.25,2.2],["古里（卡利卡特）",75.78,11.25,"l"],["忽鲁谟斯",56.45,27.1,"l"],["马林迪",40.1,-3.2,"l"]],"rt":[[[121.2,31.6],[122,28],[119.6,25.9],[116,21.5],[110,15],[108.5,11],[105,5],[102.3,2.2],[98,5],[92,6],[81,6.5],[77,8],[75.8,11.2],[68,17],[60,22.5],[56.5,26.8]],[[75.8,11.2],[65,5],[52,0],[45,-2],[40.2,-3.2]]]},{"c":15,"y":1414,"cam":[100,20,3],"t":"郑和船队带回了各国使节和奇珍异兽，最轰动的是一千四百一十四年从榜葛剌，也就是孟加拉来的长颈鹿。朝廷上下把它当成了传说中的瑞兽麒麟，还专门画了《瑞应麒麟图》。顺便说一句，今天日语和韩语里的长颈鹿，仍然叫麒麟。","pts":[["榜葛剌（孟加拉）",90.4,23.7],["北京",116.4,39.9]],"rt":[[[90.4,22.5],[92,16],[96,8],[102,3],[106,8],[110,16],[115,22],[120,28],[121.5,32],[119.5,36.5],[117.5,38.8]]]},{"c":15,"y":1433,"cam":[116.4,39.9,9],"t":"一千四百三十三年第七次下西洋结束后，明朝再没组织过这样的远航。有人说是耗费太大，有人说是朝廷政策转向，学界看法不一。同一时期，永乐皇帝迁都北京，紫禁城在一千四百二十年建成。几十年后，欧洲人的小船却开始往外闯了。","pts":[["北京紫禁城",116.4,39.92]]},{"c":15,"y":1453,"cam":[29,41,10],"t":"一千四百五十三年，二十一岁的奥斯曼苏丹穆罕默德二世围攻君士坦丁堡。他用巨炮轰击千年城墙，还让士兵把战船从陆地上拖过山坡，绕开封锁金角湾的铁链。五月二十九日，城破，东罗马帝国灭亡。从四百七十六年算起，东罗马又多撑了九百七十七年。","pts":[["君士坦丁堡",28.98,41.01,"l"],["金角湾",28.97,41.03,"t"]]},{"c":15,"y":1453,"cam":[29,41,6],"t":"历史有时像是刻意安排好的。为这座城命名的皇帝叫君士坦丁，母亲叫海伦娜；最后一位皇帝也叫君士坦丁，母亲也叫海伦娜。君士坦丁堡后来成为奥斯曼帝国的首都，今天叫伊斯坦布尔，依然是欧亚之间最重要的门户之一。","pts":[["伊斯坦布尔",28.98,41.01]]},{"c":15,"y":1455,"cam":[8,50,6],"t":"几乎同一时间，德国美因茨的古登堡把金属活字、油性墨水和压印机结合起来。约一千四百五十五年，他印出了著名的古登堡圣经，大约一百五十到一百八十本。印刷术迅速传遍欧洲，到一千五百年，欧洲已经印出了上千万册书。知识第一次可以批量复制了。","a":true,"pts":[["美因茨",8.27,50]]},{"c":15,"y":1446,"cam":[123,36,6],"t":"说到印刷，东亚其实走得更早。除了宋朝的毕昇，高丽在一千三百七十七年用金属活字印出了《直指》，是现存最早的金属活字印本。一千四百四十六年，朝鲜世宗大王颁布训民正音，也就是今天的韩文字母，目的是让普通百姓也能读写。","pts":[["汉阳（首尔）",126.98,37.57],["清州（《直指》）",127.49,36.64,"b"]]},{"c":15,"y":1436,"cam":[11.3,43.8,10],"t":"这一时期，意大利的佛罗伦萨富得流油，银行家美第奇家族大把赞助艺术家。一千四百三十六年，布鲁内莱斯基设计的大教堂穹顶完工，施工时没有搭常规的木质拱架。人们重新研读古希腊罗马的作品，把目光从天堂转向人间，这就是文艺复兴。","pts":[["佛罗伦萨",11.26,43.77]]},{"c":15,"y":1508,"cam":[-30,25,1.2],"t":"达·芬奇是画家、工程师和解剖学家，他的笔记用镜像文字书写，要对着镜子才好读。米开朗基罗在一千五百零四年完成了大卫像，又在一千五百零八年到一千五百一十二年间仰着头画完了西斯廷礼拜堂天顶画。而在大西洋彼岸，阿兹特克和印加正处于鼎盛。","pts":[["佛罗伦萨",11.26,43.77],["罗马",12.5,41.9,"b"],["特诺奇蒂特兰",-99.13,19.43],["库斯科",-71.97,-13.53]]},{"c":16,"y":1488,"cam":[0,5,1.8],"t":"欧洲人为什么要出海？一个重要原因是香料。胡椒、丁香、肉豆蔻在欧洲贵得惊人，而东方商路被层层中间商把持。葡萄牙人率先沿着非洲西海岸一路南下，一千四百八十八年，迪亚士绕过了非洲最南端附近的好望角。","pts":[["里斯本",-9.14,38.72,"l"],["好望角",18.47,-34.36]],"rt":[[[-9.1,38.7],[-13,30],[-17.5,21],[-17,14],[-12,7],[-3,4],[8,2],[11,-6],[12,-15],[14.5,-24],[17,-31],[18.5,-34.6],[22,-34.5]]]},{"c":16,"y":1492,"cam":[-40,28,2.6],"t":"一千四百九十二年八月，哥伦布带着三艘船从西班牙出发，向西航行，想抄近路去亚洲。顺便澄清一个误会：当时有学问的欧洲人都知道地球是圆的，哥伦布的问题在于把地球算小了。十月十二日，他登上了巴哈马群岛的一座小岛，此后一直坚称自己到了亚洲。","pts":[["帕洛斯",-6.89,37.23],["圣萨尔瓦多岛",-74.5,24.05,"l"]],"rt":[[[-6.9,37.2],[-12,32],[-15.5,28.1],[-30,26.5],[-50,26],[-65,25.3],[-74.4,24.1]]]},{"c":16,"y":1494,"cam":[-40,0,1.6],"t":"因为这个误会，美洲原住民被叫作印第安人，加勒比海的岛屿至今被称为西印度群岛。一千四百九十四年，西班牙和葡萄牙签订托尔德西利亚斯条约，在大西洋上画了一条线：线以西归西班牙，线以东归葡萄牙。生活在那里的人们，当然没有被问过意见。","pts":[["加勒比海（西印度群岛）",-72,18]],"rt":[[[-46.5,60],[-46.5,30],[-46.5,0],[-46.5,-30]]]},{"c":16,"y":1498,"cam":[35,-5,1.8],"t":"一千四百九十八年，葡萄牙的达·伽马绕过好望角，在东非的马林迪找到领航员，横渡印度洋，抵达印度西南海岸的卡利卡特。有意思的是，郑和船队在几十年前就到过这两个地方。两支船队到过同一片海，却写下了完全不同的故事。","pts":[["里斯本",-9.14,38.72,"l"],["马林迪",40.1,-3.2,"l"],["卡利卡特",75.78,11.25]],"rt":[[[-9.1,38.7],[-15,28],[-23,15],[-25,0],[-20,-20],[-5,-33],[12,-36],[20,-36],[30,-31],[36,-24],[40.5,-15],[40.2,-3.2],[50,2],[62,7],[75.6,11.2]]]},{"c":16,"y":1519,"cam":[-50,-10,1.8],"t":"一千五百一十九年，麦哲伦率五艘船、约两百七十人从西班牙出发，向西寻找香料群岛。他们穿过南美最南端险峻的海峡，进入一片风平浪静的大洋，麦哲伦把它命名为太平洋。可谁也没想到，这片海大得离谱，船员们在海上漂了三个多月，靠吃皮革和木屑充饥。","pts":[["桑卢卡尔",-6.35,36.78],["麦哲伦海峡",-70.9,-53.5,"l"]],"rt":[[[-6.4,36.8],[-15.4,28.1],[-25,10],[-34,-6],[-43,-23],[-56,-35],[-67.7,-49.3],[-70.9,-53.1],[-75,-52.5],[-78,-45]]]},{"c":16,"y":1522,"cam":[160,-10,1.1],"t":"一千五百二十一年，麦哲伦在菲律宾的麦克坦岛卷入当地冲突，被首领拉普拉普的战士杀死。剩下的船员继续航行，一千五百二十二年，只有维多利亚号一艘船、十八个人回到西班牙，完成了第一次环球航行。他们还发现，船上的日期比岸上少了一天。","p":"p","pts":[["麦克坦岛",123.97,10.3,"l"],["关岛",144.8,13.4],["桑卢卡尔",-6.35,36.78,"l"]],"rt":[[[-78,-45],[-85,-32],[-100,-20],[-120,-14],[-140,-8],[-160,0],[-180,9],[160,12.5],[144.8,13.4],[130,11],[125.7,10.7],[124,10.3],[127.4,0.7],[124,-9],[105,-15],[80,-25],[50,-36],[20,-36],[10,-25],[-5,-5],[-20,10],[-18,25],[-6.4,36.7]]]},{"c":16,"y":1519,"cam":[-99,19.4,6],"t":"就在麦哲伦出发的同一年，西班牙人科尔特斯带着几百人在墨西哥登陆。阿兹特克帝国的首都特诺奇蒂特兰建在湖中岛上，人口可能有二十万左右，比当时欧洲绝大多数城市都大。科尔特斯联合了不满阿兹特克统治的特拉斯卡拉人等，组成了大军。","pts":[["特诺奇蒂特兰",-99.13,19.43],["特拉斯卡拉",-98.24,19.32,"r"],["韦拉克鲁斯",-96.13,19.19]],"rt":[[[-96.1,19.2],[-97,19.5],[-98.2,19.35],[-99,19.4]]]},{"c":16,"y":1521,"cam":[-99,19.4,7],"t":"真正致命的是天花。一千五百二十年，天花在当地暴发，原住民对这种病毫无免疫力，大量死亡。一千五百二十一年，特诺奇蒂特兰在围城和瘟疫中陷落。此后一百多年里，美洲原住民人口因疾病、战争和强迫劳动锐减，许多地区减少了一大半，甚至九成。","pts":[["特诺奇蒂特兰",-99.13,19.43]]},{"c":16,"y":1532,"cam":[-75,-10,4.5],"t":"一千五百三十二年，皮萨罗带着一百六十多名士兵，在秘鲁的卡哈马卡俘虏了印加皇帝阿塔瓦尔帕。印加帝国当时刚经历了天花和一场兄弟间的内战。阿塔瓦尔帕许诺用黄金填满一间屋子来赎身，西班牙人收了赎金，却在一千五百三十三年处死了他。","pts":[["卡哈马卡",-78.52,-7.16,"l"],["库斯科",-71.97,-13.53],["马丘比丘",-72.55,-13.16,"l"]],"ar":[["印加帝国",-72,-15,9]]},{"c":16,"y":1533,"cam":[-72,-14,5],"t":"印加帝国没有我们熟悉的那种文字，却用打结的绳子奇普来记录数字，还修建了长达数万公里的道路网，翻山越岭连接整个安第斯山脉，驿卒接力奔跑传递消息。山顶的马丘比丘至今令人惊叹，它在殖民时代被遗忘，直到二十世纪初才被外界广泛知晓。","pts":[["库斯科",-71.97,-13.53],["马丘比丘",-72.55,-13.16,"l"]],"rt":[[[-78.5,-0.2],[-78.5,-7.2],[-76,-11.5],[-72,-13.5],[-69,-16.5],[-68,-21],[-70.5,-30],[-70.7,-33.4]]]},{"c":16,"y":1600,"cam":[-25,5,1.6],"t":"美洲的种植园需要劳动力，原住民大量死亡后，殖民者把目光投向了非洲。从十六世纪到十九世纪，约一千二百五十万非洲人被强行装上奴隶船运往美洲，其中约一百八十万人死在途中。这是人类历史上规模最大的强迫迁徙之一，深刻改变了三个大洲。","a":true,"ar":[["西非海岸",0,7,8]],"rt":[[[3,6],[-10,3],[-25,-2],[-35,-8]],[[-2,5],[-20,10],[-45,15],[-65,17]],[[10,-5],[-10,-10],[-30,-15],[-42,-22]]]},{"c":16,"y":1550,"cam":[-20,20,1.2],"t":"新旧大陆之间开始了一场物种大交换，学者称之为哥伦布大交换。马、牛、小麦、甘蔗去了美洲；玉米、土豆、番薯、番茄、花生、可可和烟草来到旧大陆。对了，辣椒的老家也在美洲，今天中国菜里那股呛人的辣味，其实是个几百年的新来客。","a":true,"ar":[["美洲",-80,10,14],["旧大陆",40,35,18]],"rt":[[[-30,33],[-55,22],[-75,15]],[[-75,20],[-45,40],[-15,45]]]},{"c":16,"y":1593,"cam":[118,22,4.5],"t":"辣椒传入中国的时间并不长，明朝晚期的书里才出现番椒的记载，最初还被当作观赏植物。一千五百九十三年，福建商人陈振龙从吕宋带回番薯藤。后来番薯和玉米在山地广泛种植，帮助清朝人口在十八世纪末增长到三亿左右。","pts":[["吕宋（马尼拉）",120.98,14.6],["福州",119.3,26.08,"l"]],"rt":[[[121,14.6],[120.3,18],[120,22],[119.6,25.9]]]},{"c":16,"y":1571,"cam":[-160,5,1.2],"t":"美洲还盛产白银。一千五百四十五年，西班牙人在今天玻利维亚的波托西发现了巨大的银山。一千五百七十一年马尼拉建城后，西班牙大帆船定期把美洲白银运过太平洋，换取中国的丝绸和瓷器。日本石见等地的白银，也大量流入中国。","p":"p","pts":[["波托西银山",-65.75,-19.59,"l"],["阿卡普尔科",-99.9,16.85],["马尼拉",120.98,14.6,"l"],["石见银山",132.4,35.1]],"rt":[[[-65.8,-19.6],[-71,-18],[-77,-12],[-82,0],[-92,10],[-99.9,16.8]],[[-99.9,16.8],[-115,14],[-140,13],[-170,13],[165,13],[145,13.5],[130,13],[121,14.6]]]},{"c":16,"y":1581,"cam":[-170,10,1],"t":"当时明朝推行一条鞭法，把各种赋役折成白银缴纳，对白银的需求巨大。学者估计，十六到十八世纪全世界开采的白银，有相当大一部分最终流入了中国，有人估计多达三分之一甚至更多。第一个真正的全球经济网络，就这样以白银为血液运转起来。","p":"p","ar":[["明朝",112,31,9]],"rt":[[[-99.9,16.8],[-140,13],[165,13],[121,14.6],[116,22],[113,26]],[[-20,15],[-5,-10],[20,-36],[60,-20],[90,0],[110,15]]]},{"c":17,"y":1517,"cam":[12.6,51.9,9],"t":"一千五百一十七年，德国维滕堡的神学教授马丁·路德写下《九十五条论纲》，批评教会出售赎罪券。传说他把论纲钉在了教堂大门上，这个细节学界有争论。可以确定的是，多亏了印刷机，论纲几周之内就传遍了德意志，一场宗教改革就此爆发。","pts":[["维滕堡",12.65,51.87]]},{"c":17,"y":1521,"cam":[9,50.5,7],"t":"一千五百二十一年，路德在沃尔姆斯帝国议会上拒绝收回主张，随后躲进瓦特堡，把《新约》译成了德语。他的译本让普通人也能读圣经，对现代德语的形成影响深远。此后新教分出许多派别，欧洲的宗教版图被彻底改写。","pts":[["沃尔姆斯",8.36,49.63,"l"],["瓦特堡",10.31,50.97]],"rt":[[[8.4,49.6],[9.2,50.2],[10.3,50.95]]]},{"c":17,"y":1618,"cam":[8,50,4],"t":"在英格兰，国王亨利八世因为离婚问题与教皇闹翻，在一千五百三十四年成为英格兰教会的首脑。宗教分歧还引发了一连串战争，其中最惨烈的是一千六百一十八年到一千六百四十八年的三十年战争，德意志的一些地区人口损失了三分之一甚至更多。","pts":[["伦敦",-0.12,51.5,"l"],["布拉格",14.42,50.09]],"ar":[["神圣罗马帝国",11,50,5]]},{"c":17,"y":1648,"cam":[60,42,1.5],"t":"一千六百四十八年签订的威斯特伐利亚和约结束了三十年战争，许多学者把它视为近代主权国家体系的起点。同一时期，明朝在一千六百四十四年灭亡，清朝入关。欧亚大陆两端几乎在同一个十年里完成了秩序重组，有学者认为，当时的小冰期气候异常给双方都雪上加霜。","pts":[["明斯特（威斯特伐利亚）",7.63,51.96,"l"],["北京",116.4,39.9]]},{"c":17,"y":1543,"cam":[19,53,6],"t":"宗教改革的同时，人们看宇宙的方式也在改变。一千五百四十三年，哥白尼出版《天体运行论》，提出地球绕着太阳转。传说他在临终的病床上才看到印好的书。几十年后，开普勒发现，行星的轨道不是正圆，而是椭圆。","pts":[["弗龙堡（哥白尼）",19.69,54.36],["布拉格（开普勒）",14.42,50.09,"l"]]},{"c":17,"y":1610,"cam":[11,44,7],"t":"一千六百一十年，伽利略用改进的望远镜看到了木星的四颗卫星、月球上的山，后来又观测到金星的盈亏，有力地支持了日心说。一千六百三十三年，他受到宗教裁判所审判，被迫放弃观点，余生在软禁中度过。直到一千九百九十二年，罗马教廷才正式承认当年的处理有误。","pts":[["帕多瓦",11.88,45.41],["罗马",12.5,41.9]]},{"c":17,"y":1687,"cam":[-0.5,52.5,7],"t":"一千六百八十七年，牛顿出版《自然哲学的数学原理》，用万有引力和三大运动定律，把天上和地上的运动统一了起来。苹果的故事确实来自牛顿晚年自己的讲述，不过苹果砸到头上，多半是后人加的戏。一个用数学描述世界的新时代开始了。","pts":[["剑桥",0.12,52.2],["伍尔斯索普（牛顿故乡）",-0.63,52.81,"l"]]},{"c":17,"y":1607,"cam":[110,30,3.2],"t":"这些西方学问也在向东方流动。意大利传教士利玛窦一千五百八十二年来到中国，后来定居北京，绘制了《坤舆万国全图》，让很多中国士人第一次看到五大洲。他和徐光启合作翻译了《几何原本》的前六卷，一般认为，几何这个学科名就来自这部译作。","pts":[["澳门",113.54,22.19],["北京",116.4,39.9]],"rt":[[[113.5,22.2],[113.3,23.1],[114.5,27],[115.9,28.7],[118.8,32.1],[117.2,36],[116.4,39.8]]]},{"c":17,"y":1616,"cam":[60,35,1.4],"t":"还有一个巧合：一千六百一十六年，英国的莎士比亚、西班牙的塞万提斯和中国的汤显祖在同一年去世。写《罗密欧与朱丽叶》的和写《牡丹亭》的，都在写爱情如何冲破束缚。同一时期，日本进入德川幕府时代，不久之后，印度莫卧儿王朝开始修建泰姬陵。","pts":[["伦敦（莎士比亚）",-0.12,51.5,"l"],["马德里（塞万提斯）",-3.7,40.42,"l"],["临川（汤显祖）",116.36,27.95],["江户",139.69,35.69],["阿格拉",78.04,27.18]]},{"c":18,"y":1773,"cam":[-72,40,4.5],"t":"十八世纪，欧洲的启蒙思想家高喊理性、自由和人权。在北美，英国的十三个殖民地对没有代表权却要交税越来越不满。一千七百七十三年，波士顿的抗议者把三百多箱东印度公司的茶叶倒进了海里，史称波士顿倾茶事件。","pts":[["波士顿",-71.06,42.36],["费城",-75.17,39.95,"l"]],"ar":[["十三个殖民地",-76,38,6]]},{"c":18,"y":1776,"cam":[-75,40,6],"t":"一千七百七十六年七月四日，北美大陆会议通过《独立宣言》，宣称人人生而平等，尽管当时的奴隶并不在其中。经过多年战争，英国在一千七百八十三年承认美国独立。冷知识：宣言的两位关键人物杰斐逊和亚当斯，在一千八百二十六年七月四日同一天去世，正好是宣言发表五十周年。","pts":[["费城",-75.17,39.95],["约克镇",-76.51,37.24,"l"]]},{"c":18,"y":1793,"cam":[116.4,40.2,6],"t":"同一时期的中国正值乾隆盛世，人口在十八世纪末达到约三亿。一千七百九十三年，英国派马戛尔尼使团来华，希望扩大通商。乾隆在给英王的敕谕里说，天朝物产丰盈，无所不有，原不借外夷货物以通有无。这次会面，后来被许多史家反复回味。","pts":[["北京",116.4,39.9],["承德避暑山庄",117.94,40.99]]},{"c":18,"y":1789,"cam":[2.35,48.86,10],"t":"一千七百八十九年，法国财政濒临破产，国王召开三级会议，局势迅速失控。七月十四日，巴黎民众攻占了巴士底狱。冷知识：当时监狱里只关着七个人，四个伪造犯、两个精神病人，还有一个被家人送进去的贵族。但巴士底狱象征着王权，它的陷落成了革命的标志。","pts":[["巴士底狱",2.37,48.85],["凡尔赛",2.12,48.8,"l"]]},{"c":18,"y":1793,"cam":[2.35,48.86,8],"t":"同年八月，《人权和公民权宣言》发表。革命越走越激进，一千七百九十三年一月，国王路易十六被送上断头台。接下来的恐怖统治中，仅经过正式判决处死的就有约一万七千人。革命也带来了新事物：公制单位米和公斤，就诞生于这个时期的法国。","pts":[["巴黎",2.35,48.86]]},{"c":18,"y":1791,"cam":[-72.5,19,7],"t":"法国大革命的口号传到了加勒比海的圣多明各，那里是当时世界上最赚钱的殖民地之一，靠几十万被奴役的非洲人种植甘蔗和咖啡。一千七百九十一年，奴隶起义爆发，杜桑·卢维杜尔成为起义领袖。他们先后与法国、西班牙和英国的军队作战。","pts":[["圣多明各（海地）",-72.3,19.2]],"ar":[["圣多明各",-72.5,19,1.5]]},{"c":18,"y":1804,"cam":[-72.5,19,7],"t":"一千八百零四年一月一日，海地宣布独立，成为世界上第一个由被奴役者通过起义建立的国家。但独立的代价沉重：一千八百二十五年，法国以武力相威胁，要求海地支付巨额赔款来换取承认，据估算，海地为此背负的债务一直还到了二十世纪中叶。","pts":[["太子港",-72.34,18.54]]},{"c":18,"y":1804,"cam":[10,48,3],"t":"法国这边，一位科西嘉出身的炮兵军官拿破仑迅速崛起，一千七百九十九年发动政变上台，一千八百零四年加冕称帝，据记载是他自己把皇冠戴到了头上。他颁布的《拿破仑法典》影响了世界上许多国家的民法。他的军队几乎横扫了欧洲大陆。","pts":[["巴黎",2.35,48.86],["科西嘉",9.1,42.1]],"ar":[["拿破仑帝国",8,48,8]]},{"c":18,"y":1812,"cam":[20,52,3],"t":"顺便替拿破仑澄清一下：他并不矮，身高约一米六九，比当时法国男性的平均身高还略高一点。矮子的印象，来自法国和英国长度单位的换算误会，以及英国漫画家的刻意丑化。一千八百一十二年，他率领数十万大军进攻俄国，在严冬中撤退时几乎全军覆没。","pts":[["莫斯科",37.62,55.75],["涅曼河",23.9,54.9,"l"]],"rt":[[[23.9,54.9],[27.5,54.6],[30.3,54.8],[33,55],[35.5,55.5],[37.5,55.75]]]},{"c":18,"y":1815,"cam":[-30,0,1.4],"t":"一千八百一十五年，拿破仑在比利时的滑铁卢战败，被流放到南大西洋的圣赫勒拿岛，一千八百二十一年死在那里。随后，拉丁美洲在玻利瓦尔等人的带领下掀起独立浪潮，到十九世纪二十年代，西班牙在美洲大陆的殖民地基本都独立了。","pts":[["滑铁卢",4.4,50.68,"l"],["圣赫勒拿岛",-5.72,-15.97],["加拉加斯（玻利瓦尔）",-66.9,10.5,"l"]]},{"c":19,"y":1769,"cam":[-2.2,53,7],"t":"十八世纪后半叶，英国开始了一场比任何政治革命都更深刻的变革。一千七百六十九年，瓦特为改良蒸汽机申请了专利；新式纺纱机让一个工人能顶过去好几个人。为什么偏偏是英国？煤炭便宜、工资高、市场大，学界有很多解释，至今仍在争论。","pts":[["格拉斯哥",-4.25,55.86,"l"],["伯明翰",-1.9,52.49],["曼彻斯特",-2.24,53.48]]},{"c":19,"y":1830,"cam":[-2.6,53.45,14],"t":"一千八百三十年，利物浦到曼彻斯特的铁路通车，这是世界上第一条完全靠蒸汽机车运营的城际铁路。人类第一次可以比马跑得更快地长途旅行。各地原本按自己的太阳时间过日子，为了排列车时刻表，英国铁路后来统一采用了伦敦时间。","pts":[["利物浦",-2.98,53.41,"l"],["曼彻斯特",-2.24,53.48]],"rt":[[[-2.98,53.41],[-2.6,53.44],[-2.24,53.48]]]},{"c":19,"y":1848,"cam":[5,50,4.5],"t":"工业化也有黑暗的一面。工厂里有大量童工，一天工作十几个小时；城市烟尘弥漫，工人挤在拥挤的贫民窟里。一千八百四十八年，马克思和恩格斯发表《共产党宣言》，同一年，欧洲许多国家爆发革命。工业革命改变了财富，也改变了思想。","pts":[["曼彻斯特",-2.24,53.48,"l"],["伦敦",-0.12,51.5],["巴黎",2.35,48.86],["柏林",13.4,52.52]]},{"c":19,"y":1800,"cam":[60,40,1.3],"t":"在工业革命之前，中国的江南和英国的富裕地区，生活水平可能相差不大，学界对此有过激烈争论。但此后，东西方之间的差距迅速拉大，史学家称之为大分流。到了十九世纪，拥有蒸汽船和新式火炮的欧洲国家，把目光投向了亚洲。","a":true,"ar":[["英格兰",-1.5,52.5,3],["江南",120,31,3]]},{"c":19,"y":1839,"cam":[100,18,2.6],"t":"英国从中国买茶叶，却没有多少东西能卖给中国，白银不断流向东方。于是英国商人向中国大量走私鸦片，到十九世纪三十年代末，每年运来的鸦片多达约四万箱。一千八百三十九年，林则徐在虎门当众销毁鸦片两百多万斤，前后用了二十多天。","pts":[["加尔各答",88.36,22.57,"l"],["广州",113.26,23.13],["虎门",113.67,22.82,"b"]],"rt":[[[88.4,22],[90,17],[94,10],[99,4],[104,1.5],[108,8],[112,16],[113.6,22.5]]]},{"c":19,"y":1842,"cam":[116,27,4],"t":"一千八百四十年，英国发动鸦片战争。清军装备落后，节节败退。一千八百四十二年，清政府签订《南京条约》，割让香港岛，开放广州、厦门、福州、宁波、上海五处通商口岸，赔款两千一百万银元。中国近代史，通常就从这里讲起。","pts":[["广州",113.26,23.13],["厦门",118.09,24.48],["福州",119.3,26.08],["宁波",121.55,29.87],["上海",121.47,31.23],["香港",114.17,22.3,"b"],["南京",118.78,32.06,"l"]]},{"c":19,"y":1860,"cam":[114,32,3.6],"t":"接下来的二十年，清朝内外交困。一千八百五十年底爆发的太平天国运动席卷南方许多省份，死亡人数估计在两千万以上，学界估计差异较大。一千八百六十年，英法联军攻入北京，焚毁了圆明园。这些都是那个时代沉重的伤痕。","pts":[["北京圆明园",116.3,40.01],["天京（南京）",118.78,32.06]],"ar":[["太平天国",116,29,5]]},{"c":19,"y":1861,"cam":[20,40,1.1],"t":"一千八百六十一年是个特别的年份。这一年，美国南北战争爆发，战争结束时奴隶制被废除；俄国沙皇宣布废除农奴制；清朝设立总理衙门，洋务运动起步，开始办工厂、造轮船。世界各地，都在用自己的方式应对这个突然加速的时代。","pts":[["华盛顿",-77.04,38.9],["圣彼得堡",30.32,59.94],["北京",116.4,39.9]]},{"c":19,"y":1853,"cam":[139.7,35.4,8],"t":"日本的大门是被黑船敲开的。一千八百五十三年，美国海军准将佩里率领冒着黑烟的蒸汽军舰驶入江户湾，要求日本开国。日本举国震惊，国内爆发激烈争论。一千八百六十八年，德川幕府倒台，明治天皇亲政，史称明治维新。","pts":[["江户（东京）",139.69,35.69],["浦贺",139.72,35.24,"b"]]},{"c":19,"y":1872,"cam":[139.6,35.55,12],"t":"明治政府大刀阔斧地改革：废除武士特权，推行义务教育，派出岩仓使节团考察欧美近两年。一千八百七十二年，东京到横滨的铁路通车。日本几乎是一边抄作业、一边改作业，几十年里就从一个闭关的岛国变成了工业强国。","pts":[["东京",139.69,35.69],["横滨",139.64,35.44]],"rt":[[[139.76,35.66],[139.7,35.55],[139.64,35.46]]]},{"c":19,"y":1895,"cam":[125,33,4.5],"t":"一千八百九十四年，中日甲午战争爆发，北洋水师全军覆没。一千八百九十五年的《马关条约》中，中国割让台湾，赔款两亿两白银。这场失败深深刺痛了中国人，变法图强的呼声从此越来越高。这时，海底电报已经把各大洲连在一起，坏消息很快就能传遍世界。","pts":[["威海卫",122.12,37.5],["马关（下关）",130.94,33.96],["台湾",121,23.7]]},{"c":20,"y":1884,"cam":[18,5,2],"t":"十九世纪末，欧洲列强掀起瓜分世界的狂潮。一千八百八十四年到八十五年的柏林会议上，各国代表在地图上划分非洲，与会者中没有一个非洲人。到一千九百一十四年，非洲大约九成的土地处在殖民统治之下。一千八百九十六年，埃塞俄比亚在阿杜瓦击败意大利军队，保住了独立。","pts":[["柏林",13.4,52.52],["阿杜瓦",38.89,14.16],["蒙罗维亚（利比里亚）",-10.8,6.3,"l"]],"ar":[["非洲",20,3,18]]},{"c":20,"y":1900,"cam":[22,-3,4.5],"t":"殖民统治常常伴随着残酷的剥削。在比利时国王利奥波德二世私人控制的刚果，当地人被强迫采集橡胶，完不成定额就会遭到砍手等酷刑，大量人口死亡。消息传出后，引发了国际舆论的强烈谴责。殖民的伤痕，至今仍在许多地区留下印记。","a":true,"pts":[["利奥波德维尔",15.3,-4.32,"l"]],"ar":[["刚果自由邦",23,-3,8]]},{"c":20,"y":1911,"cam":[115,34,4],"t":"一千九百年，八国联军攻入北京。次年的《辛丑条约》要求中国赔款四亿五千万两白银，相当于当时每个中国人赔一两。一千九百一十一年十月十日，武昌起义爆发，次年一月一日中华民国成立，二月清帝退位，两千多年的帝制就此终结。","pts":[["北京",116.4,39.9],["武昌",114.3,30.55],["南京",118.78,32.06]]},{"c":20,"y":1914,"cam":[18.4,43.85,12],"t":"一千九百一十四年六月二十八日，奥匈帝国皇储斐迪南大公在萨拉热窝遇刺。当天早些时候的一次炸弹袭击已经失败，下午车队却拐错了路口，车子停下倒车时，恰好停在刺客普林西普面前。一个月后，奥匈帝国对塞尔维亚宣战，盟约像锁链一样，把欧洲大国一个个拖入战争。","pts":[["萨拉热窝",18.41,43.86]]},{"c":20,"y":1914,"cam":[3,50,7],"t":"战争很快在西线陷入僵局。也有让人动容的片刻：一千九百一十四年的圣诞节，西线一些地段的英国和德国士兵自发停火，走出战壕交换香烟和食物，有的地方据说还一起踢了足球。可惜这样的停火，后来再也没有大规模出现过。","pts":[["伊珀尔",2.88,50.85,"l"],["阿尔芒蒂耶尔",2.88,50.69,"b"]]},{"c":20,"y":1916,"cam":[4,49,5],"t":"几百公里长的战壕从北海一直延伸到瑞士边境。一千九百一十六年七月一日，索姆河战役第一天，英军伤亡近六万人，其中约一万九千人阵亡。机枪、铁丝网、毒气和大炮，把战争变成了一台吞噬生命的机器。","pts":[["索姆河",2.7,50,"l"],["凡尔登",5.39,49.16]],"rt":[[[2.6,51.15],[2.9,50.8],[2.8,50.3],[2.8,49.9],[3.3,49.4],[4.5,49.25],[5.4,49.1],[6.4,48.8],[7.1,48.2],[7.3,47.6]]]},{"c":20,"y":1917,"cam":[60,40,1.5],"t":"中国也与这场战争有关。一千九百一十七年，北洋政府对德宣战；在此前后，约十四万华工远赴欧洲，在法国和比利时挖战壕、搬弹药、修铁路，许多人长眠异乡。一战期间，全世界约有一千五百万到两千万人死亡。","pts":[["山东",117.5,36.5],["法国北部",2.5,50,"l"]],"rt":[[[120.3,36.1],[128,40],[140,45],[145,50]],[[-70,47],[-40,48],[-10,48.5],[1,49.5]]]},{"c":20,"y":1917,"cam":[30.3,59.9,8],"t":"一千九百一十七年，俄国爆发革命，沙皇退位。到了十一月，列宁领导布尔什维克夺取政权。冷知识：这场革命叫十月革命，却发生在公历十一月，因为当时俄国还在用比公历慢十三天的儒略历。不久后，俄国退出一战，后来建立了苏联。","pts":[["彼得格勒",30.32,59.94]]},{"c":20,"y":1918,"cam":[11,25,1],"t":"一千九百一十八年十一月十一日，一战停火。可另一场灾难正在蔓延：一九一八年流感大流行在全球夺去了数千万人的生命，估计从两千多万到五千万不等。它被叫作西班牙流感，并不是因为源自西班牙，而是因为中立的西班牙新闻不受战时审查，报道得最多。"},{"c":20,"y":1919,"cam":[60,42,1.5],"t":"一千九百一十九年巴黎和会召开。中国是战胜国之一，却被要求把战前德国在山东的权益转交给日本。消息传回国内，五月四日，北京的学生走上街头抗议，掀起了五四运动。最终，中国代表拒绝在《凡尔赛和约》上签字。","pts":[["巴黎",2.35,48.86,"l"],["北京",116.4,39.9],["青岛",120.38,36.07,"b"]]},{"c":20,"y":1921,"cam":[119,31,7],"t":"五四前后的新文化运动，请来了两位先生：德先生和赛先生，也就是民主和科学。白话文取代文言文，鲁迅发表了《狂人日记》。一千九百二十一年，中国共产党在上海召开第一次全国代表大会，最后一天的会议转移到浙江嘉兴南湖的一条游船上举行。","pts":[["上海",121.47,31.23],["嘉兴南湖",120.76,30.76,"b"],["北京",116.4,39.9]]},{"c":21,"y":1929,"cam":[-74,40.7,8],"t":"一千九百二十年代的美国一片繁荣，股市似乎只涨不跌。一千九百二十九年十月，纽约股市崩盘，大萧条席卷全球。到一千九百三十三年，美国约四分之一的劳动力失业，德国失业人数也多达数百万。经济上的绝望，为极端势力的崛起提供了土壤。","pts":[["纽约华尔街",-74.01,40.71]]},{"c":21,"y":1933,"cam":[40,40,1.6],"t":"一千九百三十三年，希特勒在德国上台，迅速建立独裁统治，疯狂扩军，并对犹太人展开系统性迫害。意大利的墨索里尼早在一千九百二十二年就已掌权。在亚洲，日本军国主义势力日益膨胀，把扩张的矛头对准了中国。","pts":[["柏林",13.4,52.52],["罗马",12.5,41.9,"l"],["东京",139.69,35.69]]},{"c":21,"y":1937,"cam":[118,38,4],"t":"一千九百三十一年九月十八日，日本制造九一八事变，侵占中国东北。一千九百三十七年七月七日，卢沟桥事变爆发，中国开始全面抗战。请记住这个时间：在欧洲战火燃起的两年多以前，中国已经在全面抗击侵略了。","pts":[["沈阳（九一八）",123.43,41.8],["卢沟桥",116.21,39.85,"l"]]},{"c":21,"y":1937,"cam":[118.8,32.05,10],"t":"一千九百三十七年十二月，日军攻占南京，在此后数周内对放下武器的士兵和平民进行了大规模屠杀。远东国际军事法庭认定遇难者在二十万以上，南京军事法庭认定为三十万以上。这是人类历史上最黑暗的暴行之一，今天的南京有一座纪念馆，铭记着遇难同胞。","pts":[["南京",118.78,32.06]]},{"c":21,"y":1939,"cam":[8,50,4],"t":"一千九百三十九年九月一日，德国入侵波兰，英法对德宣战，欧洲战争爆发。第二年，德军绕过马其诺防线，用六个星期左右击败了法国。英国在丘吉尔领导下坚持抵抗，在不列颠空战中顶住了德国空军的狂轰滥炸。","pts":[["华沙",21.01,52.23],["巴黎",2.35,48.86,"l"],["伦敦",-0.12,51.5,"l"]]},{"c":21,"y":1942,"cam":[-170,30,1.1],"t":"一千九百四十一年六月，德国撕毁条约，入侵苏联。十二月七日，日本偷袭美国珍珠港，美国随即参战，战争真正成为世界大战。一千九百四十二年的中途岛海战，和一千九百四十二年到四十三年的斯大林格勒战役，成为太平洋和欧洲战场的重要转折点。","p":"p","pts":[["珍珠港",-157.95,21.36],["中途岛",-177.37,28.21,"t"],["斯大林格勒",44.5,48.7,"l"]]},{"c":21,"y":1942,"cam":[19.2,50,7],"t":"在纳粹控制的欧洲，约六百万犹太人在大屠杀中被杀害，同时遇害的还有大量罗姆人、残障人士和其他受害者。奥斯维辛等集中营成为人类罪恶的代名词。今天，奥斯维辛旧址作为纪念馆保留下来，提醒后人：这样的事情，绝不能再发生。","pts":[["奥斯维辛",19.2,50.03]]},{"c":21,"y":1942,"cam":[108,28,3.5],"t":"中国战场长期牵制了大量日军。从台儿庄、武汉等正面战场的会战，到敌后战场的游击战争，中国军民坚持了艰苦卓绝的抗战。滇缅公路和飞越喜马拉雅山的驼峰航线，成为输送援华物资的生命线。抗战期间，中国军民伤亡超过三千五百万。","pts":[["台儿庄",117.73,34.56],["武汉",114.3,30.59],["重庆",106.55,29.56],["昆明",102.71,25.04,"l"]],"rt":[[[91.7,26.2],[95.5,27.5],[99,26],[102.7,25.05]],[[97,22.5],[99,23.5],[100.5,24.5],[102.7,25]]]},{"c":21,"y":1944,"cam":[5,51,4],"t":"一千九百四十四年六月六日，盟军在法国诺曼底登陆，十几万士兵在一天之内踏上海滩，开辟了第二战场。东线的苏军也在不断推进。一千九百四十五年四月，苏军攻入柏林，五月八日，德国无条件投降。","pts":[["诺曼底",-0.6,49.35,"l"],["柏林",13.4,52.52]],"rt":[[[-1.5,50.7],[-0.9,50],[-0.6,49.4]],[[30,52.5],[24,52.4],[19,52.4],[13.5,52.5]]]},{"c":21,"y":1945,"cam":[133,35,5],"t":"一千九百四十五年八月六日和九日，美国在日本广岛和长崎投下原子弹，数十万人死伤。八月八日，苏联对日宣战。八月十五日，日本宣布无条件投降，九月二日签署投降书。第二天，九月三日，后来被定为中国人民抗日战争胜利纪念日。","pts":[["广岛",132.46,34.39],["长崎",129.87,32.75,"l"],["东京",139.69,35.69]]},{"c":21,"y":1945,"cam":[11,20,1],"t":"第二次世界大战造成约七千万到八千五百万人死亡，是人类历史上伤亡最惨重的战争。一千九百四十五年十月，联合国成立，中国是安理会五个常任理事国之一。经历过浩劫的人们希望，用对话代替战争，用规则约束强权。","pts":[["旧金山（联合国宪章签署）",-122.42,37.77],["纽约（联合国总部）",-74,40.75]]},{"c":22,"y":1947,"cam":[40,52,2],"t":"战后的世界很快分成两大阵营。一千九百四十六年，丘吉尔说，一道铁幕已经在欧洲大陆落下。美国和苏联为首的两大阵营，开始了长达四十多年的冷战。之所以叫冷战，是因为两个超级大国从未直接开战，但各地的代理人战争却一点也不冷。","pts":[["富尔顿（铁幕演说）",-91.95,38.85]],"ar":[["北约阵营",-10,48,10],["华约阵营",45,55,14]]},{"c":22,"y":1949,"cam":[95,28,3.2],"t":"与此同时，殖民帝国纷纷瓦解。一千九百四十七年八月，印度和巴基斯坦独立，但分治过程中爆发了大规模暴力，一千多万人被迫背井离乡，死亡人数估计从几十万到两百万不等。一千九百四十九年十月一日，中华人民共和国成立。","pts":[["新德里",77.21,28.61,"l"],["卡拉奇",6       setTimeout(function () {
        if (G.el.parentNode) G.el.parentNode.removeChild(G.el);
        var i = groups.indexOf(G); if (i >= 0) groups.splice(i, 1);
      }, 480);
    });
  }

  /* ================= 年份滚动 ================= */
  var yearEl = $('year'), yearShown = null, yearAnim = 0;
  function trim1(v) { return String(Math.round(v * 10) / 10); }
  function fmtYear(y, approx) {
    if (y <= -1e8) return '约 ' + trim1(-y / 1e8) + ' 亿年前';
    if (y <= -1e4) { var w = -y / 1e4; return '约 ' + (w >= 10 ? Math.round(w) : trim1(w)) + ' 万年前'; }
    y = Math.round(y);
    if (y < 0) return (approx ? '约' : '') + '公元前 ' + (-y) + ' 年';
    return (approx ? '约' : '') + '公元 ' + Math.max(1, y) + ' 年';
  }
  function setYear(s, instant) {
    cancelAnimationFrame(yearAnim);
    var to = s.y, from = yearShown;
    if (s.yt) { yearEl.textContent = s.yt; yearShown = to; return; }
    if (instant || RM || from === null || from === to) { yearEl.textContent = fmtYear(to, s.a); yearShown = to; return; }
    var logMode = from < -1e4 && to < -1e4, t0 = performance.now(), dur = 1300;
    var step = function (now) {
      var t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3), v;
      if (logMode) v = -Math.exp(Math.log(-from) + (Math.log(-to) - Math.log(-from)) * e);
      else v = from + (to - from) * e;
      if (t >= 1) v = to;
      yearEl.textContent = fmtYear(v, s.a);
      yearShown = v;
      if (t < 1) yearAnim = requestAnimationFrame(step);
    };
    yearAnim = requestAnimationFrame(step);
  }

  /* ================= 切换镜头 ================= */
  var cardT = 0, lastCh = null;
  function goScene(i, opt) {
    opt = opt || {};
    i = Math.max(0, Math.min(SC.length - 1, i));
    stopAll();
    var chChanged = SC[i].c !== SC[cur].c || lastCh === null;
    cur = i; sent = opt.sent && opt.sent < SC[i].sents.length ? opt.sent : 0;
    finished = false;
    var s = SC[i];
    clearGroups();
    var flyMs = moveCamera(s, opt.instant);
    buildGroup(s, opt.instant ? 0 : Math.min(900, flyMs * 0.45));
    setYear(s, opt.instant);
    setChapter(s, chChanged && !opt.instant && !opt.quiet);
    showSub(s.sents[sent]);
    updateProgress(); saveState();
    if (playing) {
      var my = token;
      var delay = opt.auto ? (chChanged ? 2200 : 800) : 420;
      timer = setTimeout(function () { if (my === token && playing) speakCurrent(); }, delay);
    }
  }

  function setChapter(s, showCard) {
    var c = CH[s.c - 1];
    $('chap').innerHTML = '<b>第 ' + s.c + ' 章</b>' + esc(c.title);
    markToc();
    if (lastCh !== s.c && showCard && !stage.classList.contains('covered')) {
      $('cardN').textContent = '第 ' + s.c + ' 章';
      $('cardT').textContent = c.title;
      var card = $('card');
      card.classList.add('show');
      clearTimeout(cardT);
      cardT = setTimeout(function () { card.classList.remove('show'); }, 2600);
    }
    lastCh = s.c;
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ================= 字幕与进度 ================= */
  var subEl = $('subText'), subT = 0;
  function showSub(text) {
    text = (text || '').replace(/[，：]$/, '');
    if (subEl.textContent === text) return;
    if (RM) { subEl.textContent = text; return; }
    subEl.classList.add('fade');
    clearTimeout(subT);
    subT = setTimeout(function () { subEl.textContent = text; subEl.classList.remove('fade'); }, 160);
  }

  function fraction() {
    var s = SC[cur], done = 0;
    for (var j = 0; j < sent; j++) done += s.sents[j].length;
    return (CUM[cur] + done) / TOTAL;
  }
  function updateProgress() {
    var f = fraction();
    $('progFill').style.width = (f * 100).toFixed(2) + '%';
    $('count').textContent = (cur + 1) + ' / ' + SC.length;
    var ticks = $('ticks').children;
    for (var i = 0; i < ticks.length; i++) ticks[i].classList.toggle('done', +ticks[i].dataset.f <= f + 1e-9);
    $('prog').setAttribute('aria-valuenow', Math.round(f * 100));
  }
  function buildTicks() {
    var box = $('ticks');
    CH.forEach(function (c, ci) {
      if (ci === 0) return;
      var f = CUM[CHSTART[ci + 1]] / TOTAL, t = document.createElement('i');
      t.style.left = (f * 100).toFixed(3) + '%'; t.dataset.f = f;
      box.appendChild(t);
    });
  }
  function sceneAt(f) {
    var pos = f * TOTAL, i = 0;
    while (i < SC.length - 1 && CUM[i + 1] <= pos) i++;
    return i;
  }
  (function progressEvents() {
    var prog = $('prog'), tip = $('progTip');
    var fAt = function (e) { var r = prog.getBoundingClientRect(); return Math.max(0, Math.min(0.9999, (e.clientX - r.left) / r.width)); };
    prog.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      var f = fAt(e), s = SC[sceneAt(f)];
      tip.textContent = '第 ' + s.c + ' 章 · ' + CH[s.c - 1].title;
      var r = prog.getBoundingClientRect();
      var x = Math.max(80, Math.min(r.width - 80, f * r.width));
      tip.style.left = x + 'px'; tip.classList.add('show');
    });
    prog.addEventListener('pointerleave', function () { tip.classList.remove('show'); });
    prog.addEventListener('click', function (e) { goScene(sceneAt(fAt(e)), {}); });
    prog.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); goScene(cur + (e.key === 'ArrowRight' ? 1 : -1), {}); }
    });
  })();

  /* ================= 目录与设置 ================= */
  function buildToc() {
    var ol = $('tocList');
    CH.forEach(function (c, ci) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="n">' + (ci + 1 < 10 ? '0' : '') + (ci + 1) + '</span><span class="t">' + esc(c.title) + '</span><span class="s">' + esc(c.sub) + '</span>';
      b.addEventListener('click', function () { closePanels(); goScene(CHSTART[ci + 1], {}); if (stage.classList.contains('covered')) play(true); });
      li.appendChild(b); ol.appendChild(li);
    });
  }
  function markToc() {
    var lis = $('tocList').children, c = SC[cur].c;
    for (var i = 0; i < lis.length; i++) lis[i].classList.toggle('cur', i + 1 === c);
  }
  function openPanel(id) {
    closePanels();
    $(id).hidden = false;
    if (id === 'toc') { var c = $('tocList').children[SC[cur].c - 1]; if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' }); }
  }
  function closePanels() { $('toc').hidden = true; $('settings').hidden = true; }
  ['toc', 'settings'].forEach(function (id) {
    var p = $(id);
    p.addEventListener('click', function (e) { if (e.target === p || e.target.hasAttribute('data-close')) closePanels(); });
  });
  $('btnToc').addEventListener('click', function () { openPanel('toc'); });
  $('btnSet').addEventListener('click', function () { openPanel('settings'); });

  function renderVoiceSel() {
    var sel = $('optVoiceSel'), note = $('voiceNote');
    sel.innerHTML = '';
    if (!hasTTS) {
      sel.disabled = true; note.textContent = '这个浏览器不支持语音合成，将只显示字幕。';
      return;
    }
    if (!voices.length) {
      sel.disabled = true;
      var o = document.createElement('option'); o.textContent = '未找到中文声音'; sel.appendChild(o);
      note.textContent = '没有找到中文语音，将按字数计时、只显示字幕。Mac 可在「系统设置 → 辅助功能 → 朗读内容」中添加中文声音（如「婷婷」）。';
      return;
    }
    sel.disabled = false;
    voices.forEach(function (v, i) {
      var o = document.createElement('option');
      o.value = i; o.textContent = v.name + '（' + v.lang + (v.localService ? '' : '，联网') + '）';
      if (v === voice) o.selected = true;
      sel.appendChild(o);
    });
    note.textContent = '标注「联网」的声音需要连接境外服务器，在国内可能无法播放，建议选本机声音。';
  }
  $('optVoiceSel').addEventListener('change', function (e) {
    voice = voices[+e.target.value] || voice; errCount = 0; saved.vn = voice && voice.name;
    saveState();
    if (playing) speakCurrent(true);
  });
  function updateVoiceBtn() {
    stage.classList.toggle('mute', !voiceUsable());
    var sw = $('optVoice'); sw.setAttribute('aria-checked', voiceOn ? 'true' : 'false');
    $('btnVoice').setAttribute('aria-label', voiceOn ? '关闭语音' : '打开语音');
  }
  function setVoiceOn(on) {
    voiceOn = on; errCount = 0; updateVoiceBtn(); saveState();
    if (on && hasTTS && !voices.length) toast('没有找到中文语音，将只显示字幕');
    if (playing) speakCurrent(true);
  }
  $('optVoice').addEventListener('click', function () { setVoiceOn(!voiceOn); });
  $('btnVoice').addEventListener('click', function () { setVoiceOn(!voiceOn); toast(voiceOn ? '语音讲解：开' : '语音讲解：关（只看字幕）'); });

  function setRate(r, restart) {
    rate = clampRate(r);
    $('btnRate').textContent = rate.toFixed(1) + '×';
    $('rateVal').textContent = rate.toFixed(1) + '×';
    $('optRate').value = rate;
    saveState();
    if (restart && playing) speakCurrent(true);
  }
  $('optRate').addEventListener('change', function (e) { setRate(+e.target.value, true); });
  $('optRate').addEventListener('input', function (e) { $('rateVal').textContent = (+e.target.value).toFixed(1) + '×'; });
  $('btnRate').addEventListener('click', function () {
    var n = rate >= 1.6 ? 0.8 : rate + 0.2;
    setRate(n, true); toast('语速 ' + rate.toFixed(1) + ' 倍');
  });

  /* ================= 控制按钮与键盘 ================= */
  $('btnPlay').addEventListener('click', toggle);
  $('btnPrev').addEventListener('click', function () { goScene(cur - 1, {}); });
  $('btnNext').addEventListener('click', function () { goScene(cur + 1, {}); });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
    if (e.key === 'Escape') { closePanels(); return; }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (stage.classList.contains('covered')) { startFrom(finished ? 0 : (saved.i > 0 ? cur : 0)); return; }
      toggle(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goScene(cur + 1, {}); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goScene(cur - 1, {}); }
  });

  var fullBtn = $('btnFull');
  if (document.fullscreenEnabled && !/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    fullBtn.hidden = false;
    fullBtn.addEventListener('click', function () {
      try { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen(); } catch (e) { /* ignore */ }
    });
  }

  var toastT = 0;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ================= 封面 ================= */
  function minutes() { return Math.round(TOTAL / 4.6 / 60); }
  function showCover(mode) {
    stage.classList.add('covered');
    clearTimeout(cardT); $('card').classList.remove('show');
    $('cover').classList.remove('gone');
    var btns = $('coverBtns'); btns.innerHTML = '';
    var mk = function (html, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.innerHTML = html; b.addEventListener('click', fn); btns.appendChild(b); return b; };
    if (mode === 'end') {
      $('coverKicker').textContent = '全片终';
      $('coverTitle').textContent = '放映结束';
      $('coverLede').innerHTML = '谢谢观看。人类的故事还在继续，<br>下一章由我们来写。';
      mk('从头再看一遍', 'primary', function () { startFrom(0); });
      mk('章节目录', '', function () { openPanel('toc'); });
      $('coverHint').textContent = '想核对书里说的年代和数字？设置里有核对记录的链接。';
      return;
    }
    if (mode === 'resume') {
      var s = SC[cur];
      mk('从上次的地方继续<small>第 ' + s.c + ' 章 · ' + esc(CH[s.c - 1].title) + ' · 第 ' + (cur + 1) + ' 段</small>', 'primary two', function () { startFrom(cur, sent); }).focus();
      mk('从头开始', '', function () { startFrom(0); });
    } else {
      mk('开始放映', 'primary', function () { startFrom(0); }).focus();
    }
  }
  function hideCover() {
    if (!stage.classList.contains('covered')) return;
    stage.classList.remove('covered');
    $('cover').classList.add('gone');
  }
  function startFrom(i, s) {
    hideCover();
    if (i !== cur || (s || 0) !== sent) goScene(i, { sent: s || 0, quiet: true });
    // 在点击事件里同步开始朗读，满足 iOS/Safari 必须由用户手势触发声音的要求
    play(true);
    lastCh = null;
    setChapter(SC[cur], true);
  }

  /* ================= 启动 ================= */
  window.addEventListener('resize', debounce(function () {
    measure();
    var t = targetCam(SC[cur]); fly = null; cam = t; showProj(t.pk); applyWorld();
    groups.forEach(function (G) { updateGroup(G, performance.now()); });
    kick();
  }, 120));
  function debounce(fn, ms) { var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; }

  buildToc(); buildTicks();
  setRate(rate, false);
  updateVoiceBtn();
  $('coverMeta').textContent = CH.length + ' 章 · ' + SC.length + ' 个镜头 · 约 ' + minutes() + ' 分钟';
  measure();

  // 进度按「章节标题 + 章内第几段」保存，插入新章节后仍能回到原处
  var savedAt = -1;
  if (typeof saved.ct === 'string') {
    for (var ci = 0; ci < CH.length; ci++) {
      if (CH[ci].title === saved.ct) {
        var first = CHSTART[ci + 1], next = ci + 1 < CH.length ? CHSTART[ci + 2] : SC.length;
        savedAt = Math.min(first + Math.max(0, saved.ci | 0), next - 1);
        if (savedAt !== first + (saved.ci | 0)) saved.s = 0;
        break;
      }
    }
  } else if (saved.i > 0 && saved.i < SC.length) savedAt = saved.i;
  var resume = savedAt > 0 && !saved.done;
  saved.i = savedAt;
  cur = resume ? savedAt : 0;
  sent = resume && saved.s < SC[cur].sents.length ? (saved.s || 0) : 0;
  var s0 = SC[cur];
  cam = targetCam(s0); showProj(cam.pk); applyWorld();
  buildGroup(s0, 400);
  setYear(s0, true); setChapter(s0, false);
  subEl.textContent = s0.sents[sent];
  updateProgress();
  showCover(resume ? 'resume' : 'start');

  // 供自动化自测使用的只读接口
  window.__wh = {
    get cur() { return cur; }, get sent() { return sent; }, get playing() { return playing; }, get finished() { return finished; },
    count: SC.length, go: function (i) { goScene(i, { instant: true }); }, next: function () { sentenceDone(); }, cam: function () { return cam; }, view: function () { return view; }
  };
})();

</script>
</body>
