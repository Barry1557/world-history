起，突厥内部争位不断，刚刚建立的隋朝趁机拉一派、打一派，大臣长孙晟献计说要远交而近攻，离强而合弱。到六〇三年前后，突厥正式分裂成了东突厥和西突厥两部。","a":true,"ar":[["东突厥",105,46,8],["西突厥",70,44,9]]},{"c":20,"y":630,"cam":[110,39,4],"t":"六二六年，唐太宗李世民刚即位不到二十天，东突厥颉利可汗就率大军兵临长安城外的渭水，太宗只得与他订立盟约。四年后风水轮流转：六三〇年，唐将李靖在阴山一带大破东突厥，颉利兵败被擒，东突厥汗国灭亡。","pts":[["长安",108.94,34.26,"b"],["渭水便桥",108.7,34.38,"l"],["定襄（阴山南麓）",111.6,40.3]]},{"c":20,"y":630,"cam":[100,40,2.6],"t":"东突厥灭亡后，草原各部首领请唐太宗做他们的天可汗，也就是可汗之上的可汗。同一个人，既是中原的皇帝，又是草原的大汗。颉利被安置在长安，据《资治通鉴》记载，太上皇李渊设宴时，还让他起舞助兴。","pts":[["长安",108.94,34.26]],"ar":[["唐朝",110,33,9],["草原诸部",103,46,8]]},{"c":20,"y":657,"cam":[73,43,4],"t":"西突厥撑得更久一些，它控制着丝绸之路上的许多绿洲城邦。玄奘西行取经时，就在碎叶城拜见过西突厥可汗。六五七年，唐将苏定方击败西突厥，唐朝的势力一度伸进中亚腹地。碎叶也因此出名，有一种说法认为李白就出生在这里，学界有争论。","pts":[["碎叶",75.2,42.8],["伊塞克湖",77.3,42.4,"b"]],"ar":[["西突厥",72,44,7]]},{"c":20,"y":732,"cam":[102.8,47.5,8],"t":"六八二年，突厥人起兵复国，建立后突厥汗国。七三二年，毗伽可汗为弟弟阙特勤立碑，碑文用突厥人自己的文字刻成，和附近的暾欲谷碑等一起，是现存最古老的突厥语文献。突厥人第一次用自己的语言，讲述祖先如何建国、失国又复兴。","pts":[["阙特勤碑",102.83,47.56]]},{"c":20,"y":732,"cam":[102.8,47.5,8],"t":"有意思的是，阙特勤碑的一面刻着汉文，一般认为由唐玄宗亲自撰写。而突厥文那一面却在提醒族人：唐人的言辞甜蜜，财物柔软，靠这些把远方的人引诱过去。一块碑，两种腔调。这种文字直到一八九三年才被丹麦学者汤姆森破译。","pts":[["阙特勤碑",102.83,47.56]]},{"c":20,"y":740,"cam":[42,45,3.2],"t":"再把镜头拉到西边。西突厥瓦解后，里海和黑海之间兴起了可萨汗国。可萨和东罗马长期结盟，东罗马皇储还娶了可萨公主，他们的儿子利奥四世外号就叫可萨人。更奇特的是，可萨上层在八世纪前后改信了犹太教，民间信了多少，学界一直有争论。","a":true,"pts":[["阿的尔（可萨都城）",48,46.4],["君士坦丁堡",28.98,41.01,"l"]],"ar":[["可萨汗国",45,47,6]]},{"c":20,"y":744,"cam":[103,46,4],"t":"七四四年，回鹘人联合其他部落推翻了后突厥，在鄂尔浑河畔建立回鹘汗国。回鹘人说的是和突厥人相近的语言，草原上换了主人，却没换语言。他们在河边筑起一座都城，叫斡耳朵八里，有宫殿、寺院和市场，是当时草原上少见的大城。","pts":[["斡耳朵八里",102.66,47.43]],"ar":[["回鹘汗国",103,47,9]]},{"c":20,"y":751,"cam":[72,42.5,6],"t":"前面讲过七五一年的怛逻斯之战。换个角度看，这一仗里也有突厥人的身影：据中国史书记载，唐军中的葛逻禄部临阵倒戈，是高仙芝战败的重要原因。葛逻禄是一支突厥语部落，后来成了中亚喀喇汗王朝的重要源头之一。","pts":[["怛逻斯",71.4,42.9]]},{"c":20,"y":757,"cam":[108,40,3.4],"t":"七五五年爆发的安史之乱，主角安禄山本人，母亲是突厥人，父亲一般认为是粟特人。而帮唐朝平乱的，又是草原上的回鹘。七五七年，回鹘骑兵协助唐军收复长安和洛阳，不过他们在洛阳也大肆劫掠。一场动摇大唐的战乱，两边都离不开草原。","pts":[["长安",108.94,34.26,"l"],["洛阳",112.45,34.62]],"rt":[[[102.7,47.4],[105,44],[107.5,41],[108.5,37.5],[108.9,34.5]]]},{"c":20,"y":760,"cam":[105,40,3],"t":"回鹘出兵是要回报的。此后回鹘每年赶来数以万计的马匹，向唐朝换取丝绸，据《新唐书》记载，一匹马要换四十匹绢，而这些马常常瘦弱得不堪使用。草原需要丝绸，中原需要战马，彼此离不开，又彼此抱怨，这就是绢马贸易。","a":true,"pts":[["长安",108.94,34.26,"b"],["斡耳朵八里",102.66,47.43]]},{"c":20,"y":762,"cam":[103,46,5],"t":"七六二年，回鹘牟羽可汗南下助唐，在洛阳一带结识了摩尼教僧侣，把他们带回草原，摩尼教从此成为回鹘国教。伊朗高原那一章讲过，摩尼教诞生在萨珊波斯，在家乡备受打压，没想到却在蒙古草原上当上了国教。","pts":[["斡耳朵八里",102.66,47.43]]},{"c":20,"y":836,"cam":[44,34,6],"t":"与此同时，大批突厥人以另一种身份进入伊斯兰世界：奴隶兵。阿拔斯哈里发从中亚买来突厥少年，训练成精锐骑兵，叫作古拉姆。八三六年，哈里发为这支军队另建新都萨迈拉。后来，军人们渐渐掌握大权，连哈里发的废立都要看他们的脸色。","pts":[["萨迈拉",43.87,34.2],["巴格达",44.36,33.31,"b"]]},{"c":20,"y":840,"cam":[96,44,2.6],"t":"八四〇年，来自叶尼塞河上游的黠戛斯人攻破回鹘都城，回鹘汗国崩溃。回鹘人四散迁徙：一支南下河西走廊，建立甘州回鹘，今天甘肃的裕固族就是他们的后裔；一支西迁吐鲁番盆地，建立高昌回鹘，和今天的维吾尔族有很深的渊源。","pts":[["斡耳朵八里",102.66,47.43],["高昌",89.53,42.85,"l"],["甘州（张掖）",100.45,38.93,"b"]],"rt":[[[92,53],[96,50.5],[101,48]],[[102.5,47],[97,45.5],[93,44],[89.7,43]],[[102.5,46.8],[101.8,43],[100.6,39.2]]]},{"c":20,"y":950,"cam":[89.5,42.9,8],"t":"在吐鲁番，回鹘人从游牧转向定居，大多改信了佛教，柏孜克里克石窟里留着回鹘供养人的壁画。他们用粟特字母书写回鹘文，后来蒙古人借回鹘文创制了蒙古文，满文又是从蒙古文改造来的。一套字母，从中亚一路传到了紫禁城。","a":true,"pts":[["高昌故城",89.53,42.85,"b"],["柏孜克里克石窟",89.54,42.96,"t"]]},{"c":20,"y":960,"cam":[70,41,3.6],"t":"十世纪，天山南北兴起了喀喇汗王朝。据记载，王族的萨图克·博格拉汗率先皈依伊斯兰教；阿拉伯史家还记载，九六〇年有二十万帐突厥人改宗。喀喇汗王朝是最早的伊斯兰突厥王朝之一，九九九年前后又攻占布哈拉，取代了波斯人的萨曼王朝。","a":true,"pts":[["八剌沙衮",75.25,42.75],["喀什噶尔",75.99,39.47,"b"],["布哈拉",64.42,39.77,"l"]],"ar":[["喀喇汗王朝",73,41,6]]},{"c":20,"y":985,"cam":[63,42,5],"t":"现在，这一章的主角登场。十世纪末，乌古斯突厥人中有位首领名叫塞尔柱，他带着部众来到锡尔河下游，约九八五年皈依了伊斯兰教。他的孙子图格里勒和恰格里兄弟，后来南下呼罗珊放牧。这个家族的名字，日后成了一个大帝国的名字。","a":true,"pts":[["锡尔河下游（毡的）",64.5,44.6],["木鹿",61.84,37.66,"b"]]},{"c":20,"y":998,"cam":[70,29,3.2],"t":"在今天阿富汗的伽色尼，奴隶兵出身的突厥将领建立了伽色尼王朝。九九八年，马哈茂德即位，此后十几次远征印度北部，掠走大量财富。一〇二五年，他攻入古吉拉特，洗劫了索姆纳特神庙，这在印度的历史记忆里留下了很深的伤痕。","pts":[["伽色尼",68.42,33.55,"l"],["索姆纳特",70.4,20.89,"l"]],"rt":[[[68.4,33.5],[69,30],[70.5,27],[71.5,24],[70.4,21]]]},{"c":20,"y":1010,"cam":[66,33,4],"t":"马哈茂德的宫廷也是一座文化重镇。伊朗高原那一章讲过的菲尔多西，把《列王纪》献给了他。传说苏丹答应一联诗给一枚金币，最后却给了银币，诗人一气之下写诗讽刺他。学者比鲁尼随军到了印度，学了梵文，写下研究印度的名著《印度志》。","a":true,"pts":[["伽色尼",68.42,33.55],["图斯",59.5,36.5,"l"]]},{"c":20,"y":1040,"cam":[62,37.5,6],"t":"一〇四〇年，塞尔柱兄弟在木鹿附近的丹丹坎，击败了强大的伽色尼军队。塞尔柱骑兵来去如风，切断粮道、守住水井，把又饿又渴的伽色尼大军活活拖垮。这一战之后，呼罗珊落入塞尔柱人手中，他们一路向西，席卷了伊朗高原。","pts":[["木鹿",61.84,37.66],["丹丹坎（大致位置）",62.4,37.2,"b"]]},{"c":20,"y":1055,"cam":[47,34,4.5],"t":"一〇五五年，图格里勒率军进入巴格达。那时阿拔斯哈里发早已大权旁落，被信奉什叶派的布韦希王朝控制。图格里勒以保护哈里发的名义赶走了布韦希人，自称苏丹。苏丹在阿拉伯语里本意是权力。从此哈里发只保留宗教上的尊位，实权握在苏丹手里。","pts":[["巴格达",44.36,33.31],["赖伊",51.43,35.59]],"rt":[[[51.4,35.6],[49,34.8],[46.5,34.2],[44.5,33.4]]]},{"c":20,"y":1069,"cam":[75,41,6],"t":"同一时期，东边的喀喇汗王朝迎来了文化高峰。约一〇六九年，八剌沙衮人尤素甫写成长诗《福乐智慧》，献给喀什噶尔的君主。全诗六千六百多联，借国王、宰相、智者和隐士四个人物的对话谈治国和做人，是突厥语文学的早期经典。","pts":[["八剌沙衮",75.25,42.75],["喀什噶尔",75.99,39.47,"b"]]},{"c":20,"y":1071,"cam":[36,40,5],"t":"一〇七一年，塞尔柱苏丹阿尔普·阿尔斯兰在亚美尼亚高原的曼齐刻尔特，迎战东罗马皇帝罗曼努斯四世。东罗马军中有雇佣兵倒戈，后军将领又擅自撤走，大军溃败，皇帝成了俘虏。上一次罗马皇帝被活捉，还是伊朗高原那一章讲的瓦勒良。","pts":[["曼齐刻尔特",42.53,39.14],["君士坦丁堡",28.98,41.01,"l"]],"rt":[[[29,41],[32,40],[35.5,39.8],[38.5,39.7],[42.4,39.2]]]},{"c":20,"y":1071,"cam":[42.5,39.1,8],"t":"据流传的记载，苏丹问被俘的皇帝：要是我成了你的俘虏，你会怎样？皇帝说，也许杀了你，也许押着你在君士坦丁堡游街。苏丹说：我的惩罚要重得多，我原谅你，放你回去。可罗曼努斯回国后被政敌废黜、刺瞎双眼，不久死去。","pts":[["曼齐刻尔特",42.53,39.14]]},{"c":20,"y":1074,"cam":[62,38,2.4],"t":"另一位喀什噶尔人麻赫穆德·喀什噶里来到巴格达，约一〇七二年至一〇七四年写成《突厥语大词典》，用阿拉伯语给阿拉伯读者讲解突厥语。书里附了一幅圆形世界地图，以他心目中的突厥世界为中心，正中是八剌沙衮，最东边还画上了日本。","pts":[["喀什噶尔",75.99,39.47],["巴格达",44.36,33.31,"l"]],"rt":[[[76,39.5],[70,40.2],[64.4,39.8],[61.8,37.6],[56,36],[51.4,35.6],[47,34.3],[44.4,33.3]]]},{"c":20,"y":1077,"cam":[32,39,4.2],"t":"曼齐刻尔特之后，大批突厥部落涌入小亚细亚。一〇七七年，塞尔柱家族的一支在这里建立罗姆苏丹国。罗姆就是罗马，意思是罗马人的土地。后来他们定都科尼亚，沿商路修了约一百座商队客栈。小亚细亚从此渐渐成为突厥人的家园。","pts":[["尼西亚",29.72,40.43,"l"],["科尼亚",32.49,37.87,"b"]],"ar":[["罗姆苏丹国",32,39,3.5]],"rt":[[[42.4,39.1],[39,39.2],[36,39.3],[33,39.6],[30.2,40.3]]]},{"c":20,"y":1079,"cam":[54,35,3.4],"t":"阿尔普·阿尔斯兰的儿子马立克沙在位时，塞尔柱帝国最为强盛，从中亚一直延伸到地中海东岸。撑起这个帝国的是波斯宰相尼扎姆·穆勒克，他辅佐两代苏丹近三十年。伊朗高原那一章讲过海亚姆的精确历法，正是在马立克沙的宫廷里制定的。","pts":[["伊斯法罕",51.67,32.65],["巴格达",44.36,33.31,"l"],["内沙布尔",58.8,36.21]],"ar":[["大塞尔柱帝国",56,36,12]]},{"c":20,"y":1080,"cam":[52,34,4],"t":"尼扎姆·穆勒克在巴格达、内沙布尔等城市创办了一批学校，人称尼扎米亚学校，用捐赠的财产给老师发薪、给学生提供食宿。据说他还写了一本《治国策》，给苏丹讲治国之道。同一时间，地球的东边，北宋的王安石也正在变法。","a":true,"pts":[["巴格达",44.36,33.31,"l"],["伊斯法罕",51.67,32.65],["内沙布尔",58.8,36.21]]},{"c":20,"y":1090,"cam":[50.6,36.4,8],"t":"一〇九〇年，伊斯玛仪派的哈桑·萨巴赫靠暗中发展信徒，几乎兵不血刃地夺取了厄尔布尔士山中的阿拉穆特堡，以险峻的山堡对抗塞尔柱。他们以刺杀政敌闻名，英语的刺客一词据说来自他们的外号，跟大麻有没有关系，学界有争论。","pts":[["阿拉穆特堡",50.58,36.44]]},{"c":20,"y":1092,"cam":[50,34,4.5],"t":"一〇九二年十月，尼扎姆·穆勒克在旅途中遇刺身亡，一般认为凶手出自阿拉穆特，但也有别的说法。一个多月后，马立克沙在巴格达突然去世。苏丹的儿子和兄弟们为了继承权打成一团，强盛一时的塞尔柱帝国，很快四分五裂。","pts":[["纳哈万德",48.38,34.19,"l"],["巴格达",44.36,33.31,"b"],["伊斯法罕",51.67,32.65]]},{"c":20,"y":1095,"cam":[24,40,3.6],"t":"到一〇九五年，叙利亚的阿勒颇和大马士革分属一对争斗不休的兄弟。东罗马皇帝阿历克塞一世想趁机收复小亚细亚，可兵力不够，于是派使者到意大利的皮亚琴察，向教皇乌尔班二世求援。几个月后，教皇的一场演说，将掀起两百年的风暴。","pts":[["君士坦丁堡",28.98,41.01],["皮亚琴察",9.69,45.05,"l"],["阿勒颇",37.16,36.2],["大马士革",36.29,33.51,"b"]]},{"c":21,"y":1095,"cam":[18,42,3],"t":"公元一千零九十五年，教皇乌尔班二世在法国克莱蒙发表演说，号召西欧人前往东方夺取耶路撒冷。起因之一，是东罗马皇帝向西方求援，抵抗塞尔柱突厥人。第二年，大批骑士和平民踏上东征之路，十字军东征就此开始，前后持续了约两百年。","pts":[["克莱蒙",3.08,45.78,"l"],["君士坦丁堡",28.98,41.01],["耶路撒冷",35.23,31.78]],"rt":[[[3.1,45.8],[8,47.5],[16,48],[20.5,44.8],[26,42.5],[29,41],[32,39.5],[35,37],[36.2,36.2],[35.8,33.8],[35.2,31.9]]]},{"c":21,"y":1099,"cam":[36,34,6],"t":"一千零九十九年，第一次十字军攻占耶路撒冷，城中大批穆斯林和犹太居民遭到屠杀。十字军随后在地中海东岸建立了几个十字军国家。对当地居民来说，这首先是一场漫长而血腥的入侵。","pts":[["耶路撒冷",35.23,31.78],["安条克",36.16,36.2],["埃德萨",38.79,37.16]],"ar":[["十字军国家",36,34,3]]},{"c":21,"y":1187,"cam":[35.4,32.4,10],"t":"一千一百八十七年，萨拉丁在哈丁战役中大败十字军，随后收复了耶路撒冷。与八十多年前不同，他没有对城中居民展开屠杀，许多人缴纳赎金后得以离开。萨拉丁因此在中东和欧洲都留下了宽厚君主的名声。","pts":[["哈丁",35.45,32.8],["耶路撒冷",35.23,31.78]]},{"c":21,"y":1192,"cam":[35,32.5,8],"t":"于是有了第三次十字军，英格兰国王狮心王理查和萨拉丁成了一对著名的对手。据记载，理查的战马阵亡时，萨拉丁的弟弟阿迪勒派人送去了战马。双方打了一年多，最终在一千一百九十二年达成协议：耶路撒冷仍归穆斯林，但基督徒朝圣者可以前往。有趣的是，两人始终没有见过面。","pts":[["阿卡",35.07,32.92],["雅法",34.75,32.05,"l"],["耶路撒冷",35.23,31.78]]},{"c":21,"y":1204,"cam":[21,42,4.5],"t":"最出人意料的是第四次十字军。他们欠了威尼斯一大笔船费，在威尼斯的影响下转而攻打基督教城市君士坦丁堡，一千二百零四年将其洗劫一空。许多珍宝被运往西方，今天威尼斯圣马可教堂的青铜驷马，就是当年的战利品。","pts":[["威尼斯",12.33,45.44,"l"],["君士坦丁堡",28.98,41.01]],"rt":[[[12.4,45.4],[14,44],[16.5,42.5],[19,40],[21.5,37],[24,37],[26,39.5],[28.9,41]]]},{"c":21,"y":1291,"cam":[35,33,8],"t":"十字军运动还有许多插曲，比如所谓的儿童十字军，传说成分很大。一千二百二十九年，神圣罗马皇帝腓特烈二世干脆通过谈判，兵不血刃地拿到了耶路撒冷，结果还被教会谴责。一千二百九十一年，十字军在东方的最后重镇阿卡陷落，东征时代结束。","pts":[["阿卡",35.07,32.92],["耶路撒冷",35.23,31.78]]},{"c":21,"y":1150,"cam":[10,25,1],"t":"十字军时代，欧洲人从东方带回了对糖、香料和丝绸的胃口，威尼斯和热那亚的商人赚得盆满钵满。同一时期，柬埔寨正在建造吴哥窟；北美密西西比河畔的卡霍基亚，人口可能有一两万；非洲南部的大津巴布韦正在兴起；日本则在十二世纪末进入武士掌权的幕府时代。","a":true,"pts":[["吴哥窟",103.87,13.41],["卡霍基亚",-90.06,38.66],["镰仓",139.55,35.32],["大津巴布韦",30.93,-20.27],["威尼斯",12.33,45.44,"l"]]},{"c":22,"y":1206,"cam":[104,47,4],"t":"一千二百零六年，蒙古草原上的铁木真被各部推举为成吉思汗。他把草原部落重新编成千户、百户，打破了原有的部落界限，建立起一支纪律严明的骑兵。此后几十年，蒙古人建立了历史上面积最大的连续陆地帝国，两千多万平方公里。","pts":[["斡难河源",110.5,48.9],["哈拉和林",102.83,47.2,"l"]],"ar":[["蒙古高原",105,47,6]]},{"c":22,"y":1258,"cam":[70,42,2.2],"t":"蒙古的征服极其残酷。一千二百一十九年起的西征中，中亚花剌子模的许多城市遭到毁灭性打击，人口损失极其惨重。一千二百五十八年，蒙古军攻陷巴格达，阿拔斯王朝灭亡，智慧宫等文化宝库毁于一旦。这是人类历史上沉重的一页。","pts":[["撒马尔罕",66.96,39.65],["巴格达",44.37,33.31,"l"],["哈拉和林",102.83,47.2]],"rt":[[[102.8,47.2],[93,46],[84,45],[76,43],[70,41.5],[67,39.7]],[[67,39.7],[62,37],[55,36.5],[49,35],[44.4,33.3]]]},{"c":22,"y":1260,"cam":[80,35,1.5],"t":"蒙古也有打不过的时候。一千二百六十年，埃及马穆鲁克军队在巴勒斯坦的阿音札鲁特击败蒙古军，阻止了他们进入非洲。忽必烈两次渡海进攻日本，一千二百七十四年和一千二百八十一年都遭遇风暴受挫，日本人后来称之为神风。","pts":[["阿音札鲁特",35.36,32.55,"l"],["博多湾",130.4,33.6]],"ar":[["蒙古帝国",85,45,22]]},{"c":22,"y":1279,"cam":[114,31,4],"t":"一千二百七十一年，忽必烈定国号为元，以大都，也就是今天的北京为都城。一千二百七十九年，元军在崖山海战中消灭了南宋最后的抵抗力量，据史书记载，大臣陆秀夫背着年幼的皇帝跳海殉国。元朝成为第一个由北方游牧民族建立、统治全中国的王朝。","pts":[["大都（北京）",116.4,39.9],["崖山",113.1,22.2]]},{"c":22,"y":1287,"cam":[60,42,1.6],"t":"蒙古帝国客观上把欧亚大陆连成了一片，驿站遍布各地。威尼斯人马可·波罗据说在元朝生活了十几年，学界对他的游记有过不少争论。反方向也有人：一千二百八十七年前后，景教僧人拉班·扫马从大都一路西行，到了巴黎和罗马，见过法国国王和教皇。","pts":[["大都",116.4,39.9],["巴黎",2.35,48.86,"l"],["罗马",12.5,41.9,"b"],["威尼斯",12.33,45.44]],"rt":[[[116.4,39.9],[110,40.5],[100,40],[94.7,40.1],[87,43.5],[76,42],[67,39.7],[58,37],[51,36],[44.4,33.5],[40,37],[32,39.5],[29,41],[20,40],[14,41],[12.5,41.9],[8.9,44.4],[5,46],[2.4,48.8]]]},{"c":22,"y":1324,"cam":[-5,22,3],"t":"同一时代的西非，马里帝国正在鼎盛。一千三百二十四年，国王曼萨·穆萨前往麦加朝圣，带着大批随从和黄金，路过开罗时出手阔绰。据阿拉伯史家记载，当地金价因此下跌了好些年。同一时期，摩洛哥旅行家伊本·白图泰走了近三十年，足迹从西非一直到中国。","pts":[["廷巴克图",-3,16.77],["开罗",31.24,30.04],["麦加",39.83,21.42]],"ar":[["马里帝国",-6,14,7]],"rt":[[[-3,16.8],[2,19],[10,23],[20,27],[28,29.8],[31.2,30]]]},{"c":22,"y":1346,"cam":[55,44,2.6],"t":"然而，把欧亚连起来的道路也运送了别的东西。十四世纪三四十年代，鼠疫从中亚扩散开来，二零二二年的一项古DNA研究，把源头指向今天吉尔吉斯斯坦的伊塞克湖一带。据一份当时的记载，围攻黑海港口卡法的军队，把染病的尸体抛进了城里。","pts":[["伊塞克湖一带",76.5,42.5],["卡法",35.38,45.03]],"rt":[[[76.5,42.5],[70,43],[62,44.5],[54,46.5],[47,46.5],[40,46],[35.5,45.1]]]},{"c":22,"y":1347,"cam":[12,45,3],"t":"一千三百四十七年，商船把鼠疫带到了西西里，随后席卷欧洲、中东和北非。短短几年里，欧洲约有三分之一到一半的人口死亡，有的城镇几乎空无一人。人们不知道病因，恐慌之中，一些地方还发生了迫害犹太人的暴行。这是人类历史上最惨烈的瘟疫之一。","pts":[["墨西拿",15.55,38.19],["佛罗伦萨",11.26,43.77,"l"],["卡法",35.38,45.03]],"ar":[["黑死病",10,47,12]],"rt":[[[35.4,45],[31.5,43],[29,41],[26,39],[23,36.5],[19,37.5],[15.6,38.2]]]},{"c":22,"y":1368,"cam":[60,40,1.6],"t":"瘟疫之后，西欧劳动力奇缺，幸存的农民和工匠要求更高的工钱，封建束缚开始松动。地中海港口开始要求外来船只隔离，后来定为四十天，英语里的检疫一词就来自意大利语的四十天。在东方，元朝在灾荒和起义中崩溃，一千三百六十八年，朱元璋建立明朝。","pts":[["威尼斯",12.33,45.44,"l"],["应天（南京）",118.78,32.06]]},{"c":23,"y":790,"cam":[-5,18,2.4],"t":"这一章，镜头回到撒哈拉以南的非洲，看看那些因黄金而闻名的王国。前面讲过，骆驼让穿越撒哈拉的贸易成为可能。约八世纪末，阿拉伯学者法扎里就在书里提到了西非的加纳，称它为黄金之国。","a":true,"pts":[["昆比萨利赫",-7.97,15.77,"l"],["西吉尔马萨",-4.27,31.28]],"ar":[["加纳帝国",-8,15.5,4.5]],"rt":[[[-4.27,31.28],[-5,26],[-7,21],[-7.9,16.2]]]},{"c":23,"y":800,"cam":[-5,12,3.4],"t":"先说一个容易弄混的地方：中世纪的加纳帝国在今天的毛里塔尼亚东南部和马里西部，和现在的加纳共和国隔着好几百公里。加纳原本是国王的称号，意思大约是战争首领；当地的索宁克人把自己的国家叫作瓦加杜。一九五七年，黄金海岸独立时，借用了这个古老而光荣的名字。","a":true,"pts":[["昆比萨利赫",-7.97,15.77],["阿克拉（今加纳首都）",-0.19,5.6]],"ar":[["加纳帝国",-8,15.5,4]]},{"c":23,"y":1068,"cam":[-8,15.8,8],"t":"一〇六八年，西班牙的地理学家巴克里写成一部地理书。他本人从没去过西非，靠的是商人的讲述。书里说，加纳的都城分成两半：穆斯林商人住的城里有十二座清真寺，国王住的城在约十公里外，守在国王门口的狗都戴着金银项圈。","pts":[["昆比萨利赫遗址",-7.97,15.77]]},{"c":23,"y":1068,"cam":[-9,13.5,5],"t":"巴克里还记下一条规矩：国内挖出的金块一律归国王，老百姓只能拿金沙。他解释说，要不然金子太多就不值钱了。加纳的金矿其实大多在更南边，它的财富主要来自控制黄金和盐的买卖，对进出的货物收税，算得上是撒哈拉南缘的大收费站。","a":true,"pts":[["昆比萨利赫",-7.97,15.77],["班布克金矿区",-11.3,13.4,"b"]]},{"c":23,"y":1068,"cam":[-10,12,5],"t":"关于金子从哪里来，流传着一个神秘的说法，叫无声贸易：商人把盐和货物摆在河边，敲鼓示意后走开；对方出来放下金沙，再退回去。双方你来我往地加减，直到都满意，全程不见面、不说话。这类故事古希腊的希罗多德就讲过，学者认为它带有很浓的传说色彩。","a":true,"pts":[["班布克金矿区",-11.3,13.4]]},{"c":23,"y":1076,"cam":[-7,23,2.6],"t":"十一世纪，撒哈拉西部的柏柏尔游牧部落兴起了一个宗教运动，叫阿尔摩拉维德，男子蒙着面纱。他们约一〇七〇年建起马拉喀什，后来又北上统治了西班牙南部。阿拉伯文献说他们在一〇七六年攻占了加纳，但不少学者认为这是后人的误读，考古也没找到城破的痕迹。","pts":[["马拉喀什",-7.99,31.63],["昆比萨利赫",-7.97,15.77]],"ar":[["阿尔摩拉维德",-9,25,6]]},{"c":23,"y":1200,"cam":[39,12,6],"t":"镜头转到东非的埃塞俄比亚高原。前面讲过的阿克苏姆衰落后，扎格维王朝兴起。约十二世纪末到十三世纪初，国王拉利贝拉下令在山里开凿教堂。有学者认为，这和一一八七年萨拉丁夺取耶路撒冷有关：去圣地朝圣难了，就在家门口造一座新耶路撒冷。","a":true,"pts":[["拉利贝拉",39.04,12.03],["阿克苏姆",38.72,14.13]]},{"c":23,"y":1200,"cam":[39.04,12.03,10],"t":"拉利贝拉的十一座教堂不是砌起来的，而是从整块岩石往下凿出来的：先挖出深沟，留下中间的石块，再掏空做成门窗、立柱和拱顶。最有名的圣乔治教堂从天上看是一个十字，藏在十几米深的坑里。当地传说，白天工匠凿，夜里天使接着凿。","a":true,"pts":[["圣乔治教堂",39.04,12.03]]},{"c":23,"y":1235,"cam":[-8.2,12.3,6],"t":"回到西非。加纳衰落后，索索王国一度称霸。约一二三五年，曼丁哥王子松迪亚塔·凯塔联合各部，在基里纳击败索索国王苏曼古鲁，马里帝国由此兴起。差不多同一时间，在欧亚大陆的另一头，蒙古人正准备第二次西征。","a":true,"pts":[["基里纳",-8.15,12.31]],"ar":[["马里帝国的起点",-8.5,12,2]]},{"c":23,"y":1235,"cam":[-8.4,12,7],"t":"松迪亚塔的故事主要靠格里奥口口相传。格里奥是世袭的说唱史官，弹着科拉琴，背诵各家族的谱系和往事。按《松迪亚塔史诗》的说法，王子小时候不会走路，饱受嘲笑，后来撑着一根树枝站了起来；决战时，他用一支带着白公鸡距的箭破了对手的魔法。这些当然是传说。","a":true,"pts":[["康加巴",-8.41,11.93]]},{"c":23,"y":1236,"cam":[-8.4,11.9,8],"t":"传说松迪亚塔胜利后在库鲁坎富加召集各部，宣布了一套规矩，后人称为《曼丁宪章》，讲到尊重生命、保障粮食、废止抢掠为奴等。它主要靠口头流传，原貌难以考证，二〇〇九年被列入联合国教科文组织的非物质文化遗产名录。","a":true,"pts":[["库鲁坎富加一带",-8.41,11.93]]},{"c":23,"y":1250,"cam":[29.24,-22.19,7],"t":"同一时期，往南几千公里，在今天南非北部的林波波河畔，兴起了马蓬古布韦王国。国王和贵族住在平顶山上，百姓住在山下，这是南部非洲已知最早的等级社会之一。山顶的王族墓里出土过一头小金犀牛，木头做芯，外面包着薄金片，只有手掌大小。","a":true,"pts":[["马蓬古布韦",29.24,-22.19]],"ar":[["马蓬古布韦王国",29.5,-22,1.5]]},{"c":23,"y":1270,"cam":[39,11,5],"t":"一二七〇年，埃塞俄比亚贵族耶库诺·阿姆拉克推翻扎格维王朝，开创了所罗门王朝。这个王朝自称是所罗门王和示巴女王的后代，也就是前面讲过的那个传说。历史学家认为这是政治神话，但这个王朝一直延续到一九七四年，最后一位皇帝是海尔·塞拉西。","pts":[["拉利贝拉",39.04,12.03]],"ar":[["埃塞俄比亚",39,11,3.5]]},{"c":23,"y":1300,"cam":[30.93,-20.27,8],"t":"马蓬古布韦衰落后，北边的大津巴布韦接过了接力棒。约十一世纪起，这里的人用花岗岩石块垒起高墙，不用一点灰浆，最大的围墙高约十一米、长约二百五十米。全盛时这里也许住着上万人。津巴布韦在当地的绍纳语里，大意是石头房子。","a":true,"pts":[["大津巴布韦",30.93,-20.27]],"ar":[["大津巴布韦",30.9,-20,2]]},{"c":23,"y":1300,"cam":[35,-15,3.2],"t":"大津巴布韦的财富来自牛群和黄金。黄金被运到海边的索法拉，再由斯瓦希里商人沿着海路北运。考古学家在大津巴布韦挖出过中国的瓷器、波斯和叙利亚的器物、玻璃珠，说明这座内陆石城和整个印度洋贸易网连在一起。","a":true,"pts":[["大津巴布韦",30.93,-20.27,"l"],["索法拉",34.72,-20.17,"b"],["基尔瓦",39.51,-8.96]],"rt":[[[30.93,-20.27],[32.5,-20.3],[34.7,-20.2],[35.6,-20.6],[37.6,-18.6],[41.2,-15.5],[41.3,-12],[40,-9.2]]]},{"c":23,"y":1300,"cam":[30.93,-20.27,6],"t":"可是到了殖民时代，很多欧洲人不愿相信大津巴布韦是非洲人建的。一八七一年，德国探险家毛赫猜它是示巴女王的宫殿；后来罗得西亚的白人政府还向考古学家施压。其实二十世纪初的科学发掘就已证明，它的建造者是当地绍纳人的祖先。","a":true,"pts":[["大津巴布韦",30.93,-20.27]]},{"c":23,"y":1300,"cam":[30.93,-20.27,9],"t":"遗址里出土过八只皂石雕刻的鸟。一八八九年，有一只被欧洲猎人凿下来，后来卖给了殖民者塞西尔·罗得斯。如今大多数石鸟已回到津巴布韦。一九八〇年独立的津巴布韦，国名就取自这座古城，石鸟也被画上了国旗和国徽。","a":true,"pts":[["大津巴布韦",30.93,-20.27]]},{"c":23,"y":1320,"cam":[38.72,14.13,7],"t":"约十四世纪初，阿克苏姆的一位教士用古老的吉兹语编成一部书，书名意思是《国王的荣耀》。它把示巴女王、所罗门王、孟尼利克和约柜的故事写成完整的史诗，为所罗门王朝的正统撑腰。直到今天，它仍被视为埃塞俄比亚的民族经典。","a":true,"pts":[["阿克苏姆",38.72,14.13]]},{"c":23,"y":1324,"cam":[-25,15,2.2],"t":"前面讲过曼萨·穆萨一三二四年在开罗撒金的事。他在开罗还讲过一个故事：前任国王不信大西洋没有尽头，先派四百条船出海，只回来一条；国王又亲率两千条船出发，从此杳无音讯，穆萨这才继位。这个故事只有一处记载，有人说他们到了美洲，但没有考古证据。","pts":[["塞内加尔河口",-16.5,16]],"rt":[[[-17,15.5],[-25,14],[-34,12.5],[-42,11]]],"rs":"d"},{"c":23,"y":1327,"cam":[-3,16.77,9],"t":"曼萨·穆萨朝圣归来，带回了学者，还有一位来自西班牙格拉纳达的诗人萨赫利。据记载，萨赫利替国王主持修建一座议事大厅，得到约五十公斤金沙的酬劳。廷巴克图的津加里贝尔清真寺也传说出自他手，这座以泥土为主建成的清真寺，至今已站了近七百年。","a":true,"pts":[["津加里贝尔清真寺",-3.01,16.77]]},{"c":23,"y":1331,"cam":[39.51,-8.96,8],"t":"东非海岸这边，斯瓦希里城邦正处在黄金时代。约一三三一年，伊本·白图泰来到基尔瓦，称赞它是世界上最美丽的城市之一。基尔瓦控制着南边索法拉的黄金贸易，苏丹在海边修了大宫殿，城里还铸造自己的钱币，一铸就是几百年。","a":true,"pts":[["基尔瓦",39.51,-8.96]]},{"c":23,"y":1331,"cam":[40,-4,4.5],"t":"从索马里南部到莫桑比克，一串港口连成了斯瓦希里海岸。斯瓦希里一词来自阿拉伯语的海岸。斯瓦希里语本身是班图语，又吸收了大量阿拉伯语词汇，今天有好几千万人使用。英语里指非洲观兽旅行的那个词萨法里，就来自斯瓦希里语的旅行。","a":true,"pts":[["拉穆",40.9,-2.27],["马林迪",40.12,-3.22],["蒙巴萨",39.67,-4.04,"l"],["桑给巴尔",39.19,-6.16,"l"]]},{"c":23,"y":1331,"cam":[88,-10,1.3],"t":"基尔瓦的铜币还留下一个谜。一九四四年，一名驻守澳大利亚北部马奇巴尔岛的雷达兵在海滩上捡到几枚古钱，后来认出其中有几枚是基尔瓦铸的铜币。它们是怎么漂过整个印度洋来到澳大利亚的，至今没有定论。","a":true,"pts":[["基尔瓦",39.51,-8.96,"l"],["马奇巴尔岛",136.6,-11.2]]},{"c":23,"y":1350,"cam":[5,7,6],"t":"西非南部的森林地带，约鲁巴人的圣城伊费出产写实的铜合金头像，五官匀称、神态安详，多数是约十二到十五世纪的作品。一九一〇年，德国学者弗罗贝尼乌斯见到这类作品，竟说是传说中亚特兰蒂斯的遗物。事实上，它们出自伊费本地的工匠之手。","a":true,"pts":[["伊费",4.56,7.47,"l"],["贝宁城",5.63,6.34]]},{"c":23,"y":1352,"cam":[-5,24,3.2],"t":"一三五二年，伊本·白图泰又从摩洛哥出发，穿越撒哈拉去马里。半路上他经过塔加扎盐矿，那里一棵树都没有，房子和清真寺都用盐块砌成，屋顶盖着骆驼皮。挖盐的是奴隶，吃的椰枣和粮食全靠外面运来，水还是咸的。","pts":[["西吉尔马萨",-4.27,31.28],["塔加扎盐矿",-5,23.6],["瓦拉塔",-7.03,17.3,"l"]],"rt":[[[-4.27,31.28],[-4.8,27.5],[-5,23.6],[-6,20.5],[-7,17.4]]]},{"c":23,"y":1352,"cam":[-6,14,4.5],"t":"到了马里，伊本·白图泰把尼日尔河当成了尼罗河。国王苏莱曼是曼萨·穆萨的弟弟，送来的见面礼只有面包、炸牛肉和一葫芦酸奶，让他大失所望，在游记里抱怨国王小气。不过他也承认，马里治安极好，旅人不必害怕强盗。","pts":[["廷巴克图",-3.01,16.77],["尼日尔河",-7.5,12.6,"b"]],"ar":[["马里帝国",-6,14,6]]},{"c":23,"y":1415,"cam":[70,10,1.7],"t":"后面讲郑和时，会说到一四一四年那头被当作麒麟的长颈鹿。这里先揭个底：据研究，它其实来自东非，马林迪的使节把长颈鹿带到孟加拉，转送给了中国人。第二年，又有一头长颈鹿从马林迪来到南京。郑和船队后来也到过这一带的东非海岸。","pts":[["马林迪",40.12,-3.22],["榜葛剌",90.4,23.7],["南京",118.78,32.06]],"rt":[[[40.12,-3.22],[48,3],[55,8],[65,10],[75,6],[81,5.5],[85,12],[89,20.8]]]},{"c":23,"y":1468,"cam":[-2,16,4.5],"t":"十五世纪，马里逐渐衰落，尼日尔河中游的桑海崛起，都城在加奥。国王索尼·阿里善用骑兵和河上船队，约一四六八年拿下廷巴克图。廷巴克图的学者们很讨厌他，在编年史里把他写成暴君，也有现代学者认为，这样的评价带着偏见。","a":true,"pts":[["加奥",-0.04,16.27],["廷巴克图",-3.01,16.77,"l"]],"ar":[["桑海",-1,16,4]]},{"c":23,"y":1473,"cam":[-4.56,13.91,9],"t":"索尼·阿里接着围攻杰内，传说围了七年七个月零七天，城里断粮才投降。杰内就在前面讲过的杰内-杰诺古城旁边。今天的杰内大清真寺建于一九〇七年，常被称为世界上最大的土坯建筑，墙上插满棕榈木棍，既是装饰，也是脚手架。","pts":[["杰内",-4.56,13.91]]},{"c":23,"y":1473,"cam":[-4.56,13.91,10],"t":"土坯怕雨，每到雨季，墙上的泥就会被冲掉一层。所以每年全城的人都要一起出动，有人和泥，有人运水，有人爬上木棍往墙上抹，把整座清真寺重新糊一遍。这件苦差事，硬是被办成了全城最热闹的节日。","a":true,"pts":[["杰内大清真寺",-4.56,13.91]]},{"c":23,"y":1493,"cam":[-0.04,16.27,7],"t":"一四九三年，将军穆罕默德夺取王位，史称阿斯基亚大帝。他一四九六年去麦加朝圣，回国后推行伊斯兰教法，设立各级官员，统一度量衡。桑海一度有一百多万平方公里，是非洲历史上最大的帝国之一。他在加奥的金字塔形土坯陵墓高约十七米。","pts":[["加奥",-0.04,16.27]],"ar":[["桑海帝国",-2,16,7]]},{"c":23,"y":1505,"cam":[40,-6.5,4.5],"t":"东非海岸的命运也在改变。后面讲大航海时还会说到，达伽马正是在马林迪找到领航员去的印度。一五〇五年，葡萄牙舰队攻下并洗劫了基尔瓦和蒙巴萨，想独占印度洋的贸易。斯瓦希里城邦从此走向衰落，基尔瓦如今只剩下海岛上的珊瑚石废墟。","pts":[["基尔瓦",39.51,-8.96,"l"],["蒙巴萨",39.67,-4.04,"l"],["马林迪",40.12,-3.22]]},{"c":23,"y":1510,"cam":[-3,16.77,8],"t":"桑海时代的廷巴克图是学者云集的地方，围绕桑科雷等清真寺有很多学校。约一五一〇年，一位在摩洛哥长大的年轻人到过这里，他就是后来的利奥·阿非利加努斯。他在书里写道，在廷巴克图，卖书比卖别的货物都赚钱。","a":true,"pts":[["廷巴克图",-3.01,16.77],["桑科雷清真寺",-3,16.78,"t"]]},{"c":23,"y":1510,"cam":[-5,15,5],"t":"廷巴克图留下了几十万份手稿，从天文、医学到法律、诗歌都有。二〇一二年极端武装占领这座城，图书管理员海达拉等人把三十多万份手稿装进两千多只铁皮箱，冒险偷运到首都巴马科。可惜仍有几千份手稿被焚毁。","a":true,"pts":[["廷巴克图",-3.01,16.77],["巴马科",-8,12.64]],"rt":[[[-3.01,16.77],[-4.2,14.5],[-6.2,13.4],[-8,12.65]]]},{"c":23,"y":1520,"cam":[39,12,5],"t":"欧洲人长期相信东方有一位基督教国王，叫祭司王约翰，后来认定他就在埃塞俄比亚。一五二〇年，葡萄牙使团终于到达。随团神父阿尔瓦雷斯参观了拉利贝拉的岩凿教堂，在书里写道：我不想再写这些建筑了，因为再写下去，恐怕没人会信。","pts":[["拉利贝拉",39.04,12.03],["马萨瓦",39.45,15.61]]},{"c":23,"y":1526,"cam":[14,-6,6],"t":"非洲中西部的刚果王国约在十四世纪末兴起。一四八三年葡萄牙船只到来，一四九一年刚果国王受洗。国王阿方索一世笃信基督教，一个儿子还当上了主教。但葡萄牙商人大肆贩卖人口，一五二六年，阿方索写信给葡萄牙国王抗议：商人每天都在绑走我们的人。","pts":[["姆班扎刚果",14.25,-6.27]],"ar":[["刚果王国",14.5,-6,2.5]]},{"c":23,"y":1591,"cam":[-3,23,2.6],"t":"一五九〇年，摩洛哥苏丹曼苏尔误以为桑海的财富来自金矿，派约四千人的军队穿越撒哈拉，很多士兵带着火绳枪，还拖着几门大炮。一五九一年三月，两军在加奥以北的通迪比交战。桑海军队人数多得多，却没有火器。","pts":[["马拉喀什",-7.99,31.63],["塔加扎",-5,23.6,"l"],["通迪比",-0.17,16.6]],"rt":[[[-7.99,31.63],[-6,28],[-5,23.6],[-3,20],[-1,17.5],[-0.2,16.7]]]},{"c":23,"y":1591,"cam":[-0.2,16.5,7],"t":"桑海人把上千头牛赶向敌阵，想冲散对方，结果枪炮一响，牛群掉头冲进了自己的队伍。战斗只打了大约两个小时，桑海大败，加奥、廷巴克图和杰内相继被洗劫。可摩洛哥管不住这片辽阔的土地，西非从此分裂成许多小国。","pts":[["通迪比",-0.17,16.6],["加奥",-0.04,16.27]]},{"c":23,"y":1591,"cam":[20,3,1.4],"t":"从加纳、马里到桑海，从斯瓦希里海岸、大津巴布韦到埃塞俄比亚，中世纪的非洲有黄金，有学问，也有连通世界的贸易网。通迪比之战的第二年，地球另一边的丰臣秀吉出兵朝鲜，后面会讲到。下一章，镜头北上，去看从基辅到莫斯科的罗斯。","ar":[["加纳",-8,15.5,3],["马里",-6,13.5,3.5],["桑海",-1,16,3],["斯瓦希里海岸",40,-5,3],["大津巴布韦",31,-20,2.5],["埃塞俄比亚",39,11,3]]},{"c":24,"y":850,"cam":[34,55,2.6],"t":"这一章，镜头来到东欧平原。北边是望不到头的森林，南边是草原，第聂伯河、伏尔加河等大河穿行其间。九世纪时，这里住着东斯拉夫人，还有说芬兰语和波罗的语的部落。今天的乌克兰、白俄罗斯和俄罗斯，都把接下来要讲的基辅罗斯看作自己历史的源头。","a":true,"pts":[["基辅",30.52,50.45],["诺夫哥罗德",31.27,58.52]],"ar":[["东欧平原",35,54,10]]},{"c":24,"y":850,"cam":[30,51,3.4],"t":"前面讲维京人时提过，他们沿河南下，这里来细看这条「从瓦良格到希腊之路」。船从波罗的海进入涅瓦河和拉多加湖，经诺夫哥罗德逆流而上，在两条河之间把船拖过陆地，再顺第聂伯河南下，穿过黑海，直抵君士坦丁堡。","a":true,"pts":[["诺夫哥罗德",31.27,58.52],["基辅",30.52,50.45],["君士坦丁堡",28.98,41.01,"l"]],"rt":[[[24,59.8],[28,60.1],[30.3,59.95],[31.1,59.95],[31.9,60.15],[32.3,60],[31.6,59.1],[31.27,58.52],[31.4,57.6],[31.1,56.5],[32.05,54.78],[30.4,54.5],[30.35,53.9],[30.4,52.4],[30.66,51.7],[30.52,50.45],[31.8,49.6],[33.4,49.07],[35,48.45],[35.1,47.8],[33.5,46.8],[31.6,46.5],[30.8,45.6],[29.9,44.5],[29,43.2],[28.8,42],[29.1,41.25],[28.98,41.05]]]},{"c":24,"y":862,"cam":[32,59.3,6],"t":"据十二世纪初编成的《往年纪事》记载，八六二年，北方几个斯拉夫和芬兰部落内斗不休，于是请来瓦良格人留里克，对他说：「我们的土地辽阔富饶，却没有秩序，请来统治我们吧。」这个故事传说色彩很浓，留里克本人的身世，学界也一直有争论。","pts":[["旧拉多加",32.3,60],["诺夫哥罗德",31.27,58.52]]},{"c":24,"y":863,"cam":[22,46,4.5],"t":"就在留里克传说的第二年，八六三年，拜占庭派西里尔和美多德两兄弟到中欧的大摩拉维亚传教，他们为斯拉夫语创制了格拉哥里字母。后来，他们的弟子在保加利亚以希腊字母为基础发展出新字母，为纪念老师，称为西里尔字母。一百多年后，它随着基督教来到罗斯。","pts":[["大摩拉维亚",17.39,49.1,"l"],["普雷斯拉夫",26.83,43.16],["君士坦丁堡",28.98,41.01,"b"]]},{"c":24,"y":882,"cam":[31,54.5,3.6],"t":"编年史接着说，八八二年，留里克的亲属奥列格带兵南下，拿下斯摩棱斯克，又用计骗出统治基辅的两位首领，杀了他们，占据基辅，宣布它是「罗斯众城之母」。从此北方的诺夫哥罗德和南方的基辅连成一线，十九世纪的史学家把这个国家叫作基辅罗斯。","pts":[["诺夫哥罗德",31.27,58.52],["斯摩棱斯克",32.05,54.78],["基辅",30.52,50.45]],"rt":[[[31.27,58.52],[31.4,57.6],[31.1,56.5],[32.05,54.78],[30.4,54.5],[30.35,53.9],[30.4,52.4],[30.66,51.7],[30.52,50.45]]]},{"c":24,"y":907,"cam":[30,45,3.8],"t":"编年史说，九〇七年，奥列格率船队远征君士坦丁堡，给船装上轮子，扬帆从陆地上冲向城下，还把自己的盾牌钉在了城门上。这些情节多半是民间传说，但罗斯与东罗马签订的条约是真的，九一一年那份条约的文本就抄在编年史里。","pts":[["基辅",30.52,50.45],["君士坦丁堡",28.98,41.01]],"rt":[[[30.52,50.45],[31.8,49.6],[33.4,49.07],[35,48.45],[35.1,47.8],[33.5,46.8],[31.6,46.5],[30.8,45.6],[29.9,44.5],[29,43.2],[28.8,42],[29.1,41.25],[28.98,41.05]]]},{"c":24,"y":922,"cam":[44,46,2.2],"t":"同一时期，另一个文明也在打量罗斯人。九二一年，巴格达的哈里发派使团去伏尔加河的保加尔人那里，随行的伊本·法德兰见到了在河边做生意的罗斯商人。他写道，从没见过体格这么完美的人，个个高得像椰枣树，还详细记录了一场罗斯首领的船葬。","pts":[["巴格达",44.36,33.31],["保加尔（伏尔加河）",49.06,54.98]],"rt":[[[44.36,33.31],[48,36],[51.4,35.7],[57,37.5],[61.8,37.6],[64.4,39.8],[60.6,41.5],[55,45],[51.5,48.5],[49.06,54.98]]]},{"c":24,"y":945,"cam":[29.5,50.7,7],"t":"奥列格之后，伊戈尔做了基辅的王公。九四五年，他向德列夫利安部落收贡，嫌少又回头再收，被愤怒的部落杀死。妻子奥尔加替年幼的儿子掌权。编年史说她接连设计诛杀使者，最后围城时向每户只要三只鸽子、三只麻雀，再让鸟带着点燃的硫磺飞回巢中，全城起火。","pts":[["伊斯科罗斯坚",28.65,50.95,"l"],["基辅",30.52,50.45]]},{"c":24,"y":957,"cam":[30,46,3.4],"t":"这些复仇故事未必都是史实，带着浓厚的传说色彩。奥尔加更实在的功绩，是整顿贡赋，设立固定的收贡点。约九五七年，她访问君士坦丁堡，受洗成为基督徒，教名叶莲娜。但她的儿子斯维亚托斯拉夫拒绝受洗，据说是怕手下的亲兵笑话他。","a":true,"pts":[["基辅",30.52,50.45],["君士坦丁堡",28.98,41.01]]},{"c":24,"y":964,"cam":[36,52,3.4],"t":"斯维亚托斯拉夫是个纯粹的武人。编年史说他行军不带大车和锅，把肉切成薄片放在炭火上烤，睡觉时铺马毯、枕马鞍。他出兵前还会先派人通知对方：「我要来攻打你们了！」这句话至今还活在俄语和乌克兰语里，意思是「我要动手了，先打声招呼」。","a":true,"pts":[["基辅",30.52,50.45]],"ar":[["维亚季奇人",37,54,2.5]]},{"c":24,"y":965,"cam":[38,47,4.2],"t":"约九六五年，他东征可萨汗国，攻破顿河边的萨克尔要塞，几年内又拿下了可萨的都城。称雄草原西部约三百年的可萨汗国从此瓦解。他还打到巴尔干，想把都城迁到多瑙河边，被东罗马击退。九七二年回国途中，他在第聂伯河险滩遭佩切涅格人伏击身亡。","a":true,"pts":[["萨克尔",42.1,47.7],["阿的尔（可萨都城）",47.9,46.4,"b"],["基辅",30.52,50.45,"l"]],"ar":[["可萨汗国",44,47,5]]},{"c":24,"y":986,"cam":[35,47,2.2],"t":"斯维亚托斯拉夫的儿子弗拉基米尔夺得大位。据《往年纪事》记载，九八六年起，伏尔加河的保加尔人、德意志人、可萨的犹太人和希腊人先后来劝他改信自己的宗教。这就是有名的「挑选宗教」故事，学者普遍认为它经过了编年史家的加工。","pts":[["基辅",30.52,50.45],["保加尔（伏尔加河）",49.06,54.98],["罗马",12.5,41.9,"l"],["君士坦丁堡",28.98,41.01,"b"]]},{"c":24,"y":987,"cam":[28.98,41.01,9],"t":"故事里，听说伊斯兰教要求戒酒，弗拉基米尔说：「喝酒是罗斯人的快乐，没有这份乐趣我们活不下去。」后来他派使者出国考察。使者回来说，在君士坦丁堡的圣索菲亚大教堂里做礼拜时，「我们不知道自己是在天上，还是在人间」。","pts":[["圣索菲亚大教堂",28.98,41.01]]},{"c":24,"y":988,"cam":[31.5,47,4.2],"t":"真实的历史还有政治算盘。约九八八年，东罗马皇帝巴西尔二世遭遇叛乱，向弗拉基米尔求援。弗拉基米尔派去六千名战士，这一般被看作瓦良格卫队的开端。条件是他迎娶皇帝的妹妹安娜，并且受洗。回到基辅，他把雷神庇隆的神像扔进第聂伯河，让市民在河里集体受洗。罗斯从此进入拜占庭东正教的文化圈。","pts":[["赫尔松涅斯",33.49,44.61,"b"],["基辅",30.52,50.45]],"rt":[[[30.52,50.45],[31.8,49.6],[33.4,49.07],[35,48.45],[34.5,47.5],[33.8,46.5],[33.7,46.15],[33.9,45.3],[33.6,44.8],[33.49,44.65]]]},{"c":24,"y":1037,"cam":[30.52,50.45,9],"t":"弗拉基米尔死后，儿子们为争位互相残杀，最后智者雅罗斯拉夫胜出。他仿照君士坦丁堡，在基辅修建了金门和圣索菲亚大教堂。教堂里至今保存着大片十一世纪的马赛克和壁画，墙上还有七千多处古人留下的刻字和涂鸦，其中一条记下了雅罗斯拉夫的去世。","pts":[["圣索菲亚大教堂",30.514,50.453],["金门",30.513,50.449,"l"]]},{"c":24,"y":1040,"cam":[30.52,50.45,6],"t":"雅罗斯拉夫还颁布了东斯拉夫人最早的成文法典，后人称为《罗斯法典》。它限制血亲复仇，没有死刑和肉刑，过错多用银锭格里夫纳来罚：擅自骑别人的马，罚三个；砍掉别人一根手指，也罚三个；剪掉别人的胡子，却要罚十二个。","a":true,"pts":[["基辅",30.52,50.45],["诺夫哥罗德",31.27,58.52]]},{"c":24,"y":1051,"cam":[15,54,3],"t":"雅罗斯拉夫有「欧洲的岳父」之称。一个女儿嫁给后来的匈牙利国王；一个嫁给挪威的哈拉尔，就是一〇六六年战死在斯坦福桥的那位；女儿安娜一〇五一年嫁给法国国王亨利一世。一份法国王室文书上，还留着一行西里尔字母的签名，一般认为写的是「安娜王后」。","pts":[["基辅",30.52,50.45],["巴黎",2.35,48.86,"l"],["挪威",10.4,63.43],["匈牙利",18.74,47.79,"b"]]},{"c":24,"y":1097,"cam":[33,53,3.4],"t":"雅罗斯拉夫死后，王位在兄弟叔侄之间轮流传递，结果亲戚们打成一团。一〇九七年，王公们在柳别奇开会，约定各自守住父辈传下的领地。纷争暂时平息了，罗斯却从此逐渐分成许多各自为政的公国，基辅的分量也越来越轻。","pts":[["柳别奇",30.66,51.7,"l"],["基辅",30.52,50.45,"l"],["诺夫哥罗德",31.27,58.52],["弗拉基米尔",40.4,56.13]],"ar":[["基辅罗斯",33,54,7]]},{"c":24,"y":1136,"cam":[31.27,58.52,7],"t":"北方的诺夫哥罗德走了一条不同的路。一一三六年起，这里由市民大会「维彻」决定请哪位王公、赶走哪位王公，城市自称「诺夫哥罗德大君主」，不过会上说了算的多是大贵族。它靠北方森林的毛皮致富，是汉萨同盟最东边的贸易站，德意志商人在这里设有商馆。","pts":[["诺夫哥罗德",31.27,58.52]]},{"c":24,"y":1147,"cam":[38.5,55.9,6],"t":"一一四七年，一个叫莫斯科的小地方第一次出现在编年史里。苏兹达尔王公尤里，外号「长手」，邀请一位盟友：「兄弟，到我这儿来，到莫斯科来。」客人来了，第二天他摆下盛宴。谁也想不到，这个边境小镇日后会成为一个大国的都城。","pts":[["莫斯科",37.62,55.75],["弗拉基米尔",40.4,56.13]]},{"c":24,"y":1200,"cam":[31.27,58.52,9],"t":"诺夫哥罗德的湿黏土留下了一份珍贵的礼物。一九五一年七月二十六日，考古队在这里挖出第一封桦树皮文书，此后这里已出土一千一百多件，多是十一到十五世纪普通人写的：催债、做买卖、家长里短。有一封信说：「把房子卖了，到斯摩棱斯克或基辅来吧，这边面包便宜。」","a":true,"pts":[["诺夫哥罗德",31.27,58.52]]},{"c":24,"y":1230,"cam":[31.27,58.52,10],"t":"最可爱的作者是一个叫翁菲姆的男孩，生活在十三世纪中叶，当时大约六七岁。他在桦树皮上练字母、抄诗篇，抄着抄着就画起了画：一位骑马的武士用长矛刺倒敌人，旁边写着自己的名字；另一张把自己画成了一头野兽。八百年后，这些作业成了研究中世纪儿童的宝贵资料。","a":true,"pts":[["翁菲姆的桦树皮",31.28,58.52]]},{"c":24,"y":1237,"cam":[37,53.5,3.6],"t":"然后，蒙古大军从草原上来了。前面讲过蒙古西征，这里换成罗斯的视角。一二三七年冬，拔都的大军攻破梁赞；次年二月攻破弗拉基米尔，大公一家死在大火中。小城科泽利斯克坚守了七个星期。北方的诺夫哥罗德提前表示臣服，躲过了一劫。","pts":[["梁赞",40.11,54.5],["弗拉基米尔",40.4,56.13],["科泽利斯克",35.77,54.03,"l"],["基辅",30.52,50.45,"l"]],"rt":[[[40.11,54.5],[40.4,56.13],[37.6,55.6],[35.77,54.03]],[[35.77,54.03],[33.5,52.5],[31.3,51.5],[30.52,50.45]]]},{"c":24,"y":1240,"cam":[30.52,50.45,8],"t":"一二四〇年十二月六日，基辅陷落。许多市民躲进什一教堂，教堂的一部分在人群的重压下坍塌。六年后，教皇的使者柏朗嘉宾路过这里，记载说地上到处是头骨和白骨，城里只剩下约两百户人家。不过，学者对这段记载的可靠程度也有讨论。","pts":[["基辅",30.52,50.45]]},{"c":24,"y":1240,"cam":[29,59,5],"t":"就在同一年，诺夫哥罗德的年轻王公亚历山大在涅瓦河边击败瑞典人，后来得名「涅夫斯基」。一二四二年，他又在冰封的楚德湖上击败立窝尼亚骑士团。不少学者认为，这两仗的规模都不大；骑士们压破冰面落水的名场面，主要来自一九三八年的一部电影。","pts":[["涅瓦河",30.6,59.81],["楚德湖",27.5,58.7,"l"],["诺夫哥罗德",31.27,58.52]]},{"c":24,"y":1243,"cam":[42,51,3],"t":"此后两百多年，罗斯各公国向金帐汗国称臣纳贡。汗国的都城萨莱在伏尔加河下游，罗斯王公得从大汗那里拿到许可状，才能名正言顺地统治。亚历山大·涅夫斯基对东方很务实，接受了蒙古的宗主权，替汗国收贡，后来在从萨莱回来的路上去世。","a":true,"pts":[["萨莱",47,46.6],["弗拉基米尔",40.4,56.13],["莫斯科",37.62,55.75,"l"]],"ar":[["金帐汗国",50,48,8]]},{"c":24,"y":1253,"cam":[27,51.5,3.6],"t":"罗斯的西南部和西部，又是另一番局面。加利奇-沃伦的王公丹尼洛一二五三年由教皇使节加冕为国王，还建了以儿子列夫命名的利沃夫城。十四世纪，立陶宛大公国逐步并入大片罗斯土地，连基辅也在其中，它的公文用的是当地的罗斯书面语。","pts":[["利沃夫",24.03,49.84,"l"],["维尔纽斯",25.28,54.69],["基辅",30.52,50.45]],"ar":[["立陶宛大公国",27,53,5]]},{"c":24,"y":1325,"cam":[37,56,5],"t":"莫斯科的崛起，靠的是精明。伊凡一世外号「钱袋」，他替金帐汗国向各公国收贡，自己也攒下不少家底。一三二七年邻居特维尔爆发反蒙古起义，他带着蒙古军队去镇压，随后拿到了大公头衔。罗斯教会的首领都主教，也在这时把驻地搬到了莫斯科。","pts":[["莫斯科",37.62,55.75],["特维尔",35.9,56.86,"l"],["弗拉基米尔",40.4,56.13]]},{"c":24,"y":1380,"cam":[38,54.6,5.5],"t":"一三八〇年九月八日，莫斯科大公德米特里在顿河上游的库利科沃原野击败金帐汗国的权臣马麦，因此得名「顿斯科伊」。可两年后，新的大汗脱脱迷失就攻破并烧了莫斯科，罗斯只得继续纳贡。不过这一仗让人们看到，金帐汗国并非不可战胜。","pts":[["库利科沃原野",38.66,53.65],["莫斯科",37.62,55.75,"l"]],"rt":[[[37.62,55.75],[38.78,55.1],[38.7,54.3],[38.66,53.75]]]},{"c":24,"y":1411,"cam":[38.13,56.31,8],"t":"莫斯科东北的森林里，修士谢尔盖曾和哥哥搭起一座献给圣三一的小木教堂，后来发展成圣三一修道院。为了纪念他，修士画家鲁布廖夫画了圣像《圣三一》：三位天使围坐桌边，宁静柔和。同一时期，郑和的船队正在印度洋上航行，下一章会讲到。","a":true,"pts":[["圣三一修道院",38.13,56.31]]},{"c":24,"y":1472,"cam":[26,49,3.2],"t":"一四七二年，莫斯科大公伊凡三世迎娶了索菲娅。她是拜占庭末代皇帝君士坦丁十一世的侄女，在罗马长大。教皇促成这门亲事，本想借此拉近东西两个教会，结果落了空。此后，拜占庭的双头鹰出现在了莫斯科大公的印章上。","pts":[["罗马",12.5,41.9,"l"],["莫斯科",37.62,55.75]],"rt":[[[12.5,41.9],[11.5,46],[12.5,50],[17,52.4],[21,52.2],[27,54],[32,54.8],[37.62,55.75]]]},{"c":24,"y":1478,"cam":[35,57,4],"t":"伊凡三世把周边的罗斯公国一个个收拢。一四七八年，他吞并诺夫哥罗德，废除市民大会，连召集会议的大钟都运到了莫斯科。他又请来意大利建筑师重建克里姆林宫，今天克里姆林宫的城墙和许多塔楼，就是一四八五年起由意大利人主持修建的。","pts":[["诺夫哥罗德",31.27,58.52],["莫斯科",37.62,55.75]],"rt":[[[31.27,58.52],[33,57.8],[35.9,56.86],[37.62,55.75]]]},{"c":24,"y":1480,"cam":[36.2,55,6],"t":"一四八〇年秋，大帐汗阿合马率军北上，要伊凡三世继续纳贡。两军隔着乌格拉河对峙了一个多月。阿合马等的立陶宛援军始终没来，天冷了，河快封冻，双方几乎没怎么交手就各自撤兵。传统上，这被看作「鞑靼之轭」结束的标志，也有学者认为它的意义被夸大了。","pts":[["乌格拉河",35.9,54.6,"l"],["莫斯科",37.62,55.75]]},{"c":24,"y":1523,"cam":[34,52,4.5],"t":"十六世纪二十年代，普斯科夫的修士菲洛费写道：「两个罗马已经倒下，第三个屹立，不会有第四个。」莫斯科是「第三罗马」的说法由此流传。从基辅到莫斯科，罗斯走了六百多年。至于第二个罗马怎么倒下，我们先把时钟拨回十五世纪初，从郑和的船队讲起。","a":true,"pts":[["普斯科夫",28.33,57.82,"l"],["莫斯科",37.62,55.75],["基辅",30.52,50.45,"l"]]},{"c":25,"y":1405,"cam":[90,8,2.2],"t":"一千四百零五年，明成祖朱棣派郑和率船队下西洋。第一次出航就有两百多艘船、两万七千多人。据记载，最大的宝船长四十四丈，换算下来超过一百米，不过学界对这个尺寸争论很大。郑和前后七次出海，最远到达东非沿岸。","pts":[["南京",118.78,32.06],["马六甲",102.25,2.2],["古里（卡利卡特）",75.78,11.25,"l"],["忽鲁谟斯",56.45,27.1,"l"],["马林迪",40.1,-3.2,"l"]],"rt":[[[121.2,31.6],[122,28],[119.6,25.9],[116,21.5],[110,15],[108.5,11],[105,5],[102.3,2.2],[98,5],[92,6],[81,6.5],[77,8],[75.8,11.2],[68,17],[60,22.5],[56.5,26.8]],[[75.8,11.2],[65,5],[52,0],[45,-2],[40.2,-3.2]]]},{"c":25,"y":1414,"cam":[100,20,3],"t":"郑和船队带回了各国使节和奇珍异兽，最轰动的是一千四百一十四年从榜葛剌，也就是孟加拉来的长颈鹿。朝廷上下把它当成了传说中的瑞兽麒麟，还专门画了《瑞应麒麟图》。顺便说一句，今天日语和韩语里的长颈鹿，仍然叫麒麟。","pts":[["榜葛剌（孟加拉）",90.4,23.7],["北京",116.4,39.9]],"rt":[[[90.4,22.5],[92,16],[96,8],[102,3],[106,8],[110,16],[115,22],[120,28],[121.5,32],[119.5,36.5],[117.5,38.8]]]},{"c":25,"y":1433,"cam":[116.4,39.9,9],"t":"一千四百三十三年第七次下西洋结束后，明朝再没组织过这样的远航。有人说是耗费太大，有人说是朝廷政策转向，学界看法不一。同一时期，永乐皇帝迁都北京，紫禁城在一千四百二十年建成。几十年后，欧洲人的小船却开始往外闯了。","pts":[["北京紫禁城",116.4,39.92]]},{"c":25,"y":1453,"cam":[29,41,10],"t":"一千四百五十三年，二十一岁的奥斯曼苏丹穆罕默德二世围攻君士坦丁堡。他用巨炮轰击千年城墙，还让士兵把战船从陆地上拖过山坡，绕开封锁金角湾的铁链。五月二十九日，城破，东罗马帝国灭亡。从四百七十六年算起，东罗马又多撑了九百七十七年。","pts":[["君士坦丁堡",28.98,41.01,"l"],["金角湾",28.97,41.03,"t"]]},{"c":25,"y":1453,"cam":[29,41,6],"t":"历史有时像是刻意安排好的。为这座城命名的皇帝叫君士坦丁，母亲叫海伦娜；最后一位皇帝也叫君士坦丁，母亲也叫海伦娜。君士坦丁堡后来成为奥斯曼帝国的首都，今天叫伊斯坦布尔，依然是欧亚之间最重要的门户之一。","pts":[["伊斯坦布尔",28.98,41.01]]},{"c":25,"y":1455,"cam":[8,50,6],"t":"几乎同一时间，德国美因茨的古登堡把金属活字、油性墨水和压印机结合起来。约一千四百五十五年，他印出了著名的古登堡圣经，大约一百五十到一百八十本。印刷术迅速传遍欧洲，到一千五百年，欧洲已经印出了上千万册书。知识第一次可以批量复制了。","a":true,"pts":[["美因茨",8.27,50]]},{"c":25,"y":1446,"cam":[123,36,6],"t":"说到印刷，东亚其实走得更早。除了宋朝的毕昇，高丽在一千三百七十七年用金属活字印出了《直指》，是现存最早的金属活字印本。一千四百四十六年，朝鲜世宗大王颁布训民正音，也就是今天的韩文字母，目的是让普通百姓也能读写。","pts":[["汉阳（首尔）",126.98,37.57],["清州（《直指》）",127.49,36.64,"b"]]},{"c":25,"y":1436,"cam":[11.3,43.8,10],"t":"这一时期，意大利的佛罗伦萨富得流油，银行家美第奇家族大把赞助艺术家。一千四百三十六年，布鲁内莱斯基设计的大教堂穹顶完工，施工时没有搭常规的木质拱架。人们重新研读古希腊罗马的作品，把目光从天堂转向人间，这就是文艺复兴。","pts":[["佛罗伦萨",11.26,43.77]]},{"c":25,"y":1508,"cam":[-30,25,1.2],"t":"达·芬奇是画家、工程师和解剖学家，他的笔记用镜像文字书写，要对着镜子才好读。米开朗基罗在一千五百零四年完成了大卫像，又在一千五百零八年到一千五百一十二年间仰着头画完了西斯廷礼拜堂天顶画。而在大西洋彼岸，阿兹特克和印加正处于鼎盛。","pts":[["佛罗伦萨",11.26,43.77],["罗马",12.5,41.9,"b"],["特诺奇蒂特兰",-99.13,19.43],["库斯科",-71.97,-13.53]]},{"c":26,"y":1150,"cam":[-86,4,1.5],"t":"这一章，镜头再次越过大西洋，回到美洲。约一一五〇年前后，墨西哥高原上托尔特克人的都城图拉衰落了。后来的阿兹特克人把托尔特克人奉为文明的祖师，在他们的语言里，托尔特克一词渐渐成了能工巧匠的意思。此时，美洲还没有统一的大国。","a":true,"pts":[["图拉",-99.34,20.06],["库斯科",-71.97,-13.53]],"ar":[["墨西哥高原",-99,19.5,4],["安第斯山区",-73,-12,6]]},{"c":26,"y":1150,"cam":[-102,21.5,5],"t":"现在登场的是墨西加人。据他们自己的传说，祖先来自北方一个叫阿兹特兰的地方，在战神的指引下南迁，一走就是近两百年。阿兹特兰在哪里、是否真的存在，至今没有定论。他们自称墨西加人，阿兹特克这个叫法，是十八、十九世纪的学者从阿兹特兰一词推广开的。","a":true,"pts":[["墨西哥谷地",-99.13,19.43]],"rt":[[[-105.5,23.5],[-104,22.2],[-102.5,21.3],[-101,20.5],[-99.8,19.9],[-99.13,19.43]]],"rs":"d"},{"c":26,"y":1200,"cam":[-78.5,-8,5],"t":"同一时期，南美洲秘鲁北部的沙漠海岸上，奇穆王国正在兴起。传说开国之君乘着筏子从海上漂来。奇穆人一条河谷一条河谷地向外扩张，鼎盛时控制了约一千公里长的海岸线，是印加崛起之前安第斯地区最强大的国家。","a":true,"pts":[["昌昌",-79.07,-8.11]],"ar":[["奇穆王国",-79.2,-7.5,3.2]]},{"c":26,"y":1200,"cam":[-79.07,-8.11,10],"t":"奇穆的都城昌昌全用土坯建成，全城约二十平方公里，被联合国教科文组织称为前哥伦布时代美洲最大的土城。城中有九到十座高墙围起的宫殿大院，学者推测每位国王都给自己另建一座，死后就葬在里面。宫殿变成了陵墓，新王只好再盖一座。","a":true,"pts":[["昌昌",-79.07,-8.11]],"ar":[["昌昌城址",-79.07,-8.11,0.04]]},{"c":26,"y":1200,"cam":[-70.6,-14.8,5.5],"t":"再往南，安第斯山中的库斯科谷地，约一二〇〇年前后出现了一个小城邦，这就是后来的印加。传说太阳神的儿女从的的喀喀湖中走出，手持金杖一路北行，金杖插进土里一下子沉没的地方，就是库斯科。另一种版本说，他们是从山洞里走出来的。","a":true,"pts":[["的的喀喀湖",-69.17,-16.02],["库斯科",-71.97,-13.53]],"rt":[[[-69.17,-16.02],[-70,-15.5],[-70.9,-14.7],[-71.4,-14.1],[-71.97,-13.53]]],"rs":"d"},{"c":26,"y":1280,"cam":[-108.47,37.17,8],"t":"北美洲西南部，普韦布洛人的祖先这时把村子搬进了悬崖下的岩洞。科罗拉多州梅萨维德的悬崖宫有约一百五十个房间，是北美最大的悬崖住宅。约一二七六年起，一场二十多年的大旱降临，到一三〇〇年前后，这里人去楼空。","a":true,"pts":[["悬崖宫",-108.47,37.17]]},{"c":26,"y":1299,"cam":[-99.14,19.42,9],"t":"墨西加人是最后一批来到墨西哥谷地的移民，湖边的好地方早被人占光了。他们先在查普尔特佩克山落脚，一二九九年被周边城邦联手赶走，只好去给库尔瓦坎当附庸，住在一片贫瘠的荒地上。谁也没想到，这群寄人篱下的外来户，日后会成为整个谷地的主人。","pts":[["查普尔特佩克",-99.18,19.42,"l"],["库尔瓦坎",-99.11,19.33],["阿斯卡波察尔科",-99.18,19.48,"l"]],"ar":[["特斯科科湖",-99.03,19.45,0.12]]},{"c":26,"y":1325,"cam":[-99.13,19.43,10],"t":"传说战神曾告诉他们：看到一只老鹰站在仙人掌上吃蛇，那里就是新家。约一三二五年，他们在特斯科科湖西部的一个沼泽小岛上看到了这一幕，建起了特诺奇蒂特兰。今天墨西哥国旗正中，画的就是这只站在仙人掌上、叼着蛇的鹰。","pts":[["特诺奇蒂特兰",-99.13,19.43]]},{"c":26,"y":1325,"cam":[10,28,1],"t":"就在同一年，前面讲过的伊本·白图泰从摩洛哥的丹吉尔出发，开始他长达近三十年的远游；一年前，马里国王曼萨·穆萨刚在开罗撒过金子；中国这边，正是元朝。旧大陆各地的人彼此打听着消息，却没有人知道，大洋彼岸的湖上多了一座小城。","pts":[["特诺奇蒂特兰",-99.13,19.43],["丹吉尔",-5.8,35.77,"l"],["开罗",31.24,30.04],["大都",116.4,39.9]]},{"c":26,"y":1350,"cam":[-99.1,19.3,9.5],"t":"小岛太小，墨西加人就向湖里要地。他们在浅水中打下木桩、编好围栏，填进湖泥和水草，堆出一条条长方形的人工田，叫奇南帕。它常被叫作浮园，其实并不会漂。这种田据说一年最多能收七季。今天墨西哥城南的霍奇米尔科，还能看到它们。","a":true,"pts":[["特诺奇蒂特兰",-99.13,19.43],["霍奇米尔科",-99.1,19.26]]},{"c":26,"y":1428,"cam":[-99.05,19.48,8.5],"t":"此后几十年，墨西加人一直是湖西岸强国阿斯卡波察尔科的附庸，年年纳贡。一四二八年，特诺奇蒂特兰联合湖东的特斯科科、西岸的特拉科潘，推翻了阿斯卡波察尔科。三城结成同盟，贡赋按二、二、一的份额分配。我们说的阿兹特克帝国，其实就是这个三方同盟。","pts":[["特诺奇蒂特兰",-99.13,19.43,"b"],["特斯科科",-98.88,19.51],["特拉科潘",-99.19,19.46,"l"],["阿斯卡波察尔科",-99.18,19.49,"t"]]},{"c":26,"y":1428,"cam":[-99.13,19.43,10],"t":"同盟的缔造者、墨西加首领伊斯科阿特尔做了一件耐人寻味的事。据后来的记载，他下令烧掉旧有的史书图画，理由是让所有人都知道这些内容并不明智，再由官方重新讲述本族的光荣历史。胜利者改写历史，这在世界各地都不新鲜。","pts":[["特诺奇蒂特兰",-99.13,19.43]]},{"c":26,"y":1431,"cam":[-98.88,19.5,9.5],"t":"特斯科科的国王内萨瓦尔科约特尔是个传奇人物。他十六岁时亲眼看着父亲被敌人杀死，流亡多年，一四三一年才登上王位。他主持修水利、建园林，还留下许多感叹人生短暂的诗歌，被称为诗人国王，不过哪些诗真出自他手，学界仍有争论。他的头像还曾印在墨西哥一百比索的纸币上。","pts":[["特斯科科",-98.88,19.51],["特诺奇蒂特兰",-99.13,19.43,"l"]]},{"c":26,"y":1438,"cam":[-72.6,-13.6,7],"t":"安第斯这边，约一四三八年，强悍的昌卡人围攻库斯科，老国王弃城出逃，王子库西·尤潘基却留下死守，击退了敌人。传说连石头都变成战士帮他作战。他随后夺得王位，改名帕查库特克，意思是世界翻转。具体年份学界有争议，但印加从此由城邦变成了帝国。","a":true,"pts":[["库斯科",-71.97,-13.53],["昌卡人地区",-73.4,-13.65,"l"]],"rt":[[[-73.4,-13.65],[-72.8,-13.6],[-72.3,-13.55],[-72,-13.53]]]},{"c":26,"y":1440,"cam":[-71.97,-13.52,10],"t":"印加人把国家叫作塔万廷苏尤，意思是四方合一之国，四大区在首都库斯科交汇。帕查库特克大规模重建库斯科，城北山上修起萨克塞瓦曼巨石围墙：不用灰浆，最重的石块估计有一百多吨，石缝严丝合缝，西班牙人说连一枚小银币都塞不进去。","a":true,"pts":[["库斯科",-71.97,-13.53],["萨克塞瓦曼",-71.98,-13.51,"l"]]},{"c":26,"y":1450,"cam":[-72.55,-13.16,10],"t":"约一四五〇年，库斯科西北海拔两千四百多米的山脊上建起了马丘比丘，多数学者认为它是帕查库特克的王家庄园。一九一一年，美国学者宾厄姆让它闻名世界，但给他带路的是当地农民，山上还住着种地的人家。马丘比丘从来没有真正失踪过。","a":true,"pts":[["马丘比丘",-72.55,-13.16]]},{"c":26,"y":1450,"cam":[-98.65,19.3,8],"t":"约一四五〇年起，墨西哥谷地连续几年霜冻和干旱，饥荒严重，据记载有人把自己或孩子卖为奴隶。此后，三方同盟和东边的特拉斯卡拉等城邦定期打一种仗，叫花战，据说是为了抓俘虏献祭和练兵。不过花战的起源和真实目的，学界争论很大。","a":true,"pts":[["特诺奇蒂特兰",-99.13,19.43],["特拉斯卡拉",-98.24,19.32],["韦霍钦戈",-98.41,19.16,"b"]]},{"c":26,"y":1450,"cam":[-76,42.9,6],"t":"同一时期的北美东北部，今天纽约州一带的五个部族结成了易洛魁联盟。传说一位被称为和平缔造者的人与海华沙一起奔走，说服五族停止仇杀，订立大和平法。联盟何时成立争议很大，有人说早在一一四二年，不少学者则倾向于一四五〇年前后。","a":true,"pts":[["奥农达加湖",-76.21,43.09]],"ar":[["易洛魁五族",-75.8,42.9,1.8]]},{"c":26,"y":1460,"cam":[-71.88,-15.82,9],"t":"印加也有人祭。一九九五年，人类学家在秘鲁安帕托雪山六千多米的峰顶附近，发现了一具冻成木乃伊的少女遗体，人们叫她胡安妮塔。她只有十几岁，约在十五世纪中后期，在一种叫卡帕科查的仪式中被献给山神。高寒干燥让她几乎完好地保存了五百多年。","a":true,"pts":[["安帕托雪山",-71.88,-15.82]]},{"c":26,"y":1470,"cam":[-75.5,-10.5,4.2],"t":"帕查库特克的儿子图帕克·印卡·尤潘基是个更厉害的征服者。约一四七〇年，他征服了奇穆王国，把末代国王带回库斯科，昌昌的金银被运去装饰库斯科的太阳神殿。印加的版图随后北到今天的厄瓜多尔，南到智利中部的马乌莱河。","a":true,"pts":[["库斯科",-71.97,-13.53],["昌昌",-79.07,-8.11,"l"]],"rt":[[[-71.97,-13.53],[-73.5,-13.3],[-74.2,-13.1],[-75.2,-12.1],[-76.2,-10.3],[-77.5,-9.4],[-78.3,-8.1],[-79.07,-8.11]]]},{"c":26,"y":1473,"cam":[-99.135,19.443,11],"t":"特诺奇蒂特兰北边紧挨着一座姊妹城特拉特洛尔科，一四七三年被吞并。这里有整个谷地最大的市场。后来见到它的西班牙人写道，每天来这里买卖的人有好几万；一些去过罗马和君士坦丁堡的士兵说，从没见过这么大、这么有秩序的集市。","pts":[["特拉特洛尔科",-99.137,19.451],["特诺奇蒂特兰",-99.131,19.435,"b"]]},{"c":26,"y":1478,"cam":[-100.4,19.55,7],"t":"不过阿兹特克也有啃不动的骨头。西边的塔拉斯坎王国，又称普雷佩查，是中美洲少数会用金属打造工具和兵器的国家。一四七〇年代后期，阿兹特克国王阿哈雅卡特尔率大军西征，惨败而归。直到西班牙人到来，阿兹特克也没能征服塔拉斯坎。","a":true,"pts":[["钦祖坦",-101.58,19.63,"l"],["塔希马罗阿",-100.55,19.69,"t"],["特诺奇蒂特兰",-99.13,19.43]],"rt":[[[-99.13,19.43],[-99.6,19.5],[-100.1,19.6],[-100.55,19.69]]]},{"c":26,"y":1480,"cam":[-72,-14,4],"t":"印加的经济在世界史上相当少见：基本没有货币，也没有集市。老百姓纳税不交钱，而是轮流出工，叫米塔。男人按班次去修路、架桥、开梯田、种官田、当兵；国家则在灾年开仓放粮，节庆时摆宴请客。整个帝国就像一本巨大的劳动力账簿。","a":true,"pts":[["库斯科",-71.97,-13.53]],"ar":[["塔万廷苏尤",-72,-14,7]]},{"c":26,"y":1480,"cam":[-69,-15.5,4.5],"t":"安第斯山陡峭寒冷，印加人在山坡上修出层层梯田。他们还会做冻干土豆丘纽：趁高原夜里结冰、白天暴晒，反复踩踏挤出水分，能存放好几年。各地山坡上排满了国家仓库，玻利维亚的科塔帕奇一处就有约两千四百座，储存粮食、布匹和武器。","a":true,"pts":[["库斯科",-71.97,-13.53],["科塔帕奇",-66.3,-17.41]]},{"c":26,"y":1487,"cam":[-99.131,19.435,11],"t":"特诺奇蒂特兰的中心是大神庙，塔顶并立两座神殿，分别供奉战神和雨神。一四八七年神庙扩建落成，举行了大规模的献祭。西班牙时代的记载说死者有两万到八万人，学者普遍认为这些数字被夸大了。但人祭确有其事：二〇一五年起，考古学家在神庙旁挖出一座头骨塔，已发现六百多个头骨，其中有妇女和儿童。","pts":[["大神庙",-99.131,19.435]]},{"c":26,"y":1490,"cam":[-72,-13.5,6],"t":"前面讲过，结绳记事的奇普在印加之前就有了，到了印加手里才用到极致。一根主绳上挂着许多细绳，用绳结的位置表示个、十、百、千，是一套十进制账本，由专门的结绳官编写和解读。殖民时期一部分奇普被下令烧毁，今天存世的约有一千四百件。","a":true,"pts":[["库斯科",-71.97,-13.53]]},{"c":26,"y":1490,"cam":[-74,-12,2.4],"t":"把四方连在一起的是道路网，总长常见的估计约四万公里，大航海一章还会提到它。路边每隔几公里设一个驿站，驿卒查斯基吹着海螺接力奔跑，消息一天能传两三百公里。据记载，皇帝在库斯科还能吃到从几百公里外的海边送来的鲜鱼。","a":true,"pts":[["基多",-78.47,-0.18],["库斯科",-71.97,-13.53],["查拉",-74.25,-15.86,"l"]],"rt":[[[-78.47,-0.18],[-78.9,-2.9],[-79.2,-5.5],[-78.5,-7.2],[-77.5,-9.5],[-76.2,-11],[-74.2,-13.1],[-71.97,-13.53],[-70.5,-15.5],[-68.7,-16.6],[-68,-19.5],[-68.8,-24],[-70,-28],[-70.7,-33.4]]]},{"c":26,"y":1490,"cam":[-71.48,-14.38,9],"t":"遇到深谷，印加人就用草绳编成吊桥。今天最有名的一座在秘鲁的阿普里马克河峡谷上，叫克斯瓦恰卡，长约三十米。每年附近四个社区的村民一起搓草绳，花三天把旧桥换成新桥。二〇一三年，这项手艺被列入联合国教科文组织的非物质文化遗产名录。","a":true,"pts":[["克斯瓦恰卡草桥",-71.48,-14.38]]},{"c":26,"y":1500,"cam":[-97,18.5,5],"t":"阿兹特克的市场上，可可豆就是零钱。按殖民初期留下的价目，一颗可可豆能买一个番茄，一只火鸡要上百颗。于是也有人造假币：把可可豆掏空，塞进泥沙。用可可调成的苦味饮料，是贵族才喝得起的东西，喝它简直就像在喝钱。","a":true,"pts":[["特诺奇蒂特兰",-99.13,19.43]],"ar":[["可可产区",-92.5,15.5,1.5]]},{"c":26,"y":1502,"cam":[-90,17.5,4.5],"t":"一五〇二年，蒙特祖马二世即位，帝国在他手上达到最大。同一年，哥伦布第四次西航，在洪都拉斯外海遇到一艘玛雅人的大独木舟，载着布匹、铜斧和可可豆。他儿子记载，可可豆掉在船上，船里的人赶紧去捡，就像掉了自己的眼睛。","pts":[["特诺奇蒂特兰",-99.13,19.43],["瓜纳哈岛",-85.89,16.45]]},{"c":26,"y":1510,"cam":[-99.13,19.43,7],"t":"阿兹特克人说纳瓦特尔语，今天仍有一百多万人在说。它借着西班牙语给全世界留下了不少词：番茄、牛油果、辣椒的叫法，还有郊狼，都源自纳瓦特尔语。巧克力一词也常被认为来自纳瓦特尔语，不过它的确切来历，语言学家还在争论。","a":true,"pts":[["特诺奇蒂特兰",-99.13,19.43]]},{"c":26,"y":1512,"cam":[-99.133,19.432,11],"t":"著名的太阳石也刻于蒙特祖马二世时期。它直径约三点六米，重二十多吨，常被叫作阿兹特克历法石，其实并不是用来查日子的日历，而是表现宇宙循环的纪念碑。一七九〇年，它在墨西哥城中央广场铺路时被挖出，今天收藏在国家人类学博物馆。","a":true,"pts":[["太阳石出土处",-99.133,19.432]]},{"c":26,"y":1527,"cam":[-78.5,-4,4.5],"t":"印加这边，图帕克的儿子瓦伊纳·卡帕克把帝国推到今天的厄瓜多尔和哥伦比亚南部，常驻北方的基多。约一五二七年，一场瘟疫夺去了他和继承人的性命，可能是从欧洲人那里辗转传来的天花或麻疹，也有人认为是别的病。这时，他还没见过一个西班牙人。","a":true,"pts":[["基多",-78.47,-0.18],["图米班巴",-79,-2.9]],"ar":[["印加北疆",-78.5,-2,3]]},{"c":26,"y":1519,"cam":[-86,4,1.5],"t":"瘟疫跑在了征服者前面，皇位悬空，印加的两位王子很快兵戎相见。而在北方，一五一九年，一支西班牙船队已在墨西哥海岸登陆。湖上之城和四方之国都站在鼎盛的顶点，却还不知道大洋彼岸的来客将改变一切。他们的故事，留给下一章。","pts":[["特诺奇蒂特兰",-99.13,19.43],["库斯科",-71.97,-13.53]],"ar":[["阿兹特克",-98,18.5,4],["印加",-73,-12,9]]},{"c":27,"y":1488,"cam":[0,5,1.8],"t":"欧洲人为什么要出海？一个重要原因是香料。胡椒、丁香、肉豆蔻在欧洲贵得惊人，而东方商路被层层中间商把持。葡萄牙人率先沿着非洲西海岸一路南下，一千四百八十八年，迪亚士绕过了非洲最南端附近的好望角。","pts":[["里斯本",-9.14,38.72,"l"],["好望角",18.47,-34.36]],"rt":[[[-9.1,38.7],[-13,30],[-17.5,21],[-17,14],[-12,7],[-3,4],[8,2],[11,-6],[12,-15],[14.5,-24],[17,-31],[18.5,-34.6],[22,-34.5]]]},{"c":27,"y":1492,"cam":[-40,28,2.6],"t":"一千四百九十二年八月，哥伦布带着三艘船从西班牙出发，向西航行，想抄近路去亚洲。顺便澄清一个误会：当时有学问的欧洲人都知道地球是圆的，哥伦布的问题在于把地球算小了。十月十二日，他登上了巴哈马群岛的一座小岛，此后一直坚称自己到了亚洲。","pts":[["帕洛斯",-6.89,37.23],["圣萨尔瓦多岛",-74.5,24.05,"l"]],"rt":[[[-6.9,37.2],[-12,32],[-15.5,28.1],[-30,26.5],[-50,26],[-65,25.3],[-74.4,24.1]]]},{"c":27,"y":1494,"cam":[-40,0,1.6],"t":"因为这个误会，美洲原住民被叫作印第安人，加勒比海的岛屿至今被称为西印度群岛。一千四百九十四年，西班牙和葡萄牙签订托尔德西利亚斯条约，在大西洋上画了一条线：线以西归西班牙，线以东归葡萄牙。生活在那里的人们，当然没有被问过意见。","pts":[["加勒比海（西印度群岛）",-72,18]],"rt":[[[-46.5,60],[-46.5,30],[-46.5,0],[-46.5,-30]]]},{"c":27,"y":1498,"cam":[35,-5,1.8],"t":"一千四百九十八年，葡萄牙的达·伽马绕过好望角，在东非的马林迪找到领航员，横渡印度洋，抵达印度西南海岸的卡利卡特。有意思的是，郑和船队在几十年前就到过这两个地方。两支船队到过同一片海，却写下了完全不同的故事。","pts":[["里斯本",-9.14,38.72,"l"],["马林迪",40.1,-3.2,"l"],["卡利卡特",75.78,11.25]],"rt":[[[-9.1,38.7],[-15,28],[-23,15],[-25,0],[-20,-20],[-5,-33],[12,-36],[20,-36],[30,-31],[36,-24],[40.5,-15],[40.2,-3.2],[50,2],[62,7],[75.6,11.2]]]},{"c":27,"y":1519,"cam":[-50,-10,1.8],"t":"一千五百一十九年，麦哲伦率五艘船、约两百七十人从西班牙出发，向西寻找香料群岛。他们穿过南美最南端险峻的海峡，进入一片风平浪静的大洋，麦哲伦把它命名为太平洋。可谁也没想到，这片海大得离谱，船员们在海上漂了三个多月，靠吃皮革和木屑充饥。","pts":[["桑卢卡尔",-6.35,36.78],["麦哲伦海峡",-70.9,-53.5,"l"]],"rt":[[[-6.4,36.8],[-15.4,28.1],[-25,10],[-34,-6],[-43,-23],[-56,-35],[-67.7,-49.3],[-70.9,-53.1],[-75,-52.5],[-78,-45]]]},{"c":27,"y":1522,"cam":[160,-10,1.1],"t":"一千五百二十一年，麦哲伦在菲律宾的麦克坦岛卷入当地冲突，被首领拉普拉普的战士杀死。剩下的船员继续航行，一千五百二十二年，只有维多利亚号一艘船、十八个人回到西班牙，完成了第一次环球航行。他们还发现，船上的日期比岸上少了一天。","p":"p","pts":[["麦克坦岛",123.97,10.3,"l"],["关岛",144.8,13.4],["桑卢卡尔",-6.35,36.78,"l"]],"rt":[[[-78,-45],[-85,-32],[-100,-20],[-120,-14],[-140,-8],[-160,0],[-180,9],[160,12.5],[144.8,13.4],[130,11],[125.7,10.7],[124,10.3],[127.4,0.7],[124,-9],[105,-15],[80,-25],[50,-36],[20,-36],[10,-25],[-5,-5],[-20,10],[-18,25],[-6.4,36.7]]]},{"c":27,"y":1519,"cam":[-99,19.4,6],"t":"就在麦哲伦出发的同一年，西班牙人科尔特斯带着几百人在墨西哥登陆。阿兹特克帝国的首都特诺奇蒂特兰建在湖中岛上，人口可能有二十万左右，比当时欧洲绝大多数城市都大。科尔特斯联合了不满阿兹特克统治的特拉斯卡拉人等，组成了大军。","pts":[["特诺奇蒂特兰",-99.13,19.43],["特拉斯卡拉",-98.24,19.32,"r"],["韦拉克鲁斯",-96.13,19.19]],"rt":[[[-96.1,19.2],[-97,19.5],[-98.2,19.35],[-99,19.4]]]},{"c":27,"y":1521,"cam":[-99,19.4,7],"t":"真正致命的是天花。一千五百二十年，天花在当地暴发，原住民对这种病毫无免疫力，大量死亡。一千五百二十一年，特诺奇蒂特兰在围城和瘟疫中陷落。此后一百多年里，美洲原住民人口因疾病、战争和强迫劳动锐减，许多地区减少了一大半，甚至九成。","pts":[["特诺奇蒂特兰",-99.13,19.43]]},{"c":27,"y":1532,"cam":[-75,-10,4.5],"t":"一千五百三十二年，皮萨罗带着一百六十多名士兵，在秘鲁的卡哈马卡俘虏了印加皇帝阿塔瓦尔帕。印加帝国当时刚经历了天花和一场兄弟间的内战。阿塔瓦尔帕许诺用黄金填满一间屋子来赎身，西班牙人收了赎金，却在一千五百三十三年处死了他。","pts":[["卡哈马卡",-78.52,-7.16,"l"],["库斯科",-71.97,-13.53],["马丘比丘",-72.55,-13.16,"l"]],"ar":[["印加帝国",-72,-15,9]]},{"c":27,"y":1533,"cam":[-72,-14,5],"t":"印加帝国没有我们熟悉的那种文字，却用打结的绳子奇普来记录数字，还修建了长达数万公里的道路网，翻山越岭连接整个安第斯山脉，驿卒接力奔跑传递消息。山顶的马丘比丘至今令人惊叹，它在殖民时代被遗忘，直到二十世纪初才被外界广泛知晓。","pts":[["库斯科",-71.97,-13.53],["马丘比丘",-72.55,-13.16,"l"]],"rt":[[[-78.5,-0.2],[-78.5,-7.2],[-76,-11.5],[-72,-13.5],[-69,-16.5],[-68,-21],[-70.5,-30],[-70.7,-33.4]]]},{"c":27,"y":1600,"cam":[-25,5,1.6],"t":"美洲的种植园需要劳动力，原住民大量死亡后，殖民者把目光投向了非洲。从十六世纪到十九世纪，约一千二百五十万非洲人被强行装上奴隶船运往美洲，其中约一百八十万人死在途中。这是人类历史上规模最大的强迫迁徙之一，深刻改变了三个大洲。","a":true,"ar":[["西非海岸",0,7,8]],"rt":[[[3,6],[-10,3],[-25,-2],[-35,-8]],[[-2,5],[-20,10],[-45,15],[-65,17]],[[10,-5],[-10,-10],[-30,-15],[-42,-22]]]},{"c":27,"y":1550,"cam":[-20,20,1.2],"t":"新旧大陆之间开始了一场物种大交换，学者称之为哥伦布大交换。马、牛、小麦、甘蔗去了美洲；玉米、土豆、番薯、番茄、花生、可可和烟草来到旧大陆。对了，辣椒的老家也在美洲，今天中国菜里那股呛人的辣味，其实是个几百年的新来客。","a":true,"ar":[["美洲",-80,10,14],["旧大陆",40,35,18]],"rt":[[[-30,33],[-55,22],[-75,15]],[[-75,20],[-45,40],[-15,45]]]},{"c":27,"y":1593,"cam":[118,22,4.5],"t":"辣椒传入中国的时间并不长，明朝晚期的书里才出现番椒的记载，最初还被当作观赏植物。一千五百九十三年，福建商人陈振龙从吕宋带回番薯藤。后来番薯和玉米在山地广泛种植，帮助清朝人口在十八世纪末增长到三亿左右。","pts":[["吕宋（马尼拉）",120.98,14.6],["福州",119.3,26.08,"l"]],"rt":[[[121,14.6],[120.3,18],[120,22],[119.6,25.9]]]},{"c":27,"y":1571,"cam":[-160,5,1.2],"t":"美洲还盛产白银。一千五百四十五年，西班牙人在今天玻利维亚的波托西发现了巨大的银山。一千五百七十一年马尼拉建城后，西班牙大帆船定期把美洲白银运过太平洋，换取中国的丝绸和瓷器。日本石见等地的白银，也大量流入中国。","p":"p","pts":[["波托西银山",-65.75,-19.59,"l"],["阿卡普尔科",-99.9,16.85],["马尼拉",120.98,14.6,"l"],["石见银山",132.4,35.1]],"rt":[[[-65.8,-19.6],[-71,-18],[-77,-12],[-82,0],[-92,10],[-99.9,16.8]],[[-99.9,16.8],[-115,14],[-140,13],[-170,13],[165,13],[145,13.5],[130,13],[121,14.6]]]},{"c":27,"y":1581,"cam":[-170,10,1],"t":"当时明朝推行一条鞭法，把各种赋役折成白银缴纳，对白银的需求巨大。学者估计，十六到十八世纪全世界开采的白银，有相当大一部分最终流入了中国，有人估计多达三分之一甚至更多。第一个真正的全球经济网络，就这样以白银为血液运转起来。","p":"p","ar":[["明朝",112,31,9]],"rt":[[[-99.9,16.8],[-140,13],[165,13],[121,14.6],[116,22],[113,26]],[[-20,15],[-5,-10],[20,-36],[60,-20],[90,0],[110,15]]]},{"c":28,"y":1299,"cam":[30,40.4,6],"t":"这一章，镜头来到小亚细亚的西北角。前面讲过塞尔柱人在这里建立的罗姆苏丹国，它在一二四三年败给蒙古人，渐渐瓦解，小亚细亚分裂成许多突厥小侯国。其中一个紧挨着东罗马的边境，首领叫奥斯曼。传统上，奥斯曼帝国从约一二九九年算起。","a":true,"pts":[["瑟于特",30.18,40.02],["君士坦丁堡",28.98,41.01,"l"]],"ar":[["奥斯曼的小侯国",30.1,40.1,0.8]]},{"c":28,"y":1300,"cam":[30.1,40.1,9],"t":"后世的奥斯曼史书讲了一个开国传说：奥斯曼借宿在一位长老家，梦见一轮明月从长老怀中升起，落进自己胸中；接着他的肚脐里长出一棵大树，树荫盖住了天下的山河。长老说，这预示着他的子孙将统治天下，还把女儿嫁给了他。","a":true,"pts":[["瑟于特",30.18,40.02],["比莱吉克",29.98,40.14,"l"]]},{"c":28,"y":1326,"cam":[29.5,40.3,7],"t":"一三二六年，奥斯曼的儿子奥尔汗攻下了东罗马的城市布尔萨，后来把它定为都城。布尔萨是生丝贸易的重镇，奥斯曼和奥尔汗都葬在这里。一三三一年，奥尔汗又拿下尼西亚，也就是一千年前基督教召开第一次大公会议的地方。","pts":[["布尔萨",29.06,40.19,"b"],["尼西亚",29.72,40.43],["瑟于特",30.18,40.02,"b"]]},{"c":28,"y":1354,"cam":[27.6,40.6,6],"t":"奥斯曼人是怎么进入欧洲的？东罗马正在打内战，争位的皇帝约翰六世请奥尔汗出兵相助，还把女儿嫁给了他。一三五四年三月，一场地震把加里波利的房屋和城墙几乎全部震塌，居民逃离，奥斯曼军队随即进驻，从此在欧洲站稳了脚跟。","pts":[["加里波利",26.67,40.41,"l"],["君士坦丁堡",28.98,41.01]],"rt":[[[29.06,40.19],[28,40.3],[27.1,40.3],[26.67,40.41]]]},{"c":28,"y":1365,"cam":[27.5,41.3,6],"t":"一三六〇年代，奥斯曼人拿下了色雷斯的重镇阿德里安堡，改名埃迪尔内，并把都城迁到这里，具体年份学界有争论。这样一来，君士坦丁堡还没攻下，奥斯曼的都城反倒先搬到了它背后的欧洲。千年古都，渐渐成了一座被团团围住的孤岛。","a":true,"pts":[["埃迪尔内",26.56,41.68,"l"],["君士坦丁堡",28.98,41.01],["加里波利",26.67,40.41,"b"]],"ar":[["奥斯曼",28,40.8,2.2]]},{"c":28,"y":1389,"cam":[21.2,42.7,8],"t":"一三八九年，奥斯曼苏丹穆拉德一世在科索沃平原，与塞尔维亚王公拉扎尔率领的联军决战。双方伤亡都很惨重，两位君主都死于此战。据传统说法，穆拉德是被一位假装投降的塞尔维亚骑士刺杀的。这一战后来成为塞尔维亚民族记忆中沉重的一页。","pts":[["科索沃平原",21.13,42.69]]},{"c":28,"y":1390,"cam":[23,42,4.5],"t":"奥斯曼还逐渐形成一种征召制度，叫德夫希尔梅：定期从巴尔干基督徒农家挑选少年，带离家乡，改信伊斯兰教，再加以训练。大多数人编入苏丹的常备步兵耶尼切里，意思是新军；最出色的进入宫廷学校，有的后来当上了宰相。对许多家庭来说，这首先是骨肉分离。","a":true,"pts":[["埃迪尔内",26.56,41.68]],"ar":[["巴尔干",22,42.5,3.5]]},{"c":28,"y":1396,"cam":[26.5,42.2,5],"t":"穆拉德的儿子巴耶济德一世用兵神速，人称闪电。一三九六年，匈牙利国王和法国骑士组成的十字军，在多瑙河畔的尼科波利斯被他击溃。从一三九四年起，他就开始围困君士坦丁堡，眼看这座城就要撑不住了，东方却杀来了一个更可怕的对手。","pts":[["尼科波利斯",24.89,43.7],["君士坦丁堡",28.98,41.01]]},{"c":28,"y":1402,"cam":[50,39,3.6],"t":"这个对手就是以撒马尔罕为都的帖木儿。一四〇二年，两大强人在安卡拉附近决战，巴耶济德军中的一些部队临阵倒戈，他本人兵败被俘，第二年死在囚禁之中。后世说他被关在铁笼里示众，但当时的目击记载里并没有这回事，多半是传说。","pts":[["撒马尔罕",66.96,39.65],["安卡拉",32.86,39.93,"l"]],"rt":[[[66.96,39.65],[62,37.6],[56,36.5],[51.4,35.7],[46.3,38.1],[41.3,39.9],[37,39.75],[32.9,39.93]]]},{"c":28,"y":1405,"cam":[75,37,1.5],"t":"帖木儿没有久留，转身要去攻打明朝。一四〇五年二月，他在东征途中病死于讹答剌一带。同一年，郑和的船队第一次下西洋，前面讲过。奥斯曼这边，巴耶济德的儿子们为争王位打了十一年内战，直到一四一三年，帝国才重新统一。","pts":[["安卡拉",32.86,39.93,"l"],["讹答剌",68.3,42.85],["南京",118.78,32.06]]},{"c":28,"y":1453,"cam":[28.97,41.01,10],"t":"一四五三年，穆罕默德二世攻下君士坦丁堡，前面讲过。战后的城市残破冷清，苏丹下令从各地迁来穆斯林、基督徒和犹太人，重新填满这座城，还修建了大巴扎的前身。到一四七八年，城里已有约八万居民。奥斯曼人正式称它君士坦丁尼耶，民间则叫伊斯坦布尔。","pts":[["大巴扎",28.97,41.01,"b"],["圣索菲亚",28.98,41.01,"r"]]},{"c":28,"y":1459,"cam":[28.98,41.01,10],"t":"一四五九年，穆罕默德二世在半岛尖端的山丘上修建新宫，也就是后来的托普卡帕宫，意思是炮门宫。它不是一座大楼，而是一层层庭院和亭阁组成的建筑群，越往里越私密，后宫就有四百多个房间。此后约四百年，这里一直是苏丹居住和治国的地方。","pts":[["托普卡帕宫",28.98,41.01,"t"]]},{"c":28,"y":1480,"cam":[20,43,3.4],"t":"穆罕默德二世自称罗马皇帝，认为占有君士坦丁堡就继承了罗马的皇位。他据说通晓多种语言，藏书里有希腊文和拉丁文的典籍。一四八〇年，他请威尼斯画家贝利尼为自己画像，这幅肖像今天属于伦敦的国家美术馆。","pts":[["伊斯坦布尔",28.98,41.01],["威尼斯",12.33,45.44,"l"],["伦敦",-0.13,51.51,"l"]]},{"c":28,"y":1492,"cam":[14,39,2.6],"t":"一四九二年，也就是哥伦布出海那一年，西班牙下令驱逐不肯改宗的犹太人。奥斯曼接纳了大批流亡者，他们带来了手艺、医术和商业网络。萨洛尼卡一度成为犹太人占多数的城市。据说苏丹讥讽西班牙国王让自己的国家变穷，却让奥斯曼富了起来。","pts":[["西班牙",-3.7,40.42,"l"],["萨洛尼卡",22.94,40.64,"t"],["伊斯坦布尔",28.98,41.01]],"rt":[[[-0.3,39.4],[4,38.6],[9,38.2],[11.8,37.2],[16,36.2],[21,36.4],[23.8,36.6],[25.3,38.2],[25.9,39.8],[26.3,40.1],[26.7,40.4],[27.5,40.7],[28.9,40.95]]]},{"c":28,"y":1500,"cam":[30,38,4.5],"t":"奥斯曼治下有大量基督徒和犹太人。他们要缴人头税，地位低于穆斯林，但通常可以保留信仰，由本宗教的领袖按自己的法律处理婚姻、继承等事务。后世称之为米勒特制度，不过学者提醒，成体系的制度要到十九世纪才形成，早期做法因时因地而异。","a":true,"pts":[["伊斯坦布尔",28.98,41.01],["耶路撒冷",35.23,31.78],["萨洛尼卡",22.94,40.64,"l"]]},{"c":28,"y":1513,"cam":[-20,15,1.6],"t":"一五一三年，奥斯曼海军将领皮里·雷斯在羚羊皮上画了一幅世界地图，画出了欧洲、非洲和南美洲的海岸。他说自己参考了约二十幅地图，其中一幅出自哥伦布之手。这幅地图一九二九年才在托普卡帕宫被重新发现，只剩西边约三分之一。","pts":[["伊斯坦布尔",28.98,41.01],["加勒比海",-72,18,"l"],["巴西海岸",-38,-8,"l"]]},{"c":28,"y":1514,"cam":[40,39.3,4],"t":"一五一二年，塞利姆一世在耶尼切里的支持下逼父亲退位。他把东边新兴的萨法维波斯视为大敌。一五一四年，两军在查尔迪兰决战，奥斯曼的大炮和耶尼切里的火枪，击败了萨法维勇猛的骑兵。从波斯那边看，这场仗是什么样子，下一章还会讲到。","pts":[["查尔迪兰",43.91,39.14],["大不里士",46.29,38.08,"b"],["伊斯坦布尔",28.98,41.01,"l"]],"rt":[[[29,40.9],[32.9,39.9],[37,39.75],[41.3,39.9],[43.9,39.14]]]},{"c":28,"y":1517,"cam":[36,30,3],"t":"接着塞利姆挥师南下，一五一六年在叙利亚、一五一七年在开罗附近，接连击败马穆鲁克王朝。前面讲过，正是马穆鲁克在阿音札鲁特挡住了蒙古人。埃及、叙利亚连同汉志都归了奥斯曼，苏丹从此自称两座圣城麦加和麦地那的仆人。","pts":[["阿勒颇",37.16,36.2],["开罗",31.24,30.04,"l"],["麦地那",39.61,24.47],["麦加",39.83,21.42]],"rt":[[[37.3,36.6],[36.7,34.8],[36.29,33.51],[35.2,32],[34.45,31.4],[32.3,30.9],[31.3,30.1]]]},{"c":28,"y":1520,"cam":[40,33,2],"t":"塞利姆在位只有八年，帝国疆域却扩大了约七成。他被称为冷酷者。有一个流传很广的说法：开罗的最后一位阿拔斯哈里发把哈里发称号正式让给了他。不过学者指出，这个故事要到十八世纪才出现。一五二〇年，他的儿子苏莱曼即位。","pts":[["伊斯坦布尔",28.98,41.01]],"ar":[["奥斯曼帝国",33,36,11]]},{"c":28,"y":1521,"cam":[60,38,1.4],"t":"苏莱曼在位四十六年，是在位最久的奥斯曼苏丹。欧洲人叫他苏莱曼大帝，土耳其人称他为立法者。和他同时代的，有欧洲的查理五世、弗朗索瓦一世、亨利八世，还有明朝的嘉靖皇帝，两人的在位时间几乎完全重合。一五二一年，他拿下了多瑙河畔的贝尔格莱德。","pts":[["伊斯坦布尔",28.98,41.01],["马德里",-3.7,40.42,"l"],["北京",116.4,39.9]]},{"c":28,"y":1526,"cam":[18.9,46.2,7],"t":"一五二六年八月，苏莱曼在匈牙利的莫哈奇平原击溃了匈牙利军队，主战场不到两个小时就崩溃了。二十岁的国王路易二世在撤退时坠马落入溪流，被盔甲拖住淹死。匈牙利后来一分为三，至今还有句俗语：在莫哈奇丢的更多，用来安慰遇到小挫折的人。","pts":[["莫哈奇",18.68,45.99],["布达",19.04,47.5]]},{"c":28,"y":1529,"cam":[18,47,5],"t":"一五二九年，苏莱曼兵临维也纳。那年春雨特别多，道路泥泞，许多重炮只好丢在半路，大军九月底才到城下。围城不到三周，补给困难，冬天将至，奥斯曼军队于十月中旬撤退。维也纳，标出了奥斯曼大军在中欧所能到达的极限。","pts":[["维也纳",16.37,48.21],["布达",19.04,47.5,"b"],["贝尔格莱德",20.46,44.82]],"rt":[[[20.46,44.82],[19.2,45.6],[18.7,46],[19,47.4],[17.7,47.8],[16.5,48.15]]]},{"c":28,"y":1534,"cam":[29.5,44,4],"t":"苏莱曼的宫廷里有一位传奇女性：许蕾姆，欧洲人叫她罗克塞拉娜。她据说出生在今天乌克兰西部，被克里米亚的奴隶劫掠者掳走，卖进苏丹后宫。约一五三四年，苏莱曼打破惯例，正式娶她为妻。她参与政务，还修建了清真寺、医院和施粥所。","pts":[["罗哈廷",24.6,49.41],["伊斯坦布尔",28.98,41.01,"b"]],"rt":[[[24.6,49.4],[30,47],[33.5,45.2],[33,43],[29.5,41.4],[29,41.05]]]},{"c":28,"y":1538,"cam":[10,39,4.5],"t":"海上的大将是海雷丁·巴巴罗萨，在意大利语里意思是红胡子。他原是以阿尔及尔为据点的海盗兼私掠者，后来当上奥斯曼海军总司令，一五三八年在普雷韦扎击败基督教联合舰队。法国为了对付查理五世与苏莱曼结盟，他的舰队还在法国土伦港过了一冬。","pts":[["阿尔及尔",3.06,36.75,"b"],["普雷韦扎",20.75,38.96],["土伦",5.93,43.12]]},{"c":28,"y":1555,"cam":[28.97,41.02,9],"t":"约一五五五年，两位来自叙利亚的商人在伊斯坦布尔开了最早的咖啡馆。人们在这里喝咖啡、下棋、读书、听说书、谈论时事，很快大街小巷都开起了咖啡馆。有人担心这里会成为议论朝政的地方，咖啡馆的麻烦，还在后头。","a":true,"pts":[["塔赫塔卡莱",28.97,41.02]]},{"c":28,"y":1557,"cam":[28.96,41.02,10],"t":"苏莱曼时代最耀眼的建筑师是希南。他也出身德夫希尔梅，在军中当过工程兵，当了将近五十年的宫廷总建筑师，名下的建筑有三百多座。一五五七年落成的苏莱曼清真寺立在伊斯坦布尔的第三座山丘上，至今是城市天际线上最醒目的建筑之一。","pts":[["苏莱曼清真寺",28.964,41.016]]},{"c":28,"y":1560,"cam":[12,48,3.4],"t":"奥斯曼人酷爱郁金香，把它画在瓷砖和织物上。一般认为，十六世纪中期，神圣罗马帝国派驻伊斯坦布尔的使节布斯贝克把郁金香带回维也纳，一五九三年又传到荷兰的莱顿。据说欧洲人把它和头巾弄混了，郁金香的西方名称就来自头巾一词。","a":true,"pts":[["伊斯坦布尔",28.98,41.01],["维也纳",16.37,48.21],["莱顿",4.49,52.16,"l"]],"rt":[[[28.9,41.1],[24,43.5],[20.5,44.8],[16.4,48.2],[11,50],[4.6,52.1]]]},{"c":28,"y":1566,"cam":[16,41,3.6],"t":"一五六五年，奥斯曼大军围攻马耳他，守岛的正是当年从罗得岛撤走的圣约翰骑士团，奥斯曼久攻不下。第二年，七十多岁的苏莱曼亲征匈牙利，在锡盖特堡围城期间死在营帐里。为了稳住军心，大臣们秘不发丧达四十八天。一个时代落幕了。","pts":[["马耳他",14.51,35.89],["锡盖特堡",17.79,46.05]]},{"c":28,"y":1571,"cam":[24,37,4],"t":"一五七一年，奥斯曼刚从威尼斯手中夺下塞浦路斯。十月，西班牙、威尼斯和教皇等组成的神圣同盟舰队，在希腊的勒班陀附近与奥斯曼舰队决战，双方战船超过四百艘，奥斯曼惨败。一位二十四岁的西班牙士兵身负重伤，左手从此残废，他叫塞万提斯。","pts":[["勒班陀",21.83,38.39,"t"],["塞浦路斯",33.4,35.1]]},{"c":28,"y":1572,"cam":[12,39,3],"t":"奥斯曼只用了约半年，就重建起一百五十多艘桨帆战船。据说大维齐尔对威尼斯使者说：我们夺走塞浦路斯，是砍了你们一条手臂；你们打败我们的舰队，只是剃了我们的胡子。塞万提斯后来被北非海盗俘虏，在阿尔及尔关了五年，才写出《堂吉诃德》。","pts":[["阿尔及尔",3.06,36.75,"b"],["伊斯坦布尔",28.98,41.01]]},{"c":28,"y":1575,"cam":[26.56,41.68,9],"t":"希南自己最满意的作品，是八十多岁时在埃迪尔内建成的塞利米耶清真寺，约一五七五年完工。它的大圆顶直径约三十一米，和近千年前的圣索菲亚大教堂不相上下。据他的传记，他自豪地说自己的穹顶比圣索菲亚更高、更宽。","pts":[["塞利米耶清真寺",26.559,41.678]]},{"c":28,"y":1603,"cam":[28.98,41.01,10],"t":"奥斯曼的王位继承一度十分残酷。新苏丹即位后，常常处死自己的兄弟，以防内战。一五九五年，穆罕默德三世即位，他的十九个兄弟被处死。一六〇三年后，这种做法渐渐被另一种办法取代：王子们被关在宫中深院里，与世隔绝，这里后来被称为笼子。","pts":[["托普卡帕宫",28.98,41.01]]},{"c":28,"y":1623,"cam":[28.98,41.01,9],"t":"十六世纪中期到十七世纪，太后和后妃们在宫廷中握有很大权力，常被称为女人苏丹国。最著名的是柯塞姆太后，先后为儿子和孙子摄政。这个说法出自二十世纪初的一位土耳其史学家，原本带点贬义，今天的学者更多把它看作权力运作方式的变化。","a":true,"pts":[["托普卡帕宫",28.98,41.01]]},{"c":28,"y":1633,"cam":[28.97,41.02,9],"t":"一六三三年，苏丹穆拉德四世下令关闭全城的咖啡馆，还禁烟禁酒。据说他夜里换上便装微服巡查，抓到违禁者就严惩，这些故事可能有夸张。禁令最终没能挡住咖啡，它很快传进了威尼斯、伦敦和巴黎，成了欧洲人的新嗜好。","pts":[["伊斯坦布尔",28.97,41.02]]},{"c":28,"y":1683,"cam":[16.35,48.23,9],"t":"一六八三年七月，大维齐尔卡拉·穆斯塔法率军第二次围攻维也纳。守军苦撑了两个月。九月十二日，波兰国王扬·索别斯基率领援军赶到，翼骑兵从卡伦山上冲下，奥斯曼大军溃败。卡拉·穆斯塔法在那年圣诞节被下令处死。","pts":[["维也纳",16.37,48.21,"b"],["卡伦山",16.34,48.27,"l"]]},{"c":28,"y":1683,"cam":[16.37,48.21,8],"t":"这场围城留下了不少美食传说：说维也纳面包师把面包做成奥斯曼旗帜上的新月形，后来变成了羊角面包；还说奥斯曼人丢下的咖啡豆开启了维也纳的咖啡馆。其实新月形面包早就有了，这些故事很动听，多半是后人编的。","pts":[["维也纳",16.37,48.21]]},{"c":28,"y":1699,"cam":[40,40,1.8],"t":"一六九九年的卡尔洛维茨条约，让奥斯曼把匈牙利大部分割给了哈布斯堡，这是它在欧洲的第一次重大割地。帝国还会延续两百多年。同一时期，它的东边是萨法维波斯，再往东是印度的莫卧儿，三大帝国都靠火炮起家，这就是下一章的故事。","pts":[["卡尔洛维茨",19.93,45.2,"l"],["伊斯法罕",51.67,32.65],["阿格拉",78.02,27.18]]},{"c":29,"y":1501,"cam":[58,32,2.2],"t":"上一章我们看了奥斯曼的鼎盛，这一章镜头往东移，来到伊朗高原和印度次大陆。二十世纪的美国学者霍奇森和麦克尼尔，把奥斯曼、萨法维、莫卧儿三个伊斯兰大帝国并称为火药帝国，认为大炮和火枪帮它们打下了江山。不过后来的学者提醒，光靠火药解释不了一切。","ar":[["奥斯曼",33,39,7],["萨法维",53,33,7],["莫卧儿",78,25,8]]},{"c":29,"y":1501,"cam":[47.3,38.2,6.5],"t":"故事从伊朗西北的阿尔达比勒开始。这里有一个世代相传的苏菲派教团，追随者头戴红色高帽，被称为红头军。一五〇一年，教团首领、年仅十四岁左右的伊斯玛仪率军攻下大不里士，自立为沙阿，也就是国王，萨法维王朝就此建立。","pts":[["阿尔达比勒",48.29,38.25],["大不里士",46.29,38.08,"l"]]},{"c":29,"y":1501,"cam":[53,32.5,3.6],"t":"伊斯玛仪一上台，就把伊斯兰教什叶派中的十二伊玛目派定为国教。什叶派和逊尼派的分歧，源于先知穆罕默德去世后由谁来继承的争论。在此之前，伊朗多数人信奉逊尼派；萨法维王朝常以强制手段推行什叶派，经过几代人，伊朗才逐渐成了今天这样以什叶派为主的国家。","ar":[["萨法维",52,33,8]]},{"c":29,"y":1514,"cam":[45.3,38.7,6.5],"t":"这位少年君主还是个用突厥语写诗的诗人，红头军把他当作不会失败的圣人。可前面讲过，一五一四年，奥斯曼人在查尔迪兰用大炮和火枪击败了萨法维骑兵，还一度占领大不里士。神话就此破灭。据一些记载，伊斯玛仪此后再没亲自领兵，十年后去世，年仅三十六岁。","pts":[["查尔迪兰",44.38,39.07,"l"],["大不里士",46.29,38.08]]},{"c":29,"y":1504,"cam":[68.5,37.5,4.2],"t":"同一时期，中亚费尔干纳盆地出了一位不得志的王子，他叫巴布尔。父系是帖木儿的后代，母系可以追溯到成吉思汗，血统显赫，运气却很差：他前后三次夺下祖先的都城撒马尔罕，三次都没守住。一五〇四年，他转身南下，占据了阿富汗的喀布尔。","pts":[["安集延",72.34,40.78],["撒马尔罕",66.96,39.65,"l"],["喀布尔",69.18,34.53]],"rt":[[[72.34,40.78],[70.5,40.2],[67.4,39.5],[67.8,37.2],[68.8,35.4],[69.18,34.53]]]},{"c":29,"y":1526,"cam":[73,31.5,4.2],"t":"既然回不了北方，巴布尔把目光投向印度。一五二六年，他在德里以北的帕尼帕特迎战德里苏丹易卜拉欣·洛迪。巴布尔兵力远少于对手，却用大车连成防线，后面架着火炮和火枪，两翼骑兵包抄。洛迪战死，莫卧儿王朝由此开始。","pts":[["喀布尔",69.18,34.53,"l"],["帕尼帕特",76.97,29.39],["德里",77.21,28.63,"b"]],"rt":[[[69.18,34.53],[71.1,34.1],[72.5,33.7],[74.3,31.6],[76.97,29.39]]]},{"c":29,"y":1526,"cam":[74,31,4],"t":"巴布尔用突厥语写了一部回忆录，叫《巴布尔纳玛》，坦率得惊人。他抱怨印度没有好马、好狗，没有葡萄和甜瓜，没有冰块，集市上没有好面包，也没有澡堂。他让人从喀布尔运来瓜果，在花园里种上家乡的葡萄和甜瓜。不过他也承认，芒果是印度最好的水果。","pts":[["喀布尔",69.18,34.53,"l"],["阿格拉",78.01,27.18]]},{"c":29,"y":1539,"cam":[48.29,38.25,7],"t":"回到伊朗。伊斯玛仪的儿子塔赫玛斯普在位近五十二年，是萨法维在位最久的君主，他本人也会作画。为阿尔达比勒祖祠织造的一对大地毯，题记年份约为一五三九年，是世上最古老的有确切年份的地毯之一，其中一块据估计打了两千五百万个结。","pts":[["阿尔达比勒",48.29,38.25]]},{"c":29,"y":1540,"cam":[64,31,2.8],"t":"巴布尔一五三〇年去世，儿子胡马雍大约十年后就被阿富汗将领舍尔沙夺了江山。舍尔沙铸造的银币叫卢比亚，一般认为是今天卢比的前身。胡马雍一路流亡到伊朗，投奔塔赫玛斯普。据记载，这位沙阿要他改信什叶派、日后让出坎大哈，才肯借兵。","pts":[["德里",77.21,28.63],["坎大哈",65.71,31.61,"b"],["加兹温",50,36.27,"l"]],"rt":[[[77.21,28.63],[74.3,31.5],[70.5,27.5],[69.74,25.36],[67,29],[65.71,31.61],[62.2,34.35],[59.6,36.3],[54.5,36.5],[50,36.27]]]},{"c":29,"y":1556,"cam":[77,29,7],"t":"一五五五年，胡马雍带着波斯援军夺回德里，半年多后却在自己图书馆的楼梯上失足摔伤，几天后去世。十四岁的儿子阿克巴即位，同年在帕尼帕特击败了想趁乱夺取德里的将领赫姆。两场帕尼帕特之战，一场开创了莫卧儿王朝，一场保住了它。","pts":[["帕尼帕特",76.97,29.39],["德里",77.21,28.63]]},{"c":29,"y":1565,"cam":[76.4,15.9,7],"t":"这时的南印度，还屹立着信奉印度教的毗奢耶那伽罗王国，都城在今天的亨比。到过这里的葡萄牙人形容它像罗马一样大。一五六五年，德干地区几个苏丹国联手，在塔利科塔附近击败了它的军队，都城被洗劫了约半年，之后渐渐荒废，如今是世界遗产。","pts":[["亨比（毗奢耶那伽罗）",76.46,15.33],["塔利科塔",76.32,16.47]]},{"c":29,"y":1571,"cam":[77.66,27.09,8],"t":"阿克巴在阿格拉附近修了一座红砂岩新都，叫法塔赫布尔西格里，意思是胜利之城。一五七一年前后起，这里做了十多年的都城，宫殿、清真寺、大门气势恢宏。可一五八五年宫廷迁走后，这座城很快被冷落，原因可能是缺水，也可能只是皇帝改了主意。","pts":[["法塔赫布尔西格里",77.66,27.09],["阿格拉",78.01,27.18]]},{"c":29,"y":1575,"cam":[77.66,27.09,7],"t":"阿克巴废除了向非穆斯林征收的人头税吉兹亚，娶了印度教拉其普特王公的女儿，还重用印度教徒大臣。一五七五年，他在新都修建了一座辩经堂，后来邀请穆斯林、印度教、耆那教、拜火教学者和耶稣会传教士一起辩论。他提倡的原则，叫做普遍和平。","pts":[["法塔赫布尔西格里",77.66,27.09]]},{"c":29,"y":1580,"cam":[78,27,6],"t":"最有意思的是，阿克巴一辈子没学会读写，有人猜他可能有阅读障碍。可他的图书馆据说藏书两万四千多卷，每天都有人给他朗读。他还让人把印度史诗《摩诃婆罗多》译成波斯文，配上精美的插图。一个不识字的皇帝，却是那个时代最大的书籍收藏家之一。","a":true,"pts":[["阿格拉",78.01,27.18],["拉合尔",74.34,31.55,"l"]]},{"c":29,"y":1588,"cam":[50,34,4.5],"t":"再看伊朗。一五八〇年代末，十六七岁的阿拔斯一世登上王位，后来被称为阿拔斯大帝。他组建了一支由格鲁吉亚人、切尔克斯人、亚美尼亚人等组成的禁卫军，只效忠国王，用来压制骄横的红头军部落。英国冒险家雪利兄弟也来帮他操练军队、改进火炮，不过他们的作用常被夸大。","a":true,"pts":[["加兹温",50,36.27],["伊斯法罕",51.67,32.65]],"ar":[["萨法维",51,33,7]]},{"c":29,"y":1598,"cam":[51.68,32.66,9],"t":"一五九八年，阿拔斯把都城迁到伊斯法罕，修了一座长约五百六十米、宽约一百六十米的大广场，四周是清真寺、宫殿和市集，国王坐在宫殿露台上看马球比赛。河上还架起一座三十三孔桥。波斯谚语自豪地说：伊斯法罕是半个世界。","pts":[["伊玛目广场",51.68,32.66],["三十三孔桥",51.67,32.64,"b"]]},{"c":29,"y":1600,"cam":[60,35,1.4],"t":"把镜头拉远看看同一时间的地球：阿克巴在印度、阿拔斯在伊朗，英国是伊丽莎白一世，中国是明朝万历皇帝，日本正从战国乱世走向统一，这段后面会讲到。一六〇三年伊丽莎白去世，一六〇五年阿克巴去世，一个时代的君主们几乎同时退场。","pts":[["伊斯法罕",51.67,32.65,"b"],["阿格拉",78.01,27.18],["北京",116.4,39.9],["伦敦",-0.12,51.5,"l"]]},{"c":29,"y":1604,"cam":[48.5,35.8,4.5],"t":"一六〇四年，阿拔斯与奥斯曼作战时，把高加索朱利法城的亚美尼亚人强行迁往伊朗，途中死伤惨重。幸存者在伊斯法罕城外建起新朱利法。他们经营丝绸贸易，在国王保护下，建立了一张从阿姆斯特丹一直延伸到马尼拉的商业网，伊朗生丝的出口很多就经他们之手。","pts":[["朱利法（旧）",45.63,38.96,"l"],["新朱利法",51.66,32.64]],"rt":[[[45.63,38.96],[46.29,38.08],[48.5,36.7],[50,36.27],[51.4,34],[51.66,32.64]]]},{"c":29,"y":1604,"cam":[74.3,31.6,7],"t":"同一时期的旁遮普，锡克教正在成长。创始人古鲁那纳克生于一四六九年，主张人人平等，锡克寺庙至今设免费公共食堂，谁都可以坐下吃饭。一六〇四年，第五代古鲁阿尔琼编成经典，供奉在阿姆利则的金庙。两年后，在阿克巴之子贾汉吉尔治下，阿尔琼死于官府羁押，锡克教从此逐渐走向武装自卫。","pts":[["阿姆利则（金庙）",74.88,31.62],["南卡纳萨希卜",73.69,31.45,"l"]]},{"c":29,"y":1616,"cam":[74,24,5],"t":"一六一六年初，英国国王派来的使节托马斯·罗在阿杰梅尔见到了贾汉吉尔，想为东印度公司争取贸易特权。他带来一幅英国细密画，宫廷画师照着画了几幅，摆在一起让他辨认。据罗的日记，他犹豫了一阵才认出原作。这次出使收获不大，只换来在苏拉特设商馆的许可。","pts":[["苏拉特",72.83,21.17,"l"],["阿杰梅尔",74.64,26.45]],"rt":[[[72.83,21.17],[73.2,23],[74.64,26.45]]]},{"c":29,"y":1621,"cam":[78.01,27.18,7],"t":"贾汉吉尔是个博物学迷。一六二一年有人献上一匹斑马，宫里有人怀疑条纹是画上去的，查验之后，皇帝在回忆录里感叹，这是造物主的手笔。宫廷画家曼苏尔把斑马画了下来；据认为出自他手的一幅渡渡鸟画像，被看作这种已经灭绝的鸟最逼真的图像之一。","pts":[["阿格拉",78.01,27.18]]},{"c":29,"y":1622,"cam":[56.4,27.1,8],"t":"一六二二年，阿拔斯借助英国东印度公司的战舰，从葡萄牙人手里夺下了波斯湾口的霍尔木兹，结束了葡萄牙在这里一百多年的统治。两百年前郑和船队到过这里，那时叫忽鲁谟斯。对岸的港口从此改名阿巴斯港，意思是阿拔斯的港口，这个名字一直用到今天。","pts":[["霍尔木兹岛",56.46,27.06],["阿巴斯港",56.27,27.18,"l"]]},{"c":29,"y":1632,"cam":[78.04,27.17,9],"t":"一六三一年，贾汉吉尔的儿子沙贾汗的爱妻慕塔芝·玛哈在生第十四个孩子时去世。第二年，沙贾汗开始在阿格拉的河边为她修建陵墓，这就是泰姬陵，整个建筑群到一六五三年前后才完工，据说动用了约两万名工匠。至于完工后砍掉工匠双手的说法，历史学家认为毫无根据。","pts":[["泰姬陵",78.04,27.17],["阿格拉堡",78.02,27.18,"l"]]},{"c":29,"y":1658,"cam":[78.02,27.18,9],"t":"一六五八年，沙贾汗病重，几个儿子爆发了继承战争。三儿子奥朗则布击败兄弟登上皇位，把父亲软禁在阿格拉堡，一直到他八年后去世。据说沙贾汗晚年常在堡里的塔楼上，远远望着河对岸的泰姬陵。","pts":[["阿格拉堡",78.02,27.18,"l"],["泰姬陵",78.04,27.17]]},{"c":29,"y":1674,"cam":[73.6,18.6,7],"t":"在印度西部的山区，马拉塔人的领袖希瓦吉靠着险要的山堡和灵活的游击战，屡次和莫卧儿军队周旋。传说他一六六六年被软禁在阿格拉，藏进运送甜食的大筐里逃了出来。一六七四年，他在赖加德山堡加冕为王，今天在马哈拉施特拉邦仍被视为英雄。","pts":[["赖加德",73.44,18.23,"l"],["浦那",73.86,18.52]]},{"c":29,"y":1690,"cam":[77,22,2.8],"t":"奥朗则布在一六七九年重新开征吉兹亚，后半生二十多年都在南方的德干打仗。到十七世纪末，莫卧儿的疆域达到顶峰，从喀布尔一直到印度南部。可马拉塔人始终没有平定，连年战争掏空了国库。一七〇七年，他在德干的艾哈迈德讷格尔去世，享年八十八岁。","a":true,"pts":[["德里",77.21,28.63],["艾哈迈德讷格尔",74.74,19.09,"l"]],"ar":[["莫卧儿最大疆域",77,23,11]]},{"c":29,"y":1700,"cam":[35,15,1.2],"t":"这时世界上最抢手的商品之一，是印度棉布。英语里的白棉布一词，来自印度港口卡利卡特；印花布一词，来自印地语里意为斑点的词。印度棉布在英国太受欢迎，抢了本国毛纺业的生意，英国议会在一七〇〇年和一七二一年两次立法限制它进口和销售。","pts":[["苏拉特",72.83,21.17],["卡利卡特",75.78,11.25],["伦敦",-0.12,51.5,"l"]],"rt":[[[72.6,20.8],[62,12],[52,0],[42,-15],[36,-28],[20,-36.5],[10,-25],[-5,0],[-20,15],[-15,35],[-10.5,44],[-5.5,49.3],[-1,50.2],[1.4,50.9],[1,51.45],[0.3,51.5]]]},{"c":29,"y":1700,"cam":[90,28,1.6],"t":"经济史学家麦迪森估计，一七〇〇年前后，印度次大陆的经济总量约占全世界的四分之一，和清朝中国不相上下。这类数字是根据零散资料推算的，误差很大，也有学者给出不同的估算。但可以肯定，那时的印度和中国都是世界上最富庶的地区。","ar":[["印度",78,22,11],["清朝",108,33,13]]},{"c":29,"y":1722,"cam":[51.6,32.6,7],"t":"阿拔斯一六二九年去世后，萨法维在繁华中渐渐衰弱。一七二二年，阿富汗首领马哈茂德·霍塔克在古尔纳巴德击败萨法维军队，随后围困伊斯法罕。他没有重炮，就切断粮道，城里发生了严重的饥荒。同年十月，萨法维国王出城投降，半个世界之城就此陷落。","pts":[["伊斯法罕",51.67,32.65],["古尔纳巴德",51.6,32.5,"l"]]},{"c":29,"y":1736,"cam":[56,35,5],"t":"乱世中崛起了一位出身寒微的军人，纳迪尔。他来自呼罗珊的阿夫沙尔部落，先是替萨法维王族赶走阿富汗人，又从奥斯曼人手里夺回西部失地，还迫使俄国退出了里海沿岸。一七三六年，他在穆甘草原召集大会，自立为沙阿。因为善战，有历史学家称他为波斯的拿破仑。","pts":[["马什哈德",59.6,36.3],["穆甘草原",48,39.5,"l"]]},{"c":29,"y":1739,"cam":[70,31,4.5],"t":"纳迪尔沙从坎大哈出发，越过开伯尔山口，一七三九年二月在卡尔纳尔大败莫卧儿军队，随后进入德里。城里传出他遇刺的谣言，骚乱中有波斯士兵被杀，纳迪尔沙随即下令屠城。据估计，约六个小时里有两三万人遇害，确切数字已无从查考。","pts":[["坎大哈",65.71,31.61,"l"],["卡尔纳尔",76.98,29.69],["德里",77.21,28.63,"b"]],"rt":[[[65.71,31.61],[68.42,33.55],[69.18,34.53],[70.45,34.43],[71.57,34.01],[72.24,33.89],[74.12,32.44],[76.98,29.69],[77.21,28.63]]]},{"c":29,"y":1739,"cam":[60,40,1.4],"t":"纳迪尔沙带走了莫卧儿几代人的财宝，包括沙贾汗打造、据说造价是泰姬陵两倍的孔雀宝座，和一颗巨钻。传说他见到钻石时惊呼光之山，名字由此而来。宝座在他死后下落不明，可能被拆散了；光之山几经易手，如今镶在英国王室的王冠上，陈列在伦敦塔。","pts":[["德里",77.21,28.63],["伦敦塔",-0.08,51.51,"l"]]},{"c":29,"y":1747,"cam":[70,30,2.2],"t":"一七四七年，纳迪尔沙被自己的部将刺杀，帝国随即瓦解。莫卧儿皇帝还在德里，权力却越来越小，英国东印度公司趁机崛起，那是后面英属印度一章的故事。下一章，我们去东亚，看看武士的日本和朝鲜王朝。","ar":[["萨法维故地",54,33,7],["莫卧儿",78,24,8]]},{"c":30,"y":1392,"cam":[133,36,3.4],"t":"这一章，镜头回到海峡两岸的朝鲜半岛和日本列岛，从十四世纪末一路看到十八世纪末。前面讲到，日本在一一九二年进入武士掌权的幕府时代，半岛上的高丽则熬过了蒙古入侵。现在，海峡两边都要换主人了。","ar":[["朝鲜半岛",127.5,37.5,3.5],["日本列岛",136.5,36,5]]},{"c":30,"y":1392,"cam":[125.8,39,5.5],"t":"一三八八年，高丽将军李成桂奉命北上攻打明朝的辽东，走到鸭绿江中的威化岛，却掉转马头杀回首都开城，夺取了大权。一三九二年，他自己登上王位。新王朝取了个古老的名字：朝鲜，向传说中的古朝鲜致敬，这个国号还得到了明朝皇帝的认可。","pts":[["威化岛",124.42,40.05,"l"],["开城",126.55,37.97]],"rt":[[[124.42,40.05],[125,39.5],[125.75,39.03],[126.1,38.5],[126.55,37.97]]]},{"c":30,"y":1395,"cam":[126.98,37.57,9],"t":"一三九四年，朝鲜决定迁都汉阳，也就是今天的首尔。第二年正宫落成，取《诗经》里的两个字，叫景福宫。这里从此成了半岛的政治中心，今天仍是韩国的首都。景福宫后来毁于一五九二年开始的那场战争，这一章后面会讲到。","pts":[["景福宫",126.98,37.58],["汉阳（今首尔）",126.99,37.55,"b"]]},{"c":30,"y":1400,"cam":[127.5,36.5,5],"t":"朝鲜王朝把儒家理学奉为立国之本，压制在高丽时很兴盛的佛教。做官要考科举，分文科和武科，文官和武官合称两班，后来两班就成了贵族阶层的代称。理论上平民也能应考，可读书要钱要闲，考中的大多还是两班子弟。","a":true,"pts":[["汉阳",126.98,37.57]],"ar":[["朝鲜王朝",127.5,37.5,3.5]]},{"c":30,"y":1397,"cam":[135.74,35.03,9],"t":"海峡对面，日本的武士政权也换了人。镰仓幕府灭亡后，足利氏在京都的室町开设幕府。第三代将军足利义满权势极盛，一三九七年起把京都北山的一座别墅改建成金光闪闪的金阁，今天看到的是一九五〇年遭纵火后重建的。义满还捧红了观阿弥、世阿弥父子的能剧，演员戴着面具，动作缓慢含蓄，这种戏一直演到今天。","pts":[["金阁寺",135.73,35.04,"l"],["室町（幕府所在）",135.76,35.03]]},{"c":30,"y":1446,"cam":[126.98,37.58,9],"t":"前面讲过，一四四六年，朝鲜世宗大王颁布训民正音，也就是今天的韩文字母。它的设计很巧：基本辅音模仿发音器官的形状，比如发「克」音的字母，画的是舌根抵住喉咙；发「姆」音的是个方框，像一张嘴。元音则由代表天、地、人的一点、一横、一竖组合而成。","pts":[["景福宫",126.98,37.58]]},{"c":30,"y":1441,"cam":[126.98,37.57,8],"t":"世宗时代也是朝鲜科技的高峰。一四四一年，朝廷造出测雨器：标准尺寸的铁筒，第二年发往各地，按规定量雨上报。它常被称为世界上最早的标准化雨量计，比英国一六六二年的雨量计早两百多年。这时最有名的发明家蒋英实，出身贱民，造过能自动报时的水钟。","pts":[["汉阳",126.98,37.57]]},{"c":30,"y":1467,"cam":[135.76,35.01,9],"t":"一四六七年，将军家的继承人之争牵动各路大名，在京都打成一场混战，史称应仁之乱。仗打了十一年，京都大半成了废墟。有个流传很广的笑话：京都老人说的「上次打仗」，指的不是二战，而是应仁之乱。此后下级取代上级的「下克上」成了常态，日本进入一百多年的战国时代。","pts":[["京都",135.76,35.01]]},{"c":30,"y":1543,"cam":[130.8,31,6.5],"t":"一五四三年，一艘中国商船被风暴吹到九州南边的种子岛，船上的葡萄牙人带着火绳枪。岛主种子岛时尧买下两支，让刀匠照着仿造。不到十年，日本好几个地方都能造枪，堺和近江国友成了两大产地。日本人干脆把火绳枪叫作种子岛。","pts":[["种子岛",130.98,30.6],["鹿儿岛",130.56,31.6,"l"]]},{"c":30,"y":1549,"cam":[130.3,32.2,6.5],"t":"商人之后是传教士。一五四九年，耶稣会士沙勿略在鹿儿岛登陆，天主教在九州迅速传开，一些大名也受了洗，到十六世纪末，日本信徒约有三十万。葡萄牙人还留下了一些词，比如日语管面包叫「潘」，就来自葡萄牙语。","pts":[["鹿儿岛",130.56,31.6],["长崎",129.87,32.75,"l"]]},{"c":30,"y":1560,"cam":[137,35.1,8],"t":"乱世里，尾张国的织田信长冒了出来。他年轻时衣着古怪、举止出格，被人叫作「尾张的大傻瓜」。一五六〇年，邻国大名今川义元率约两万五千人西进，信长只有两三千人。他借着一场雷雨掩护，突袭今川本阵，在桶狭间斩杀了义元，一战成名。","pts":[["桶狭间",136.99,35.05,"b"],["清洲（信长居城）",136.84,35.22,"l"]]},{"c":30,"y":1575,"cam":[137.55,34.92,9],"t":"一五七五年的长篠之战，织田和德川联军在阵前竖起防马栅栏，用大量火绳枪击败了武田胜赖的军队。流传很广的说法是：三千支枪分三排轮流射击，枪声不断。不过学界多认为三段击是后人的演绎，枪的数目也有争论，武田军其实也有不少枪。","pts":[["长篠城",137.56,34.92]]},{"c":30,"y":1582,"cam":[136,35.1,8],"t":"信长一五七三年把室町幕府的最后一位将军赶出京都，又在琵琶湖边修起豪华的安土城，离统一只差一步。一五八二年，他住在京都本能寺时，部将明智光秀突然起兵来袭，信长在大火中身亡。光秀为什么反叛，至今众说纷纭，是日本史上最有名的谜案之一。","pts":[["安土城",136.14,35.16],["本能寺",135.76,35.01,"l"]]},{"c":30,"y":1590,"cam":[137.3,35.1,4.8],"t":"替信长报仇的是部将丰臣秀吉。秀吉的父亲据说只是个足轻，也就是步兵，他从给信长提草鞋做起，一路爬到了天下人的位置。一五八八年，他下令收缴农民的刀枪，叫刀狩，让农民只管种地、武士只管打仗。一五九〇年他攻下关东的小田原，第二年平定东北的叛乱，日本基本统一。","pts":[["大阪城",135.53,34.69,"b"],["小田原",139.15,35.25]]},{"c":30,"y":1592,"cam":[127.8,36.6,4.2],"t":"统一之后，秀吉扬言要征服明朝，要求朝鲜借道，遭到拒绝。一五九二年，约十五万日军从九州的名护屋出发，在釜山登陆。朝鲜称之为壬辰倭乱，日本称文禄之役，中国称万历朝鲜之役。日军装备大量火绳枪，不到二十天就攻入汉阳，国王宣祖一路向北逃往义州，平壤也随之失守。","pts":[["名护屋城",129.87,33.54],["釜山",129.04,35.1],["汉阳",126.98,37.57,"l"],["平壤",125.75,39.03,"l"]],"rt":[[[129.87,33.55],[129.95,33.9],[129.7,34.75],[129.05,35.08]],[[129.04,35.1],[128.6,35.87],[127.9,36.6],[126.98,37.57],[126.4,38.3],[125.75,39.03]]]},{"c":30,"y":1592,"cam":[128.1,34.85,7.5],"t":"陆上节节败退，海上却是另一番景象。全罗道水军将领李舜臣率领的舰队接连获胜。他改进的龟船顶上盖着护板、插着尖刺，敌兵难以跳帮登船，船头还装着龙头。一五九二年夏天的闲山岛海战，日本水军损失惨重，此后不敢轻易沿南海岸西进。","pts":[["闲山岛",128.48,34.77],["丽水（李舜臣驻地）",127.66,34.76,"l"],["泗川",128.06,35,"t"]]},{"c":30,"y":1593,"cam":[125.8,39,5.5],"t":"各地儒生和百姓自发组织义兵，连僧人也拿起了武器，高僧休静号召了至少八千名僧兵。明朝应朝鲜请求出兵，一五九三年初，李如松率领的明军和朝鲜军队一起收复了平壤。此后战线在半岛南部僵持，双方转入了漫长的议和谈判。","pts":[["义州",124.53,40.2,"l"],["平壤",125.75,39.03],["汉阳",126.98,37.57]],"rt":[[[124.45,40.1],[124.9,39.8],[125.4,39.4],[125.75,39.05]]]},{"c":30,"y":1597,"cam":[126.3,34.6,8],"t":"议和破裂，一五九七年日军再次进攻，朝鲜称丁酉再乱，日本称庆长之役。这年夏天，朝鲜水军在漆川梁几乎全军覆没。重新起用的李舜臣手里只剩十三艘战船，他利用鸣梁海峡湍急的潮流，挡住了一百多艘日本战船，击毁击伤数十艘。","pts":[["鸣梁海峡",126.31,34.57]]},{"c":30,"y":1598,"cam":[127.85,34.92,8],"t":"一五九八年九月，丰臣秀吉在伏见城病死，日军开始撤退。十二月，李舜臣与明朝将领陈璘、邓子龙率联合舰队，在露梁海峡截击撤退的日军。激战中邓子龙战死，李舜臣也中弹身亡。据记载，他临终叮嘱：战事正急，不要宣布我的死讯。","pts":[["露梁海峡",127.87,34.94]]},{"c":30,"y":1598,"cam":[131,35.5,5],"t":"七年战争给朝鲜半岛带来了巨大的破坏。有估计说，朝鲜军民死亡可能多达上百万，耕地减少约三分之一，景福宫等宫殿被焚毁。日军以割下的鼻子充当战功凭证运回日本，京都至今留有一座耳冢，据说埋着数万朝鲜人和明朝人的鼻子。","pts":[["汉阳",126.98,37.57],["耳冢（京都）",135.77,34.99]],"ar":[["朝鲜半岛",127.8,36.5,2.5]]},{"c":30,"y":1616,"cam":[129.8,34,6],"t":"日军还掳走了大批朝鲜人，估计有五六万，其中不少被转卖给葡萄牙商人。被带到九州的陶工建起窑场，据传李参平在有田一带找到瓷土，一般认为一六一六年前后，日本开始烧制瓷器，几十年后有田瓷还经荷兰人远销欧洲。这场战争因此也被称为「陶瓷战争」。","pts":[["有田",129.88,33.19],["釜山",129.04,35.1]]},{"c":30,"y":1600,"cam":[137.3,35.4,5.5],"t":"秀吉死时，儿子秀赖才五岁。辅政的德川家康趁势而起，一六〇〇年十月，东西两军在关原决战，西军有将领临阵倒戈，家康大胜。一六〇三年，家康受封征夷大将军，在江户开设幕府。一六一五年，他攻陷大阪城，丰臣家灭亡。也是在一六〇三年，京都的出云阿国跳起新奇的舞蹈，一般认为这就是歌舞伎的开端。","pts":[["关原",136.47,35.37,"b"],["大阪城",135.53,34.69,"l"],["江户",139.75,35.69]]},{"c":30,"y":1607,"cam":[133.5,35.3,5],"t":"战后，急于恢复贸易的对马岛主宗氏在中间斡旋。一六〇七年，朝鲜使团前往日本，两国恢复邦交。从一六〇七年到一八一一年，朝鲜共派出十二次使团，后来通称朝鲜通信使，每次三五百人。沿途日本文人争相向使团求诗求字。相关记录二〇一七年入选世界记忆名录。","pts":[["汉阳",126.98,37.57,"l"],["对马",129.29,34.2,"l"],["江户",139.75,35.69]],"rt":[[[126.98,37.57],[127.9,36.6],[128.6,35.87],[129.04,35.1],[129.7,34.75],[130.3,34.1],[130.93,33.95],[131.6,33.9],[132.2,33.82],[133,34.25],[133.8,34.4],[134.5,34.6],[135.2,34.6],[135.45,34.66],[135.76,35.01],[136.9,35.17],[138.38,34.97],[139,35.1],[139.75,35.69]]]},{"c":30,"y":1635,"cam":[137.6,35.2,5],"t":"为了管住各地大名，幕府在一六三五年把参勤交代定为制度：大名要隔年到江户住一年，妻子和继承人则常住江户，形同人质。大名的队伍浩浩荡荡往返，开销巨大，让他们没钱造反，却带旺了沿途的驿站和道路。到十八世纪初，江户人口估计超过一百万，是当时世界上最大的城市之一。","pts":[["京都",135.76,35.01,"l"],["江户",139.75,35.69]],"rt":[[[135.76,35.01],[136.5,34.95],[136.9,35.1],[137.7,34.71],[138.38,34.97],[139,35.1],[139.62,35.45],[139.75,35.68]]]},{"c":30,"y":1636,"cam":[125.3,39.6,4],"t":"朝鲜的北方也不太平。东北的女真人崛起，建立后金。一六二七年后金攻入朝鲜，迫使朝鲜结为兄弟之国。一六三六年，后金已改国号为清，皇太极亲率大军再次入侵，史称丙子胡乱。国王仁祖退守南汉山城，被围四十多天后，在汉江边的三田渡出城投降。","pts":[["沈阳（盛京）",123.43,41.8],["南汉山城",127.18,37.48]],"rt":[[[123.43,41.8],[124.4,40.1],[125.75,39.03],[126.6,38],[127.1,37.52]]]},{"c":30,"y":1637,"cam":[130.15,32.65,8],"t":"日本这边，幕府从一六一四年起在全国禁止天主教。一六三七年，九州岛原、天草一带的农民不堪重税和迫害，奉十六岁左右的少年天草四郎为首起义，据守原城。次年城破，起义者连同家属死者数以万计。此后幕府更严厉地搜捕信徒，许多人转入地下。","pts":[["原城",130.26,32.63],["长崎",129.87,32.75,"l"]]},{"c":30,"y":1641,"cam":[133,34,2.3],"t":"一六三九年，幕府禁止葡萄牙船来日。一六四一年起，荷兰人被搬到长崎港内一座扇形人工岛出岛，长约一百二十米，散个步几分钟就走完了。这就是后人说的锁国，但日本并未完全关门：长崎对荷兰和中国，对马对朝鲜，萨摩对琉球，松前对阿伊努人，学者称之为四个口。","pts":[["出岛（长崎）",129.87,32.74,"l"],["对马",129.29,34.2,"l"],["鹿儿岛（萨摩）",130.56,31.6],["松前",140.1,41.43]],"ar":[["琉球王国",127.8,26.4,1.4]]},{"c":30,"y":1689,"cam":[139.3,37.4,4.6],"t":"江户时代长久的和平，让文化在城市里开花。俳句诗人松尾芭蕉一六八六年写下名句：古池塘，青蛙跳进水里的声音。一六八九年，他从江户出发，徒步游历东北和北陆，约一百五十天走了约两千四百公里，写成游记《奥之细道》。差不多同时，英国的牛顿出版了《自然哲学的数学原理》，后面会讲到。","pts":[["深川（江户）",139.8,35.68],["平泉",141.12,38.99],["大垣",136.62,35.36,"l"]],"rt":[[[139.8,35.68],[139.6,36.75],[140.2,37.1],[141.06,38.37],[141.12,38.99],[140.44,38.31],[139.91,39.21],[138.9,37.9],[137.2,36.9],[136.66,36.56],[136.62,35.36]]]},{"c":30,"y":1703,"cam":[139.77,35.67,10],"t":"一七〇一年，赤穗藩主浅野长矩在江户城内拔刀砍伤礼仪官吉良义央，当天就被命令切腹，领地没收。一七〇三年初，四十七名失去主君的赤穗浪人夜袭吉良宅邸，杀死吉良，把首级供到泉岳寺主君墓前。幕府随后命令其中四十六人切腹。这个故事后来被改编成戏剧《忠臣藏》，演了近三百年。","pts":[["吉良宅邸",139.79,35.69],["泉岳寺",139.74,35.64,"l"]]},{"c":30,"y":1765,"cam":[139.77,35.68,9],"t":"江户的市井生活也画进了浮世绘。浮世原本是佛教说的人间苦海，后来变成及时行乐的都市生活。浮世绘多是木版画，能大量印刷，便宜得像今天的海报。一七六五年，铃木春信做出了多色套印的锦绘。十九世纪它传到欧洲，梵高就收藏和临摹过浮世绘。","pts":[["江户",139.77,35.68]]},{"c":30,"y":1774,"cam":[134.5,34.3,5],"t":"一七二〇年，将军德川吉宗放宽了西方书籍的进口，只要和天主教无关就行，日本人开始通过荷兰语学习西方学问，叫兰学。一七七一年，医生杉田玄白等人观看尸体解剖，发现荷兰解剖书画得比中医旧图准确，便发愤翻译，一七七四年出版了《解体新书》。","pts":[["出岛",129.87,32.74,"l"],["江户",139.75,35.69]]},{"c":30,"y":1776,"cam":[126.99,37.58,9],"t":"海峡这边的朝鲜，十八世纪迎来了中兴。英祖在位五十二年，是朝鲜在位最久的国王，他努力调和激烈的党争。但他和儿子思悼世子关系恶化，一七六二年下令把世子关进米柜，第八天世子死去。一七七六年，世子的儿子正祖即位，设立了奎章阁，招揽有学问的人。","pts":[["昌德宫",126.99,37.58]]},{"c":30,"y":1796,"cam":[127.01,37.28,9],"t":"一七八九年，正祖把父亲思悼世子的墓迁到水原，又在旁边修建新城华城。一七九四年开工，一七九六年完工，据说原计划十年的工程不到三年就完成了。设计者丁若镛参考从中国传入、介绍西方力学的《奇器图说》，设计了用滑轮吊起大石块的举重机。丁若镛后来成了朝鲜实学的代表人物。","pts":[["华城（水原）",127.02,37.29]]},{"c":30,"y":1796,"cam":[131,36,3.2],"t":"华城的工期、人工、花费和机械都详细记在《华城城役仪轨》里，一九九七年华城列入世界遗产。丙子胡乱之后，海峡两岸都过了一百多年太平日子。可外面的世界正在剧变，半个多世纪后，西方的蒸汽船就会开到门口，后面会讲到。现在，先把时钟拨回一五一七年的欧洲，那里刮起了一场信仰与科学的风暴。","ar":[["朝鲜半岛",127.5,37.5,3.5],["日本列岛",136.5,36,5]]},{"c":31,"y":1517,"cam":[12.6,51.9,9],"t":"一千五百一十七年，德国维滕堡的神学教授马丁·路德写下《九十五条论纲》，批评教会出售赎罪券。传说他把论纲钉在了教堂大门上，这个细节学界有争论。可以确定的是，多亏了印刷机，论纲几周之内就传遍了德意志，一场宗教改革就此爆发。","pts":[["维滕堡",12.65,51.87]]},{"c":31,"y":1521,"cam":[9,50.5,7],"t":"一千五百二十一年，路德在沃尔姆斯帝国议会上拒绝收回主张，随后躲进瓦特堡，把《新约》译成了德语。他的译本让普通人也能读圣经，对现代德语的形成影响深远。此后新教分出许多派别，欧洲的宗教版图被彻底改写。","pts":[["沃尔姆斯",8.36,49.63,"l"],["瓦特堡",10.31,50.97]],"rt":[[[8.4,49.6],[9.2,50.2],[10.3,50.95]]]},{"c":31,"y":1618,"cam":[8,50,4],"t":"在英格兰，国王亨利八世因为离婚问题与教皇闹翻，在一千五百三十四年成为英格兰教会的首脑。宗教分歧还引发了一连串战争，其中最惨烈的是一千六百一十八年到一千六百四十八年的三十年战争，德意志的一些地区人口损失了三分之一甚至更多。","pts":[["伦敦",-0.12,51.5,"l"],["布拉格",14.42,50.09]],"ar":[["神圣罗马帝国",11,50,5]]},{"c":31,"y":1648,"cam":[60,42,1.5],"t":"一千六百四十八年签订的威斯特伐利亚和约结束了三十年战争，许多学者把它视为近代主权国家体系的起点。同一时期，明朝在一千六百四十四年灭亡，清朝入关。欧亚大陆两端几乎在同一个十年里完成了秩序重组，有学者认为，当时的小冰期气候异常给双方都雪上加霜。","pts":[["明斯特（威斯特伐利亚）",7.63,51.96,"l"],["北京",116.4,39.9]]},{"c":31,"y":1543,"cam":[19,53,6],"t":"宗教改革的同时，人们看宇宙的方式也在改变。一千五百四十三年，哥白尼出版《天体运行论》，提出地球绕着太阳转。传说他在临终的病床上才看到印好的书。几十年后，开普勒发现，行星的轨道不是正圆，而是椭圆。","pts":[["弗龙堡（哥白尼）",19.69,54.36],["布拉格（开普勒）",14.42,50.09,"l"]]},{"c":31,"y":1610,"cam":[11,44,7],"t":"一千六百一十年，伽利略用改进的望远镜看到了木星的四颗卫星、月球上的山，后来又观测到金星的盈亏，有力地支持了日心说。一千六百三十三年，他受到宗教裁判所审判，被迫放弃观点，余生在软禁中度过。直到一千九百九十二年，罗马教廷才正式承认当年的处理有误。","pts":[["帕多瓦",11.88,45.41],["罗马",12.5,41.9]]},{"c":31,"y":1687,"cam":[-0.5,52.5,7],"t":"一千六百八十七年，牛顿出版《自然哲学的数学原理》，用万有引力和三大运动定律，把天上和地上的运动统一了起来。苹果的故事确实来自牛顿晚年自己的讲述，不过苹果砸到头上，多半是后人加的戏。一个用数学描述世界的新时代开始了。","pts":[["剑桥",0.12,52.2],["伍尔斯索普（牛顿故乡）",-0.63,52.81,"l"]]},{"c":31,"y":1607,"cam":[110,30,3.2],"t":"这些西方学问也在向东方流动。意大利传教士利玛窦一千五百八十二年来到中国，后来定居北京，绘制了《坤舆万国全图》，让很多中国士人第一次看到五大洲。他和徐光启合作翻译了《几何原本》的前六卷，一般认为，几何这个学科名就来自这部译作。","pts":[["澳门",113.54,22.19],["北京",116.4,39.9]],"rt":[[[113.5,22.2],[113.3,23.1],[114.5,27],[115.9,28.7],[118.8,32.1],[117.2,36],[116.4,39.8]]]},{"c":31,"y":1616,"cam":[60,35,1.4],"t":"还有一个巧合：一千六百一十六年，英国的莎士比亚、西班牙的塞万提斯和中国的汤显祖在同一年去世。写《罗密欧与朱丽叶》的和写《牡丹亭》的，都在写爱情如何冲破束缚。同一时期，日本进入德川幕府时代，不久之后，印度莫卧儿王朝开始修建泰姬陵。","pts":[["伦敦（莎士比亚）",-0.12,51.5,"l"],["马德里（塞万提斯）",-3.7,40.42,"l"],["临川（汤显祖）",116.36,27.95],["江户",139.69,35.69],["阿格拉",78.04,27.18]]},{"c":32,"y":1547,"cam":[37.62,55.75,5],"t":"这一章，镜头回到莫斯科。前面讲到伊凡三世摆脱了金帐汗国，有修士把莫斯科称作「第三罗马」。他的孙子伊凡四世三岁继位，一五四七年一月，十六岁的他加冕为「沙皇」。这个词源自拉丁语的「凯撒」，意思是：我不只是大公，我是皇帝。","pts":[["莫斯科",37.62,55.75],["克里姆林宫",37.62,55.75,"b"]],"ar":[["莫斯科国",39,57,6]]},{"c":32,"y":1552,"cam":[44,52,3.4],"t":"一五五二年十月，伊凡四世的大军围城一个多月，攻下了喀山汗国的都城喀山。几年后，下游的阿斯特拉罕汗国也被并入。从此，伏尔加河从上游直到里海都归莫斯科掌控，许多鞑靼人和其他民族也成了沙皇的臣民。","pts":[["莫斯科",37.62,55.75,"l"],["喀山",49.11,55.79],["阿斯特拉罕",48.03,46.35]],"rt":[[[37.62,55.75],[40.4,56.13],[44,56.33],[47,56.1],[49.11,55.79]],[[49.11,55.79],[48.6,54],[46,51.5],[44.5,48.7],[46.5,47.5],[48.03,46.35]]]},{"c":32,"y":1555,"cam":[37.623,55.7525,10],"t":"为了纪念攻下喀山，伊凡四世在红场边修了一座教堂，一五五五年动工，一五六一年完工，就是今天的圣瓦西里大教堂。传说沙皇刺瞎了建筑师，免得他再造一座同样美的。可史料显示，建筑师后来还在别处主持施工，这多半只是个传说。","pts":[["圣瓦西里大教堂",37.6231,55.7525],["红场",37.6208,55.7539,"l"]]},{"c":32,"y":1553,"cam":[22,62,2.4],"t":"同一时期，一支英国船队想绕过欧洲北端去中国，在挪威外海遇上风暴。一五五三年，船长钱塞勒的船漂进白海，他坐雪橇来到莫斯科，受到伊凡四世接见。中国没去成，英俄贸易倒是开张了，伦敦商人的这家公司从此专做俄国生意，人称莫斯科公司。","pts":[["伦敦",-0.13,51.51,"l"],["北德维纳河口",40.5,64.6],["莫斯科",37.62,55.75]],"rt":[[[0.5,51.5],[2.5,52.8],[4,56],[4.2,60],[4.5,62],[8.5,64.5],[11.5,67.4],[16.5,70],[25.5,71.6],[31,70.8],[37,69.6],[42,67.8],[41.8,66.9],[41.2,66.55],[40,66.2],[39.5,65.6],[39.4,65],[40,64.7],[40.5,64.6]],[[40.5,64.6],[41.8,64.2],[40.5,61.5],[39.9,59.2],[38.5,57.6],[37.62,55.75]]]},{"c":32,"y":1565,"cam":[38,56.3,6],"t":"伊凡四世越来越多疑。一五六五年，他推行「特辖制」，划出一块国土归自己直辖，组建效忠他个人的特辖军。据记载，他们身穿黑衣，马鞍上挂着狗头和扫帚，意思是嗅出叛徒、扫除叛徒。大批贵族、教士和平民被处死或流放。","pts":[["莫斯科",37.62,55.75],["亚历山德罗夫",38.71,56.4]]},{"c":32,"y":1570,"cam":[36,57,4.4],"t":"一五七〇年，特辖军以叛变的罪名血洗诺夫哥罗德。被害人数，当时的编年史说有六万，现代学者多估计为两三千人。第二年，克里米亚汗国的军队攻到莫斯科城下，大火几乎烧毁了整座城市。一五七二年，特辖制被废除。","pts":[["诺夫哥罗德",31.27,58.52],["莫斯科",37.62,55.75]]},{"c":32,"y":1581,"cam":[33,57.5,4.2],"t":"伊凡四世的晚年满是阴影。为争夺波罗的海出海口打的立窝尼亚战争拖了二十多年，最后以失败告终。一五八一年十一月，他在争吵中用权杖击中了儿子伊凡的头部，儿子没几天就死了。他的俄语外号「格罗兹内」，意思是「令人畏惧的」。","pts":[["亚历山德罗夫",38.71,56.4],["纳尔瓦",28.19,59.38,"l"]],"ar":[["立窝尼亚",25,57.5,3]]},{"c":32,"y":1582,"cam":[62,59,4],"t":"乌拉尔山西麓，富商斯特罗加诺夫家族靠煮盐起家，得到沙皇特许开发卡马河一带。他们资助哥萨克首领叶尔马克东征。一五八二年，叶尔马克带着几百人翻过乌拉尔山，顺河而下，攻占西伯利亚汗国的都城卡什雷克。几年后，他在额尔齐斯河上遭库楚姆汗夜袭身亡。","pts":[["斯特罗加诺夫领地",56.25,59.4,"l"],["卡什雷克",68.4,58.13]],"ar":[["西伯利亚汗国",68,57,3.5]],"rt":[[[57.8,58.1],[59,58.3],[60.3,58.6],[62,58],[64.5,57.6],[66.5,58],[68.3,58.15]]]},{"c":32,"y":1601,"cam":[37.62,55.75,5],"t":"伊凡四世的继承人费奥多尔体弱无子，一五九八年去世，从留里克传下来的王族主支就此断绝。俄国陷入「混乱时期」：一六〇一年起连年饥荒，据估计死了约三分之一的人；冒充王子的人一个接一个出现，有一位还真坐上了皇位。","pts":[["莫斯科",37.62,55.75]]},{"c":32,"y":1613,"cam":[41,55.5,4.6],"t":"波兰-立陶宛的军队一度占领克里姆林宫。下诺夫哥罗德的肉商米宁和波扎尔斯基公爵组织民兵，一六一二年秋收复了它。次年二月，缙绅会议推举十六岁的米哈伊尔·罗曼诺夫为沙皇，罗曼诺夫王朝由此开始，一直延续到一九一七年。三年后，努尔哈赤在中国东北建立后金。","pts":[["下诺夫哥罗德",44,56.33],["莫斯科",37.62,55.75,"l"]],"rt":[[[44,56.33],[41,56.2],[40.4,56.13],[38.6,56],[37.62,55.75]]]},{"c":32,"y":1620,"cam":[90,60,2],"t":"推动俄国人一路向东的是毛皮，尤其是紫貂皮，人称「软黄金」。十七世纪中叶，西伯利亚毛皮一度占到国家收入的一成以上。哥萨克和猎人沿着大河前进，每到一处就建一座木堡，向当地原住民征收毛皮实物税「雅萨克」，还常常扣押人质逼他们交纳。","a":true,"pts":[["托博尔斯克",68.25,58.2],["叶尼塞斯克",92.17,58.45]],"ar":[["西伯利亚的森林",100,62,12]]},{"c":32,"y":1639,"cam":[110,60,1.9],"t":"扩张快得惊人：一五八七年建托博尔斯克，一六一九年建叶尼塞斯克，一六三二年建雅库茨克。一六三九年，莫斯克温带领的哥萨克小队来到鄂霍次克海边。从翻越乌拉尔算起，不到六十年，俄国人就走到了太平洋。","pts":[["托博尔斯克",68.25,58.2,"l"],["叶尼塞斯克",92.17,58.45,"b"],["雅库茨克",129.73,62.03],["鄂霍次克",143.24,59.36]],"rt":[[[68.25,58.2],[73.4,57],[79,58.5],[84.95,56.49],[89,58],[92.17,58.45],[97,58],[102,57.5],[105.7,56.8],[108.5,57.5],[114,59.5],[120,60.5],[125,61.3],[129.73,62.03],[135,61],[138.5,60.2],[141.5,59.4],[143.24,59.36]]]},{"c":32,"y":1650,"cam":[125,62,3],"t":"对西伯利亚的原住民来说，这是天翻地覆的变化。雅库特人、埃文基人等被迫纳贡，反抗遭到镇压。天花等外来疾病打击更大，有学者估计，十七世纪五十年代的疫情中，有些族群死了多达八成。许多原住民族群的人口从此长期下降。","a":true,"pts":[["雅库茨克",129.73,62.03]],"ar":[["雅库特人",128,63,5],["埃文基人",110,60,6]]},{"c":32,"y":1648,"cam":[-178,66.5,3.6],"t":"一六四八年，哥萨克杰日尼奥夫等人驾着木船从北冰洋的科雷马河口出发，向东绕过亚洲的最东端，穿过海峡来到太平洋一侧。七条船出发，只有他那条到了南边。这比白令早了八十年，可他的报告在雅库茨克档案里躺了近九十年才被发现。","p":"p","pts":[["科雷马河口",161.3,69.5],["杰日尼奥夫角",-169.65,66.08],["阿纳德尔河",177.5,64.75,"b"]],"rt":[[[161.3,69.6],[166,70.4],[172,70.6],[178,69.9],[-176,68.6],[-172,67.5],[-169.3,66.4],[-170.3,65],[-172.5,64],[-177,63.6],[179,64.3],[177.6,64.7]]]},{"c":32,"y":1649,"cam":[37.62,55.75,7],"t":"回到莫斯科。一六四八年，盐税激起了暴动。第二年，缙绅会议通过一部新法典，最要紧的一条，是取消追捕逃亡农民的期限：农民逃到哪里、逃了多少年，都能被抓回去。农奴制从此牢牢固定下来，要到一八六一年才废除，后面会讲到。","pts":[["莫斯科",37.62,55.75]]},{"c":32,"y":1666,"cam":[37,61,3.4],"t":"一六五〇年代，牧首尼康按希腊礼仪修改俄国的经书和仪式，比如画十字从两根手指改成三根。许多人坚决不改，被称为「旧礼仪派」。一六六六年起的宗教会议把旧礼仪定为异端，信众遭到迫害，不少人逃进北方森林和西伯利亚深处。","pts":[["莫斯科",37.62,55.75],["索洛韦茨基修道院",35.71,65.02]]},{"c":32,"y":1689,"cam":[120,46,3],"t":"俄国人沿黑龙江南下，与清朝发生冲突，清军两次围攻雅克萨。一六八九年，双方在尼布楚签订条约，划定东段边界。有意思的是，正式文本用的是拉丁文，康熙皇帝一方的翻译是两位耶稣会传教士。这是中国与西方国家签订的第一个正式条约。","pts":[["尼布楚",116.52,51.98,"l"],["雅克萨",124.2,53.4],["北京",116.4,39.9]],"ar":[["黑龙江流域",128,50,4]]},{"c":32,"y":1697,"cam":[20,55,2.8],"t":"一六八九年，十七岁的彼得从摄政的姐姐手里夺回大权。一六九七年，他派出约两百五十人的「大使团」出访西欧，自己化名彼得·米哈伊洛夫混在里面。可他身高约两米，实在藏不住。在荷兰，他到东印度公司的船厂当木匠，亲手造船。","pts":[["莫斯科",37.62,55.75],["阿姆斯特丹",4.9,52.37,"l"]],"rt":[[[37.62,55.75],[32,56.3],[28.3,57.8],[24.1,56.95],[20.5,54.7],[17,53.5],[13.4,52.5],[9.7,52.4],[4.9,52.37]]]},{"c":32,"y":1698,"cam":[-0.03,51.48,9],"t":"随后他来到英国，借住在作家伊夫林的庄园，好就近去船厂。一行人走后，房子被糟蹋得一塌糊涂：窗户破了，椅子丢了，花园也毁了。维修清单上还有一项「被沙皇弄坏的手推车」，据说他喜欢坐着手推车往树篱里冲。","pts":[["德特福德船厂",-0.03,51.48]]},{"c":32,"y":1698,"cam":[37.62,55.75,7],"t":"一六九八年，射击军叛乱的消息传来，彼得匆匆回国，处决了大批射击军。据说他还亲手剪掉了大臣们的胡子；后来想留胡子得交胡子税，领一枚铜牌随身带着，上面写着「钱已收讫」。他还改了历法，从一七〇〇年起，以一月一日为新年。","pts":[["莫斯科",37.62,55.75]]},{"c":32,"y":1703,"cam":[29.3,59.7,6.5],"t":"为了夺取波罗的海出海口，彼得向瑞典开战。一七〇〇年，俄军在纳尔瓦被年轻的瑞典国王卡尔十二世打得大败。彼得重整军队，夺下涅瓦河口。一七〇三年五月，他在河口的兔子岛上修起彼得保罗要塞，圣彼得堡由此诞生。","pts":[["纳尔瓦",28.19,59.38,"l"],["彼得保罗要塞",30.32,59.95]]},{"c":32,"y":1712,"cam":[30.32,59.94,9],"t":"这里原本是沼泽地。从全国征来的农奴在泥水里打桩、挖渠，修建新城，疾病、寒冷和饥饿夺去了大量劳工的生命，一般说死者有数万人，确切数字难以考证。一七一二年，彼得把首都迁到这里，圣彼得堡做首都一直到一九一八年。","pts":[["圣彼得堡",30.32,59.94]]},{"c":32,"y":1709,"cam":[32,48.5,5],"t":"一七〇九年夏，卡尔十二世深入到波尔塔瓦，哥萨克首领马泽帕也站到了他这边。瑞典军远道而来，刚熬过一个罕见的严冬，国王本人脚上中弹，只能坐担架指挥。俄军大胜，卡尔十二世逃进奥斯曼帝国，瑞典从此失去了北欧强国的地位。","pts":[["波尔塔瓦",34.55,49.59],["本德尔",29.48,46.83,"l"]],"rt":[[[34.55,49.59],[34.1,49.1],[33.6,48.9],[32.4,48.2],[30.8,47.4],[29.48,46.83]]]},{"c":32,"y":1721,"cam":[26,60,5],"t":"一七二一年，俄瑞签订尼斯塔德和约，俄国得到波罗的海东岸的大片土地。同年，彼得接受「全俄罗斯皇帝」的称号，俄国从此称为俄罗斯帝国，不过人们依旧习惯叫沙皇。他还颁布官秩表，让人按功劳和资历一级级往上升。","pts":[["尼斯塔德",21.41,60.8,"l"],["圣彼得堡",30.32,59.94],["里加",24.11,56.95]]},{"c":32,"y":1741,"cam":[-170,57,2.4],"t":"彼得临终前派丹麦人白令去查明亚洲和美洲是否相连。一七二八年，白令穿过了后来以他命名的海峡，因冰情掉头，没看到美洲。一七四一年他再次出航，望见了阿拉斯加的圣伊莱亚斯山。返航时船在一座荒岛搁浅，白令死在了那里。","p":"p","pts":[["彼得罗巴甫洛夫斯克",158.65,53.02,"l"],["白令岛",166.2,55.2,"b"],["圣伊莱亚斯山",-140.93,60.29]],"rt":[[[158.65,53],[165,51.5],[175,51],[-172,52],[-160,54],[-150,57.5],[-141,59.6]]]},{"c":32,"y":1741,"cam":[166.2,55.1,8],"t":"随船的博物学家斯特勒在岛上记下了一种巨大的海牛，体长可达九米，性情温和，靠吃海藻过活，后来就叫斯特勒海牛。消息传开后，猎人们纷纷来岛上捕杀它们吃肉。从被发现算起，仅仅二十七年，这种动物就灭绝了。","pts":[["白令岛",166.2,55.2]]},{"c":32,"y":1755,"cam":[40,60,3.6],"t":"一七三〇年，白海附近一个渔民的儿子、十九岁的罗蒙诺索夫步行来到莫斯科求学。他后来成了化学家、诗人和语法学家，还在观测金星凌日时推断金星有大气。一七五五年，他参与创办了莫斯科大学，今天这所大学就以他的名字命名。","pts":[["霍尔莫戈雷",41.79,64.22],["莫斯科",37.62,55.75,"l"]],"rt":[[[41.79,64.22],[41,62.5],[40.2,60.8],[39.9,59.22],[38.6,57.6],[37.62,55.75]]]},{"c":32,"y":1762,"cam":[23,56,4.8],"t":"一七四四年，什切青出生的德意志小公主索菲亚，十四岁远嫁俄国，改信东正教，改名叶卡捷琳娜。她的丈夫彼得三世即位才半年，一七六二年夏，她就在近卫军支持下发动政变登上皇位。几天后，被幽禁的彼得三世死去，死因成谜。","pts":[["什切青",14.55,53.43,"l"],["圣彼得堡",30.32,59.94]],"rt":[[[14.55,53.43],[18,54.2],[20.5,54.7],[24.1,56.95],[27,58.5],[30.32,59.94]]]},{"c":32,"y":1764,"cam":[30.3146,59.9398,10],"t":"叶卡捷琳娜自认是启蒙的君主，和伏尔泰通信约十五年。听说狄德罗要卖藏书给女儿凑嫁妆，她买下全部藏书，却让狄德罗留着用，还付他「管理员」薪水。一七六四年，她买下两百多幅油画，这被看作埃尔米塔日博物馆的起点。","pts":[["冬宫",30.3146,59.9398]]},{"c":32,"y":1767,"cam":[42,54,3.4],"t":"可启蒙的光，照不到农奴身上。地主可以把不听话的农奴送去西伯利亚服苦役；一七六七年的法令规定，农奴向女皇告主人的状，要受鞭刑并被流放。农奴可以被买卖、被当作礼物赏人。这一时期，农奴制非但没有松动，反而加重了。","pts":[["莫斯科",37.62,55.75]],"ar":[["农奴制的核心地区",40,55,6]]},{"c":32,"y":1773,"cam":[51,53.5,4],"t":"一七七三年，顿河哥萨克普加乔夫自称是「死里逃生的彼得三世」，在亚伊克河一带举兵，许诺废除农奴制。哥萨克、农奴、矿工、巴什基尔人等纷纷加入，起义军一度攻进喀山。一七七五年初，普加乔夫在莫斯科被处死。","pts":[["亚伊克镇",51.37,51.23,"l"],["奥伦堡",55.1,51.77],["喀山",49.11,55.79]],"ar":[["起义地区",52,53.5,4]]},{"c":32,"y":1783,"cam":[34,45.2,6],"t":"南边，俄国和奥斯曼帝国反复交战。一七七四年的和约让克里米亚汗国脱离奥斯曼，名义上独立；一七八三年，俄国正式吞并了它，并在半岛西南的港湾建起塞瓦斯托波尔，作为黑海舰队的基地。此后许多克里米亚鞑靼人迁往奥斯曼帝国。","pts":[["巴赫奇萨赖",33.86,44.75],["塞瓦斯托波尔",33.52,44.6,"l"]],"ar":[["克里米亚汗国",34.3,45.3,1.5]]},{"c":32,"y":1784,"cam":[-165,57,2.6],"t":"毛皮生意也越过了白令海。猎人们为海獭皮追到阿留申群岛和阿拉斯加，一七八四年在科迪亚克岛建起定居点，一七九九年俄美公司成立，垄断这里的买卖。阿留申人被迫替他们猎海獭，加上疾病，人口锐减。到了一八六七年，俄国把阿拉斯加卖给了美国。","p":"p","pts":[["鄂霍次克",143.24,59.36,"l"],["科迪亚克岛",-153.4,57.4],["锡特卡",-135.33,57.05]],"ar":[["阿留申群岛",-175,52,4]]},{"c":32,"y":1787,"cam":[33,48.3,4.6],"t":"一七八七年，女皇坐船沿第聂伯河南巡。后来流传一个说法：宠臣波将金沿岸搭起假村庄，让人扮成富足的农民，船一过就拆了，搬到下游再搭。这个「波将金村」的故事出自一位没有随行的外交官，史学家多认为是夸大的传说。","pts":[["基辅",30.52,50.45,"l"],["赫尔松",32.62,46.64,"l"]],"rt":[[[30.52,50.45],[31.8,49.6],[33.4,49.07],[35,48.45],[35.1,47.8],[34.3,47.5],[33.4,46.8],[32.62,46.64]]]},{"c":32,"y":1795,"cam":[23,52.5,4],"t":"西边的波兰-立陶宛联邦，在一七七二年、一七九三年和一七九五年被俄国、普鲁士和奥地利三次瓜分，从地图上消失了，俄国分到的土地最多，约占六成。波兰人在一七九四年起义抵抗，没有成功，直到一九一八年才重新建国。","pts":[["华沙",21.01,52.23],["维尔纽斯",25.28,54.69],["克拉科夫",19.94,50.06,"l"]],"ar":[["波兰-立陶宛联邦",24,52.5,5]]},{"c":32,"y":1796,"cam":[90,58,1.3],"t":"一七九六年十一月，叶卡捷琳娜二世去世，后人称她「大帝」。两百五十年间，莫斯科从东欧平原上的一个国家，变成了横跨欧亚、从波罗的海一直到太平洋的帝国。就在女皇在位的年代，英国人库克三次远航，走遍了南方的大洋。下一章，我们去大洋洲。","pts":[["圣彼得堡",30.32,59.94,"l"],["鄂霍次克",143.24,59.36]],"ar":[["俄罗斯帝国",90,60,22]]},{"c":33,"y":1773,"cam":[-72,40,4.5],"t":"十八世纪，欧洲的启蒙思想家高喊理性、自由和人权。在北美，英国的十三个殖民地对没有代表权却要交税越来越不满。一千七百七十三年，波士顿的抗议者把三百多箱东印度公司的茶叶倒进了海里，史称波士顿倾茶事件。","pts":[["波士顿",-71.06,42.36],["费城",-75.17,39.95,"l"]],"ar":[["十三个殖民地",-76,38,6]]},{"c":33,"y":1776,"cam":[-75,40,6],"t":"一千七百七十六年七月四日，北美大陆会议通过《独立宣言》，宣称人人生而平等，尽管当时的奴隶并不在其中。经过多年战争，英国在一千七百八十三年承认美国独立。冷知识：宣言的两位关键人物杰斐逊和亚当斯，在一千八百二十六年七月四日同一天去世，正好是宣言发表五十周年。","pts":[["费城",-75.17,39.95],["约克镇",-76.51,37.24,"l"]]},{"c":33,"y":1793,"cam":[116.4,40.2,6],"t":"同一时期的中国正值乾隆盛世，人口在十八世纪
